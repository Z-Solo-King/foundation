name: WooCommerce Unknown Family Guess V7
on:
  push:
    branches: [feat/wc-unknown-family-guess-v7-20261001]
    paths:
      - "tools/woocommerce_unknown_family_guess_v7.mjs"
      - "tests/test_woocommerce_unknown_family_guess_v7.mjs"
      - ".github/workflows/woocommerce-unknown-family-guess-v7.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/woocommerce_unknown_family_guess_v7.mjs"
      - "tests/test_woocommerce_unknown_family_guess_v7.mjs"
      - ".github/workflows/woocommerce-unknown-family-guess-v7.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wc-unknown-family-v7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guess:
    name: unknown-family shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Unit tests
        run: node --test tests/test_woocommerce_unknown_family_guess_v7.mjs
      - name: Unknown-family guessing
        run: node tools/woocommerce_unknown_family_guess_v7.mjs
      - name: Upload shard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-unknown-family-v7-shard-${{ matrix.shard }}
          path: out/woocommerce-unknown-family-guess-v7/
          retention-days: 30
  aggregate:
    needs: guess
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: woocommerce-unknown-family-v7-shard-*
          path: out/shards
          merge-multiple: false
      - name: Aggregate
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const files=[];
          function walk(p){for(const e of fs.readdirSync(p,{withFileTypes:true})){const q=path.join(p,e.name);if(e.isDirectory())walk(q);else if(e.name.endsWith('.json'))files.push(q);}}
          walk('out/shards');
          const rows=files.sort().flatMap(f=>JSON.parse(fs.readFileSync(f,'utf8')).results||[]);
          const unique=new Map(rows.map(x=>[x.root,x]));
          const ordered=[...unique.values()].sort((a,b)=>a.root.localeCompare(b.root));
          if(ordered.length!==17) throw new Error('expected 17 unique unknown targets, got '+ordered.length);
          const out={schema:'woocommerce-unknown-family-guess-v7-aggregate/v1',target_count:17,native_verified:ordered.filter(x=>x.candidate_hits?.length).length,native_urls:ordered.flatMap(x=>x.positive_urls||[]),transport_limited:ordered.filter(x=>x.status.includes('TRANSPORT_LIMITED')).length,clean_no_hit:ordered.filter(x=>x.status==='NO_NATIVE_FEED_VERIFIED').length,candidate_total:ordered.reduce((n,x)=>n+x.candidate_count,0),results:ordered};
          fs.mkdirSync('out/aggregate',{recursive:true});
          fs.writeFileSync('out/aggregate/aggregate.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({...out,results:undefined},null,2));
          NODE
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-unknown-family-v7-aggregate
          path: out/aggregate/
          retention-days: 30
