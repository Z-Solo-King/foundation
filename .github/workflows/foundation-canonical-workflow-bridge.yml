name: Foundation canonical workflow bridge

'on':
  workflow_dispatch:
    inputs:
      target:
        description: Canonical Foundation workflow to dispatch
        required: true
        type: choice
        options:
          - nightly-multi-agent-research.yml
          - heroic-ai-production-release.yml
          - cross-repository-contract-drift.yml
          - operations-centralized-validation.yml
          - main-push-actions-control-plane-probe.yml
        default: nightly-multi-agent-research.yml
      dry_run:
        description: Pass dry_run=true to nightly research only
        required: false
        type: boolean
        default: false
      confirm_production:
        description: Required confirmation before triggering production release
        required: false
        type: boolean
        default: false
      operations_ref:
        description: Operations branch or immutable SHA for centralized validation only
        required: false
        type: string
        default: main

  repository_dispatch:
    types: [foundation_action]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch canonical Foundation workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Foundation App installation token
        id: foundation-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FOUNDATION_APP_ID }}
          private-key: ${{ secrets.FOUNDATION_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: foundation
          permission-actions: write
          permission-contents: read

      - name: Validate and dispatch canonical Foundation workflow
        shell: bash
        env:
          GH_TOKEN: ${{ steps.foundation-app.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          INPUT_OPERATIONS_REF: ${{ inputs.operations_ref }}
          PAYLOAD_TARGET: ${{ github.event.client_payload.target }}
          PAYLOAD_DRY_RUN: ${{ github.event.client_payload.dry_run }}
          PAYLOAD_CONFIRM_PRODUCTION: ${{ github.event.client_payload.confirm_production }}
          PAYLOAD_OPERATIONS_REF: ${{ github.event.client_payload.operations_ref }}
          FOUNDATION_REF: main
        run: |
          set -euo pipefail

          TARGET="${INPUT_TARGET:-}"
          DRY_RUN="${INPUT_DRY_RUN:-false}"
          CONFIRM_PRODUCTION="${INPUT_CONFIRM_PRODUCTION:-false}"
          OPERATIONS_REF="${INPUT_OPERATIONS_REF:-main}"

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            TARGET="${PAYLOAD_TARGET:-}"
            DRY_RUN="${PAYLOAD_DRY_RUN:-false}"
            CONFIRM_PRODUCTION="${PAYLOAD_CONFIRM_PRODUCTION:-false}"
            OPERATIONS_REF="${PAYLOAD_OPERATIONS_REF:-main}"
          fi

          case "$TARGET" in
            nightly-multi-agent-research.yml|heroic-ai-production-release.yml|cross-repository-contract-drift.yml|operations-centralized-validation.yml|main-push-actions-control-plane-probe.yml) ;;
            *)
              echo "Refusing non-canonical Foundation workflow: $TARGET"
              exit 1
              ;;
          esac

          if [[ "$DRY_RUN" == "true" && "$TARGET" != "nightly-multi-agent-research.yml" ]]; then
            echo 'dry_run is only valid for nightly research'
            exit 1
          fi

          if [[ "$TARGET" == "heroic-ai-production-release.yml" ]]; then
            [[ "$DRY_RUN" != "true" ]] || {
              echo 'dry_run is not valid for the production release workflow'
              exit 1
            }
            [[ "$CONFIRM_PRODUCTION" == "true" ]] || {
              echo 'Production release requires explicit confirm_production=true'
              exit 1
            }
          elif [[ "$CONFIRM_PRODUCTION" == "true" ]]; then
            echo 'confirm_production is only valid for the production release workflow'
            exit 1
          fi

          if [[ "$OPERATIONS_REF" != "main" && ! "$OPERATIONS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'operations_ref must be main or a 40-character commit SHA'
            exit 1
          fi

          payload=$(jq -n --arg ref "$FOUNDATION_REF" '{ref: $ref}')
          case "$TARGET" in
            nightly-multi-agent-research.yml)
              payload=$(jq --arg value "$DRY_RUN" '.inputs = {dry_run: $value}' <<<"$payload")
              ;;
            operations-centralized-validation.yml)
              payload=$(jq --arg value "$OPERATIONS_REF" '.inputs = {operations_ref: $value}' <<<"$payload")
              ;;
          esac

          dispatch_status=$(curl -sS -o "$RUNNER_TEMP/foundation-dispatch-response.json" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://api.github.com/repos/Z-Solo-King/foundation/actions/workflows/${TARGET}/dispatches")

          echo "Foundation workflow dispatch -> HTTP ${dispatch_status}"
          if [[ "$dispatch_status" != "204" ]]; then
            jq -c '{message,errors,documentation_url}' "$RUNNER_TEMP/foundation-dispatch-response.json" 2>/dev/null || cat "$RUNNER_TEMP/foundation-dispatch-response.json"
            exit 1
          fi

          echo "Foundation dispatch accepted: $TARGET @ $FOUNDATION_REF"
          echo "router_event=$EVENT_NAME"
