name: Foundation canonical workflow bridge

'on':
  workflow_dispatch:
    inputs:
      target:
        description: Canonical Foundation workflow to dispatch
        required: true
        type: choice
        options:
          - nightly-multi-agent-research-v2.yml
          - heroic-ai-production-release.yml
          - cross-repository-contract-drift.yml
          - operations-centralized-validation.yml
          - main-push-actions-control-plane-probe.yml
        default: nightly-multi-agent-research-v2.yml
      dry_run:
        description: Pass dry_run=true to nightly research only
        required: false
        type: boolean
        default: false
      confirm_production:
        description: Required confirmation before triggering production release
        required: false
        type: boolean
        default: false
      operations_ref:
        description: Operations branch or immutable SHA for centralized validation only
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch canonical Foundation workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Foundation App installation token
        id: foundation-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FOUNDATION_APP_ID }}
          private-key: ${{ secrets.FOUNDATION_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: foundation
          permission-actions: write
          permission-contents: read

      - name: Validate and dispatch canonical Foundation workflow
        shell: bash
        env:
          GH_TOKEN: ${{ steps.foundation-app.outputs.token }}
          TARGET: ${{ inputs.target }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          OPERATIONS_REF: ${{ inputs.operations_ref }}
          FOUNDATION_REF: main
        run: |
          set -euo pipefail

          DRY_RUN="${DRY_RUN:-false}"
          CONFIRM_PRODUCTION="${CONFIRM_PRODUCTION:-false}"
          OPERATIONS_REF="${OPERATIONS_REF:-main}"

          case "$TARGET" in
            nightly-multi-agent-research-v2.yml|heroic-ai-production-release.yml|cross-repository-contract-drift.yml|operations-centralized-validation.yml|main-push-actions-control-plane-probe.yml) ;;
            *)
              echo "Refusing non-canonical Foundation workflow: $TARGET"
              exit 1
              ;;
          esac

          if [[ "$DRY_RUN" == "true" && "$TARGET" != "nightly-multi-agent-research-v2.yml" ]]; then
            echo 'dry_run is only valid for nightly research'
            exit 1
          fi

          if [[ "$TARGET" == "heroic-ai-production-release.yml" ]]; then
            [[ "$DRY_RUN" != "true" ]] || {
              echo 'dry_run is not valid for the production release workflow'
              exit 1
            }
            [[ "$CONFIRM_PRODUCTION" == "true" ]] || {
              echo 'Production release requires explicit confirm_production=true'
              exit 1
            }
          elif [[ "$CONFIRM_PRODUCTION" == "true" ]]; then
            echo 'confirm_production is only valid for the production release workflow'
            exit 1
          fi

          if [[ "$OPERATIONS_REF" != "main" && ! "$OPERATIONS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'operations_ref must be main or a 40-character commit SHA'
            exit 1
          fi

          expected_sha="$(gh api \"repos/${GITHUB_REPOSITORY}/git/ref/heads/${FOUNDATION_REF}\" --jq '.object.sha')"
          test "$expected_sha" =~ ^[0-9a-f]{40}$ || { echo "Invalid target ref SHA"; exit 1; }
          echo "Dispatch target revision: ${FOUNDATION_REF}@${expected_sha}"

          payload=$(jq -n --arg ref "$FOUNDATION_REF" '{ref: $ref}')
          case "$TARGET" in
            nightly-multi-agent-research-v2.yml)
              payload=$(jq --arg value "$DRY_RUN" '.inputs = {dry_run: $value}' <<<"$payload")
              ;;
            operations-centralized-validation.yml)
              payload=$(jq --arg value "$OPERATIONS_REF" '.inputs = {operations_ref: $value}' <<<"$payload")
              ;;
          esac

          # Record the dispatch boundary BEFORE the POST. GitHub can create the run
          # immediately; recording the timestamp afterward creates a race where a valid
          # run is rejected as too old.
          dispatch_epoch="$(date -u +%s)"

          dispatch_status=$(curl -sS -o "$RUNNER_TEMP/foundation-dispatch-response.json" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://api.github.com/repos/Z-Solo-King/foundation/actions/workflows/${TARGET}/dispatches")

          echo "Foundation workflow dispatch -> HTTP ${dispatch_status}"
          if [[ "$dispatch_status" != "204" ]]; then
            jq -c '{message,errors,documentation_url}' "$RUNNER_TEMP/foundation-dispatch-response.json" 2>/dev/null || cat "$RUNNER_TEMP/foundation-dispatch-response.json"
            exit 1
          fi

          echo "Foundation dispatch accepted: $TARGET @ $FOUNDATION_REF"

          # A successful dispatch HTTP 204 only proves request admission. Poll for the
          # resulting workflow run and its first job so accepted-trigger/zero-job states
          # become explicit control-plane evidence instead of disappearing into history.
          run_id=""
          for attempt in {1..12}; do
            runs_json="$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET}/runs?event=workflow_dispatch&branch=${FOUNDATION_REF}&per_page=10")"
            run_id="$(python - "$dispatch_epoch" "$runs_json" "$expected_sha" <<'PY'
import json
import sys
from datetime import datetime

dispatch_epoch = int(sys.argv[1])
payload = json.loads(sys.argv[2])
expected_sha = sys.argv[3]

def epoch(value: str) -> int:
    return int(datetime.fromisoformat(value.replace("Z", "+00:00")).timestamp())

for run in payload.get("workflow_runs", []):
    created = run.get("created_at")
    if not created:
        continue
    if epoch(created) >= dispatch_epoch - 30 and run.get("head_sha") == expected_sha:
        print(run.get("id", ""))
        break
PY
)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done

          test -n "$run_id" || {
            echo "CONTROL_PLANE=UNKNOWN"
            echo "Dispatch returned 204 but no workflow run was observed."
            exit 1
          }

          echo "Foundation workflow run observed: $TARGET run_id=$run_id"
          job_count=0
          for attempt in {1..6}; do
            jobs_json="$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
            job_count="$(jq '.total_count // (.jobs | length) // 0' <<<"$jobs_json")"
            echo "Foundation workflow jobs observed (attempt $attempt): $job_count"
            [[ "$job_count" != "0" ]] && break
            sleep 5
          done
          if [[ "$job_count" == "0" ]]; then
            echo "CONTROL_PLANE=ACCEPTED_TRIGGER_ZERO_JOB"
            echo "Dispatch was accepted and the exact run exists, but no job was created after bounded polling."
            exit 1
          fi
          echo "CONTROL_PLANE=JOB_CREATED"
