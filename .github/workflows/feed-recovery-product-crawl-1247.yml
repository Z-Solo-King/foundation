name: WooCommerce Feed Product Crawl 1247

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wc-feed-product-crawl-1247
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-package-lock --no-save playwright
          npx playwright install --with-deps chromium
      - name: Syntax check
        run: node --check tools/woocommerce_google_feed_product_crawl_1247.mjs
      - name: Crawl public product/category pages
        run: node tools/woocommerce_google_feed_product_crawl_1247.mjs
      - name: Upload crawl evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: woocommerce-feed-product-crawl-1247
          path: out/feed-crawl-1247/report.json
          if-no-files-found: error
          retention-days: 30
