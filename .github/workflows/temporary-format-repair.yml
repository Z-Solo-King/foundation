name: Temporary format repair

on:
  push:
    branches:
      - fix/current-gates-20261003

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Format canonical workflow
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.9 --write .github/workflows/operations-centralized-validation.yml
      - name: Show canonical diff
        run: git diff --unified=8 -- .github/workflows/operations-centralized-validation.yml
      - name: Upload canonical output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatted-operations-validation
          path: .github/workflows/operations-centralized-validation.yml
          if-no-files-found: error
          retention-days: 1
