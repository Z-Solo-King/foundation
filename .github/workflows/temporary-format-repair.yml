name: Temporary format repair

on:
  push:
    branches:
      - fix/current-gates-20261003

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Format canonical workflow
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.9 --write .github/workflows/operations-centralized-validation.yml
      - name: Commit canonical formatter output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/operations-centralized-validation.yml
          if git diff --cached --quiet; then
            echo "already formatted"
            exit 0
          fi
          git commit -m "style: apply canonical Prettier formatting [skip ci]"
          git push origin HEAD:fix/current-gates-20261003
