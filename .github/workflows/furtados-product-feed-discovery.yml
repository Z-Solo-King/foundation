name: Furtados product-feed discovery

on:
  push:
    branches:
      - diag/furtados-feed-api-2026-09-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check "playwright>=1.45,<2"
          python -m playwright install --with-deps chromium

      - name: Inspect storefront and candidate feeds
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit
          import json, re
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          BASE = "https://www.furtadosonline.com/"
          out = {
              "base": BASE,
              "navigation": {},
              "network": [],
              "discovered_urls": [],
              "candidate_results": [],
              "search": {},
          }

          candidates = [
              "sitemap.xml",
              "sitemap_index.xml",
              "robots.txt",
              "feed.xml",
              "rss.xml",
              "atom.xml",
              "products.xml",
              "product-feed.xml",
              "productfeed.xml",
              "google.xml",
              "google-feed.xml",
              "google_shopping.xml",
              "google-shopping.xml",
              "googlemerchant.xml",
              "google-merchant.xml",
              "merchant.xml",
              "feeds/google.xml",
              "feed/google.xml",
              "feeds/google-shopping.xml",
              "feed/google-shopping.xml",
              "google-shopping-feed.xml",
              "google-product-feed.xml",
              "api/products",
              "api/catalog",
              "api/products.json",
              "products.json",
              "collections/all/products.json",
              "wp-json/wp/v2/product",
              "wp-json/wc/v3/products",
              "rest/V1/products",
              "graphql",
              "api/graphql",
              "search/suggestions?q=guitar",
              "search.json?q=guitar",
              "search?q=guitar",
          ]

          interesting = re.compile(r"(api|graphql|json|xml|feed|product|catalog|search|sitemap|collection|cart|variant)", re.I)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                  locale="en-IN",
                  viewport={"width": 1440, "height": 1200},
              )
              page = context.new_page()

              def on_response(resp):
                  try:
                      u = resp.url
                      if interesting.search(u) or resp.request.resource_type in {"xhr", "fetch"}:
                          out["network"].append({
                              "url": u,
                              "status": resp.status,
                              "content_type": resp.headers.get("content-type", ""),
                              "resource_type": resp.request.resource_type,
                          })
                  except Exception:
                      pass

              page.on("response", on_response)

              try:
                  response = page.goto(BASE, wait_until="domcontentloaded", timeout=90000)
                  page.wait_for_timeout(5000)
                  out["navigation"] = {
                      "status": response.status if response else None,
                      "final_url": page.url,
                      "title": page.title(),
                  }
              except Exception as exc:
                  out["navigation"]["error"] = f"{type(exc).__name__}: {exc}"

              # Capture source-level endpoint clues.
              html = page.content()
              Path("furtados-home.html").write_text(html, encoding="utf-8")
              anchors = page.locator("a[href]")
              discovered = set()
              for i in range(min(anchors.count(), 5000)):
                  try:
                      href = anchors.nth(i).get_attribute("href") or ""
                      if href:
                          discovered.add(urljoin(page.url, href))
                  except Exception:
                      pass

              forms = page.locator("form")
              for i in range(min(forms.count(), 200)):
                  try:
                      for attr in ("action", "data-action", "hx-get", "data-hx-get"):
                          value = forms.nth(i).get_attribute(attr) or ""
                          if value:
                              discovered.add(urljoin(page.url, value))
                  except Exception:
                      pass

              for selector in ("[hx-get]", "[data-hx-get]", "[data-url]", "[data-endpoint]"):
                  nodes = page.locator(selector)
                  for i in range(min(nodes.count(), 1000)):
                      try:
                          for attr in ("hx-get", "data-hx-get", "data-url", "data-endpoint"):
                              value = nodes.nth(i).get_attribute(attr) or ""
                              if value:
                                  discovered.add(urljoin(page.url, value))
                      except Exception:
                          pass

              out["discovered_urls"] = sorted(u for u in discovered if urlsplit(u).netloc == urlsplit(page.url).netloc and interesting.search(u))[:1000]

              # Try visible search controls with a real browser interaction.
              inputs = page.locator("input")
              search_idx = None
              for i in range(min(inputs.count(), 200)):
                  try:
                      blob = " ".join([
                          inputs.nth(i).get_attribute("type") or "",
                          inputs.nth(i).get_attribute("name") or "",
                          inputs.nth(i).get_attribute("placeholder") or "",
                          inputs.nth(i).get_attribute("aria-label") or "",
                      ]).lower()
                      if "search" in blob or (inputs.nth(i).get_attribute("type") or "").lower() == "search":
                          search_idx = i
                          break
                  except Exception:
                      pass

              if search_idx is not None:
                  try:
                      inp = inputs.nth(search_idx)
                      inp.fill("guitar")
                      inp.press("Enter")
                      page.wait_for_timeout(4000)
                      out["search"] = {
                          "input_found": True,
                          "url_after": page.url,
                          "title_after": page.title(),
                      }
                  except Exception as exc:
                      out["search"] = {"input_found": True, "error": f"{type(exc).__name__}: {exc}"}
              else:
                  out["search"] = {"input_found": False}

              # Direct public candidate checks in the same browser context.
              for suffix in candidates:
                  target = urljoin(BASE, suffix)
                  try:
                      resp = context.request.get(
                          target,
                          headers={
                              "Accept": "text/html,application/json,application/xml,text/xml,*/*",
                              "Referer": BASE,
                          },
                          timeout=30000,
                          fail_on_status_code=False,
                      )
                      ct = resp.headers.get("content-type", "")
                      body = resp.body()
                      sample = body[:3000].decode("utf-8", errors="replace")
                      looks_product = bool(re.search(r"(product|price|sku|gtin|mpn|item)", sample, re.I))
                      looks_feed = bool(re.search(r"(rss|feed|channel|item|g:price|product_type|offer|sku)", sample, re.I))
                      out["candidate_results"].append({
                          "url": target,
                          "status": resp.status,
                          "content_type": ct,
                          "bytes": len(body),
                          "looks_product": looks_product,
                          "looks_feed": looks_feed,
                          "sample": sample[:1000],
                      })
                  except Exception as exc:
                      out["candidate_results"].append({
                          "url": target,
                          "error": f"{type(exc).__name__}: {exc}",
                      })

              # Keep a compact list of unique observed requests.
              dedup = {}
              for row in out["network"]:
                  dedup[(row["url"], row["status"], row["content_type"])] = row
              out["network"] = list(dedup.values())[:2000]

              Path("furtados-discovery.json").write_text(
                  json.dumps(out, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

              # Print the answer-bearing subset first.
              print("=== NAVIGATION ===")
              print(json.dumps(out["navigation"], indent=2, ensure_ascii=False))
              print("=== NETWORK INTERESTING ===")
              for row in out["network"]:
                  print(json.dumps(row, ensure_ascii=False))
              print("=== CANDIDATE HITS ===")
              for row in out["candidate_results"]:
                  if row.get("status") in {200, 301, 302, 304} or row.get("looks_product") or row.get("looks_feed"):
                      print(json.dumps(row, ensure_ascii=False))
              print("=== SEARCH ===")
              print(json.dumps(out["search"], indent=2, ensure_ascii=False))

              browser.close()

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: furtados-product-feed-discovery
          path: |
            furtados-discovery.json
            furtados-home.html
          if-no-files-found: warn
          retention-days: 14
