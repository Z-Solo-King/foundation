name: cross-repository contract drift

'on':
  pull_request:
    branches: [main]
    paths:
      - 'CAPABILITIES.json'
      - 'backend/governance/contract_drift.py'
      - 'tools/check_cross_repo_drift.py'
      - 'tools/validate_language_fit_inventory.py'
      - 'tests/test_cross_repo_drift_gate.py'
      - 'tools/check_continuity_freshness.py'
      - 'tests/test_continuity_freshness.py'
      - '.github/workflows/cross-repository-contract-drift.yml'
  push:
    branches: [main]
    paths:
      - 'CAPABILITIES.json'
      - 'backend/governance/contract_drift.py'
      - 'tools/check_cross_repo_drift.py'
      - 'tools/validate_language_fit_inventory.py'
      - 'tests/test_cross_repo_drift_gate.py'
      - '.github/workflows/cross-repository-contract-drift.yml'
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-cross-repository-contract-drift-${{github.ref}}
  cancel-in-progress: false

jobs:
  drift:
    name: Cross-repository contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: foundation

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Authenticate private Operations catalog access
        shell: bash
        working-directory: foundation
        env:
          OPERATIONS_REPOSITORY: Z-Solo-King/operations
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPERATIONS_APP_ID:-}" || { echo 'Missing OPERATIONS_APP_ID GitHub Actions secret'; exit 1; }
          test -n "${OPERATIONS_APP_PRIVATE_KEY:-}" || { echo 'Missing OPERATIONS_APP_PRIVATE_KEY GitHub Actions secret'; exit 1; }
          key_file="$RUNNER_TEMP/operations-app.pem"
          jwt_file="$RUNNER_TEMP/operations-app-jwt.txt"
          response_file="$RUNNER_TEMP/operations-app-response.json"
          umask 077
          printf '%s\n' "$OPERATIONS_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          python scripts/create_github_app_jwt.py "$OPERATIONS_APP_ID" "$key_file" > "$jwt_file"
          app_jwt="$(cat "$jwt_file")"
          installation_output="$RUNNER_TEMP/operations-installation-id.txt"
          installation_error="$RUNNER_TEMP/operations-installation-id.err"
          set +e
          OPERATIONS_APP_JWT="$app_jwt" python scripts/resolve_operations_installation.py >"$installation_output" 2>"$installation_error"
          installation_status=$?
          set -e
          if [ "$installation_status" -ne 0 ]; then
            echo "GitHub App installation discovery failed (exit $installation_status)"
            cat "$installation_error" 2>/dev/null || true
            exit 1
          fi
          installation_id="$(tr -d '\r\n' < "$installation_output")"
          test -n "$installation_id" || { echo 'GitHub App installation discovery returned an empty installation id'; exit 1; }
          installation_response="$(curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${app_jwt}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/app/installations/${installation_id}/access_tokens")"
          printf '%s\n' "$installation_response" > "$response_file"
          github_app_token="$(jq -r '.token // empty' "$response_file")"
          test -n "$github_app_token"
          echo "::add-mask::$github_app_token"
          mkdir -p ../operations
          git_basic_auth="$(printf 'x-access-token:%s' "$github_app_token" | base64 -w0)"
          git -c "http.extraHeader=Authorization: Basic $git_basic_auth" \
            clone --depth=1 --filter=blob:none \
            "https://github.com/${OPERATIONS_REPOSITORY}.git" ../operations/repo
          catalog_response="$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${github_app_token}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OPERATIONS_REPOSITORY}/contents/CAPABILITIES.json?ref=main")"
          printf '%s\n' "$catalog_response" | jq -r '.content // empty' | tr -d '\n' | base64 --decode > ../operations/CAPABILITIES.json
          jq -e --arg repo "$OPERATIONS_REPOSITORY" '.full_name == $repo and .private == true' \
            < <(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${github_app_token}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${OPERATIONS_REPOSITORY}") >/dev/null
          test -s ../operations/CAPABILITIES.json
          workflow_status="$(curl -sS -o "$RUNNER_TEMP/operations-workflows.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${github_app_token}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OPERATIONS_REPOSITORY}/contents/.github/workflows?ref=main")"
          echo "Operations .github/workflows -> HTTP ${workflow_status}"
          if [[ "${workflow_status}" == "404" ]]; then
            echo 'private Operations GitHub Actions boundary: PASS (no workflow directory)'
          elif [[ "${workflow_status}" == "200" ]] && jq -e 'length == 0' "$RUNNER_TEMP/operations-workflows.json" >/dev/null 2>&1; then
            echo 'private Operations GitHub Actions boundary: PASS (workflow directory empty)'
          else
            echo 'private Operations GitHub Actions boundary: FAIL'
            jq -c 'map({name,path,type})' "$RUNNER_TEMP/operations-workflows.json" 2>/dev/null || cat "$RUNNER_TEMP/operations-workflows.json"
            exit 1
          fi

      - name: Install drift test tools
        working-directory: foundation
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10"

      - name: Generate family language-fit coverage
        working-directory: foundation
        env:
          PYTHONPATH: ../operations/repo
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python ../operations/repo/tools/code_language_coverage.py \
            --repo . \
            --repo ../operations/repo \
            --name foundation \
            --name operations \
            --output .runtime/language_fit_inventory.json
          python tools/validate_language_fit_inventory.py .runtime/language_fit_inventory.json

      - name: Upload family language-fit inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: family-language-fit-inventory
          path: foundation/.runtime/language_fit_inventory.json

      - name: Enforce continuity freshness for canonical changes
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group' }}
        working-directory: foundation
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          python tools/check_continuity_freshness.py --base-sha "$base_sha" --head-sha "$GITHUB_SHA"

      - name: Run drift contract regression
        working-directory: foundation
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_cross_repo_drift_gate.py
          python tools/check_cross_repo_drift.py \
            --foundation CAPABILITIES.json \
            --operations ../operations/CAPABILITIES.json