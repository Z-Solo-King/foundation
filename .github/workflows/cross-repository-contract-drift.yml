name: cross-repository contract drift

on:
  pull_request:
    branches: [main]
    paths:
      - 'CAPABILITIES.json'
      - 'backend/governance/contract_drift.py'
      - 'tools/check_cross_repo_drift.py'
      - 'tests/test_cross_repo_drift_gate.py'
      - '.github/workflows/cross-repository-contract-drift.yml'
  push:
    branches: [main]
    paths:
      - 'CAPABILITIES.json'
      - 'backend/governance/contract_drift.py'
      - 'tools/check_cross_repo_drift.py'
      - 'tests/test_cross_repo_drift_gate.py'
      - '.github/workflows/cross-repository-contract-drift.yml'
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Cross-repository contract drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: foundation

      - name: Authenticate private Operations catalog access
        shell: bash
        env:
          OPERATIONS_REPOSITORY: Z-Solo-King/operations
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPERATIONS_APP_ID:-}" || { echo 'Missing OPERATIONS_APP_ID GitHub Actions secret'; exit 1; }
          test -n "${OPERATIONS_APP_PRIVATE_KEY:-}" || { echo 'Missing OPERATIONS_APP_PRIVATE_KEY GitHub Actions secret'; exit 1; }
          key_file="$RUNNER_TEMP/operations-app.pem"
          jwt_file="$RUNNER_TEMP/operations-app-jwt.txt"
          response_file="$RUNNER_TEMP/operations-app-response.json"
          umask 077
          printf '%s\n' "$OPERATIONS_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          python - "$OPERATIONS_APP_ID" "$key_file" > "$jwt_file" <<'PY'
import base64
import json
import subprocess
import sys
import time

app_id, key_file = sys.argv[1:]

def b64url(value: bytes) -> str:
    return base64.urlsafe_b64encode(value).rstrip(b"=").decode("ascii")

now = int(time.time())
header = {"alg": "RS256", "typ": "JWT"}
payload = {"iat": now - 60, "exp": now + 540, "iss": app_id}
unsigned = f"{b64url(json.dumps(header, separators=(",", ":")).encode())}.{b64url(json.dumps(payload, separators=(",", ":")).encode())}".encode()
signed = subprocess.run(
    ["openssl", "dgst", "-sha256", "-sign", key_file],
    input=unsigned,
    stdout=subprocess.PIPE,
    stderr=subprocess.PIPE,
    check=True,
)
print(unsigned.decode() + "." + b64url(signed.stdout))
PY
          app_jwt=$(cat "$jwt_file")
          installation_output="$RUNNER_TEMP/operations-installation-id.txt"
          installation_error="$RUNNER_TEMP/operations-installation-id.err"
          set +e
          OPERATIONS_APP_JWT="$app_jwt" python scripts/resolve_operations_installation.py >"$installation_output" 2>"$installation_error"
          installation_status=$?
          set -e
          if [ "$installation_status" -ne 0 ]; then
            echo "GitHub App installation discovery failed (exit $installation_status)"
            cat "$installation_error" 2>/dev/null || true
            exit 1
          fi
          installation_id="$(tr -d "
" < "$installation_output")"
          test -n "$installation_id" || { echo 'GitHub App installation discovery returned an empty installation id'; exit 1; }
          installation_response=$(curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${app_jwt}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/app/installations/${installation_id}/access_tokens")
          printf '%s\n' "$installation_response" > "$response_file"
          github_app_token=$(python - "$response_file" <<'PY'
import json
import sys
with open(sys.argv[1], encoding="utf-8") as handle:
    print(json.load(handle)["token"])
PY
)
          test -n "$github_app_token"
          echo "::add-mask::$github_app_token"
          mkdir -p operations
          catalog_response=$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${github_app_token}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OPERATIONS_REPOSITORY}/contents/CAPABILITIES.json?ref=main")
          python - "$catalog_response" > operations/CAPABILITIES.json <<'PY'
import base64
import json
import sys
payload = json.loads(sys.argv[1])
print(base64.b64decode(payload["content"]).decode("utf-8"))
PY
          jq -e --arg repo "$OPERATIONS_REPOSITORY" '.full_name == $repo and .private == true' \
            < <(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${github_app_token}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${OPERATIONS_REPOSITORY}") >/dev/null
          test -s operations/CAPABILITIES.json

      - name: Enforce private Operations structural policy
        shell: bash
        env:
          OPERATIONS_REPOSITORY: Z-Solo-King/operations
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/operations-app.pem"
          jwt_file="$RUNNER_TEMP/operations-app-jwt.txt"
          umask 077
          printf '%s\n' "$OPERATIONS_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          python - "$OPERATIONS_APP_ID" "$key_file" > "$jwt_file" <<'PY'
import base64, json, subprocess, sys, time
app_id, key_file = sys.argv[1:]
enc = lambda value: base64.urlsafe_b64encode(value).rstrip(b"=").decode()
now = int(time.time())
header = {"alg": "RS256", "typ": "JWT"}
payload = {"iat": now - 60, "exp": now + 540, "iss": app_id}
unsigned = f"{enc(json.dumps(header, separators=(",", ":")).encode())}.{enc(json.dumps(payload, separators=(",", ":")).encode())}".encode()
signed = subprocess.run(["openssl", "dgst", "-sha256", "-sign", key_file], input=unsigned, stdout=subprocess.PIPE, check=True).stdout
print(unsigned.decode() + "." + enc(signed))
PY
          app_jwt="$(cat "$jwt_file")"
          installation_id="$(OPERATIONS_APP_JWT="$app_jwt" python scripts/resolve_operations_installation.py)"
          token_response=$(curl -fsS -X POST             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer ${app_jwt}"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/app/installations/${installation_id}/access_tokens")
          github_app_token="$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["token"])' <<<"$token_response")"
          echo "::add-mask::$github_app_token"
          tree_response=$(curl -fsS             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer ${github_app_token}"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${OPERATIONS_REPOSITORY}/git/trees/main?recursive=1")
          printf '%s\n' "$tree_response" > "$RUNNER_TEMP/operations-tree.json"
          test "$(jq -r '.truncated // false' "$RUNNER_TEMP/operations-tree.json")" = "false"

          forbidden_docs='AI_AGENT_HANDOFF.md AI_ANALYSIS_MAP.md CLAUDE_GUIDANCE.md CODE_OWNERSHIP_AND_PLACEMENT.md AI_AUDIT_AND_VERIFICATION_STANDARD.md AI_GOVERNANCE_STANDARD.md FAMILY_ARCHITECTURE.md FAMILY_DOCUMENTATION_INDEX.md GOVERNANCE_KNOWLEDGE_TAXONOMY.md LIMITATION_KNOWLEDGE_STANDARD.md'
          for legacy in $forbidden_docs; do
            if jq -e --arg name "$legacy" '[.tree[] | select(.type=="blob" and (.path|startswith("docs/")) and (.path|endswith($name)))] | length > 0' "$RUNNER_TEMP/operations-tree.json" >/dev/null; then
              echo "FAIL: retired Operations guidance document exists: $legacy"
              exit 1
            fi
          done

          for required in CURRENT_SOURCE_OF_TRUTH.md AGENT_MAINTENANCE_GUIDE.md FAMILY_OPERATING_MODEL.md GOVERNANCE_AND_EVIDENCE_STANDARD.md KNOWLEDGE_LIFECYCLE_STANDARD.md FUTURE_KNOWLEDGE_CATALOG.md CHATBOT_BOUNDARY.md; do
            jq -e --arg name "$required" '[.tree[] | select(.type=="blob" and (.path=="docs/"+$name))] | length == 1' "$RUNNER_TEMP/operations-tree.json" >/dev/null || {
              echo "FAIL: required canonical Operations document missing: $required"
              exit 1
            }
          done

          workflow_count="$(jq '[.tree[] | select(.type=="blob" and (.path|startswith(".github/workflows/")))] | length' "$RUNNER_TEMP/operations-tree.json")"
          test "$workflow_count" -eq 0

          benchmark_count="$(jq '[.tree[] | select(.type=="blob" and (.path|startswith("benchmark/")))] | length' "$RUNNER_TEMP/operations-tree.json")"
          test "$benchmark_count" -eq 0

          archive_ok="$(jq '[.tree[] | select(.type=="blob" and (.path|contains("/archives/")) and ((.path|startswith("private/archives/"))|not))] | length' "$RUNNER_TEMP/operations-tree.json")"
          test "$archive_ok" -eq 0

          echo 'private Operations structural policy: PASS'
          # Operations is source/runtime only. GitHub Actions ownership lives in Foundation.
          workflow_status=$(curl -sS -o "$RUNNER_TEMP/operations-workflows.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${github_app_token}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OPERATIONS_REPOSITORY}/contents/.github/workflows?ref=main")
          echo "Operations .github/workflows -> HTTP ${workflow_status}"
          if [[ "${workflow_status}" == "404" ]]; then
            echo 'private Operations GitHub Actions boundary: PASS (no workflow directory)'
          elif [[ "${workflow_status}" == "200" ]] && jq -e 'length == 0' "$RUNNER_TEMP/operations-workflows.json" >/dev/null 2>&1; then
            echo 'private Operations GitHub Actions boundary: PASS (workflow directory empty)'
          else
            echo 'private Operations GitHub Actions boundary: FAIL'
            jq -c 'map({name,path,type})' "$RUNNER_TEMP/operations-workflows.json" 2>/dev/null || cat "$RUNNER_TEMP/operations-workflows.json"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Run drift contract regression
        working-directory: foundation
        run: |
          python -m pytest -q tests/test_cross_repo_drift_gate.py
          python tools/check_cross_repo_drift.py \
            --foundation CAPABILITIES.json \
            --operations ../operations/CAPABILITIES.json
