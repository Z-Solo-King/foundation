name: cross-repository contract drift

"on":
  push:
    branches: [main]
    paths:
      - "CAPABILITIES.json"
      - "REPOSITORY_MAP.json"
      - "wrangler.toml"
      - "edge.ts"
      - "pyproject.toml"
      - "foundation_core/**"
      - "frontend/**"
      - "polyglot/**"
      - "tools/check_cross_repo_drift.py"
      - "tools/validate_language_fit_inventory.py"
      - "tools/check_continuity_freshness.py"
      - "tests/test_cross_repo_drift_gate.py"
      - "tests/test_continuity_freshness.py"
      - "docs/CURRENT_SOURCE_OF_TRUTH.md"
      - "docs/FAMILY_SYNC_STATE.json"
      - ".github/workflows/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-cross-repository-contract-drift-${{github.ref}}
  cancel-in-progress: false

jobs:
  drift:
    name: Cross-repository contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: foundation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Create read-only Operations token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Authenticate private Operations catalog access
        shell: bash
        working-directory: foundation
        env:
          OPERATIONS_REPOSITORY: Z-Solo-King/operations
          OPERATIONS_APP_TOKEN: ${{ steps.operations-app.outputs.token }}
        run: |
          set -euo pipefail
          test -n "${OPERATIONS_APP_TOKEN:-}" || { echo 'GitHub App token creation returned an empty token'; exit 1; }
          mkdir -p ../operations
          git_basic_auth="$(printf 'x-access-token:%s' "$OPERATIONS_APP_TOKEN" | base64 -w0)"
          git -c "http.extraHeader=Authorization: Basic $git_basic_auth" \
            clone --depth=1 --filter=blob:none \
            "https://github.com/${OPERATIONS_REPOSITORY}.git" ../operations/repo
          catalog_response="$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${OPERATIONS_APP_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OPERATIONS_REPOSITORY}/contents/CAPABILITIES.json?ref=main")"
          printf '%s\n' "$catalog_response" | jq -r '.content // empty' | tr -d '\n' | base64 --decode > ../operations/CAPABILITIES.json
          jq -e --arg repo "$OPERATIONS_REPOSITORY" '.full_name == $repo and .private == true' \
            < <(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${OPERATIONS_APP_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${OPERATIONS_REPOSITORY}") >/dev/null
          test -s ../operations/CAPABILITIES.json
          workflow_status="$(curl -sS -o "$RUNNER_TEMP/operations-workflows.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${OPERATIONS_APP_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OPERATIONS_REPOSITORY}/contents/.github/workflows?ref=main")"
          echo "Operations .github/workflows -> HTTP ${workflow_status}"
          if [[ "${workflow_status}" == "404" ]]; then
            echo 'private Operations GitHub Actions boundary: PASS (no workflow directory)'
          elif [[ "${workflow_status}" != "200" ]]; then
            echo 'private Operations GitHub Actions boundary: FAIL (workflow listing unavailable)'
            cat "$RUNNER_TEMP/operations-workflows.json" 2>/dev/null || true
            exit 1
          else
            # Feed extraction may temporarily remain hosted in Operations; it is a
            # public-data workflow and is explicitly excluded from the private-runtime
            # authority boundary. No other Operations workflow is allowed.
            unexpected_workflows="$(jq -c \
              '[.[] | select(.type == "file" and (.name != "custom-website-product-feed-1249.yml" and .name != "woocommerce-32-plugin-feed-hunt.yml"))] | map({name,path,type})' \
              "$RUNNER_TEMP/operations-workflows.json")"
            if [[ "${unexpected_workflows}" == "[]" ]]; then
              echo 'private Operations GitHub Actions boundary: PASS (only explicitly excluded feed workflow is present)'
            else
              echo 'private Operations GitHub Actions boundary: FAIL (unexpected Operations workflow)'
              printf '%s\n' "${unexpected_workflows}"
              exit 1
            fi
          fi

      - name: Install drift test tools
        working-directory: foundation
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10"

      - name: Generate family language-fit coverage
        working-directory: foundation
        env:
          PYTHONPATH: .:../operations/repo
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python ../operations/repo/tools/code_language_coverage.py \
            --repo . \
            --repo ../operations/repo \
            --name foundation \
            --name operations \
            --output .runtime/language_fit_inventory.json
          python tools/validate_language_fit_inventory.py .runtime/language_fit_inventory.json

      - name: Upload family language-fit inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: family-language-fit-inventory
          path: foundation/.runtime/language_fit_inventory.json

      - name: Enforce continuity freshness for canonical changes
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group' }}
        working-directory: foundation
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          python tools/check_continuity_freshness.py --base-sha "$base_sha" --head-sha "$GITHUB_SHA"

      - name: Run drift contract regression
        working-directory: foundation
        env:
          PYTHONPATH: .:../operations/repo
        run: |
          python -m pytest -q tests/test_cross_repo_drift_gate.py
          python tools/check_cross_repo_drift.py \
            --foundation CAPABILITIES.json \
            --operations ../operations/CAPABILITIES.json
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python tools/check_repo_overlap.py . ../operations/repo --exhaustive
          else
            python tools/check_repo_overlap.py . ../operations/repo
          fi
