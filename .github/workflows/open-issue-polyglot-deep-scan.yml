name: Open issue polyglot deep scan
# Issue-count authority is the live Operations current_open_issue_inventory.json; never hard-code the queue size here.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: foundation-open-issue-polyglot-deep-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Freeze Operations revision
    runs-on: ubuntu-latest
    outputs:
      operations_sha: ${{ steps.freeze.outputs.sha }}
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations main once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.operations-app.outputs.token }}
          path: operations-snapshot
      - name: Freeze Operations SHA
        id: freeze
        working-directory: operations-snapshot
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git -C . rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  lane:
    needs: [snapshot]
    permissions:
      contents: read
      actions: read
    name: Deep scan ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [L1, L2, L3, L4]
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.snapshot.outputs.operations_sha }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Checkout Foundation source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/foundation
          ref: ${{ github.sha }}
          path: foundation

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate scan matrix contract
        id: validate-scan-contract
        working-directory: operations
        run: node --test tests/test_open_issue_polyglot_scan.mjs
      # Cross-repo source coverage includes Foundation-owned acceptance validators when an issue spans the family.
      - name: Run lane ${{ matrix.lane }}
        id: run-lane
        working-directory: operations
        run: |
          mkdir -p .runtime/open-issue-deep-scan
          node tools/open_issue_polyglot_scan.mjs             --foundation "$GITHUB_WORKSPACE/foundation"             --operations "$GITHUB_WORKSPACE/operations"             --matrix "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_matrix_52.json"             --surface-map "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_surface_map.json"             --lane "${{ matrix.lane }}"             --output ".runtime/open-issue-deep-scan/${{ matrix.lane }}.json"

      - name: Add provenance
        working-directory: operations
        env:
          LANE: ${{ matrix.lane }}
          FOUNDATION_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const lane = process.env.LANE;
          const receiptPath = ".runtime/open-issue-deep-scan/" + lane + ".json";
          const payload = JSON.parse(fs.readFileSync(receiptPath, "utf8"));
          const operationsRevision = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (!/^[0-9a-f]{40}$/.test(operationsRevision)) throw new Error("Operations provenance is not an immutable SHA");
          payload.foundation_revision = process.env.FOUNDATION_REVISION;
          payload.operations_revision = operationsRevision;
          fs.writeFileSync(receiptPath, JSON.stringify(payload, null, 2) + "\\n");
          NODE

      - name: Emit sanitized lane summary
        if: always()
        working-directory: operations
        env:
          LANE: ${{ matrix.lane }}
          VALIDATE_OUTCOME: ${{ steps.validate-scan-contract.outcome }}
          RUN_OUTCOME: ${{ steps.run-lane.outcome }}
        run: |
          set +e
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const lane = process.env.LANE;
          const receipt = ".runtime/open-issue-deep-scan/" + lane + ".json";
          const payload = {
            schema: "open-issue-deep-scan/summary/v1",
            lane,
            validate_outcome: process.env.VALIDATE_OUTCOME,
            run_outcome: process.env.RUN_OUTCOME,
            receipt_present: fs.existsSync(receipt),
          };
          if (payload.receipt_present) {
            try {
              const r = JSON.parse(fs.readFileSync(receipt, "utf8"));
              for (const key of ["case_count","expected_case_count","issue_count","failed_cases","review_cases","missing_cases","operations_revision"]) payload[key] = r[key];
            } catch {
              payload.receipt_parse_error = true;
            }
          }
          fs.mkdirSync(".runtime/open-issue-deep-scan", { recursive: true });
          fs.writeFileSync(".runtime/open-issue-deep-scan/" + lane + "-summary.json", JSON.stringify(payload, null, 2) + "\\n");
          console.log(JSON.stringify(payload));
          NODE

      - name: Upload sanitized lane summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-issue-deep-scan-${{ matrix.lane }}-summary-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: operations/.runtime/open-issue-deep-scan/*.json
          if-no-files-found: warn
          retention-days: 7
  # Aggregate the frozen four-lane receipts from this run; issue scope is validated before execution.
  aggregate:
    name: Aggregate dynamic issue×lane cases
    needs: [snapshot, lane]
    runs-on: ubuntu-latest
    if: ${{ needs.lane.result == 'success' }}
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Operations aggregate read token
        id: operations-app-aggregate
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations at frozen revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.snapshot.outputs.operations_sha }}
          token: ${{ steps.operations-app-aggregate.outputs.token }}
          path: operations
      - name: Download lane receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: open-issue-deep-scan-*-summary-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .runtime/open-issue-deep-scan
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate complete four-lane coverage
        env:
          EXPECTED_OPERATIONS_SHA: ${{ needs.snapshot.outputs.operations_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root = ".runtime/open-issue-deep-scan";
          const receipts = fs.readdirSync(root).filter(name => /^L[1-4]\\.json$/.test(name)).sort().map(name => JSON.parse(fs.readFileSync(path.join(root, name), "utf8")));
          if (receipts.length !== 4) throw new Error("expected exactly four lane receipts");
          if (new Set(receipts.map(r => r.lane)).size !== 4) throw new Error("lane identifiers are not unique");
          const expectedOps = process.env.EXPECTED_OPERATIONS_SHA;
          if (!/^[0-9a-f]{40}$/.test(expectedOps)) throw new Error("expected Operations SHA is not immutable");
          if (new Set(receipts.map(r => r.operations_revision)).size !== 1 || receipts[0].operations_revision !== expectedOps) throw new Error("lane receipts do not share the frozen Operations revision");
          const matrix = JSON.parse(fs.readFileSync("operations/benchmark/polyglot/open_issue_matrix_52.json", "utf8"));
          const activePairsExpected = new Set(matrix.cases.filter(c => c.active !== false).map(c => c.issue + "|" + c.lane));
          const activeIssues = new Set([...activePairsExpected].map(x => x.split("|")[0]));
          const historicalIssues = new Set(["foundation#1264","foundation#1267","foundation#1281","operations#197"]);
          const activeObserved = new Set();
          const historicalObserved = new Set();
          for (const receipt of receipts) {
            const lane = receipt.lane;
            const expectedLane = new Set([...activePairsExpected].filter(key => key.endsWith("|" + lane)));
            const observedActive = new Set(receipt.results.filter(r => activeIssues.has(r.issue)).map(r => r.issue + "|" + r.lane));
            const observedHistorical = new Set(receipt.results.filter(r => historicalIssues.has(r.issue)).map(r => r.issue + "|" + r.lane));
            if (JSON.stringify([...observedActive].sort()) !== JSON.stringify([...expectedLane].sort())) throw new Error("active issue/lane mismatch in " + lane);
            const expectedHistorical = new Set([...historicalIssues].map(issue => issue + "|" + lane));
            if (JSON.stringify([...observedHistorical].sort()) !== JSON.stringify([...expectedHistorical].sort())) throw new Error("historical issue/lane mismatch in " + lane);
            if (Number(receipt.active_case_count) !== expectedLane.size) throw new Error("active case count mismatch in " + lane);
            if (Number(receipt.expected_active_case_count) !== Number(matrix.active_case_count)) throw new Error("active matrix count mismatch in " + lane);
            if (Number(receipt.case_count) !== expectedLane.size + historicalIssues.size) throw new Error("case count mismatch in " + lane);
            if (Number(receipt.expected_case_count) !== Number(receipt.case_count)) throw new Error("expected case count mismatch in " + lane);
            if (Number(receipt.historical_issue_count) !== historicalIssues.size) throw new Error("historical issue count mismatch in " + lane);
            if ((receipt.missing_cases || []).length) throw new Error("missing cases in " + lane);
            if (Number(receipt.failed_cases) !== 0) throw new Error("failed cases in " + lane);
            if (receipt.results.some(r => r.status === "FAIL")) throw new Error("FAIL result present in " + lane);
            for (const key of observedActive) activeObserved.add(key);
            for (const key of observedHistorical) historicalObserved.add(key);
          }
          const fullHistorical = new Set([...historicalIssues].flatMap(issue => ["L1","L2","L3","L4"].map(lane => issue + "|" + lane)));
          if (JSON.stringify([...activeObserved].sort()) !== JSON.stringify([...activePairsExpected].sort())) throw new Error("active coverage is incomplete");
          if (JSON.stringify([...historicalObserved].sort()) !== JSON.stringify([...fullHistorical].sort())) throw new Error("historical coverage is incomplete");
          const aggregate = {
            schema: "open-issue-polyglot-deep-scan/v3",
            lane_count: 4,
            matrix_issue_count: Number(matrix.issue_count),
            active_issue_count: Number(matrix.active_issue_count),
            matrix_case_count: Number(matrix.case_count),
            active_case_count: Number(matrix.active_case_count),
            historical_regression_issue_count: historicalIssues.size,
            executed_active_case_count: activeObserved.size,
            executed_historical_case_count: historicalObserved.size,
            executed_case_count: activeObserved.size + historicalObserved.size,
            status: "PASS",
            foundation_revisions: [...new Set(receipts.map(r => r.foundation_revision))].sort(),
            operations_revisions: [...new Set(receipts.map(r => r.operations_revision))].sort(),
            review_cases: receipts.reduce((sum, r) => sum + Number(r.review_cases || 0), 0),
          };
          fs.writeFileSync(path.join(root, "aggregate.json"), JSON.stringify(aggregate, null, 2) + "\\n");
          console.log(JSON.stringify(aggregate, null, 2));
          NODE

      - name: Upload aggregate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-issue-polyglot-deep-scan-aggregate-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .runtime/open-issue-deep-scan/aggregate.json
          if-no-files-found: error
          retention-days: 7