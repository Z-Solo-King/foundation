name: Open issue polyglot deep scan

on:
  push:
    branches: [main]
    paths:
      - "benchmark/polyglot/**"
      - ".github/workflows/open-issue-polyglot-deep-scan.yml"
      - "docs/**"
      - "frontend/**"
      - "polyglot/**"
      - "worker.py"
      - "backend/**"
      - "tests/**"
  pull_request_target:
    paths:
      - "benchmark/polyglot/**"
      - ".github/workflows/open-issue-polyglot-deep-scan.yml"
      - "docs/**"
      - "frontend/**"
      - "polyglot/**"
      - "worker.py"
      - "backend/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-open-issue-polyglot-deep-scan
  cancel-in-progress: false

jobs:
  lane:
    name: Deep scan ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [L1, L2, L3, L4]
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate scan matrix contract
        working-directory: operations
        run: |
          python - <<'PY'
          from tests.test_open_issue_polyglot_scan import (
              test_open_issue_matrix_covers_all_issues_and_four_lanes,
              test_open_issue_scan_methods_are_broader_than_language_only_checks,
              test_all_open_issue_policies_have_lane_coverage_and_requirements,
              test_open_issue_surface_map_matches_scan_contract,
          )
          test_open_issue_matrix_covers_all_issues_and_four_lanes()
          test_open_issue_scan_methods_are_broader_than_language_only_checks()
          test_all_open_issue_policies_have_lane_coverage_and_requirements()
          test_open_issue_surface_map_matches_scan_contract()
          print("scan matrix contract: PASS")
          PY

      - name: Run lane ${{ matrix.lane }}
        working-directory: operations
        run: |
          mkdir -p .runtime/open-issue-deep-scan
          python tools/open_issue_polyglot_scan.py             --foundation "$GITHUB_WORKSPACE"             --operations "$GITHUB_WORKSPACE/operations"             --matrix "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_matrix_56.json"             --surface-map "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_surface_map.json"             --lane "${{ matrix.lane }}"             --output ".runtime/open-issue-deep-scan/${{ matrix.lane }}.json"

      - name: Add provenance
        working-directory: operations
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          lane = "${{ matrix.lane }}"
          path = Path(".runtime/open-issue-deep-scan") / f"{lane}.json"
          payload = json.loads(path.read_text())
          payload["foundation_revision"] = subprocess.check_output(
              ["git", "-C", "$GITHUB_WORKSPACE", "rev-parse", "HEAD"], text=True
          ).strip()
          payload["operations_revision"] = subprocess.check_output(
              ["git", "-C", "$GITHUB_WORKSPACE/operations", "rev-parse", "HEAD"], text=True
          ).strip()
          path.write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Upload lane receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-issue-deep-scan-${{ matrix.lane }}
          path: operations/.runtime/open-issue-deep-scan/${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate 56 issue×lane cases
    needs: [lane]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download lane receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: open-issue-deep-scan-*
          path: .runtime/open-issue-deep-scan
          merge-multiple: true

      - name: Validate complete four-lane coverage
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path(".runtime/open-issue-deep-scan")
          receipts = [json.loads(path.read_text()) for path in sorted(root.glob("L*.json"))]
          assert len(receipts) == 4, f"expected 4 lane receipts, got {len(receipts)}"
          assert {receipt["lane"] for receipt in receipts} == {"L1", "L2", "L3", "L4"}
          assert all(receipt["case_count"] == 14 for receipt in receipts)
          assert all(receipt["issue_count"] == 14 for receipt in receipts)
          assert all(not receipt["missing_cases"] for receipt in receipts)
          cases = {(result["issue"], result["lane"]) for receipt in receipts for result in receipt["results"]}
          assert len(cases) == 56
          assert all(result["status"] != "FAIL" for receipt in receipts for result in receipt["results"])
          aggregate = {
              "schema": "open-issue-polyglot-deep-scan/v1",
              "lane_count": 4,
              "issue_count": 14,
              "case_count": 56,
              "status": "PASS",
              "foundation_revisions": sorted({receipt["foundation_revision"] for receipt in receipts}),
              "operations_revisions": sorted({receipt["operations_revision"] for receipt in receipts}),
              "review_cases": sum(receipt["review_cases"] for receipt in receipts),
          }
          Path(".runtime/open-issue-deep-scan/aggregate.json").write_text(json.dumps(aggregate, indent=2) + "\n")
          print(json.dumps(aggregate, indent=2))

      - name: Upload aggregate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-issue-polyglot-deep-scan-aggregate
          path: .runtime/open-issue-deep-scan/aggregate.json
          if-no-files-found: error
          retention-days: 30
