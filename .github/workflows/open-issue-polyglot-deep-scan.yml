name: Open issue polyglot deep scan
# Issue-count authority is the live Operations current_open_issue_inventory.json; never hard-code the queue size here.

on:
  push:
    branches: [main]
    paths:
      - "benchmark/polyglot/**"
      - ".github/workflows/open-issue-polyglot-deep-scan.yml"
      - "docs/**"
      - "frontend/**"
      - "polyglot/**"
      - "worker.py"
      - "backend/**"
      - "tests/**"
  pull_request_target:
    paths:
      - "benchmark/polyglot/**"
      - ".github/workflows/open-issue-polyglot-deep-scan.yml"
      - "docs/**"
      - "frontend/**"
      - "polyglot/**"
      - "worker.py"
      - "backend/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: foundation-open-issue-polyglot-deep-scan
  cancel-in-progress: false

jobs:
  lane:
    name: Deep scan ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [L1, L2, L3, L4]
    steps:
      - name: Validate Operations App configuration
        if: always() && github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          app_id_state=missing
          app_key_state=missing
          [ -n "${OPERATIONS_APP_ID:-}" ] && app_id_state=present
          [ -n "${OPERATIONS_APP_PRIVATE_KEY:-}" ] && app_key_state=present
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "### Deep-scan Operations App preflight\n\nOPERATIONS_APP_ID: **$app_id_state**\nOPERATIONS_APP_PRIVATE_KEY: **$app_key_state**" || true
          fi
          test "$app_id_state" = present
          test "$app_key_state" = present

      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Publish Operations token/checkout diagnostics
        if: always() && github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          TOKEN_OUTCOME: ${{ steps.operations-app.outcome }}
          TOKEN_CONCLUSION: ${{ steps.operations-app.conclusion }}
        run: |
          set -euo pipefail
          [ -n "${PR_NUMBER:-}" ] || exit 0
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "### Deep-scan Operations access diagnostic\n\nApp-token outcome: **${TOKEN_OUTCOME:-unknown}**\nApp-token conclusion: **${TOKEN_CONCLUSION:-unknown}**" || true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate scan matrix contract
        id: validate-scan-contract
        working-directory: operations
        run: |
          python - <<'PY'
          from tests.test_open_issue_polyglot_scan import (
              test_open_issue_matrix_covers_all_issues_and_four_lanes,
              test_open_issue_scan_methods_are_broader_than_language_only_checks,
              test_all_open_issue_policies_have_lane_coverage_and_requirements,
              test_open_issue_surface_map_matches_scan_contract,
          )
          test_open_issue_matrix_covers_all_issues_and_four_lanes()
          test_open_issue_scan_methods_are_broader_than_language_only_checks()
          test_all_open_issue_policies_have_lane_coverage_and_requirements()
          test_open_issue_surface_map_matches_scan_contract()
          print("scan matrix contract: PASS")
          PY

      # Cross-repo source coverage includes Foundation-owned acceptance validators when an issue spans the family.
      - name: Run lane ${{ matrix.lane }}
        id: run-lane
        working-directory: operations
        run: |
          mkdir -p .runtime/open-issue-deep-scan
          python tools/open_issue_polyglot_scan.py             --foundation "$GITHUB_WORKSPACE"             --operations "$GITHUB_WORKSPACE/operations"             --matrix "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_matrix_52.json"             --surface-map "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_surface_map.json"             --lane "${{ matrix.lane }}"             --output ".runtime/open-issue-deep-scan/${{ matrix.lane }}.json"

      - name: Emit lane diagnostic
        if: always()
        working-directory: operations
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate-scan-contract.outcome }}
          RUN_OUTCOME: ${{ steps.run-lane.outcome }}
        run: |
          set +e
          mkdir -p .runtime/open-issue-deep-scan
          python - <<'PY'
          import json, os
          from pathlib import Path
          lane="${{ matrix.lane }}"
          receipt=Path('.runtime/open-issue-deep-scan')/f'{lane}.json'
          payload={
              'schema':'open-issue-deep-scan/diagnostic/v1',
              'lane':lane,
              'validate_outcome':os.environ.get('VALIDATE_OUTCOME'),
              'run_outcome':os.environ.get('RUN_OUTCOME'),
              'receipt_present':receipt.exists(),
          }
          if receipt.exists():
              try:
                  r=json.loads(receipt.read_text(encoding='utf-8'))
                  payload.update({k:r.get(k) for k in ('case_count','expected_case_count','issue_count','failed_cases','review_cases','missing_cases')})
                  payload['failed_results']=[
                      {'issue':x.get('issue'),'lane':x.get('lane'),'status':x.get('status'),'findings':x.get('findings',[])}
                      for x in r.get('results',[]) if x.get('status') == 'FAIL'
                  ]
              except Exception as exc:
                  payload['receipt_parse_error']=repr(exc)
          Path('.runtime/open-issue-deep-scan').joinpath(f'{lane}-diagnostic.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Add provenance
        working-directory: operations
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          lane = "${{ matrix.lane }}"
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          operations_root = workspace / "operations"
          path = Path(".runtime/open-issue-deep-scan") / f"{lane}.json"
          payload = json.loads(path.read_text())
          payload["foundation_revision"] = os.environ["GITHUB_SHA"]
          payload["operations_revision"] = subprocess.check_output(
              ["git", "-C", str(operations_root), "rev-parse", "HEAD"], text=True
          ).strip()
          path.write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Upload lane receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-issue-deep-scan-${{ matrix.lane }}
          path: operations/.runtime/open-issue-deep-scan/**
          if-no-files-found: warn
          retention-days: 30

  # Refresh workflow revision after synchronized 10-issue inventory.
  aggregate:
    name: Aggregate dynamic issue×lane cases
    needs: [lane]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download lane receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: open-issue-deep-scan-*
          path: .runtime/open-issue-deep-scan
          merge-multiple: true

      - name: Validate complete four-lane coverage
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path(".runtime/open-issue-deep-scan")
          receipts = [json.loads(path.read_text()) for path in sorted(root.glob("L?.json"))]
          assert len(receipts) == 4, f"expected 4 lane receipts, got {len(receipts)}"
          assert {receipt["lane"] for receipt in receipts} == {"L1", "L2", "L3", "L4"}
          issue_counts = {int(receipt["issue_count"]) for receipt in receipts}
          case_counts = {int(receipt["case_count"]) for receipt in receipts}
          assert len(issue_counts) == 1, f"lane issue counts diverged: {sorted(issue_counts)}"
          assert len(case_counts) == 1, f"lane case counts diverged: {sorted(case_counts)}"
          expected_issue_count = next(iter(issue_counts))
          expected_case_count = next(iter(case_counts))
          assert expected_issue_count > 0
          assert expected_case_count == expected_issue_count
          assert all(not receipt["missing_cases"] for receipt in receipts)
          cases = {(result["issue"], result["lane"]) for receipt in receipts for result in receipt["results"]}
          assert len(cases) == expected_issue_count * 4
          assert all(result["status"] != "FAIL" for receipt in receipts for result in receipt["results"])
          aggregate = {
              "schema": "open-issue-polyglot-deep-scan/v1",
              "lane_count": 4,
              "issue_count": expected_issue_count,
              "case_count": expected_case_count,
              "status": "PASS",
              "foundation_revisions": sorted({receipt["foundation_revision"] for receipt in receipts}),
              "operations_revisions": sorted({receipt["operations_revision"] for receipt in receipts}),
              "review_cases": sum(receipt["review_cases"] for receipt in receipts),
          }
          Path(".runtime/open-issue-deep-scan/aggregate.json").write_text(json.dumps(aggregate, indent=2) + "\n")
          print(json.dumps(aggregate, indent=2))

      - name: Upload aggregate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-issue-polyglot-deep-scan-aggregate
          path: .runtime/open-issue-deep-scan/aggregate.json
          if-no-files-found: error
          retention-days: 30