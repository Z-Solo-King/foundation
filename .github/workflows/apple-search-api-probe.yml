name: Apple search API probe

on:
  push:
    branches:
      - diag/left-targets-v4-2026-09-26
  pull_request:

permissions:
  contents: read

jobs:
  apple:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: "24"}
      - name: Probe Apple search API
        run: node scripts/apple_search_api_probe.mjs
