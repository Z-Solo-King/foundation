name: Temporary scorecard formatter

on:
  push:
    branches:
      - migration/node-autonomous-scorecard-2026-10-02

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Format scorecard files
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.9 --write benchmark/autonomous_scorecard.mjs benchmark/test_autonomous_scorecard.mjs benchmark/research_artifact_catalog.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- benchmark/autonomous_scorecard.mjs benchmark/test_autonomous_scorecard.mjs benchmark/research_artifact_catalog.json; then
            exit 0
          fi
          git add benchmark/autonomous_scorecard.mjs benchmark/test_autonomous_scorecard.mjs benchmark/research_artifact_catalog.json
          git commit -m "chore: scorecard format pass"
          git push origin "HEAD:${GITHUB_REF_NAME}"
