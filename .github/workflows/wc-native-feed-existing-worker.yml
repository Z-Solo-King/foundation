name: WC Native Feed Existing Egress Worker
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/wc-google-feed-egress-bridge-20260929
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        site: [ads-store, ithunt, kccomputers, krg-kart]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Extract native feed
        env:
          SITE: ${{ matrix.site }}
          WORKER: https://feed-origin-probe-20260927.heroic-ai.workers.dev
        run: |
          mkdir -p artifacts/native
          curl -sS --max-time 300 -D artifacts/${SITE}.headers "${WORKER}/native/${SITE}" -o artifacts/${SITE}.body
          cat artifacts/${SITE}.headers
          wc -c artifacts/${SITE}.body
          if grep -qi '^x-native-feed-url:' artifacts/${SITE}.headers; then
            cp artifacts/${SITE}.body artifacts/native/${SITE}.xml
            node <<'NODE'
            const fs=require("fs"),crypto=require("crypto");
            const site=process.env.SITE;
            const s=fs.readFileSync("artifacts/native/"+site+".xml","utf8");
            if(!(s.includes("<rss")&&s.includes("http://base.google.com/ns/1.0")&&s.includes("<item")&&s.includes("<g:id")&&s.includes("<g:title")&&s.includes("<g:link")&&s.includes("<g:price")&&s.includes("<g:image_link"))) process.exit(1);
            console.log(JSON.stringify({site,url:fs.readFileSync("artifacts/"+site+".headers","utf8").split("\n").find(x=>/^x-native-feed-url:/i.test(x)),items:(s.match(/<item\\b/gi)||[]).length,bytes:Buffer.byteLength(s),sha256:crypto.createHash("sha256").update(s).digest("hex")}));
            NODE
          else
            echo "NATIVE_FEED_FOUND=0"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wc-native-existing-worker-${{ matrix.site }}
          path: artifacts/
          if-no-files-found: error
