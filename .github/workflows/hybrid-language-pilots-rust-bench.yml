        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
  
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
  
      - name: Materialize pinned Foundation public core
        working-directory: operations
        run: python scripts/sync_public_core.py
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
  
      - name: Install Python reference runtime
        working-directory: operations
        run: python -m pip install --disable-pip-version-check -e ".[test]"
  
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
  
      - name: Generate Python reference outputs
        working-directory: operations
        run: |
          python benchmark/polyglot/rust_jsonld_product/python_reference.py             benchmark/polyglot/rust_jsonld_product/corpus.jsonl             python-jsonld.jsonl
  
      - name: Generate Rust candidate outputs
        working-directory: operations
        run: |
          cargo run --quiet --manifest-path benchmark/polyglot/rust_jsonld_product/Cargo.toml             --bin differential --             benchmark/polyglot/rust_jsonld_product/corpus.jsonl             rust-jsonld.jsonl
  
      - name: Compare Python and Rust outputs
        working-directory: operations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          py = [json.loads(line) for line in Path("python-jsonld.jsonl").read_text().splitlines() if line]
          rs = [json.loads(line) for line in Path("rust-jsonld.jsonl").read_text().splitlines() if line]
          assert py == rs, "Rust JSON-LD output diverges from Python canonical output"
          assert len(py) == 32
          print("JSON-LD differential parity: PASS (32/32)")
          PY
  
      - name: Benchmark Rust candidate
        working-directory: operations
        run: cargo bench --manifest-path benchmark/polyglot/rust_jsonld_product/Cargo.toml --bench normalization
  
