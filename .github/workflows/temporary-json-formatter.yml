name: Temporary JSON formatter

on:
  push:
    branches:
      - fix/continuity-reconcile-20261003

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Format JSON
        run: npx --yes prettier@3.9.9 --write docs/FAMILY_SYNC_STATE.json
      - name: Show diff
        run: git diff --unified=5 -- docs/FAMILY_SYNC_STATE.json
