name: Heroic AI production release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroic-ai-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Canonical Heroic AI production release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Run canonical production release
        working-directory: ${{ github.workspace }}
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Z-Solo-King/foundation" || { echo 'Production release is restricted to the canonical Foundation repository'; exit 1; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo 'Production release is restricted to main'; exit 1; }
          test "$GITHUB_EVENT_NAME" != "pull_request" || { echo 'Privileged production release cannot run from pull_request'; exit 1; }
          test "$GITHUB_EVENT_NAME" != "pull_request_target" || { echo 'Privileged production release cannot run from pull_request_target'; exit 1; }
          bash scripts/production_release.sh

      - name: Create Foundation App installation token for bridge acceptance
        id: foundation-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FOUNDATION_APP_ID }}
          private-key: ${{ secrets.FOUNDATION_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: foundation
          permission-actions: write
          permission-contents: read

      - name: Prove canonical workflow-dispatch bridge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.foundation-app.outputs.token }}
          TARGET: main-push-actions-control-plane-probe.yml
          FOUNDATION_REF: main
        run: |
          set -euo pipefail
          expected_sha="$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          dispatch_epoch="$(date -u +%s)"

          payload="$(jq -nc --arg ref "$FOUNDATION_REF" --arg target "$TARGET" \
            '{ref:$ref,inputs:{target:$target}}')"

          status="$(curl -sS -o "$RUNNER_TEMP/bridge-dispatch-response.json" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/foundation-canonical-workflow-bridge.yml/dispatches")"
          echo "Foundation bridge dispatch -> HTTP ${status}"
          test "$status" = "204"

          bridge_run_id=""
          for _ in {1..24}; do
            runs_json="$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/foundation-canonical-workflow-bridge.yml/runs?event=workflow_dispatch&branch=${FOUNDATION_REF}&per_page=20")"
            bridge_run_id="$(python - "$dispatch_epoch" "$expected_sha" "$runs_json" <<'PY'
          import json, sys
          from datetime import datetime

          dispatch_epoch = int(sys.argv[1])
          expected_sha = sys.argv[2]
          payload = json.loads(sys.argv[3])

          def epoch(value):
              return int(datetime.fromisoformat(value.replace("Z", "+00:00")).timestamp())

          for run in payload.get("workflow_runs", []):
              created = run.get("created_at")
              if not created or epoch(created) < dispatch_epoch - 30:
                  continue
              if run.get("head_sha") == expected_sha:
                  print(run.get("id", ""))
                  break
          PY
            )"
            [[ -n "$bridge_run_id" ]] && break
            sleep 5
          done
          test -n "$bridge_run_id"

          bridge_conclusion=""
          for _ in {1..30}; do
            bridge_json="$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${bridge_run_id}")"
            bridge_status="$(jq -r '.status' <<<"$bridge_json")"
            bridge_conclusion="$(jq -r '.conclusion // empty' <<<"$bridge_json")"
            echo "Bridge run ${bridge_run_id}: ${bridge_status}/${bridge_conclusion}"
            [[ "$bridge_status" == "completed" ]] && break
            sleep 5
          done
          test "$bridge_conclusion" = "success"

          target_run_id=""
          for _ in {1..24}; do
            target_runs="$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET}/runs?event=workflow_dispatch&branch=${FOUNDATION_REF}&per_page=20")"
            target_run_id="$(python - "$dispatch_epoch" "$expected_sha" "$target_runs" <<'PY'
          import json, sys
          from datetime import datetime

          dispatch_epoch = int(sys.argv[1])
          expected_sha = sys.argv[2]
          payload = json.loads(sys.argv[3])

          def epoch(value):
              return int(datetime.fromisoformat(value.replace("Z", "+00:00")).timestamp())

          for run in payload.get("workflow_runs", []):
              created = run.get("created_at")
              if not created or epoch(created) < dispatch_epoch - 30:
                  continue
              if run.get("head_sha") == expected_sha:
                  print(run.get("id", ""))
                  break
          PY
            )"
            [[ -n "$target_run_id" ]] && break
            sleep 5
          done
          test -n "$target_run_id"

          jobs_json="$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${target_run_id}/jobs?per_page=100")"
          job_count="$(jq '.total_count // (.jobs | length) // 0' <<<"$jobs_json")"
          test "$job_count" -gt 0

          python - "$expected_sha" "$bridge_run_id" "$target_run_id" "$job_count" <<'PY'
          import json, sys
          from pathlib import Path

          payload = {
              "schema": "foundation-workflow-dispatch-bridge-receipt/v1",
              "target": "main-push-actions-control-plane-probe.yml",
              "foundation_sha": sys.argv[1],
              "bridge_run_id": int(sys.argv[2]),
              "target_run_id": int(sys.argv[3]),
              "target_job_count": int(sys.argv[4]),
              "status": "success",
          }
          Path(".runtime/workflow-dispatch-bridge-receipt.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload workflow-dispatch bridge receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-dispatch-bridge-receipt
          path: .runtime/workflow-dispatch-bridge-receipt.json
          if-no-files-found: error

      - name: Upload cross-repository audit receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-repository-audit-receipt
          path: .runtime/cross-repository-audit-receipt.json
          if-no-files-found: warn
