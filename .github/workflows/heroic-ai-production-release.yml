name: Heroic AI production release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroic-ai-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Canonical Heroic AI production release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Run canonical production release
        working-directory: ${{ github.workspace }}
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Z-Solo-King/foundation" || { echo 'Production release is restricted to the canonical Foundation repository'; exit 1; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo 'Production release is restricted to main'; exit 1; }
          test "$GITHUB_EVENT_NAME" != "pull_request" || { echo 'Privileged production release cannot run from pull_request'; exit 1; }
          test "$GITHUB_EVENT_NAME" != "pull_request_target" || { echo 'Privileged production release cannot run from pull_request_target'; exit 1; }
          bash scripts/production_release.sh

      - name: Upload cross-repository audit receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-repository-audit-receipt
          path: .runtime/cross-repository-audit-receipt.json
          if-no-files-found: warn
