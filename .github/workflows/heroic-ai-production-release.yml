name: Heroic AI production release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  LEGACY_PUBLIC_WORKER: ${{ secrets.LEGACY_PUBLIC_WORKER }}
  LEGACY_PRIVATE_WORKER: ${{ secrets.LEGACY_PRIVATE_WORKER }}

permissions:
  contents: read
  issues: write

concurrency:
  group: heroic-ai-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Canonical Heroic AI production release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Persistence bootstrap is automatic inside production_release.sh; no manual override is permitted.
      - name: Run canonical production release
        id: production_release
        working-directory: ${{ github.workspace }}
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Z-Solo-King/foundation" || { echo 'Production release is restricted to the canonical Foundation repository'; exit 1; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo 'Production release is restricted to main'; exit 1; }
          test "$GITHUB_EVENT_NAME" != "pull_request" || { echo 'Privileged production release cannot run from pull_request'; exit 1; }
          test "$GITHUB_EVENT_NAME" != "pull_request_target" || { echo 'Privileged production release cannot run from pull_request_target'; exit 1; }
          bash scripts/production_release.sh

      - name: Preflight exact nightly runtime before research dispatch
        if: ${{ steps.production_release.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          operations_ref="$(python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path("docs/OPERATIONS_PIN_MANIFEST.json").read_text(encoding="utf-8"))["pins"]["production_runtime"]["sha"]
          print(value)
          PY
          )"
          printf '%s' "$operations_ref" | grep -Eq '^[0-9a-f]{40}$'

          dispatch_started="$(date +%s)"
          gh workflow run nightly-research-provider-preflight.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field target_sha="$GITHUB_SHA" \
            --field production_release_run_id="$GITHUB_RUN_ID" \
            --field operations_research_ref="$operations_ref"

          preflight_run_id=""
          for _ in $(seq 1 30); do
            runs_json="$(gh run list --workflow nightly-research-provider-preflight.yml --repo "$GITHUB_REPOSITORY" --limit 20 --json databaseId,createdAt,status,conclusion,headSha,event)"
            preflight_run_id="$(jq -r --arg sha "$GITHUB_SHA" --argjson started "$dispatch_started" '[.[] | select(.event == "workflow_dispatch" and .headSha == $sha and ((.createdAt | fromdateiso8601) >= $started))] | sort_by(.createdAt) | last | .databaseId // empty' <<<"$runs_json")"
            if [ -n "$preflight_run_id" ]; then
              status="$(jq -r --argjson id "$preflight_run_id" '.[] | select(.databaseId == $id) | .status' <<<"$runs_json" | head -1)"
              conclusion="$(jq -r --argjson id "$preflight_run_id" '.[] | select(.databaseId == $id) | .conclusion // empty' <<<"$runs_json" | head -1)"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success" || { echo "Research preflight failed; refusing to launch nightly."; exit 1; }
                break
              fi
            fi
            sleep 5
          done
          test -n "$preflight_run_id" || { echo "Unable to reconcile the dispatched research preflight run"; exit 1; }

          gh workflow run nightly-multi-agent-research-v3.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field dry_run=false \
            --field target_sha="$GITHUB_SHA" \
            --field production_release_run_id="$GITHUB_RUN_ID" \
            --field operations_research_ref="$operations_ref"

          gh workflow run live-chatbot-production-smoke.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field target_sha="$GITHUB_SHA" \
            --field production_release_run_id="$GITHUB_RUN_ID"

      - name: Upload cross-repository audit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-repository-audit-receipt
          path: .runtime/cross-repository-audit-receipt.json
          if-no-files-found: warn

      - name: Upload runtime acceptance receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-runtime-acceptance-receipts
          path: .runtime/*.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish sanitized production receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome="${{ steps.production_release.outcome }}"
          operations_ref="$(sed -n 's/^OPERATIONS_REF="\([0-9a-f]\{40\}\)"$/\1/p' scripts/production_release.sh | head -n1)"
          mkdir -p .runtime
          {
            echo "# Canonical production release receipt"
            echo
            echo "- Workflow run: ${GITHUB_RUN_ID}"
            echo "- Foundation revision: ${GITHUB_SHA}"
            echo "- Operations revision: ${operations_ref:-unknown}"
            echo "- Release step outcome: ${outcome}"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo
            echo "## Runtime receipt files"
            if compgen -G '.runtime/*.json' > /dev/null; then
              find .runtime -maxdepth 1 -type f -name '*.json' -printf '%f\n' | sort | sed 's/^/- /'
            else
              echo '- none produced'
            fi
            echo
            echo "This receipt is a sanitized index only; secret values and provider responses are not included."
          } > .runtime/production-release-tracker-receipt.md
          gh issue comment 58 --repo "$GITHUB_REPOSITORY" --body-file .runtime/production-release-tracker-receipt.md
