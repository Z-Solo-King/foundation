name: Temporary retirement formatter

on:
  push:
    branches:
      - refactor/canonical-retirement-engine-20261003

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'canonical Prettier output') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Format retirement files
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.9 --write tools/retire_microscope_branches.mjs docs/MICROSCOPIC_DEDUP_STANDARD.md
      - name: Commit canonical Prettier output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/retire_microscope_branches.mjs docs/MICROSCOPIC_DEDUP_STANDARD.md
          if git diff --cached --quiet; then
            echo "already canonical"
            exit 0
          fi
          git commit -m "style: apply canonical Prettier output"
          git push origin HEAD:refactor/canonical-retirement-engine-20261003
