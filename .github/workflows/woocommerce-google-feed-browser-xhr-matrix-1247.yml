name: WooCommerce Google Feed Browser XHR Matrix #1247

on:
  push:
    branches:
      - "test/woocommerce-feed-archive-recovery-1247-20260927"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wc-google-feed-browser-xhr-1247-latest
  cancel-in-progress: true

jobs:
  crawl:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {slug: ithunt, name: "ithunt", url: "https://ithunt.in"}
          - {slug: kccomputers, name: "kccomputers", url: "https://kccomputers.co.in"}
          - {slug: krg-kart, name: "KRG KART", url: "https://krgkart.com"}
          - {slug: pc-kumar-infotech, name: "PC Kumar Infotech", url: "https://pckumar.in"}
          - {slug: pchubshop, name: "PCHubShop", url: "https://www.pchubshop.com"}
          - {slug: scl-gaming, name: "SCL Gaming", url: "https://sclgaming.in"}
          - {slug: variety-infotech, name: "Variety Infotech", url: "https://varietyinfotech.com"}
          - {slug: moskeys, name: "Moskeys", url: "https://moskeys.com"}
          - {slug: theproaudio, name: "Theproaudio", url: "https://www.theproaudio.com"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-package-lock --no-save playwright
          npx playwright install --with-deps chromium
      - name: Syntax check
        run: node --check tools/woocommerce_google_feed_product_crawl_1247.mjs
      - name: Run public browser/XHR crawl
        run: |
          node tools/woocommerce_google_feed_product_crawl_1247.mjs \
            --site-name "${{ matrix.name }}" \
            --site-url "${{ matrix.url }}"
      - name: Upload browser/XHR evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1247-browser-xhr-${{ matrix.slug }}
          path: out/feed-crawl-1247/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: aggregate
    if: always()
    needs: crawl
    runs-on: ubuntu-24.04
    steps:
      - name: Download browser/XHR evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: v1247-browser-xhr-*
          path: out/all-sites
          merge-multiple: false
      - name: Aggregate
        run: |
          node <<'NODE'
          const fs=require('fs'), path=require('path');
          const root='out/all-sites', reports=[];
          function walk(dir){
            if(!fs.existsSync(dir))return;
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,e.name);
              if(e.isDirectory())walk(p);
              else if(e.name==='report.json'){try{reports.push(JSON.parse(fs.readFileSync(p,'utf8')))}catch(err){reports.push({status:'REPORT_PARSE_ERROR',file:p,error:String(err)})}}
            }
          }
          walk(root);
          reports.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
          const verified=reports.flatMap(r=>(r.verified_google_xml||[]).map(v=>({...v,site:r.name})));
          const summary={schema_version:'foundation-browser-xhr-1247/v1',generated_on:new Date().toISOString(),sites:reports.length,verified_feed_count:verified.length,verified_google_xml:verified,results:reports};
          fs.mkdirSync('out/aggregate',{recursive:true});
          fs.writeFileSync('out/aggregate/summary.json',JSON.stringify(summary,null,2)+'\n');
          fs.writeFileSync('out/aggregate/reports.json',JSON.stringify(reports,null,2)+'\n');
          console.log(JSON.stringify({sites:summary.sites,verified_feed_count:summary.verified_feed_count,verified_google_xml:summary.verified_google_xml},null,2));
          NODE
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1247-browser-xhr-aggregate
          path: out/aggregate/
          if-no-files-found: error
          retention-days: 30
