name: Final chatbot cleanup

on:
  push:
    branches:
      - fix/chatbot-production-source-sync-20260922

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Restore existing repository workflow
        run: |
          git show origin/main:.github/workflows/prepare-live-chat-source-fix.yml > .github/workflows/prepare-live-chat-source-fix.yml
      - name: Normalize chatbot UX function
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("frontend/ux_enhancements.js")
          text=path.read_text(encoding="utf-8")
          start=text.index("  async function enhancedSubmitChat(text, chatId) {")
          end=text.index("\n  function installSubmitWrapper()", start)
          new="""  async function enhancedSubmitChat(text, chatId) {
    stopRequested = false;
    try {
      return await api.__originalSubmitChat(text, chatId);
    } catch (error) {
      if (stopRequested) {
        submitGuidedMessage('Response stopped by you. The backend request was cancelled.');
      } else if (/unauthorized|401/i.test(String(error?.message || error))) {
        submitGuidedMessage('Public chat does not require a session token. Protected operational views still do.');
      }
      throw error;
    }
  }
"""
          path.write_text(text[:start]+new+text[end:],encoding="utf-8")
          PY
      - name: Remove patch generator
        run: rm -f scripts/patch_live_chatbot_source.py
      - name: Validate
        run: |
          python -m py_compile worker.py
          node --check frontend/ux_enhancements.js
          python -m pip install --disable-pip-version-check "pytest>=8,<10"
          python -m pytest -q tests/test_live_chatbot_runtime_contract.py tests/test_frontend_ux_completeness.py
      - name: Commit and remove cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/final-chatbot-cleanup.yml 2>/dev/null || true
          git add .github/workflows/prepare-live-chat-source-fix.yml frontend/ux_enhancements.js
          git add -u scripts/patch_live_chatbot_source.py
          git commit -m "fix: restore repository workflow and normalize chatbot UI"
          git push origin HEAD:$GITHUB_REF_NAME
