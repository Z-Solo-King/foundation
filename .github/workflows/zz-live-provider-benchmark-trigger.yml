name: Temporary live provider benchmark trigger

on:
  push:
    branches:
      - bench/live-provider-execution-2026-10-03

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch live provider benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run live-ai-provider-crossfire.yml --repo "$GITHUB_REPOSITORY" --ref bench/live-provider-execution-2026-10-03
          echo "Dispatched live-ai-provider-crossfire.yml from benchmark branch."
