name: WooCommerce XML Live Recovery V15\non:\n  push:\n    branches: [feat/wc-xml-live-recovery-v15-20261001]\n    paths:\n      - tools/woocommerce_xml_live_v15.mjs\n      - tests/test_woocommerce_xml_live_v15.mjs\n      - .github/workflows/woocommerce-xml-live-v15.yml\n  workflow_dispatch:\npermissions:\n  contents: read\njobs:\n  recover:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    strategy:\n      fail-fast: false\n      matrix:\n        shard: [1,2,3,4,5,6]\n    env:\n      SHARD: \${{ matrix.shard }}\n      SHARDS: 6\n    steps:\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1\n      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020\n        with:\n          node-version: \"22\"\n          package-manager-cache: false\n      - run: node --test tests/test_woocommerce_xml_live_v15.mjs\n      - run: node tools/woocommerce_xml_live_v15.mjs\n      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02\n        with:\n          name: woocommerce-xml-live-v15-shard-\${{ matrix.shard }}\n          path: out/woocommerce-xml-live-v15/\n          retention-days: 30\n