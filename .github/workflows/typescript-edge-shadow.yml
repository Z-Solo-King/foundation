name: TypeScript edge shadow

on:
  pull_request:
    paths:
      - "edge_ts/**"
      - ".github/workflows/typescript-edge-shadow.yml"

permissions:
  contents: read

jobs:
  typecheck-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge_ts/package.json

      - name: Install
        working-directory: edge_ts
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: edge_ts
        run: npm run typecheck

      - name: Contract test
        working-directory: edge_ts
        run: npm test
