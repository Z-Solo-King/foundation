name: Temporary Operations TypeScript contract current-head gate

on:
  push:
    branches:
      - audit/operations-ts-contract-current-head-2026-10-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: migration/ops-ts-observation-contract-authority-2026-10-02
          path: operations
          token: ${{ steps.operations-app.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Materialize Operations pinned Foundation public core
        working-directory: operations
        run: |
          set -euo pipefail
          env -u FOUNDATION_CORE_GIT -u FOUNDATION_CORE_SOURCE node scripts/sync_public_core.mjs
          test -f foundation_core/__init__.py
      - name: Typecheck and test Operations observation contract
        working-directory: operations/polyglot/observation-contract-strict
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          mkdir -p .runtime
          npm run differential
          npm run differential:python
          npm run differential:compare
          npm run benchmark
      - name: Verify retired Python observation boundary is absent
        working-directory: operations
        run: |
          set -euo pipefail
          test ! -e extractor_mapper/observation_contract.py
          test ! -e extractor_mapper/replay_bridge.py
          test ! -e tests/test_observation_contract.py
          test ! -e tests/test_observation_contract_architecture.py
          test ! -e tests/test_v175_v18_replay_bridge.py
          if git grep -n -E 'extractor_mapper\.observation_contract|extractor_mapper\.replay_bridge|feed_candidate_cli\.py' -- extractor_mapper private tools tests polyglot | grep -v 'differential_reference.py'; then
            echo "active source reference to retired Python boundary found"
            exit 1
          fi

      - name: Run mapper/extractor cross-audit
        working-directory: operations
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python tools/mapper_extractor_cross_audit.py             --foundation "${{ github.workspace }}"             --operations "${{ github.workspace }}/operations"             --output .runtime/mapper-extractor-cross-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path(".runtime/mapper-extractor-cross-audit.json").read_text())
          assert payload["status"] == "PASS", payload
          PY

      - name: Typecheck and test Operations edge
        working-directory: operations/polyglot/edge-worker
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
