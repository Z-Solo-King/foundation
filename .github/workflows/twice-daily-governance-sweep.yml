name: Twice-daily governance sweep

on:
  schedule:
    - cron: "17 2 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan/validate only; never dispatch a child workflow"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: twice-daily-governance-sweep
  cancel-in-progress: false

jobs:
  governance:
    name: Cross-system governance and hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Foundation main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Create read-only Operations token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
          permission-issues: write

      - name: Checkout Operations main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pinned hygiene tool
        run: python -m pip install --disable-pip-version-check ruff==0.16.9

      - name: Snapshot live work and execution state
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONS_GH_TOKEN: ${{ steps.operations-app.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/governance
          gh api "repos/Z-Solo-King/foundation/issues?state=open&per_page=100" --jq '[.[] | {number,title,updatedAt:.updated_at,createdAt:.created_at,labels:[.labels[].name],url:.html_url}]' > .runtime/governance/foundation-issues.json
          gh api "repos/Z-Solo-King/foundation/pulls?state=open&per_page=100" --jq '[.[] | {number,title,updatedAt:.updated_at,createdAt:.created_at,headSha:.head.sha,headRef:.head.ref,url:.html_url}]' > .runtime/governance/foundation-prs.json
          gh api "repos/Z-Solo-King/foundation/actions/runs?per_page=100" --jq '[.workflow_runs[] | {id,name,path,status,conclusion,created_at,run_started_at,updated_at,head_sha,event}]' > .runtime/governance/foundation-runs.json
          GH_TOKEN="$OPERATIONS_GH_TOKEN" gh api "repos/Z-Solo-King/operations/issues?state=open&per_page=100" --jq '[.[] | {number,title,updatedAt:.updated_at,createdAt:.created_at,labels:[.labels[].name],url:.html_url}]' > .runtime/governance/operations-issues.json
          GH_TOKEN="$OPERATIONS_GH_TOKEN" gh api "repos/Z-Solo-King/operations/pulls?state=open&per_page=100" --jq '[.[] | {number,title,updatedAt:.updated_at,createdAt:.created_at,headSha:.head.sha,headRef:.head.ref,url:.html_url}]' > .runtime/governance/operations-prs.json
          GH_TOKEN="$OPERATIONS_GH_TOKEN" gh api "repos/Z-Solo-King/operations/actions/runs?per_page=100" --jq '[.workflow_runs[] | {id,name,path,status,conclusion,created_at,run_started_at,updated_at,head_sha,event}]' > .runtime/governance/operations-runs.json
          GH_TOKEN="$OPERATIONS_GH_TOKEN" gh api repos/Z-Solo-King/operations/commits/main --jq .sha > .runtime/governance/operations-main-sha
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".runtime/governance")
          payload={
              "schema":"governance-github-snapshot/v1",
              "foundation":{"issues":json.loads((root/"foundation-issues.json").read_text()),"prs":json.loads((root/"foundation-prs.json").read_text()),"runs":json.loads((root/"foundation-runs.json").read_text())},
              "operations":{"issues":json.loads((root/"operations-issues.json").read_text()),"prs":json.loads((root/"operations-prs.json").read_text()),"runs":json.loads((root/"operations-runs.json").read_text())},
          }
          (root/"github-snapshot.json").write_text(json.dumps(payload)+"\n")
          PY

      - name: Collect deterministic family audit summaries
        env:
          GOVERNANCE_AUDIT_FILE: .runtime/governance-audit.json
        run: |
          set -u
          mkdir -p .runtime
          run_summary() {
            local label="$1"
            shift
            local output
            output="$("${@}" 2>&1)"
            local status=$?
            python - "$label" "$status" "$output" <<'PY'
          import json, sys
          label, status, output = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          try:
              payload = json.loads(output)
          except json.JSONDecodeError:
              payload = {"passed": False, "runner_output": output[-500:]}
          payload["exit_code"] = status
          print(json.dumps({"label": label, "result": payload}, sort_keys=True))
          PY
          }
          foundation_hygiene="$(run_summary foundation_hygiene python tools/repository_hygiene.py --all --format-check --summary-only)"
          foundation_sync="$(run_summary foundation_sync python tools/code_documentation_sync.py --all --strict --summary-only)"
          operations_hygiene="$(run_summary operations_hygiene python operations/tools/repository_hygiene.py --root operations --all --format-check --summary-only)"
          operations_sync="$(run_summary operations_sync python operations/tools/code_documentation_sync.py --root operations --all --strict --summary-only)"
          python - "$foundation_hygiene" "$foundation_sync" "$operations_hygiene" "$operations_sync" > "$GOVERNANCE_AUDIT_FILE" <<'PY'
          import json, sys
          def unwrap(raw):
              value = json.loads(raw)
              return value["result"]
          data = {
              "schema": "twice-daily-governance-audit/v1",
              "foundation": {"hygiene": unwrap(sys.argv[1]), "sync": unwrap(sys.argv[2])},
              "operations": {"hygiene": unwrap(sys.argv[3]), "sync": unwrap(sys.argv[4])},
              "contract_parity": True,
              "privacy_boundary": "Operations findings are aggregate-only before AI planning.",
          }
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
          cat "$GOVERNANCE_AUDIT_FILE"

      - name: Cross-fire observation batch 1
        run: |
          set -euo pipefail
          for lane in structure_hygiene migration_boundary research_feed provider_runtime; do
            python tools/comprehensive_governance_scan.py \
              --foundation . \
              --operations operations \
              --snapshot .runtime/governance/github-snapshot.json \
              --lane "$lane" \
              --output ".runtime/governance/$lane.json" &
          done
          wait

      - name: Cross-fire observation batch 2
        run: |
          set -euo pipefail
          for lane in work_items_workflow maps_docs_policy quality_learning_evolution performance_resources; do
            python tools/comprehensive_governance_scan.py \
              --foundation . \
              --operations operations \
              --snapshot .runtime/governance/github-snapshot.json \
              --lane "$lane" \
              --output ".runtime/governance/$lane.json" &
          done
          wait

      - name: Reconcile and publish governance findings
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONS_GH_TOKEN: ${{ steps.operations-app.outputs.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path(".runtime/governance")
          findings={}
          ignored={"github-snapshot.json","merged.json","public.json","foundation-hygiene.json","foundation-sync.json","operations-hygiene.json","operations-sync.json"}
          for path in root.glob("*.json"):
              if path.name in ignored:
                  continue
              payload=json.loads(path.read_text(encoding="utf-8"))
              for finding in payload.get("findings",[]):
                  findings[finding["finding_id"]]=finding
          snapshot=json.loads((root/"github-snapshot.json").read_text(encoding="utf-8"))
          merged={
              "schema":"comprehensive-governance-scan/v1",
              "generated_at":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
              "lane":"crossfire",
              "repos":{repo:{kind:len(value) for kind,value in data.items()} for repo,data in snapshot.items()},
              "coverage":{
                  "finding_count":len(findings),
                  "critical_findings":sum(x["severity"]=="critical" for x in findings.values()),
                  "attention_findings":sum(x["severity"]=="attention" for x in findings.values()),
                  "info_findings":sum(x["severity"]=="info" for x in findings.values()),
                  "telemetry_status":"descriptive_only",
              },
          crossfire_reasons=set()
          crossfire_critical_reasons=set()
          provider_target=6
          provider_strong_threshold=5
          for payload in (json.loads(path.read_text(encoding="utf-8")) for path in root.glob("*.json") if path.name not in ignored):
              policy=payload.get("crossfire_policy") or {}
              crossfire_reasons.update(policy.get("ai_escalation_reason_codes") or [])
              crossfire_critical_reasons.update(policy.get("critical_ai_escalation_reason_codes") or [])
          merged={
              "schema":"comprehensive-governance-scan/v1",
              "generated_at":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
              "lane":"crossfire",
              "repos":{repo:{kind:len(value) for kind,value in data.items()} for repo,data in snapshot.items()},
              "coverage":{
                  "finding_count":len(findings),
                  "critical_findings":sum(x["severity"]=="critical" for x in findings.values()),
                  "attention_findings":sum(x["severity"]=="attention" for x in findings.values()),
                  "info_findings":sum(x["severity"]=="info" for x in findings.values()),
                  "telemetry_status":"descriptive_only",
              },
              "findings":list(findings.values()),
              "cross_fire_lanes":["structure_hygiene","migration_boundary","research_feed","provider_runtime","work_items_workflow","maps_docs_policy","quality_learning_evolution","performance_resources"],
              "crossfire_policy":{
                  "deterministic_first":True,
                  "read_only_parallel":True,
                  "mutations_serialized":True,
                  "provider_target":provider_target,
                  "provider_strong_threshold":provider_strong_threshold,
                  "provider_lanes_requested":provider_target if crossfire_reasons else 0,
                  "ai_escalation_required":bool(crossfire_reasons),
                  "ai_escalation_reason_codes":sorted(crossfire_reasons),
                  "critical_ai_escalation_reason_codes":sorted(crossfire_critical_reasons),
                  "ai_task_family":"audit_assist" if crossfire_reasons else None,
                  "authority":"canonical deterministic/policy owners",
              },
              "authority_note":"Observation/governance overlay only.",
          }
          (root/"merged.json").write_text(json.dumps(merged,indent=2)+"\n",encoding="utf-8")
          top=sorted([
              {"finding_id":x["finding_id"],"lane":x["lane"],"severity":x["severity"],"code":x["code"],"summary":x["summary"],"paths":x.get("paths",[])[:8]}
              for x in findings.values() if x["severity"]!="info"
          ],key=lambda x:({"critical":0,"attention":1,"warning":2}.get(x["severity"],9),x["finding_id"]))[:20]
          audit={
              "schema":"twice-daily-governance-audit/v2",
              "generated_at":merged["generated_at"],
              "coverage":merged["coverage"],
              "top_findings":top,
              "privacy_boundary":"Private Operations source remains on trusted runner; AI receives only bounded governance summaries.",
              "ai_remediation_authority":"tools/autonomous_engineering_supervisor.mjs",
              "deterministic_finding_publication_authority":"tools/publish_governance_findings.py",
          }
          Path(".runtime/governance-audit.json").write_text(json.dumps(audit,indent=2)+"\n",encoding="utf-8")
          safe=[]
          for finding in merged["findings"]:
              item={key:finding[key] for key in ("finding_id","lane","category","severity","code","summary") if key in finding}
              paths=[path for path in finding.get("paths",[]) if Path(path).exists()]
              if paths:item["paths"]=paths
              safe.append(item)
          (root/"public.json").write_text(json.dumps({**merged,"findings":safe,"privacy":"Foundation-safe metadata; private Operations paths/details removed."},indent=2)+"\n",encoding="utf-8")
          PY
          python tools/publish_governance_findings.py --repo Z-Solo-King/foundation --report .runtime/governance/public.json
          GH_TOKEN="$OPERATIONS_GH_TOKEN" python tools/publish_governance_findings.py --repo Z-Solo-King/operations --report .runtime/governance/merged.json
      - name: Cross-fire AI escalation decision
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          merged=json.loads(Path(".runtime/governance/merged.json").read_text(encoding="utf-8"))
          policy=merged.get("crossfire_policy") or {}
          request={
              "schema":"crossfire-escalation-request/v1",
              "required":bool(policy.get("ai_escalation_required")),
              "provider_target":int(policy.get("provider_target",6)),
              "provider_strong_threshold":int(policy.get("provider_strong_threshold",5)),
              "provider_lanes_requested":int(policy.get("provider_lanes_requested",0)),
              "reason_codes":sorted(policy.get("ai_escalation_reason_codes") or []),
              "critical_reason_codes":sorted(policy.get("critical_ai_escalation_reason_codes") or []),
              "task_family":policy.get("ai_task_family"),
              "deterministic_first":bool(policy.get("deterministic_first",True)),
              "read_only_parallel":bool(policy.get("read_only_parallel",True)),
              "mutations_serialized":bool(policy.get("mutations_serialized",True)),
          }
          Path(".runtime/governance/crossfire-escalation-request.json").write_text(json.dumps(request,indent=2)+"\n",encoding="utf-8")
          PY
          cat .runtime/governance/crossfire-escalation-request.json
          if [ "$DRY_RUN" = "true" ]; then
            echo "Explicit dry-run: no AI provider benchmark dispatch."
            exit 0
          fi
          required=$(jq -r '.required' .runtime/governance/crossfire-escalation-request.json)
          if [ "$required" != "true" ]; then
            echo "No ambiguous/high-information finding requires provider cross-fire."
            exit 0
          fi
          active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/live-ai-provider-crossfire.yml/runs?per_page=30" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" -gt 0 ]; then
            echo "Provider cross-fire already queued/running; no duplicate dispatch."
            exit 0
          fi
          gh workflow run live-ai-provider-crossfire.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f operations_ref="$(cat .runtime/governance/operations-main-sha)"
          echo "Triggered governed six-slot provider cross-fire from trusted main."

      - name: Validate supervisor contract
        run: |
          node --check tools/autonomous_mission_router.mjs
          node --check tools/autonomous_engineering_supervisor.mjs
          node --test tests/autonomous_mission_router.test.mjs tests/autonomous_engineering_supervisor.test.mjs

      - name: Run governed autonomous sweep
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          GOVERNANCE_AUDIT_FILE: .runtime/governance-audit.json
          MISSION_MODE: governance_sweep
          PUBLIC_WORKER_URL: https://ai-cio.pages.dev
          MAX_PLANNING_CYCLES: "3"
          MAX_WORKFLOW_ATTEMPTS: "2"
          FOUNDATION_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: node tools/autonomous_engineering_supervisor.mjs