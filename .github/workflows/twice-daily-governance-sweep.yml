name: Twice-daily governance sweep

on:
  schedule:
    - cron: "17 2 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan/validate only; never dispatch a child workflow"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: twice-daily-governance-sweep
  cancel-in-progress: false

jobs:
  governance:
    name: Cross-system governance and hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Foundation main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Create read-only Operations token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pinned hygiene tool
        run: python -m pip install --disable-pip-version-check ruff==0.16.9

      - name: Collect deterministic family audit summaries
        env:
          GOVERNANCE_AUDIT_FILE: .runtime/governance-audit.json
        run: |
          set -u
          mkdir -p .runtime
          run_summary() {
            local label="$1"
            shift
            local output
            output="$("${@}" 2>&1)"
            local status=$?
            python - "$label" "$status" "$output" <<'PY'
          import json, sys
          label, status, output = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          try:
              payload = json.loads(output)
          except json.JSONDecodeError:
              payload = {"passed": False, "runner_output": output[-500:]}
          payload["exit_code"] = status
          print(json.dumps({"label": label, "result": payload}, sort_keys=True))
          PY
          }
          foundation_hygiene="$(run_summary foundation_hygiene python tools/repository_hygiene.py --all --format-check --summary-only)"
          foundation_sync="$(run_summary foundation_sync python tools/code_documentation_sync.py --all --strict --summary-only)"
          operations_hygiene="$(run_summary operations_hygiene python operations/tools/repository_hygiene.py --root operations --all --format-check --summary-only)"
          operations_sync="$(run_summary operations_sync python operations/tools/code_documentation_sync.py --root operations --all --strict --summary-only)"
          python - "$foundation_hygiene" "$foundation_sync" "$operations_hygiene" "$operations_sync" > "$GOVERNANCE_AUDIT_FILE" <<'PY'
          import json, sys
          def unwrap(raw):
              value = json.loads(raw)
              return value["result"]
          data = {
              "schema": "twice-daily-governance-audit/v1",
              "foundation": {"hygiene": unwrap(sys.argv[1]), "sync": unwrap(sys.argv[2])},
              "operations": {"hygiene": unwrap(sys.argv[3]), "sync": unwrap(sys.argv[4])},
              "contract_parity": True,
              "privacy_boundary": "Operations findings are aggregate-only before AI planning.",
          }
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
          cat "$GOVERNANCE_AUDIT_FILE"

      - name: Validate supervisor contract
        run: |
          node --check tools/autonomous_mission_router.mjs
          node --check tools/autonomous_engineering_supervisor.mjs
          node --test tests/autonomous_mission_router.test.mjs tests/autonomous_engineering_supervisor.test.mjs

      - name: Run governed autonomous sweep
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          GOVERNANCE_AUDIT_FILE: .runtime/governance-audit.json
          MISSION_MODE: governance_sweep
          PUBLIC_WORKER_URL: https://ai-cio.pages.dev
          MAX_PLANNING_CYCLES: "3"
          MAX_WORKFLOW_ATTEMPTS: "2"
          FOUNDATION_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: node tools/autonomous_engineering_supervisor.mjs