name: Inspect Public Feed Directives
on:
  push:
    branches:
      - feat/wc-google-feed-egress-bridge-20260929
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        site: [ads-store, ithunt, kccomputers, krg-kart]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public robots and sitemap through Cloudflare egress
        env:
          SITE: ${{ matrix.site }}
          WORKER: https://feed-origin-probe-20260927.heroic-ai.workers.dev
        run: |
          set -euo pipefail
          mkdir -p out
          for p in robots.txt sitemap.xml sitemap.rss sitemap_index.xml wp-sitemap.xml; do
            target="https://${SITE}.in/${p}"
            if [ "${SITE}" = "krg-kart" ]; then target="https://krgkart.com/${p}"; fi
            curl -sS --max-time 90               "${WORKER}/?u=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "${target}")"               > "out/${SITE}-${p//\//_}.json" || true
          done
          echo "site=${SITE}"
          for f in out/*; do
            echo "===== $f ====="
            grep -Eo '"(status|url|ct|bytes)"[^,}]*' "$f" | head -30 || true
            grep -Eio 'sitemap[^"< ]*|feed[^"< ]*|google[^"< ]*|merchant[^"< ]*' "$f" | sort -u | head -50 || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: public-feed-directives-${{ matrix.site }}
          path: out/
          if-no-files-found: error
