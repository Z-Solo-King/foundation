name: WooCommerce Google Feed Hybrid Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid-a:
    name: Hybrid A (8)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_START: "0"
      TARGET_COUNT: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run hybrid public feed discovery
        run: node tools/woocommerce_google_feed_hybrid.mjs
      - name: Upload hybrid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-google-feed-hybrid-a
          path: out/hybrid/
          if-no-files-found: warn
          retention-days: 14

  hybrid-b:
    name: Hybrid B (8)
    runs-on: ubuntu-latest
    timeout-minutes: 25
