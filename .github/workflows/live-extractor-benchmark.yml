name: Live extractor benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Immutable Operations revision to benchmark
        required: false
        default: 44f53283aa308e8a294ae9fe716ab9200a44809b
        type: string
      benchmark_tools_ref:
        description: Exact Operations revision containing benchmark producer/evaluator tooling
        required: false
        default: d4ef2e6d28435a59c735b9dc4d0de31f44b9cf29
        type: string

permissions:
  contents: read

concurrency:
  group: foundation-live-extractor-benchmark-${{github.ref}}
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ matrix.case.name }} pass ${{ matrix.pass }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pass: [1, 2, 3, 4]
        case:
          - name: api-dummyjson
            label: api:dummyjson
            mode: http
            url: https://dummyjson.com/products/1
          - name: api-fakestore
            label: api:fakestore
            mode: http
            url: https://fakestoreapi.com/products/1
          - name: api-escuela
            label: api:escuela
            mode: http
            url: https://api.escuelajs.co/api/v1/products/1
          - name: feed-hnrss
            label: feed:hnrss
            mode: http
            url: https://hnrss.org/frontpage
          - name: feed-github
            label: feed:github
            mode: http
            url: https://github.com/openai/openai-python/releases.atom
          - name: html-example
            label: html:example
            mode: http
            url: https://example.com/
          - name: html-books
            label: html:books
            mode: http
            url: https://books.toscrape.com/catalogue/page-1.html
          - name: html-ecommerce
            label: html:ecommerce
            mode: http
            url: https://webscraper.io/test-sites/e-commerce/static/computers/laptops
          - name: browser-quotes
            label: browser:quotes
            mode: browser
            url: https://quotes.toscrape.com/js/
          - name: browser-ecommerce
            label: browser:ecommerce
            mode: browser
            url: https://webscraper.io/test-sites/e-commerce/dynamic/computers/laptops
    env:
      OPERATIONS_REPOSITORY: Z-Solo-King/operations
      OPERATIONS_REF: ${{ inputs.operations_ref || '44f53283aa308e8a294ae9fe716ab9200a44809b' }}
      BENCHMARK_TOOLS_REF: ${{ inputs.benchmark_tools_ref || 'd4ef2e6d28435a59c735b9dc4d0de31f44b9cf29' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout pinned Operations benchmark source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.OPERATIONS_REPOSITORY }}
          ref: ${{ env.OPERATIONS_REF }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Checkout versioned benchmark tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.OPERATIONS_REPOSITORY }}
          ref: ${{ env.BENCHMARK_TOOLS_REF }}
          token: ${{ steps.operations-app.outputs.token }}
          path: benchmark-tools

      - name: Overlay benchmark producer tooling
        run: |
          set -euo pipefail
          cp benchmark-tools/scripts/browser_site_benchmark.py operations/scripts/browser_site_benchmark.py
          cp benchmark-tools/scripts/site_benchmark_execution.py operations/scripts/site_benchmark_execution.py

      - name: Determine pinned Foundation public-core revision
        id: foundation-core-pin
        working-directory: operations
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path
          tree = ast.parse(Path("scripts/sync_public_core.py").read_text(encoding="utf-8"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "FOUNDATION_COMMIT":
                          output.write_text(f"ref={node.value.value}\n", encoding="utf-8")
                          raise SystemExit
          raise SystemExit("FOUNDATION_COMMIT not found")

      - name: Checkout exact pinned Foundation public core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/foundation
          ref: ${{ steps.foundation-core-pin.outputs.ref }}
          path: foundation-core
          fetch-depth: 1

      - name: Ensure exact pinned Foundation Git object is present
        working-directory: foundation-core
        shell: bash
        env:
          FOUNDATION_COMMIT: ${{ steps.foundation-core-pin.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$FOUNDATION_COMMIT"
          git cat-file -e "$FOUNDATION_COMMIT^{commit}"
          git cat-file -e "$FOUNDATION_COMMIT:foundation_core/__init__.py"

      - name: Materialize pinned public foundation_core for extractor
        working-directory: operations
        env:
          FOUNDATION_CORE_GIT: ${{ github.workspace }}/foundation-core
        run: |
          set -euo pipefail
          python scripts/sync_public_core.py
          test -f foundation_core/__init__.py

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install benchmark dependencies
        working-directory: operations
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[test,browser]"
          python -m pip install --disable-pip-version-check "workers-py>=1.9" workers-runtime-sdk
          if [ "${{ matrix.case.mode }}" = "browser" ]; then python -m playwright install --with-deps chromium; fi

      - name: Preflight extractor import
        working-directory: operations
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          import os
          engine = importlib.import_module("extractor_mapper.fast_engine")
          print(f"extractor module: {engine.__file__}")
          print(f"extractor symbol type: {type(getattr(engine, 'extract_and_map', None)).__name__}")
          from extractor_mapper.fast_engine import extract_and_map
          assert callable(extract_and_map)
          assert engine.__file__ is not None
          print(f"extractor import: PASS ({os.path.abspath(engine.__file__)})")
          PY
      - name: Materialize one-target case
        run: |
          set -euo pipefail
          mkdir -p benchmark-input benchmark-output
          cat > benchmark-input/target.json <<'EOF'
          {
            "targets": [{"url":"${{ matrix.case.url }}","label":"${{ matrix.case.label }}"}]
          }
          EOF

      - name: Determine case execution profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.pass }}" in
            1) echo "workers=1" >> "$GITHUB_OUTPUT"; echo "retries=2" >> "$GITHUB_OUTPUT" ;;
            2) echo "workers=2" >> "$GITHUB_OUTPUT"; echo "retries=1" >> "$GITHUB_OUTPUT" ;;
            3) echo "workers=1" >> "$GITHUB_OUTPUT"; echo "retries=3" >> "$GITHUB_OUTPUT" ;;
            4) echo "workers=2" >> "$GITHUB_OUTPUT"; echo "retries=2" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported pass profile"; exit 2 ;;
          esac
      - name: Run HTTP case
        if: matrix.case.mode == 'http'
        working-directory: operations
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/durable_site_benchmark.py run \
            --input ../benchmark-input/target.json \
            --output ../benchmark-output \
            --shards 1 --shard 0 --workers ${{ steps.profile.outputs.workers }} --retries ${{ steps.profile.outputs.retries }}

      - name: Run browser case
        if: matrix.case.mode == 'browser'
        working-directory: operations
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/browser_site_benchmark.py \
            --input ../benchmark-input/target.json \
            --output ../benchmark-output/receipts.jsonl

      - name: Normalize extractor receipts
        # Versioned producer/evaluator tooling is intentionally immutable.
        if: always()
        run: |
          set -euo pipefail
          if [ -s benchmark-output/receipts.jsonl ]; then
            echo "Extractor receipt contract: PASS (root receipts.jsonl)"
          else
            mapfile -t receipt_files < <(find benchmark-output -type f -name 'shard-*.jsonl' | sort)
            test "${#receipt_files[@]}" -gt 0 || {
              echo "No extractor JSONL receipt was produced for this case"
              find benchmark-output -maxdepth 5 -type f -print 2>/dev/null || true
              exit 1
            }
            : > benchmark-output/receipts.jsonl
            for receipt in "${receipt_files[@]}"; do
              cat "$receipt" >> benchmark-output/receipts.jsonl
            done
            test -s benchmark-output/receipts.jsonl
            echo "Extractor receipt contract: PASS (normalized ${#receipt_files[@]} shard receipt(s))"
          fi

      - name: Emit case manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p benchmark-output
          cat > benchmark-output/case.json <<EOF
          {"case":"${{ matrix.case.name }}","label":"${{ matrix.case.label }}","mode":"${{ matrix.case.mode }}","url":"${{ matrix.case.url }}","pass":${{ matrix.pass }},"workers":"${{ steps.profile.outputs.workers || '1' }}","retries":"${{ steps.profile.outputs.retries || '2' }}","operations_ref":"${{ inputs.operations_ref || '44f53283aa308e8a294ae9fe716ab9200a44809b' }}"}
          EOF

      - name: Upload case artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extractor-${{ matrix.case.name }}-pass-${{ matrix.pass }}
          path: benchmark-output/**
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate 40-case extractor benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: benchmark
    if: always()
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout pinned Operations benchmark source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref || '44f53283aa308e8a294ae9fe716ab9200a44809b' }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Checkout versioned benchmark tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.benchmark_tools_ref || 'd4ef2e6d28435a59c735b9dc4d0de31f44b9cf29' }}
          token: ${{ steps.operations-app.outputs.token }}
          path: benchmark-tools

      - name: Download all case artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: extractor-*
          path: benchmark-artifacts
          merge-multiple: false

      - name: Build aggregate quality report
        working-directory: operations
        env:
          PYTHONPATH: ${{ github.workspace }}/benchmark-tools:${{ github.workspace }}/operations
        run: |
          set -euo pipefail
          receipt_files=()
          while IFS= read -r file; do receipt_files+=("$file"); done < <(find ../benchmark-artifacts -type f -name 'receipts.jsonl' | sort)
          test "${#receipt_files[@]}" -eq 40
          inputs=()
          for file in "${receipt_files[@]}"; do inputs+=(--input "$file"); done
          python scripts/site_benchmark_quality.py "${inputs[@]}" \
            --expected-platform api \
            --expected-platform feed \
            --expected-platform html \
            --expected-platform browser \
            --output ../live-extractor-quality.json

      - name: Print aggregate summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('live-extractor-quality.json')
          print(json.dumps(json.loads(path.read_text()), indent=2, sort_keys=True) if path.exists() else 'quality report missing')
          PY

      - name: Upload aggregate benchmark artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-extractor-benchmark-40way
          path: |
            benchmark-artifacts/**
            live-extractor-quality.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce aggregate quality gate
        working-directory: operations
        run: |
          set -euo pipefail
          test -s ../live-extractor-quality.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('../live-extractor-quality.json').read_text())
          status_counts=payload.get('status_counts', {})
          ok=(
              payload.get('pass') is True
              and float(payload.get('provenance_completeness', 0.0)) == 1.0
              and int(payload.get('invalid_resource_rows', 0) or 0) == 0
              and int(payload.get('unstable_repeated_groups', 0) or 0) == 0
              and int(payload.get('missing_key_rows', 0) or 0) == 0
              and not payload.get('missing_expected_platforms')
          )
          if not ok:
              print(json.dumps({
                  'strict_gate': 'FAIL',
                  'pass': payload.get('pass'),
                  'status_counts': status_counts,
                  'completion_rate': payload.get('completion_rate'),
                  'provenance_completeness': payload.get('provenance_completeness'),
                  'invalid_resource_rows': payload.get('invalid_resource_rows'),
                  'unstable_repeated_groups': payload.get('unstable_repeated_groups'),
                  'missing_expected_platforms': payload.get('missing_expected_platforms'),
              }, sort_keys=True))
              raise SystemExit(2)
          print(json.dumps({'strict_gate': 'PASS'}, sort_keys=True))
          PY