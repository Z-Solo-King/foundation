name: Live extractor benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Immutable Operations revision to benchmark
        required: false
        default: dd30834aec8f1263d9b35142b1bd16b4ba95f1ca
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.case }} pass ${{ matrix.pass }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - case: api-dummyjson
            label: api:dummyjson
            mode: http
            url: https://dummyjson.com/products/1
            pass: 1
          - case: api-dummyjson
            label: api:dummyjson
            mode: http
            url: https://dummyjson.com/products/1
            pass: 2
          - case: api-fakestore
            label: api:fakestore
            mode: http
            url: https://fakestoreapi.com/products/1
            pass: 1
          - case: api-fakestore
            label: api:fakestore
            mode: http
            url: https://fakestoreapi.com/products/1
            pass: 2
          - case: api-escuela
            label: api:escuela
            mode: http
            url: https://api.escuelajs.co/api/v1/products/1
            pass: 1
          - case: api-escuela
            label: api:escuela
            mode: http
            url: https://api.escuelajs.co/api/v1/products/1
            pass: 2
          - case: feed-hnrss
            label: feed:hnrss
            mode: http
            url: https://hnrss.org/frontpage
            pass: 1
          - case: feed-hnrss
            label: feed:hnrss
            mode: http
            url: https://hnrss.org/frontpage
            pass: 2
          - case: feed-github
            label: feed:github
            mode: http
            url: https://github.com/openai/openai-python/releases.atom
            pass: 1
          - case: feed-github
            label: feed:github
            mode: http
            url: https://github.com/openai/openai-python/releases.atom
            pass: 2
          - case: html-example
            label: html:example
            mode: http
            url: https://example.com/
            pass: 1
          - case: html-example
            label: html:example
            mode: http
            url: https://example.com/
            pass: 2
          - case: html-books
            label: html:books
            mode: http
            url: https://books.toscrape.com/catalogue/page-1.html
            pass: 1
          - case: html-books
            label: html:books
            mode: http
            url: https://books.toscrape.com/catalogue/page-1.html
            pass: 2
          - case: html-ecommerce
            label: html:ecommerce
            mode: http
            url: https://webscraper.io/test-sites/e-commerce/static/computers/laptops
            pass: 1
          - case: html-ecommerce
            label: html:ecommerce
            mode: http
            url: https://webscraper.io/test-sites/e-commerce/static/computers/laptops
            pass: 2
          - case: browser-quotes
            label: browser:quotes
            mode: browser
            url: https://quotes.toscrape.com/js/
            pass: 1
          - case: browser-quotes
            label: browser:quotes
            mode: browser
            url: https://quotes.toscrape.com/js/
            pass: 2
          - case: browser-ecommerce
            label: browser:ecommerce
            mode: browser
            url: https://webscraper.io/test-sites/e-commerce/dynamic/computers/laptops
            pass: 1
          - case: browser-ecommerce
            label: browser:ecommerce
            mode: browser
            url: https://webscraper.io/test-sites/e-commerce/dynamic/computers/laptops
            pass: 2
    env:
      OPERATIONS_REPOSITORY: Z-Solo-King/operations
      OPERATIONS_REF: ${{ inputs.operations_ref || 'dd30834aec8f1263d9b35142b1bd16b4ba95f1ca' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout pinned Operations benchmark source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.OPERATIONS_REPOSITORY }}
          ref: ${{ env.OPERATIONS_REF }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Determine pinned Foundation public-core revision
        id: foundation-core-pin
        working-directory: operations
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path
          tree = ast.parse(Path("scripts/sync_public_core.py").read_text(encoding="utf-8"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "FOUNDATION_COMMIT":
                          output.write_text(f"ref={node.value.value}\n", encoding="utf-8")
                          raise SystemExit
          raise SystemExit("FOUNDATION_COMMIT not found")

      - name: Checkout exact pinned Foundation public core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/foundation
          ref: ${{ steps.foundation-core-pin.outputs.ref }}
          path: foundation-core
          fetch-depth: 1

      - name: Ensure exact pinned Foundation Git object is present
        working-directory: foundation-core
        shell: bash
        env:
          FOUNDATION_COMMIT: ${{ steps.foundation-core-pin.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$FOUNDATION_COMMIT"
          git cat-file -e "$FOUNDATION_COMMIT^{commit}"
          git cat-file -e "$FOUNDATION_COMMIT:foundation_core/__init__.py"

      - name: Materialize pinned public foundation_core for extractor
        working-directory: operations
        env:
          FOUNDATION_CORE_GIT: ${{ github.workspace }}/foundation-core
        run: |
          set -euo pipefail
          python scripts/sync_public_core.py
          test -f foundation_core/__init__.py

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install benchmark dependencies
        working-directory: operations
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[test,browser]"
          python -m pip install --disable-pip-version-check "workers-py>=1.9" workers-runtime-sdk
          if [ "${{ matrix.mode }}" = "browser" ]; then python -m playwright install --with-deps chromium; fi

      - name: Preflight extractor import
        working-directory: operations
        run: |
          set -euo pipefail
          python - <<'PY'
          import extractor_mapper.fast_engine as engine
          assert callable(engine.extract_and_map)
          print("extractor import: PASS")
          PY
      - name: Materialize one-target case
        run: |
          set -euo pipefail
          mkdir -p benchmark-input benchmark-output
          cat > benchmark-input/target.json <<'EOF'
          {
            "targets": [{"url":"${{ matrix.url }}","label":"${{ matrix.label }}"}]
          }
          EOF

      - name: Run HTTP case
        if: matrix.mode == 'http'
        working-directory: operations
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/durable_site_benchmark.py run \
            --input ../benchmark-input/target.json \
            --output ../benchmark-output \
            --shards 1 --shard 0 --workers 1 --retries 2

      - name: Run browser case
        if: matrix.mode == 'browser'
        working-directory: operations
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/browser_site_benchmark.py \
            --input ../benchmark-input/target.json \
            --output ../benchmark-output/receipts.jsonl

      - name: Emit case manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p benchmark-output
          cat > benchmark-output/case.json <<EOF
          {"case":"${{ matrix.case }}","label":"${{ matrix.label }}","mode":"${{ matrix.mode }}","url":"${{ matrix.url }}","pass":${{ matrix.pass }},"operations_ref":"${{ inputs.operations_ref || 'dd30834aec8f1263d9b35142b1bd16b4ba95f1ca' }}"}
          EOF

      - name: Upload case artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extractor-${{ matrix.case }}-pass-${{ matrix.pass }}
          path: benchmark-output/**
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate 20-way extractor benchmark
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout pinned Operations benchmark source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref || 'dd30834aec8f1263d9b35142b1bd16b4ba95f1ca' }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Download all case artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: extractor-*
          path: benchmark-artifacts
          merge-multiple: false

      - name: Build aggregate quality report
        working-directory: operations
        run: |
          set -euo pipefail
          inputs=()
          while IFS= read -r file; do inputs+=(--input "$file"); done < <(find ../benchmark-artifacts -type f -name '*.jsonl' | sort)
          test "${#inputs[@]}" -ge 10
          python scripts/site_benchmark_quality.py "${inputs[@]}" \
            --expected-platform api \
            --expected-platform feed \
            --expected-platform html \
            --expected-platform browser \
            --output ../live-extractor-quality.json

      - name: Print aggregate summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('live-extractor-quality.json')
          print(json.dumps(json.loads(path.read_text()), indent=2, sort_keys=True) if path.exists() else 'quality report missing')
          PY

      - name: Upload aggregate benchmark artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-extractor-benchmark-20way
          path: |
            benchmark-artifacts/**
            live-extractor-quality.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce aggregate quality gate
        working-directory: operations
        run: |
          set -euo pipefail
          test -s ../live-extractor-quality.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('../live-extractor-quality.json').read_text())
          raise SystemExit(0 if payload.get('pass') is True else 2)
          PY
