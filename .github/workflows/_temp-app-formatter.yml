name: Temporary Heroic app formatter

on:
  push:
    branches: [fix/heroic-first-chat-submit-2026-10-02]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Format app.js
        run: npx --yes prettier@3.9.9 --write frontend/app.js
      - name: Commit formatted app.js
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- frontend/app.js; then
            echo "No formatting changes required."
            exit 0
          fi
          git add frontend/app.js
          git commit -m "chore: format app.js [format-bot]"
          git push origin HEAD:${GITHUB_REF_NAME}
