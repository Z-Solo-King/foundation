name: Public Worker live probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public surface
        env:
          URL: https://Heroic-Ai.dev
        run: |
          set +e
          mkdir -p probe
          for item in root health readiness; do
            case "$item" in
              root) path="/" ;;
              health) path="/health" ;;
              readiness) path="/readiness" ;;
            esac
            status=$(curl -sS --max-time 20 -o "probe/$item.body" -D "probe/$item.headers" -w "%{http_code}" "$URL$path" 2> "probe/$item.error")
            printf "%s" "$status" > "probe/$item.status"
          done
          python - <<PY
          import json
          from pathlib import Path
          root=Path("probe")
          out={"schema":"public-worker-probe/v2","url":"https://Heroic-Ai.dev","checks":{},"ok":True}
          for name in ("root","health","readiness"):
              status=int((root/f"{name}.status").read_text().strip() or "0")
              body=(root/f"{name}.body").read_text(errors="replace")[:500]
              item={"status":status,"body_prefix":body}
              if name != "root" and 200 <= status < 500 and "json" in (root/f"{name}.headers").read_text(errors="replace").lower():
                  try:
                      data=json.loads(body)
                      item["ok"]=data.get("ok")
                      item["ready"]=data.get("ready")
                      item["database"]=data.get("database")
                      item["release"]=data.get("release")
                  except Exception:
                      item["json"]="invalid"
              out["checks"][name]=item
              if status < 200 or status >= 500: out["ok"]=False
          (root/"receipt.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          exit 0
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-worker-probe-${{ github.run_id }}
          path: probe/
          retention-days: 30