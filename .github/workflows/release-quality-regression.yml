name: release quality regression contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/release_quality_gate.py'
      - 'benchmark/vector_scorecard.py'
      - 'backend/performance_metrics.py'
      - 'tests/test_release_quality_gate.py'
      - '.github/workflows/release-quality-regression.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-quality-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run deterministic release-quality contract
        run: python -m pytest -q tests/test_release_quality_gate.py
