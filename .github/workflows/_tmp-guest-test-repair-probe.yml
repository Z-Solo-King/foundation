name: Temporary Guest Test contract repair probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Apply quote-agnostic assertions
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "frontend/guest_test_mode_contract_test.mjs";
          let s = fs.readFileSync(path, "utf8");
          s = s.replace(
            /assert\(guest\.includes\("result_state: 'TEST_ONLY'"\), "guest responses must be marked TEST_ONLY"\);/,
            'assert.match(guest, /result_state: ["\\x27]TEST_ONLY["\\x27]/, "guest responses must be marked TEST_ONLY");',
          );
          s = s.replace(
            /assert\(\n  guest\.includes\("generation_status: 'deterministic_test'"\),\n  "guest responses must identify deterministic test generation",\n\);/,
            'assert.match(guest, /generation_status: ["\\x27]deterministic_test["\\x27]/, "guest responses must identify deterministic test generation");',
          );
          s = s.replace(
            /assert\(\n  app\.includes\("if \(!normalizedText\) throw new Error\('Message is required'\);"\),\n  "guest direct-call input guard is missing",\n\);/,
            'assert.match(app, /if \\(!normalizedText\\) throw new Error\\(["\\x27]Message is required["\\x27]\\)/, "guest direct-call input guard is missing");',
          );
          s = s.replace(
            /assert\(\n  app\.includes\(\n    "if \(normalizedText\.length > 12_000\) throw new Error\('Message exceeds the 12000 character limit'\);",\n  \),\n  "guest direct-call length guard is missing",\n\);/,
            'assert.match(app, /if \\(normalizedText\\.length > 12_000\\) throw new Error\\(["\\x27]Message exceeds the 12000 character limit["\\x27]\\)/, "guest direct-call length guard is missing");',
          );
          fs.writeFileSync(path, s);
          NODE
      - name: Format repaired contract
        run: npx --yes prettier@3.9.9 --write frontend/guest_test_mode_contract_test.mjs
      - name: Upload repaired contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guest-test-repaired-contract
          path: frontend/guest_test_mode_contract_test.mjs
          if-no-files-found: error

