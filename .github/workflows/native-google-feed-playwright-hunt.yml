name: Native Google Feed Playwright Hunt v179
on:
  push:
    branches: [hunt/native-google-feed-urls-20260927]
    paths:
      - "tools/native_google_feed_playwright_hunt_v179.py"
      - ".github/workflows/native-google-feed-playwright-hunt.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-google-feed-playwright-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install chromium
      - name: Select shard
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/sites.json
          import json, os
          s=[
          ["Aarna Computers","https://aarnacomputers.com"],["Ads Store","https://adsstore.in"],["avikaretails","https://avikaretails.com"],["EZPZ Solutions","https://www.ezpzsolutions.in"],
          ["GamesNComps","https://gamesncomps.com"],["Geekbees","https://geekbees.in"],["hotshiftpc","https://hotshiftpc.com"],["itgadgetsonline","https://itgadgetsonline.com"],
          ["ithunt","https://ithunt.in"],["KC Computers","https://kccomputers.co.in"],["KRG KART","https://krgkart.com"],["Kryptronix Gaming","https://kryptronix.in"],
          ["NCL Computer","https://nclcomputer.com"],["networkitstore","https://networkitstore.in"],["nexusinfosys","https://www.mynexusinfosys.com"],["Only SDD","https://onlyssd.com"],
          ["PC Kumar Infotech","https://pckumar.in"],["PC Studio","https://www.pcstudio.in"],["PCHubShop","https://www.pchubshop.com"],["Prime ABGB","https://www.primeabgb.com"],
          ["quickincomputers","https://quickincomputers.com"],["SCL Gaming","https://sclgaming.in"],["solankienterprises","https://solankienterprises.com"],["Variety Infotech","https://varietyinfotech.com"],
          ["Viper PC","https://viperpc.in"],["AULA India","https://aulaindia.com"],["Cosmic Byte","https://www.thecosmicbyte.com"],["Meckeys","https://www.meckeys.com"],
          ["Moskeys","https://moskeys.com"],["Ninja Dog","https://ninjadog.in"],["StacksKB","https://stackskb.com"],["Theproaudio","https://www.theproaudio.com"]]
          shard=int(os.environ["SHARD"])
          print(json.dumps([{"name":n,"url":u} for i,(n,u) in enumerate(s) if i%8+1==shard]))
          PY
          echo "SITES_JSON=$(cat /tmp/sites.json)" >> "$GITHUB_ENV"
      - name: Run V179 native-only browser hunt
        shell: bash
        run: |
          set -euo pipefail
          python tools/native_google_feed_playwright_hunt_v179.py | tee "native-playwright-shard-${{ matrix.shard }}.json"
      - name: Upload URL-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-playwright-google-feed-shard-${{ matrix.shard }}
          path: native-playwright-shard-${{ matrix.shard }}.json
          retention-days: 14