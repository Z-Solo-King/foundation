name: Temporary release packaging formatter
on:
  push:
    branches:
      - fix/operations-worker-staging-packaging-2026-10-03
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Repair shell and Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.16.9
          ruff format tests/test_workflow_policy.py tests/test_production_release_boundary_policy.py
          ruff check --fix tests/test_workflow_policy.py
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/production_release.sh")
          value = p.read_text(encoding="utf-8")
          if not value.endswith("\n"):
              p.write_text(value + "\n", encoding="utf-8")
          PY
      - name: Remove formatter and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_tmp-release-packaging-format.yml
          git add scripts/production_release.sh tests/test_workflow_policy.py tests/test_production_release_boundary_policy.py .github/workflows/_tmp-release-packaging-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize release packaging validation"
          git push