name: secret-context-sanity

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect secret presence without revealing it
        env:
          TEST_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "${TEST_SECRET:-}" || true
