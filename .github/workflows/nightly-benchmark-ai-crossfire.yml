name: Nightly benchmark AI cross-fire
on:
  schedule:
    # 22:30 IST, after the 21:15 IST autonomous benchmark window.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional completed autonomous benchmark run ID; blank uses latest run"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-benchmark-ai-crossfire
  cancel-in-progress: false

jobs:
  crossfire:
    name: "AI ${{ matrix.id }}"
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { id: "llama-3.2-1b", model: "@cf/meta/llama-3.2-1b-instruct" }
          - { id: "llama-3.2-3b", model: "@cf/meta/llama-3.2-3b-instruct" }
          - { id: "granite-4-micro", model: "@cf/ibm-granite/granite-4.0-h-micro" }
          - { id: "qwen2.5-coder-32b", model: "@cf/qwen/qwen2.5-coder-32b-instruct" }
          - { id: "llama-3.1-8b", model: "@cf/meta/llama-3.1-8b-instruct-fp8" }
          - { id: "mistral-7b", model: "@cf/mistral/mistral-7b-instruct-v0.2-lora" }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve benchmark run
        id: run
        env:
          MANUAL_RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_RUN_ID" ]; then
            run_id="$MANUAL_RUN_ID"
          else
            run_id="$(gh run list --workflow autonomous-benchmark.yml --status completed --repo "$GITHUB_REPOSITORY" --limit 20 --json databaseId,status,conclusion,headBranch,event,headSha,createdAt --jq '[.[] | select(.status=="completed" and .headBranch=="main")] | .[0].databaseId // empty')"
          fi
          test -n "$run_id"
          run_json="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,name,status,conclusion,headBranch,event,headSha,createdAt)"
          echo "$run_json" | jq -e --arg id "$run_id" '.databaseId == ($id|tonumber) and .name == "autonomous benchmark" and .status == "completed" and .headBranch == "main" and (.headSha|type) == "string" and (.headSha|length) == 40' >/dev/null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.headSha' <<<"$run_json")" >> "$GITHUB_OUTPUT"
          echo "created_at=$(jq -r '.createdAt' <<<"$run_json")" >> "$GITHUB_OUTPUT"
          echo "event=$(jq -r '.event' <<<"$run_json")" >> "$GITHUB_OUTPUT"
          echo "conclusion=$(jq -r '.conclusion' <<<"$run_json")" >> "$GITHUB_OUTPUT"
      - name: Download final evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          SOURCE_SHA: ${{ steps.run.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/input
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name autonomous-nightly-benchmark-final --dir .runtime/input
          test -s .runtime/input/autonomous-nightly-benchmark-final.json
          jq -e --arg run_id "$RUN_ID" --arg source_sha "$SOURCE_SHA" '.schema == "autonomous-nightly-benchmark-final/v2" and (.run_id|tostring) == $run_id and .repository_revision == $source_sha' .runtime/input/autonomous-nightly-benchmark-final.json >/dev/null
      - name: Run bounded AI lane
        env:
          MODEL: ${{ matrix.model }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          SOURCE_SHA: ${{ steps.run.outputs.head_sha }}
          SOURCE_CREATED_AT: ${{ steps.run.outputs.created_at }}
          SOURCE_EVENT: ${{ steps.run.outputs.event }}
          SOURCE_CONCLUSION: ${{ steps.run.outputs.conclusion }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/result
          python - <<PY
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          final=json.loads(Path(".runtime/input/autonomous-nightly-benchmark-final.json").read_text())
          keys=("finalization_status","research_feed_state","benchmark_job_result","research_feed_job_result","shards_found","selected_targets","total_observations","usable_observations","operational_failures","operational_failure_rate","validation_errors")
          payload={"schema":"nightly-benchmark-ai-input/v1","final":{k:final.get(k) for k in keys}}
          data=json.dumps(payload,separators=(",",":"))
          if len(data)>12000: raise SystemExit("ai_input_too_large")
          prompt=("NIGHTLY_BENCHMARK_AI_CROSSFIRE_V1\nReturn JSON only with advisory_assessment, reason, flags.\n"
                  "Advisory only: never certify correctness, production health, or research completion.\n"
                  "Do not propose credential, policy, deployment, Cloudflare mutation, or workflow-dispatch actions.\n"
                  "Evaluate only supplied evidence. assessment must be pass, attention, or blocked. flags must be an array.\n"+data)
          body=json.dumps({"model":os.environ["MODEL"],"input":{"messages":[{"role":"user","content":prompt}],"max_tokens":96,"temperature":0}}).encode()
          req=urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/"+os.environ["CLOUDFLARE_ACCOUNT_ID"]+"/ai/run",data=body,headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Content-Type":"application/json"})
          receipt={"schema":"nightly-benchmark-ai-crossfire-result/v1","run_id":os.environ["RUN_ID"],"source_repository_revision":os.environ["SOURCE_SHA"],"source_created_at":os.environ["SOURCE_CREATED_AT"],"source_event":os.environ["SOURCE_EVENT"],"source_conclusion":os.environ["SOURCE_CONCLUSION"],"model":os.environ["MODEL"],"transport_ok":False,"elapsed_ms":None,"advisory_schema_compliant":False,"advisory_assessment":None,"reason":"","flags":[],"neurons":None,"input_sha256":hashlib.sha256(data.encode()).hexdigest(),"authority":"advisory_only_no_acceptance_or_mutation_authority"}
          started=time.time()
          try:
              with urllib.request.urlopen(req,timeout=90) as response: raw=json.loads(response.read())
              receipt["transport_ok"]=True
              result=raw.get("result") or {}
              receipt["neurons"]=(result.get("usage") or {}).get("neurons")
              value=result.get("response")
              if not isinstance(value,str): value=((result.get("choices") or [{}])[0].get("message") or {}).get("content") or ""
              obj=json.loads(str(value).replace("```json","").replace("```","").strip())
              if obj.get("advisory_assessment") in {"pass","attention","blocked"} and isinstance(obj.get("reason"),str) and isinstance(obj.get("flags"),list):
                  receipt["advisory_schema_compliant"]=True
                  receipt["advisory_assessment"]=obj["advisory_assessment"]
                  receipt["reason"]=obj["reason"][:500]
                  receipt["flags"]=[str(x)[:160] for x in obj["flags"][:8]]
          except Exception as exc:
              receipt["error"]=str(exc)[:500]
          receipt["elapsed_ms"]=int((time.time()-started)*1000)
          Path(".runtime/result/receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY
      - name: Upload lane receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: nightly-benchmark-ai-crossfire-${{ strategy.job-index }}
          path: .runtime/result/receipt.json
          retention-days: 30
          if-no-files-found: error

  aggregate:
    name: Aggregate AI cross-fire
    needs: [crossfire]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download lane receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          pattern: nightly-benchmark-ai-crossfire-*
          path: .runtime/lanes
          merge-multiple: true
      - name: Build deterministic aggregate
        shell: python
        run: |
          import json
          from collections import Counter
          from pathlib import Path
          rows=[]
          for p in sorted(Path(".runtime/lanes").glob("**/receipt.json")):
              try: rows.append(json.loads(p.read_text()))
              except Exception: pass
          valid=[r for r in rows if r.get("advisory_schema_compliant") is True]
          counts=Counter(r.get("advisory_assessment") for r in valid)
          top=counts.most_common(1)[0] if counts else (None,0)
          report={"schema":"nightly-benchmark-ai-crossfire/v1","lane_count":len(rows),"source_runs":sorted({(r.get("run_id"),r.get("source_repository_revision"),r.get("source_created_at"),r.get("source_event"),r.get("source_conclusion")) for r in rows if r.get("run_id")}),"schema_compliant_lanes":len(valid),"agreement":(top[1]/len(valid) if valid else 0),"consensus":top[0],"models":[{"model":r.get("model"),"transport_ok":r.get("transport_ok"),"schema_compliant":r.get("advisory_schema_compliant"),"assessment":r.get("advisory_assessment"),"elapsed_ms":r.get("elapsed_ms"),"neurons":r.get("neurons"),"reason":r.get("reason"),"flags":r.get("flags")} for r in rows],"authority":"advisory_only_no_acceptance_or_mutation_authority"}
          Path(".runtime").mkdir(exist_ok=True)
          Path(".runtime/nightly-benchmark-ai-crossfire.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
      - name: Publish aggregate
        if: always()
        run: cat .runtime/nightly-benchmark-ai-crossfire.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: nightly-benchmark-ai-crossfire-aggregate
          path: .runtime/nightly-benchmark-ai-crossfire.json
          retention-days: 30
          if-no-files-found: error