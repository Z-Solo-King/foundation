name: Nightly benchmark AI cross-fire

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional completed autonomous benchmark run ID; blank uses latest run"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-benchmark-ai-crossfire
  cancel-in-progress: false

jobs:
  crossfire:
    name: AI cross-fire
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUBLIC_WORKER_URL: https://heroic-ai.pages.dev
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve expected Operations production pin
        id: operations
        shell: bash
        run: |
          set -euo pipefail
          ref="$(jq -er '.pins.production_runtime.sha' docs/OPERATIONS_PIN_MANIFEST.json)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Resolve benchmark run
        id: run
        env:
          MANUAL_RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_RUN_ID" ]; then
            run_id="$MANUAL_RUN_ID"
          else
            run_id="$(gh run list --workflow autonomous-benchmark.yml --repo "$GITHUB_REPOSITORY" --branch main --limit 20 --json databaseId,status,conclusion,headBranch --jq '.[] | select(.status == "completed" and .conclusion == "success" and .headBranch == "main") | .databaseId' | head -n 1)"
          fi
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Validate benchmark run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          EXPECTED_OPERATIONS_REF: ${{ steps.operations.outputs.ref }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json name,status,conclusion,headSha,headBranch,event > .runtime/benchmark-run.json
          jq -e '
            (.name == "Autonomous benchmark"
              or .name == "Autonomous Benchmark"
              or .name == "autonomous-benchmark")
            and .status == "completed"
            and .conclusion == "success"
            and .headBranch == "main"
          ' .runtime/benchmark-run.json >/dev/null

      - name: Download final evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/input
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name autonomous-nightly-benchmark-final --dir .runtime/input
          test -s .runtime/input/autonomous-nightly-benchmark-final.json

      - name: Run Cloudflare-native six-model cross-fire
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/result
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          final = json.loads(
              Path(".runtime/input/autonomous-nightly-benchmark-final.json").read_text(
                  encoding="utf-8"
              )
          )
          keys = (
              "finalization_status",
              "research_feed_state",
              "benchmark_job_result",
              "research_feed_job_result",
              "shards_found",
              "selected_targets",
              "total_observations",
              "usable_observations",
              "operational_failures",
              "operational_failure_rate",
              "validation_errors",
          )
          evidence = {
              "schema": "nightly-benchmark-ai-input/v2",
              "final": {key: final.get(key) for key in keys},
          }
          body = json.dumps(
              {
                  "schema": "nightly-benchmark-ai-crossfire-request/v2",
                  "run_id": os.environ["RUN_ID"],
                  "expected_operations_ref": os.environ["EXPECTED_OPERATIONS_REF"],
                  "evidence": evidence,
              },
              separators=(",", ":"),
          ).encode("utf-8")

          token = os.environ.get("AUTH_TOKEN", "").strip()
          if not token:
              raise SystemExit("AUTH_TOKEN missing")

          url = os.environ["PUBLIC_WORKER_URL"].rstrip("/") + "/api/v1/benchmark/ai-crossfire"
          req = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )

          receipt = {
              "schema": "nightly-benchmark-ai-crossfire-github-receipt/v1",
              "run_id": os.environ["RUN_ID"],
              "worker_url": os.environ["PUBLIC_WORKER_URL"],
              "transport_ok": False,
          }
          try:
              with urllib.request.urlopen(req, timeout=150) as response:
                  receipt["http_status"] = response.status
                  receipt["response"] = json.loads(response.read())
              receipt["transport_ok"] = (
                  receipt["http_status"] == 200 and isinstance(receipt["response"], dict)
              )
          except urllib.error.HTTPError as exc:
              receipt["http_status"] = exc.code
              try:
                  receipt["error_response"] = json.loads(
                      exc.read().decode("utf-8", errors="replace")
                  )
              except Exception:
                  receipt["error_response"] = {"error": "non_json_http_error"}
          except Exception as exc:
              receipt["error"] = str(exc)[:500]

          Path(".runtime/result/aggregate.json").write_text(
              json.dumps(receipt, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2))
          if not receipt["transport_ok"]:
              raise SystemExit(1)

          response = receipt["response"]
          required = {
              "schema": "nightly-benchmark-ai-crossfire-result/v2",
              "model_count_expected": 6,
              "model_count_observed": 6,
              "transport_ok_count": 6,
              "schema_compliant_count": 6,
          }
          if any(response.get(key) != value for key, value in required.items()):
              raise SystemExit("crossfire_count_or_schema_gate_failed")
          if response.get("coverage_complete") is not True or response.get("quality_complete") is not True:
              raise SystemExit("crossfire_quality_or_coverage_gate_failed")
          PY

      - name: Publish cross-fire summary
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".runtime/result/aggregate.json").read_text(encoding="utf-8")
          )
          response = receipt.get("response") if isinstance(receipt.get("response"), dict) else {}
          summary = {
              "schema": "nightly-benchmark-ai-crossfire-summary/v1",
              "run_id": receipt.get("run_id"),
              "transport_ok": receipt.get("transport_ok"),
              "http_status": receipt.get("http_status"),
              "model_count": response.get("model_count_observed"),
              "quality_complete": response.get("quality_complete"),
              "coverage_complete": response.get("coverage_complete"),
              "total_neurons": response.get("total_neurons"),
              "consensus": response.get("consensus"),
              "agreement": response.get("agreement"),
              "models": [
                  {
                      "model": item.get("model"),
                      "transport_ok": item.get("transport_ok"),
                      "schema_compliant": item.get("advisory_schema_compliant"),
                      "assessment": item.get("advisory_assessment"),
                      "elapsed_ms": item.get("elapsed_ms"),
                      "neurons": item.get("neurons"),
                  }
                  for item in response.get("models", [])
                  if isinstance(item, dict)
              ],
              "authority": response.get(
                  "authority",
                  "advisory_only_no_acceptance_or_mutation_authority",
              ),
          }
          Path(".runtime/result/summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n### Nightly AI cross-fire\n\n")
              handle.write("\`\`\`json\n" + json.dumps(summary, indent=2) + "\n\`\`\`\n")

      - name: Upload cross-fire evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: nightly-benchmark-ai-crossfire-aggregate
          path: .runtime/result/
          retention-days: 30
          if-no-files-found: error
