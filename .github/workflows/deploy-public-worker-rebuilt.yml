name: deploy-public-worker-rebuilt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: 22
      - name: Discover Cloudflare account
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          accounts=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50')
          echo "$accounts" | jq -e '.success == true and (.result | length) >= 1' >/dev/null
          account_count=$(jq '.result | length' <<<"$accounts")
          echo "authorized Cloudflare accounts discovered: $account_count"
          database_account_id=$(jq -r '.result[0].id // empty' <<<"$accounts")
          test -n "$database_account_id"
          echo "account_id=$database_account_id" >> "$GITHUB_OUTPUT"
