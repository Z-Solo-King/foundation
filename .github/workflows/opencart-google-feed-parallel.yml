name: OpenCart Google Feed Parallel IDs
on:
  push:
    branches: [probe/opencart-feed-full-20260926]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Parallel feed ID probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, json, os, re, urllib.request, urllib.error, time
          targets = {
            "mdcomputers":"https://mdcomputers.in",
            "itdepot":"https://www.theitdepot.com",
            "nationalpc":"https://nationalpc.in",
            "vedant":"https://www.vedantcomputers.com",
          }
          headers = {
            "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
            "Accept":"application/xml,text/xml,application/rss+xml,application/json,*/*",
            "Accept-Language":"en-IN,en;q=0.9",
          }
          def probe(x):
              site,root,fid=x
              url=root + "/index.php?route=extension/module/google_all_feed&feed_id=" + str(fid)
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=8) as r:
                      body=r.read(2000000).decode("utf-8","replace")
                      lo=body[:50000].lower()
                      cls="unknown"; rows=0
                      if re.search(r"<rss\\b",body,re.I) and re.search(r"<item\\b",body,re.I):
                          rows=len(re.findall(r"<item\\b",body,re.I))
                          cls="google-merchant-rss" if ("base.google.com" in lo or "g:price" in lo or "g:id" in lo) else "rss-product"
                      elif re.search(r"<item\\b",body,re.I):
                          rows=len(re.findall(r"<item\\b",body,re.I)); cls="xml-item"
                      elif "<urlset" in lo:
                          rows=len(re.findall(r"<url\\b",body,re.I)); cls="sitemap"
                      elif body.lstrip().startswith(("{","[")):
                          try:
                              j=json.loads(body)
                              arr=j if isinstance(j,list) else next((j.get(k) for k in ("products","items","response","data","results") if isinstance(j.get(k),list)),None)
                              rows=len(arr) if isinstance(arr,list) else 0
                              cls="json-array" if rows else "json-object"
                          except: cls="json-like"
                      elif "<html" in lo: cls="html"
                      product_fields=bool(re.search(r"g:price|g:availability|g:link|g:id|price|stock|quantity",lo))
                      return {"site":site,"feed_id":fid,"status":r.status,"ctype":r.headers.get("content-type",""),"bytes":len(body),"class":cls,"rows":rows,"product_fields":product_fields,"sample":re.sub(r"\\s+"," ",body[:350])}
              except Exception as e:
                  return {"site":site,"feed_id":fid,"status":0,"error":type(e).__name__+":"+str(e)[:120]}
          items=[(site,root,fid) for site,root in targets.items() for fid in range(1,101)]
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
              results=list(ex.map(probe,items))
          hits=[r for r in results if r.get("class") in ("google-merchant-rss","rss-product","xml-item","json-array","sitemap") or r.get("product_fields")]
          out={"generated_at":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"tested":len(results),"hits":hits,"all":results}
          os.makedirs("out",exist_ok=True)
          open("out/google-feed-parallel.json","w").write(json.dumps(out,indent=2))
          print(json.dumps({"tested":len(results),"hits":len(hits),"interesting":hits},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: opencart-google-feed-parallel-20260926
          path: out/google-feed-parallel.json
          retention-days: 14
