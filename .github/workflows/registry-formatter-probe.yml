name: Registry formatter probe

on:
  push:
    branches:
      - fix/chatbot-crossfire-automation-2026-10-02

permissions:
  contents: read

jobs:
  format_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Format registry
        run: |
          npx --yes prettier@3.9.9 --write docs/WORKFLOW_AUTHORITY_REGISTRY.json
          git diff -- docs/WORKFLOW_AUTHORITY_REGISTRY.json
