name: temporary #1247 transport diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wc-1247-transport-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: false
      - name: Syntax check
        run: node --check tools/woocommerce_google_feed_transport_diagnostic_1247.mjs
      - name: Run diagnostic
        run: node tools/woocommerce_google_feed_transport_diagnostic_1247.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 1247-transport-diagnostic
          path: out/1247-transport-diagnostic/results.json
          if-no-files-found: error
          retention-days: 7
