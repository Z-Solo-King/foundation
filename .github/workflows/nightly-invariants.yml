name: nightly public invariants

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-public-invariants
  cancel-in-progress: false

jobs:
  invariants:
    name: Public invariant and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install public test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio workers-py workers-runtime-sdk
      - name: Run public regression suite
        run: python -m pytest -q
      - name: Validate frontend JavaScript syntax
        run: node --check frontend/app.js
      - name: Enforce browser secret boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'AUTH_TOKEN|CLOUDFLARE_API_TOKEN|RESEARCH_LLM_API_KEY' frontend --exclude='*.map'
          ! grep -RniE 'localStorage\.(setItem|AUTH_TOKEN)|Bearer[[:space:]]+[A-Za-z0-9_-]{20,}' frontend --exclude='*.map'
          echo 'frontend secret boundary: PASS'
      - name: Validate deployment ownership
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/heroic-ai-production-release.yml
          test -f scripts/production_release.sh
          ! grep -RniE 'workers[[:space:]]+build|deploy[[:space:]]+hook|workers-builds' .github/workflows
          grep -Fq 'pywrangler deploy' scripts/production_release.sh
          echo 'deployment ownership boundary: PASS'
