name: WC Google Feed Egress Bridge PR
on:
  pull_request:
    branches:
      - main

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe through Cloudflare egress Worker
        env:
          PROBE: https://feed-origin-probe-20260927.heroic-ai.workers.dev/
        run: |
          mkdir -p artifacts/native
          node <<'NODE'
          const fs = require("fs");

          const sites = {
            "ads-store": "https://adsstore.in",
            "ithunt": "https://ithunt.in",
            "kccomputers": "https://kccomputers.co.in",
            "krg-kart": "https://krgkart.com"
          };

          const seeds = [
            "/robots.txt","/sitemap.xml","/sitemap_index.xml","/wp-sitemap.xml",
            "/wp-json/","/?rest_route=/","/",
            "/?woocommerce_gpf=google","/woocommerce_gpf/google",
            "/google.xml","/google_feed.xml","/google-feed.xml","/google-products.xml",
            "/google-products-feed.xml","/google-product-feed.xml","/google-shopping.xml",
            "/google-shopping-feed.xml","/product-feed.xml","/products-feed.xml","/merchant-feed.xml",
            "/feeds/google.xml","/feeds/google-products.xml","/feed/google.xml","/feed/google-products.xml",
            "/feed/google-shopping.xml","/wp-content/uploads/codesolz-feeds/google.xml",
            "/wp-content/uploads/codesolz-feeds/google-products.xml",
            "/wp-content/uploads/woo-feed/google/xml/google.xml",
            "/wp-content/uploads/woo-feed/google/xml/google-shopping.xml",
            "/wp-content/uploads/woo-product-feed-pro/xml/google.xml",
            "/wp-content/uploads/woo-product-feed-pro/xml/google-shopping.xml",
            "/wp-content/uploads/wppfm-feeds/google.xml"
          ];

          const PROBE = process.env.PROBE;

          async function probe(url) {
            const r = await fetch(PROBE + "?u=" + encodeURIComponent(url));
            return {target:url, ...(await r.json())};
          }

          function valid(body) {
            const s = String(body || "");
            return s.includes("<rss") &&
              s.includes("http://base.google.com/ns/1.0") &&
              s.includes("<item") &&
              s.includes("<g:id") &&
              s.includes("<g:title") &&
              s.includes("<g:link") &&
              s.includes("<g:price") &&
              s.includes("<g:image_link");
          }

          function extract(body, base) {
            const out = new Set();
            const s = String(body || "");
            let p = 0;
            while ((p = s.indexOf("<loc>", p)) >= 0) {
              const e = s.indexOf("</loc>", p + 5);
              if (e < 0) break;
              try { out.add(new URL(s.slice(p + 5, e).trim(), base).href); } catch {}
              p = e + 6;
            }
            for (const key of ["href=", "src="]) {
              let q = 0;
              while ((q = s.indexOf(key, q)) >= 0) {
                const quote = s[q + key.length];
                if (quote !== '"' && quote !== "'") { q += key.length; continue; }
                const e = s.indexOf(quote, q + key.length + 1);
                if (e < 0) break;
                try { out.add(new URL(s.slice(q + key.length + 1, e), base).href); } catch {}
                q = e + 1;
              }
            }
            return [...out];
          }

          function looksFeed(url) {
            const s = String(url || "").toLowerCase();
            return s.includes("feed") || s.includes("google") || s.includes("merchant") ||
              s.includes("gpf") || s.includes("wpfm") || s.includes("woo-feed") || s.includes("xml");
          }

          async function many(items, limit, fn) {
            const out=[]; let i=0;
            async function w(){
              while(true){
                const n=i++;
                if(n>=items.length) return;
                try { out[n]=await fn(items[n]); }
                catch(e){ out[n]={target:items[n],error:String(e?.message||e)}; }
              }
            }
            await Promise.all(Array.from({length:limit},w));
            return out;
          }

          (async()=>{
            const summary={};
            for(const [site,base] of Object.entries(sites)){
              const seedUrls=seeds.map(p=>new URL(p,base+"/").href);
              const first=await many(seedUrls,12,probe);
              const candidateSet=new Set(seedUrls);
              const evidence={};
              let hit=null;

              for(const x of first){
                evidence["seed:"+x.target]={status:x.status,ct:x.ct,bytes:x.bytes};
                if(valid(x.body) && !hit) hit=x;
                for(const u of extract(x.body,base)){
                  if(looksFeed(u) && new URL(u).hostname===new URL(base).hostname) candidateSet.add(u);
                }
              }

              if(!hit){
                const candidates=[...candidateSet].slice(0,220);
                const second=await many(candidates,16,probe);
                for(const x of second){
                  evidence[x.target]={status:x.status,ct:x.ct,bytes:x.bytes};
                  if(valid(x.body)){hit=x;break;}
                }
              }

              if(hit){
                fs.writeFileSync("artifacts/native/"+site+".xml",hit.body);
                summary[site]={native:true,url:hit.target,bytes:String(hit.body).length};
              }else{
                summary[site]={
                  native:false,
                  candidate_count:Object.keys(evidence).length,
                  statuses:Object.values(evidence).reduce((a,x)=>{
                    const k=String(x.status ?? "error");a[k]=(a[k]||0)+1;return a;
                  },{}),
                  interesting:Object.entries(evidence).filter(([u])=>looksFeed(u)).slice(0,160)
                };
                fs.writeFileSync("artifacts/"+site+".json",JSON.stringify(summary[site],null,2));
              }
            }
            fs.writeFileSync("artifacts/summary.json",JSON.stringify(summary,null,2));
            console.log(JSON.stringify(summary,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: wc-google-feed-egress-pr-evidence
          path: artifacts/
          if-no-files-found: error
