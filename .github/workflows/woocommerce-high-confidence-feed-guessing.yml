name: WooCommerce High-Confidence Feed Guessing - Phase 1

on:
  push:
    branches:
      - feat/wc-high-confidence-feed-guessing-20260930
    paths:
      - "tools/woocommerce_high_confidence_feed_guess.mjs"
      - ".github/workflows/woocommerce-high-confidence-feed-guessing.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/woocommerce_high_confidence_feed_guess.mjs"
      - ".github/workflows/woocommerce-high-confidence-feed-guessing.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  high-confidence:
    name: Phase 1 - four known feed families
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check tools/woocommerce_high_confidence_feed_guess.mjs
      - name: Run Phase 1 guessing and learning
        run: node tools/woocommerce_high_confidence_feed_guess.mjs
      - name: Upload Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: woocommerce-high-confidence-feed-guess
          path: out/woocommerce-high-confidence-feed-guess/
          retention-days: 30
