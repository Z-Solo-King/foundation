name: WooCommerce Google Feed Recovery #1247

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wc-google-feed-recovery-1247
  cancel-in-progress: false

jobs:
  rescue:
    name: Recover 9 unresolved retailers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check tools/woocommerce_google_feed_rescue_fast.mjs
      - name: Run Groq/Gemini discovery agents
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_AGENT_MODEL: ${{ secrets.GROQ_AGENT_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: node tools/woocommerce_google_feed_ai_agents_1247.mjs
      - name: Run public-only recovery
        if: always()
        run: node tools/woocommerce_google_feed_rescue_fast.mjs
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: woocommerce-google-feed-recovery-1247
          path: out/rescue-fast/
          if-no-files-found: warn
          retention-days: 30
