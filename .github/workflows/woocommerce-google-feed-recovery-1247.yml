name: WooCommerce Google Feed Recovery #1247

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wc-google-feed-recovery-1247-v175-test
  cancel-in-progress: false

jobs:
  recover:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {slug: aarna-computers, name: "Aarna Computers", url: "https://aarnacomputers.com"}
          - {slug: ads-store, name: "Ads Store", url: "https://adsstore.in"}
          - {slug: avikaretails, name: "avikaretails", url: "https://avikaretails.com"}
          - {slug: ezpz-solutions, name: "EZPZ Solutions", url: "https://www.ezpzsolutions.in"}
          - {slug: gamesncomps, name: "GamesNComps", url: "https://gamesncomps.com"}
          - {slug: geekbees, name: "Geekbees", url: "https://geekbees.in"}
          - {slug: hotshiftpc, name: "hotshiftpc", url: "https://hotshiftpc.com"}
          - {slug: itgadgetsonline, name: "itgadgetsonline", url: "https://itgadgetsonline.com"}
          - {slug: ithunt, name: "ithunt", url: "https://ithunt.in"}
          - {slug: kccomputers, name: "kccomputers", url: "https://kccomputers.co.in"}
          - {slug: krg-kart, name: "KRG KART", url: "https://krgkart.com"}
          - {slug: kryptronix-gaming, name: "Kryptronix Gaming", url: "https://kryptronix.in"}
          - {slug: ncl-computer, name: "NCL Computer", url: "https://nclcomputer.com"}
          - {slug: networkitstore, name: "networkitstore", url: "https://networkitstore.in"}
          - {slug: nexusinfosys, name: "nexusinfosys", url: "https://www.mynexusinfosys.com"}
          - {slug: pc-kumar-infotech, name: "PC Kumar Infotech", url: "https://pckumar.in"}
          - {slug: pc-studio, name: "PC Studio", url: "https://www.pcstudio.in"}
          - {slug: pchubshop, name: "PCHubShop", url: "https://www.pchubshop.com"}
          - {slug: prime-abgb, name: "Prime ABGB", url: "https://www.primeabgb.com"}
          - {slug: quickincomputers, name: "quickincomputers", url: "https://quickincomputers.com"}
          - {slug: scl-gaming, name: "SCL Gaming", url: "https://sclgaming.in"}
          - {slug: solanki-enterprises, name: "solankienterprises", url: "https://solankienterprises.com"}
          - {slug: variety-infotech, name: "Variety Infotech", url: "https://varietyinfotech.com"}
          - {slug: viper-pc, name: "Viper PC", url: "https://viperpc.in"}
          - {slug: aula-india, name: "AULA India", url: "https://aulaindia.com"}
          - {slug: cosmic-byte, name: "Cosmic Byte", url: "https://www.thecosmicbyte.com"}
          - {slug: meckeys, name: "Meckeys", url: "https://www.meckeys.com"}
          - {slug: moskeys, name: "Moskeys", url: "https://moskeys.com"}
          - {slug: ninja-dog, name: "Ninja Dog", url: "https://ninjadog.in"}
          - {slug: stacks-kb, name: "Stackskb", url: "https://stackskb.com"}
          - {slug: theproaudio, name: "Theproaudio", url: "https://www.theproaudio.com"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install V175 feed recovery dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx curl_cffi playwright defusedxml
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile tools/google_feed_recovery_v175_20260927.py
      - name: Run V175-derived public recovery
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p "out/${{ matrix.slug }}"
          python tools/google_feed_recovery_v175_20260927.py             --site-name "${{ matrix.name }}"             --site-url "${{ matrix.url }}"             --outdir "out/${{ matrix.slug }}"
      - name: Upload site evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v175-google-feed-${{ matrix.slug }}
          path: out/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: always()
    needs: recover
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: v175-google-feed-*
          path: out/all-sites
          merge-multiple: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build aggregate
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("out/all-sites")
          rows = []
          for p in root.glob("*/report.json"):
              try:
                  rows.append(json.loads(p.read_text(encoding="utf-8")))
              except Exception as exc:
                  rows.append({"report": str(p), "error": str(exc)})
          rows.sort(key=lambda x: str(x.get("site","")))
          verified = [x for x in rows if int(x.get("verified_feed_count") or 0) > 0]
          out = pathlib.Path("out/v175-google-feed-aggregate")
          out.mkdir(parents=True, exist_ok=True)
          summary = {
              "schema_version": "v175-google-feed-recovery-aggregate/v1",
              "site_count": len(rows),
              "verified_site_count": len(verified),
              "verified_feed_count": sum(int(x.get("verified_feed_count") or 0) for x in rows),
              "verified": [{"site": x.get("site"), "feeds": x.get("verified_feeds") or []} for x in verified],
              "sites": rows,
          }
          (out/"aggregate.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({k: summary[k] for k in ("site_count","verified_site_count","verified_feed_count","verified")}, ensure_ascii=False, indent=2))
          PY
      - name: Upload aggregate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v175-google-feed-aggregate
          path: out/v175-google-feed-aggregate
          if-no-files-found: error
          retention-days: 30
