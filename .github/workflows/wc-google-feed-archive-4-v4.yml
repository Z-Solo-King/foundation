name: WooCommerce Google Feed Archive Discovery 4 v4

on:
  push:
    branches:
      - fix/wc-google-feed-focus-4-20260929
    paths:
      - ".github/workflows/wc-google-feed-archive-4-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Query feed-like archive URLs server-side
        run: |
          mkdir -p out/wc-google-feed-archive-v4
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const sites=[
            ["Ads Store","adsstore.in"],
            ["ithunt","ithunt.in"],
            ["KC Computers","kccomputers.co.in"],
            ["KRG KART","krgkart.com"]
          ];
          const ua='Mozilla/5.0 (compatible; WCFeedArchiveDiscovery/2026.09)';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const coll=(await (await fetch('https://index.commoncrawl.org/collinfo.json',{headers:{'User-Agent':ua},signal:AbortSignal.timeout(30000)})).json())
            .map(x=>x.id).filter(x=>/^CC-MAIN-2026-/.test(x)).slice(0,6);
          const feedRegex='.*(woocommerce[_-]?gpf|feedcraft|wppfm|codesolz|google[-_]?product|google[-_]?shopping|merchant[-_]?feed|product[-_]?feed|\\.xml(?:\\?|$)|\\.rss(?:\\?|$)).*';
          const results=[];
          for(const [site,host] of sites){
            const candidates=new Map(), statuses=[];
            for(const id of coll){
              try{
                const u=new URL('https://index.commoncrawl.org/'+id+'-index');
                u.searchParams.set('url',host+'/*');
                u.searchParams.set('matchType','prefix');
                u.searchParams.set('output','json');
                u.searchParams.set('filter','status:200');
                u.searchParams.append('filter','~url:'+feedRegex);
                u.searchParams.set('collapse','urlkey');
                u.searchParams.set('limit','200');
                u.searchParams.set('fl','url,timestamp,mime,status,filename,offset,length');
                const r=await fetch(u,{headers:{'User-Agent':ua},signal:AbortSignal.timeout(30000)});
                const t=await r.text();
                statuses.push({crawl:id,status:r.status,bytes:t.length});
                if(r.status===200){
                  for(const line of t.split('\n')){
                    if(!line.trim())continue;
                    try{const x=JSON.parse(line);if(x.url&&!candidates.has(x.url))candidates.set(x.url,x);}catch{}
                  }
                }
              }catch(e){statuses.push({crawl:id,error:e?.name||String(e)});}
              await sleep(1200);
            }
            const report={site,host,crawls:coll,statuses,candidate_count:candidates.size,candidates:[...candidates.values()].slice(0,200)};
            await writeFile('out/wc-google-feed-archive-v4/'+host+'.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
            results.push(report);
            await sleep(1500);
          }
          await writeFile('out/wc-google-feed-archive-v4/summary.json',JSON.stringify(results,null,2)+'\n');
          NODE
      - name: Upload archive URL candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wc-google-feed-archive-v4
          path: out/wc-google-feed-archive-v4/
          if-no-files-found: warn
          retention-days: 14
