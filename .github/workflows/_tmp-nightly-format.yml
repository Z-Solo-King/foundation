name: Temporary exact nightly formatter

on:
  push:
    branches:
      - fix/live-crossfire-workflow-hardening-2026-10-03
    paths:
      - ".github/workflows/nightly-benchmark-ai-crossfire.yml"
      - ".github/workflows/_tmp-nightly-format.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Format
        run: npx --yes prettier@3.9.9 --write .github/workflows/nightly-benchmark-ai-crossfire.yml
      - name: Validate
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(<.github/workflows/nightly-benchmark-ai-crossfire.yml)"
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-nightly-formatter
          path: .github/workflows/nightly-benchmark-ai-crossfire.yml
          retention-days: 1
          if-no-files-found: error
