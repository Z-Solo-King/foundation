name: Canonical workflow-dispatch bridge acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: canonical-workflow-dispatch-bridge
  cancel-in-progress: false

jobs:
  bridge-acceptance:
    name: Prove supported workflow-dispatch bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove canonical workflow-dispatch bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: main-push-actions-control-plane-probe-v2.yml
          FOUNDATION_REF: main
        run: |
          set -euo pipefail
          expected_sha="$GITHUB_SHA"
          dispatch_epoch="$(date -u +%s)"
          payload="$(jq -nc --arg ref "$FOUNDATION_REF" --arg target "$TARGET" '{ref:$ref,inputs:{target:$target}}')"

          echo "Dispatching canonical bridge through gh workflow run"
          GH_TOKEN="$GH_TOKEN" gh workflow run foundation-canonical-workflow-bridge-v3.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$FOUNDATION_REF" \
            -f "target=$TARGET"
          echo "Foundation bridge dispatch accepted"
          bridge_run_id=""
          for _ in {1..24}; do
            runs_json="$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/foundation-canonical-workflow-bridge-v3.yml/runs?event=workflow_dispatch&branch=${FOUNDATION_REF}&per_page=20")"
            bridge_run_id="$(jq -r --argjson epoch "$dispatch_epoch" --arg sha "$expected_sha" '.workflow_runs[] | select(.head_sha==$sha) | select((.created_at|fromdateiso8601) >= ($epoch-30)) | .id' <<<"$runs_json" | head -n1)"
            [[ -n "$bridge_run_id" ]] && break
            sleep 5
          done
          test -n "$bridge_run_id"

          bridge_conclusion=""
          for _ in {1..60}; do
            bridge_json="$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${bridge_run_id}")"
            bridge_status="$(jq -r '.status' <<<"$bridge_json")"
            bridge_conclusion="$(jq -r '.conclusion // empty' <<<"$bridge_json")"
            echo "Bridge run ${bridge_run_id}: ${bridge_status}/${bridge_conclusion}"
            [[ "$bridge_status" == "completed" ]] && break
            sleep 5
          done
          test "$bridge_conclusion" = "success"

          target_run_id=""
          for _ in {1..24}; do
            target_runs="$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET}/runs?event=workflow_dispatch&branch=${FOUNDATION_REF}&per_page=20")"
            target_run_id="$(jq -r --argjson epoch "$dispatch_epoch" --arg sha "$expected_sha" '.workflow_runs[] | select(.head_sha==$sha) | select((.created_at|fromdateiso8601) >= ($epoch-30)) | .id' <<<"$target_runs" | head -n1)"
            [[ -n "$target_run_id" ]] && break
            sleep 5
          done
          test -n "$target_run_id"

          job_count=0
          for _ in {1..24}; do
            jobs_json="$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${target_run_id}/jobs?per_page=100")"
            job_count="$(jq '.total_count // (.jobs | length) // 0' <<<"$jobs_json")"
            echo "Target run ${target_run_id}: job_count=${job_count}"
            [[ "$job_count" -gt 0 ]] && break
            sleep 5
          done
          test "$job_count" -gt 0

          mkdir -p .runtime
          jq -n --arg sha "$expected_sha" --argjson bridge "$bridge_run_id" --argjson target "$target_run_id" --argjson jobs "$job_count" '{schema:"foundation-workflow-dispatch-bridge-receipt/v1",target:"main-push-actions-control-plane-probe-v2.yml",foundation_sha:$sha,bridge_run_id:$bridge,target_run_id:$target,target_job_count:$jobs,status:"success"}' > .runtime/workflow-dispatch-bridge-receipt.json

      - name: Upload workflow-dispatch bridge receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-dispatch-bridge-receipt
          path: .runtime/workflow-dispatch-bridge-receipt.json
          if-no-files-found: error
