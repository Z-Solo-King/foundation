name: Canonical workflow-dispatch bridge acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: canonical-workflow-dispatch-bridge
  cancel-in-progress: false

jobs:
  bridge-acceptance:
    name: Prove supported workflow-dispatch bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove canonical workflow-dispatch bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: main-push-actions-control-plane-probe-v2.yml
          FOUNDATION_REF: main
        run: |
          set -euo pipefail
          expected_sha="$GITHUB_SHA"
          echo "Dispatching canonical bridge through gh workflow run"
          bridge_url="$(GH_TOKEN="$GH_TOKEN" gh workflow run foundation-canonical-workflow-bridge-v3.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$FOUNDATION_REF" \
            -f "target=$TARGET" 2>&1)"
          bridge_run_url="$(printf '%s\n' "$bridge_url" | grep -Eo 'https://[^[:space:]]+/actions/runs/[0-9]+' | tail -n1 || true)"
          bridge_run_id="$(printf '%s\n' "$bridge_run_url" | sed -n 's#.*/runs/\([0-9][0-9]*\).*#\1#p')"
          test -n "$bridge_run_id"
          echo "Foundation bridge dispatch accepted: run_id=$bridge_run_id"

          bridge_conclusion=""
          for _ in {1..60}; do
            bridge_json="$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${bridge_run_id}")"
            bridge_status="$(jq -r '.status' <<<"$bridge_json")"
            bridge_conclusion="$(jq -r '.conclusion // empty' <<<"$bridge_json")"
            echo "Bridge run ${bridge_run_id}: ${bridge_status}/${bridge_conclusion}"
            [[ "$bridge_status" == "completed" ]] && break
            sleep 5
          done
          test "$bridge_conclusion" = "success"

          rm -rf .runtime/bridge-receipt
          mkdir -p .runtime/bridge-receipt
          GH_TOKEN="$GH_TOKEN" gh run download "$bridge_run_id" --repo "$GITHUB_REPOSITORY" --name canonical-bridge-v3-receipt --dir .runtime/bridge-receipt
          receipt_path="$(find .runtime/bridge-receipt -type f -name 'bridge-receipt.json' -print -quit)"
          test -n "$receipt_path"
          target_run_id="$(jq -r '.target_run_id // empty' "$receipt_path")"
          job_count="$(jq -r '.target_job_count // 0' "$receipt_path")"
          test "$target_run_id" -gt 0
          test "$job_count" -gt 0
          echo "Target run ${target_run_id}: bridge receipt reported job_count=${job_count}"

          mkdir -p .runtime
          jq -n --arg sha "$expected_sha" --argjson bridge "$bridge_run_id" --argjson target "$target_run_id" --argjson jobs "$job_count" '{schema:"foundation-workflow-dispatch-bridge-receipt/v1",target:"main-push-actions-control-plane-probe-v2.yml",foundation_sha:$sha,bridge_run_id:$bridge,target_run_id:$target,target_job_count:$jobs,status:"success"}' > .runtime/workflow-dispatch-bridge-receipt.json

      - name: Upload workflow-dispatch bridge receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-dispatch-bridge-receipt
          path: .runtime/workflow-dispatch-bridge-receipt.json
          if-no-files-found: error
