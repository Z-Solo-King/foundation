name: Native Google Feed URL Hunt

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        site:
          - ads-store
          - ithunt
          - kccomputers
          - krg-kart
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe live Cloudflare egress worker
        env:
          SITE: ${{ matrix.site }}
          WORKER: https://feed-origin-probe-20260927.heroic-ai.workers.dev
        run: |
          set -euo pipefail
          mkdir -p out/native
          curl -sS --max-time 300 -D "out/native/${SITE}.headers"             "${WORKER}/native/${SITE}"             -o "out/native/${SITE}.body"
          cat "out/native/${SITE}.headers"
          wc -c "out/native/${SITE}.body"
          if grep -qi '^x-native-feed-url:' "out/native/${SITE}.headers"; then
            cp "out/native/${SITE}.body" "out/native/${SITE}.xml"
            node <<'NODE'
            const fs=require("fs"), crypto=require("crypto");
            const s=fs.readFileSync("out/native/"+process.env.SITE+".xml","utf8");
            const ok=s.includes("<rss") &&
              s.includes("http://base.google.com/ns/1.0") &&
              s.includes("<item") &&
              s.includes("<g:id") &&
              s.includes("<g:title") &&
              s.includes("<g:link") &&
              s.includes("<g:price") &&
              s.includes("<g:image_link");
            if(!ok) throw new Error("strict native validation failed");
            console.log(JSON.stringify({
              site:process.env.SITE,
              native_url:fs.readFileSync("out/native/"+process.env.SITE+".headers","utf8")
                .split("\n").find(x=>/^x-native-feed-url:/i.test(x)),
              items:(s.match(/<item\\b/gi)||[]).length,
              bytes:Buffer.byteLength(s),
              sha256:crypto.createHash("sha256").update(s).digest("hex")
            },null,2));
            NODE
          else
            echo "NATIVE_FEED_NOT_VERIFIED=${SITE}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-feed-${{ matrix.site }}
          path: out/
          if-no-files-found: error
