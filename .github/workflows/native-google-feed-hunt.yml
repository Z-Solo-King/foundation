name: Native Google Feed URL Hunt

# Legacy manual fallback; canonical current execution is WooCommerce Native XML Recovery V18.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Hunt direct native Google Merchant XML URLs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          cat > /tmp/hunt_site.sh <<'SH'
          set -uo pipefail
          site="$1"; root="$2"; output="$3"

          paths=(
            '/?woocommerce_gpf=google'
            '/?woocommerce_gpf=google&gpf_start=0&gpf_limit=250'
            '/?woocommerce_gpf=google&gpf_start=0&gpf_limit=1000'
            '/?woocommerce_gpf=google&gpf_start=0&gpf_limit=5000'
            '/woocommerce_gpf/google'
            '/woocommerce_gpf/google?gpf_start=0&gpf_limit=250'
            '/woocommerce_gpf/google?gpf_start=0&gpf_limit=1000'
            '/google.xml' '/google_feed.xml' '/google-feed.xml'
            '/google_base.xml' '/googlebase.xml'
            '/google-products.xml' '/google-product-feed.xml' '/google_product_feed.xml'
            '/google-products-feed.xml' '/google-shopping.xml' '/google-shopping-feed.xml'
            '/google-shopping-products.xml' '/google-shopping-products-feed.xml'
            '/google-merchant.xml' '/google-merchant-feed.xml' '/google_merchant_feed.xml'
            '/merchant.xml' '/merchant-feed.xml' '/merchant_feed.xml'
            '/gmerchant.xml' '/gpf.xml'
            '/product-feed.xml' '/products-feed.xml' '/feed_products.xml' '/products.xml'
            '/feed/google.xml' '/feed/google_feed.xml' '/feed/googlebase.xml'
            '/feed/google_base.xml' '/feed/google-products.xml' '/feed/google-shopping.xml'
            '/feed/google-shopping-feed.xml' '/feed/merchant.xml' '/feed/merchant-feed.xml'
            '/feeds/google.xml' '/feeds/google_feed.xml' '/feeds/google_base.xml'
            '/feeds/google-products.xml' '/feeds/google-product-feed.xml'
            '/feeds/google-shopping.xml' '/feeds/google-shopping-feed.xml'
            '/feeds/google-merchant.xml' '/feeds/google-merchant-feed.xml'
            '/feeds/merchant.xml' '/feeds/merchant-feed.xml' '/feeds/products.xml'
            '/media/feed/google.xml'
            '/catalog/feed'
            '/products/google.xml' '/products/google-feed.xml' '/products/google-shopping.xml'
            '/product-feed/google.xml' '/product-feed/google-shopping.xml'
            '/google-feed/index.xml' '/feeds/google/index.xml'
            '/wp-content/uploads/woo-feed/google.xml'
            '/wp-content/uploads/woo-feed/google/xml/google.xml'
            '/wp-content/uploads/woo-feed/google/xml/google-shopping.xml'
            '/wp-content/uploads/woo-feed/google/xml/google-shopping-feed.xml'
            '/wp-content/uploads/woo-feed/google/xml/feed.xml'
            '/wp-content/uploads/woo-product-feed-pro/xml/google.xml'
            '/wp-content/uploads/woo-product-feed-pro/xml/google-shopping.xml'
            '/wp-content/uploads/woo-product-feed-pro/xml/google-shopping-feed.xml'
            '/wp-content/uploads/woo-product-feed-pro/xml/feed.xml'
            '/wp-content/uploads/wppfm-feeds/google.xml'
            '/wp-content/uploads/codesolz-feeds/google.xml'
            '/wp-content/uploads/codesolz-feeds/google-products.xml'
            '/wp-json/feedcraft-product-feed/v1/xml'
            '/feeds/products.rss'
            '/products.rss'
            '/feed.xml'
          )

          valid() {
            local f="$1"
            grep -Eqi 'http://base.google.com/ns/1.0|https://base.google.com/ns/1.0' "$f" &&
            grep -Eqi '<rss\b|<feed\b' "$f" &&
            grep -Eqi '<item\b|<entry\b' "$f" &&
            grep -Eqi '<g:id\b|<g:title\b' "$f" &&
            grep -Eqi '<g:link\b|<g:price\b' "$f" &&
            ! grep -Eqi 'just a moment|cf-chl-|turnstile|captcha|access denied|attention required|checking your browser' "$f"
          }

          same_host() {
            local candidate="$1"
            local base="$root"
            if [ -n "${2:-}" ]; then base="$2"; fi
            python3 - "$candidate" "$base" <<'PY'
          import sys
          from urllib.parse import urlsplit
          a=urlsplit(sys.argv[1]); b=urlsplit(sys.argv[2])
          print("1" if a.hostname and b.hostname and a.hostname==b.hostname else "0")
          PY
          }

          resolve_url() {
            python3 - "$1" "$2" <<'PY'
          import sys
          from urllib.parse import urljoin
          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
          }

          public_url() {
            python3 - "$1" <<'PY'
          import socket
          import sys
          from ipaddress import ip_address
          from urllib.parse import urlsplit
          u=urlsplit(sys.argv[1])
          if u.scheme.lower() not in {"http","https"} or u.username or u.password or not u.hostname:
              raise SystemExit(1)
          if u.port not in (None, 80, 443):
              raise SystemExit(1)
          try:
              literal=ip_address(u.hostname)
              addresses=[literal]
          except ValueError:
              try:
                  addresses=[ip_address(row[4][0]) for row in socket.getaddrinfo(u.hostname, u.port or 443, type=socket.SOCK_STREAM)]
              except OSError:
                  raise SystemExit(1)
          if not addresses or not any(addr.version == 4 and addr.is_global for addr in addresses):
              raise SystemExit(1)
          if any(not addr.is_global for addr in addresses):
              raise SystemExit(1)
          PY
          }

          fetch_public() {
            local start="$1"
            local body_out="$2"
            local u="$start"
            local hop
            for hop in 0 1 2 3; do
              public_url "$u" || return 1
              local hdr
              hdr=$(mktemp)
              curl -ksS -4 --connect-timeout 4 --max-time 7 --max-redirs 0 -A 'Mozilla/5.0' -D "$hdr" -o "$body_out" "$u" >/dev/null 2>&1 || { rm -f "$hdr"; return 1; }
              local code
              code=$(awk 'tolower($1)=="http/2" || tolower($1)=="http/1.1" {c=$2} END{print c+0}' "$hdr")
              local location
              location=$(awk 'tolower($1)=="location:"{print $2}' "$hdr" | tail -1 | tr -d '\r')
              rm -f "$hdr"
              if [ "$code" -ge 300 ] && [ "$code" -lt 400 ] && [ -n "$location" ]; then
                u="$(resolve_url "$u" "$location")" || return 1
                continue
              fi
              FETCH_PUBLIC_FINAL="$u"
              FETCH_PUBLIC_CODE="$code"
              return 0
            done
            return 1
          }

          for p in "${paths[@]}"; do
            u="${root}${p}"
            body=$(mktemp)
            if fetch_public "$u" "$body"; then
              final="$FETCH_PUBLIC_FINAL"
              code="$FETCH_PUBLIC_CODE"
              if [ "$code" = "200" ] && [ "$(same_host "$final")" = "1" ] && valid "$body"; then
                printf '%s\t%s\tpath_guess\n' "$site" "$final" >> "$output"
                printf '%s\t%s\t%s\tpath_guess\n' "$site" "$final" "$code" > "out/${site// /_}.hit"
                rm -f "$body"
                exit 0
              fi
            fi
            rm -f "$body"
          done
          # Discover random/custom feed filenames from public directory indexes.
          for dir in \
            '/wp-content/uploads/woo-feed/google/xml/' \
            '/wp-content/uploads/woo-product-feed-pro/xml/' \
            '/wp-content/uploads/wppfm-feeds/' \
            '/wp-content/uploads/woo-feed/google/' \
            '/feeds/' \
            '/feed/'; do
            idx=$(mktemp)
            curl -ksSL -4 --connect-timeout 4 --max-time 4 -A 'Mozilla/5.0' -o "$idx" "${root}${dir}" >/dev/null 2>&1 || true
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              case "$ref" in
                http://*|https://*) u="$ref" ;;
                /*) u="${root}${ref}" ;;
                *) u="${root}${dir}${ref}" ;;
              esac
              case "$u" in
                *.xml|*.xml.gz|*.XML|*.XML.GZ) ;;
                *) continue ;;
              esac
              body=$(mktemp)
              if fetch_public "$u" "$body"; then
                linked_final="$FETCH_PUBLIC_FINAL"
                if same_host "$linked_final" "$u" && [ "$FETCH_PUBLIC_CODE" = "200" ] && valid "$body"; then
                  printf '%s\t%s\tdirectory_index_link\n' "$site" "$linked_final" >> "$output"
                  printf '%s\t%s\t200\tdirectory_index_link\n' "$site" "$linked_final" > "out/${site// /_}.hit"
                  rm -f "$body" "$idx"
                  exit 0
                fi
              fi
              rm -f "$body"
            done < <(
              grep -Eo 'href=["'"][^"'"]+\.(xml|xml\.gz|XML|XML\.GZ)[^"'"]*["'"]' "$idx" 2>/dev/null |
                sed -E 's/^href=["'"]//; s/["'"]$//; s/[?#].*$//' | sort -u
              grep -Eo 'https?://[^"'<>[:space:]]+\.(xml|xml\.gz|XML|XML\.GZ)' "$idx" 2>/dev/null | sort -u
            )
            rm -f "$idx"
          done

          # Public HTML/XML references sometimes expose the feed URL directly.
          for page in '/' '/robots.txt' '/sitemap.xml' '/sitemap_index.xml' '/wp-sitemap.xml'; do
            html=$(mktemp)
            curl -ksSL -4 --connect-timeout 4 --max-time 4 -A 'Mozilla/5.0' -o "$html" "${root}${page}" >/dev/null 2>&1 || true
            while IFS= read -r u; do
              [ -z "$u" ] && continue
              case "$u" in
                *.xml|*.xml.gz|*.XML|*.XML.GZ) ;;
                *) continue ;;
              esac
              body=$(mktemp)
              if fetch_public "$u" "$body"; then
                linked_final="$FETCH_PUBLIC_FINAL"
                if same_host "$linked_final" "$u" && [ "$FETCH_PUBLIC_CODE" = "200" ] && valid "$body"; then
                  printf '%s\t%s\texplicit_page_reference\n' "$site" "$linked_final" >> "$output"
                  printf '%s\t%s\t200\texplicit_page_reference\n' "$site" "$linked_final" > "out/${site// /_}.hit"
                  rm -f "$body" "$html"
                  exit 0
                fi
              fi
              rm -f "$body"
            done < <(
              grep -Eo 'https?://[^"'<>[:space:]]+' "$html" 2>/dev/null |
                sed 's/[),.;]$//' | grep -Ei '\.xml(\.gz)?($|[?#])' | sort -u
              grep -Eo 'href=["'"][^"'"]+["'"]' "$html" 2>/dev/null |
                sed -E 's/^href=["'"]//; s/["'"]$//' |
                awk -v r="$root" 'BEGIN{OFS=""} /^\//{print r,$0}' |
                grep -Ei '\.xml(\.gz)?($|[?#])' | sort -u
            )
            rm -f "$html"
          done

          printf '%s\tNOT_FOUND\n' "$site" > "out/${site// /_}.miss"
          SH
          chmod +x /tmp/hunt_site.sh

          : > out/verified-native-feed-urls.tsv
          declare -a sites=(
            'Aarna Computers|https://aarnacomputers.com'
            'Ads Store|https://adsstore.in'
            'avikaretails|https://avikaretails.com'
            'EZPZ Solutions|https://www.ezpzsolutions.in'
            'GamesNComps|https://gamesncomps.com'
            'Geekbees|https://geekbees.in'
            'hotshiftpc|https://hotshiftpc.com'
            'itgadgetsonline|https://itgadgetsonline.com'
            'ithunt|https://ithunt.in'
            'KC Computers|https://kccomputers.co.in'
            'KRG KART|https://krgkart.com'
            'PC Kumar Infotech|https://pckumar.in'
            'PCHubShop|https://pchubshop.com'
            'SCL Gaming|https://sclgaming.in'
            'Variety Infotech|https://varietyinfotech.com'
            'Viper PC|https://viperpc.in'
            'AULA India|https://aulaindia.com'
            'Cosmic Byte|https://www.thecosmicbyte.com'
            'Meckeys|https://www.meckeys.com'
            'Ninja Dog|https://ninjadog.in'
            'StacksKB|https://stackskb.com'
            'Theproaudio|https://www.theproaudio.com'
            'Prime ABGB|https://www.primeabgb.com'
            'Kryptronix Gaming|https://kryptronix.in'
            'NCL Computer|https://nclcomputer.com'
            'PC Studio|https://www.pcstudio.in'
            'Quickin Computers|https://quickincomputers.com'
            'My Nexus Infosys|https://www.mynexusinfosys.com'
            'Solanki Enterprises|https://solankienterprises.com'
            'Network IT Store|https://networkitstore.in'
          )

          pids=()
          for item in "${sites[@]}"; do
            name="${item%%|*}"
            root="${item#*|}"
            /tmp/hunt_site.sh "$name" "$root" out/verified-native-feed-urls.tsv &
            pids+=("$!")
          done
          for p in "${pids[@]}"; do wait "$p" || true; done

          sort -u out/verified-native-feed-urls.tsv -o out/verified-native-feed-urls.tsv
          echo '=== VERIFIED NATIVE FEEDS ==='
          cat out/verified-native-feed-urls.tsv
      - name: Upload feed URL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-google-feed-url-results
          path: out/
          retention-days: 14
