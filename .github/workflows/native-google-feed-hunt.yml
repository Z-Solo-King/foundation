# Restart Stage 1 from consolidated browser-session extractor state.
# Staged learning pipeline: 2 -> 4 -> 6 -> remaining 20.
# Feed filename grammar pass enabled.
# Stage 1 is intentionally gated; later waves cannot start without verified feeds.
name: Native Google Feed URL Hunt

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-google-feed-hunt.yml"
      - "tools/native_google_feed_hunt_v2.py"
      - "tests/test_native_google_feed_hunt_v2.py"
  push:
    branches:
      - fix/woocommerce-native-google-feed-hunt-20260927
    paths:
      - ".github/workflows/native-google-feed-hunt.yml"
      - "tools/native_google_feed_hunt_v2.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staged-native-google-feed-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1:
    name: "Stage 1 · first 2 · ${{ matrix.slug }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slug: krg-kart
            site: "KRG KART"
          - slug: avikaretails
            site: "avikaretails"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install browser session dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input playwright
          python -m playwright install --with-deps chromium
      - name: Run targeted native hunt with iterative learning
        run: |
          set -euo pipefail
          base="out/native-google-feed-shard-stage1-${{ matrix.slug }}"
          mkdir -p "$base"
          for round in 1 2 3 4; do
            out="$base/round-$round"
            args=(--shard 0 --shards 1 --only-sites "${{ matrix.site }}" --output-dir "$out")
            if [ "$round" -gt 1 ]; then
              for d in "$base"/round-*; do
                [ "$d" = "$out" ] && continue
                [ -d "$d" ] && args+=(--learn-from "$d")
              done
            fi
            python tools/native_google_feed_hunt_v2.py "${args[@]}" | tee "$base/round-$round.log"
            if jq -e '.status == "verified_native"' "$out/${{ matrix.slug }}.json" >/dev/null 2>&1; then
              break
            fi
          done
      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-google-feed-shard-stage1-${{ matrix.slug }}
          path: out/native-google-feed-shard-stage1-${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 14

  stage1_gate:
    name: "Gate · require both Stage 1 feeds"
    needs: [stage1]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Stage 1 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: native-google-feed-shard-stage1-*
          path: out/learning
          merge-multiple: false
      - name: Verify both Stage 1 retailers
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          wanted = {"KRG KART", "avikaretails"}
          found = {}
          for p in Path("out/learning").rglob("*.json"):
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue
              site = d.get("site")
              url = d.get("native_feed_url")
              if site in wanted and url:
                  found[site] = url
          missing = wanted - found.keys()
          if missing:
              raise SystemExit("Stage 1 gate blocked: " + ", ".join(sorted(missing)))
          for site in sorted(found):
              print(site + "\t" + found[site])
          PY

  stage2:
    name: "Stage 2 · next 4 · ${{ matrix.slug }}"
    needs: [stage1_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - slug: aarna-computers
            site: "Aarna Computers"
          - slug: pc-kumar-infotech
            site: "PC Kumar Infotech"
          - slug: viper-pc
            site: "Viper PC"
          - slug: ithunt
            site: "ithunt"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download Stage 1 learning evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: native-google-feed-shard-stage1-*
          path: out/learning
          merge-multiple: false
      - name: Install browser session dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input playwright
          python -m playwright install --with-deps chromium
      - name: Run learned targeted native hunt
        run: |
          set -euo pipefail
          args=(--shard 0 --shards 1 --only-sites "${{ matrix.site }}" --output-dir "out/native-google-feed-shard-stage2-${{ matrix.slug }}")
          for d in out/learning/*; do
            [ -d "$d" ] && args+=(--learn-from "$d")
          done
          python tools/native_google_feed_hunt_v2.py "${args[@]}"
      - name: Upload Stage 2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-google-feed-shard-stage2-${{ matrix.slug }}
          path: out/native-google-feed-shard-stage2-${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 14

  stage2_gate:
    name: "Gate · require all 4 learned feeds"
    needs: [stage2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Stage 2 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: native-google-feed-shard-stage2-*
          path: out/learning
          merge-multiple: false
      - name: Verify Stage 2 retailers
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          wanted = {"Aarna Computers", "PC Kumar Infotech", "Viper PC", "ithunt"}
          found = {}
          for p in Path("out/learning").rglob("*.json"):
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue
              site = d.get("site")
              url = d.get("native_feed_url")
              if site in wanted and url:
                  found[site] = url
          missing = wanted - found.keys()
          if missing:
              raise SystemExit("Stage 2 gate blocked: " + ", ".join(sorted(missing)))
          for site in sorted(found):
              print(site + "\t" + found[site])
          PY

  stage3:
    name: "Stage 3 · next 6 · ${{ matrix.slug }}"
    needs: [stage2_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - slug: ads-store
            site: "Ads Store"
          - slug: kc-computers
            site: "KC Computers"
          - slug: gamesncomps
            site: "GamesNComps"
          - slug: geekbees
            site: "Geekbees"
          - slug: hotshiftpc
            site: "hotshiftpc"
          - slug: itgadgetsonline
            site: "itgadgetsonline"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download prior-stage learning evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: native-google-feed-shard-stage*
          path: out/learning
          merge-multiple: false
      - name: Install browser session dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input playwright
          python -m playwright install --with-deps chromium
      - name: Run learned native hunt
        run: |
          set -euo pipefail
          args=(--shard 0 --shards 1 --only-sites "${{ matrix.site }}" --output-dir "out/native-google-feed-shard-stage3-${{ matrix.slug }}")
          for d in out/learning/*; do
            [ -d "$d" ] && args+=(--learn-from "$d")
          done
          python tools/native_google_feed_hunt_v2.py "${args[@]}"
      - name: Upload Stage 3 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-google-feed-shard-stage3-${{ matrix.slug }}
          path: out/native-google-feed-shard-stage3-${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 14

  stage3_gate:
    name: "Gate · require all 6 learned feeds"
    needs: [stage3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Stage 3 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: native-google-feed-shard-stage3-*
          path: out/learning
          merge-multiple: false
      - name: Verify Stage 3 retailers
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          wanted = {"Ads Store", "KC Computers", "GamesNComps", "Geekbees", "hotshiftpc", "itgadgetsonline"}
          found = {}
          for p in Path("out/learning").rglob("*.json"):
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue
              site = d.get("site")
              url = d.get("native_feed_url")
              if site in wanted and url:
                  found[site] = url
          missing = wanted - found.keys()
          if missing:
              raise SystemExit("Stage 3 gate blocked: " + ", ".join(sorted(missing)))
          for site in sorted(found):
              print(site + "\t" + found[site])
          PY

  stage4:
    name: "Stage 4 · remaining 20 · shard ${{ matrix.shard }}"
    needs: [stage3_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - shard: 0
            sites: "AULA India,Cosmic Byte,Meckeys"
          - shard: 1
            sites: "Moskeys,Ninja Dog,StacksKB"
          - shard: 2
            sites: "Theproaudio,EZPZ Solutions"
          - shard: 3
            sites: "Kryptronix Gaming,NCL Computer,networkitstore"
          - shard: 4
            sites: "nexusinfosys,Only SDD,PC Studio"
          - shard: 5
            sites: "PCHubShop,Prime ABGB"
          - shard: 6
            sites: "quickincomputers,SCL Gaming,solankienterprises"
          - shard: 7
            sites: "Variety Infotech"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download all prior-stage learning evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: native-google-feed-shard-stage*
          path: out/learning
          merge-multiple: false
      - name: Install browser session dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input playwright
          python -m playwright install --with-deps chromium
      - name: Run learned native hunt
        run: |
          set -euo pipefail
          args=(--shard 0 --shards 1 --only-sites "${{ matrix.sites }}" --output-dir "out/native-google-feed-shard-stage4-${{ matrix.shard }}")
          for d in out/learning/*; do
            [ -d "$d" ] && args+=(--learn-from "$d")
          done
          python tools/native_google_feed_hunt_v2.py "${args[@]}"
      - name: Upload Stage 4 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-google-feed-shard-stage4-${{ matrix.shard }}
          path: out/native-google-feed-shard-stage4-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: [stage4]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: native-google-feed-shard-stage*
          path: out/shards
          merge-multiple: false
      - name: Aggregate native-only manifest
        run: |
          set -euo pipefail
          python tools/native_google_feed_hunt_v2.py --aggregate-dir out/shards --output-file out/native-google-feed-manifest.json
          jq -e '.schema == "woocommerce-native-google-feed-manifest/v2" and .native_only == true and .no_reconstruction == true and .sites_present == 32' out/native-google-feed-manifest.json
          echo '=== VERIFIED NATIVE FEED URLS ==='
          jq -r '.verified_native_feeds[] | "(.site)	(.url)"' out/native-google-feed-manifest.json
      - name: Upload consolidated native-only manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-google-feed-manifest
          path: out/native-google-feed-manifest.json
          if-no-files-found: error
          retention-days: 30
