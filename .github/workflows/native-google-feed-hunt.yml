name: Native Google Feed URL Hunt

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Browser Run binding diagnostic (quota-only)
        run: |
          echo "Browser Run account-level diagnostic is intentionally not invoked in this direct-only pass."
      - uses: actions/upload-artifact@v4
        with:
          name: browser-binding-debug-direct-only
          path: /dev/null
          if-no-files-found: ignore

  native:
    strategy:
      fail-fast: false
      matrix:
        site: [ads-store, ithunt, kccomputers, krg-kart]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Direct public native-feed discovery
        env:
          SITE: ${{ matrix.site }}
          WORKER: https://feed-origin-probe-20260927.heroic-ai.workers.dev
        run: |
          set -euo pipefail
          mkdir -p out/native
          curl -sS --max-time 300 -D "out/native/${SITE}.headers"             "${WORKER}/native/${SITE}"             -o "out/native/${SITE}.body"
          cat "out/native/${SITE}.headers"
          wc -c "out/native/${SITE}.body"
          if grep -qi '^x-native-feed-url:' "out/native/${SITE}.headers"; then
            cp "out/native/${SITE}.body" "out/native/${SITE}.xml"
            grep -Eqi '<rss|http://base.google.com/ns/1.0|<item|<g:id|<g:title|<g:link|<g:price|<g:image_link'               "out/native/${SITE}.xml" || { echo "strict native validation failed"; exit 1; }
            grep -i '^x-native-feed-' "out/native/${SITE}.headers" || true
            echo "NATIVE_FEED_FOUND=${SITE}"
          else
            echo "NATIVE_FEED_NOT_VERIFIED=${SITE}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-feed-${{ matrix.site }}-direct-only-final
          path: out/
          if-no-files-found: error
