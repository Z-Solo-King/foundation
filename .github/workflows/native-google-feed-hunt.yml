# Parallel native-only Google Merchant feed hunt.
name: Native Google Feed URL Hunt

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-google-feed-hunt.yml"
      - "tools/native_google_feed_hunt_v2.py"
      - "tests/test_native_google_feed_hunt_v2.py"
  push:
    branches:
      - experiment/native-feed-directory-first-20260928
      - fix/woocommerce-native-google-feed-hunt-20260927
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staged-native-google-feed-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    name: "Parallel shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - shard: 0
            sites: "Aarna Computers,Ads Store,avikaretails,EZPZ Solutions"
          - shard: 1
            sites: "GamesNComps,Geekbees,hotshiftpc,itgadgetsonline"
          - shard: 2
            sites: "ithunt,KC Computers,KRG KART,Kryptronix Gaming"
          - shard: 3
            sites: "NCL Computer,networkitstore,nexusinfosys,Only SDD"
          - shard: 4
            sites: "PC Kumar Infotech,PC Studio,PCHubShop,Prime ABGB"
          - shard: 5
            sites: "quickincomputers,SCL Gaming,solankienterprises,Variety Infotech"
          - shard: 6
            sites: "Viper PC,AULA India,Cosmic Byte,Meckeys"
          - shard: 7
            sites: "Moskeys,Ninja Dog,StacksKB,Theproaudio"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install browser session dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input playwright
          python -m playwright install --with-deps chromium
      - name: Run parallel native hunt with local iterative learning
        run: |
          set -euo pipefail
          base="out/native-google-feed-shard-${{ matrix.shard }}"
          for round in 1 2; do
            out="$base/round-$round"
            args=(--shard 0 --shards 1 --only-sites "${{ matrix.sites }}" --output-dir "$out")
            if [ "$round" -gt 1 ]; then
              for d in "$base"/round-*; do
                [ "$d" = "$out" ] && continue
                [ -d "$d" ] && args+=(--learn-from "$d")
              done
            fi
            python tools/native_google_feed_hunt_v2.py "${args[@]}" | tee "$base/round-$round.log"
            if grep -R '"status": "verified_native"' "$out" >/dev/null 2>&1; then
              break
            fi
          done
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-google-feed-parallel-shard-${{ matrix.shard }}
          path: out/native-google-feed-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: [hunt]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: native-google-feed-parallel-shard-*
          path: out/shards
          merge-multiple: false
      - name: Aggregate native-only manifest
        run: |
          set -euo pipefail
          python tools/native_google_feed_hunt_v2.py --aggregate-dir out/shards --output-file out/native-google-feed-manifest.json
          jq -e '.schema == "woocommerce-native-google-feed-manifest/v2" and .native_only == true and .no_reconstruction == true and .sites_present == 32' out/native-google-feed-manifest.json
          echo '=== VERIFIED NATIVE FEED URLS ==='
          jq -r '.verified_native_feeds[] | "\(.site)\t\(.url)"' out/native-google-feed-manifest.json
      - name: Upload consolidated native-only manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-google-feed-parallel-manifest
          path: out/native-google-feed-manifest.json
          if-no-files-found: error
          retention-days: 30
