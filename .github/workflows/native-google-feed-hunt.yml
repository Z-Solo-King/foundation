# staged 31-site extraction
name: WooCommerce 31 Plugin Extraction

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened, opened]
  push:
    branches:
      - hunt/native-google-feed-urls-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    name: "plugin extraction — ${{ matrix.site }}"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {id: aarna-computers, site: Aarna Computers, root: https://aarnacomputers.com}
          - {id: ads-store, site: Ads Store, root: https://adsstore.in}
          - {id: avikaretails, site: avikaretails, root: https://avikaretails.com}
          - {id: ezpz-solutions, site: EZPZ Solutions, root: https://www.ezpzsolutions.in}
          - {id: gamesncomps, site: GamesNComps, root: https://gamesncomps.com}
          - {id: geekbees, site: Geekbees, root: https://geekbees.in}
          - {id: hotshiftpc, site: hotshiftpc, root: https://hotshiftpc.com}
          - {id: itgadgetsonline, site: itgadgetsonline, root: https://itgadgetsonline.com}
          - {id: ithunt, site: ithunt, root: https://ithunt.in}
          - {id: kc-computers, site: KC Computers, root: https://kccomputers.co.in}
          - {id: krg-kart, site: KRG KART, root: https://krgkart.com}
          - {id: kryptronix-gaming, site: Kryptronix Gaming, root: https://kryptronix.in}
          - {id: ncl-computer, site: NCL Computer, root: https://nclcomputer.com}
          - {id: networkitstore, site: networkitstore, root: https://networkitstore.in}
          - {id: nexusinfosys, site: nexusinfosys, root: https://www.mynexusinfosys.com}
          - {id: pc-kumar-infotech, site: PC Kumar Infotech, root: https://pckumar.in}
          - {id: pcstudio, site: PC Studio, root: https://www.pcstudio.in}
          - {id: pchubshop, site: PCHubShop, root: https://www.pchubshop.com}
          - {id: prime-abgb, site: Prime ABGB, root: https://www.primeabgb.com}
          - {id: quickincomputers, site: quickincomputers, root: https://quickincomputers.com}
          - {id: scl-gaming, site: SCL Gaming, root: https://sclgaming.in}
          - {id: solankienterprises, site: solankienterprises, root: https://solankienterprises.com}
          - {id: variety-infotech, site: Variety Infotech, root: https://varietyinfotech.com}
          - {id: viper-pc, site: Viper PC, root: https://viperpc.in}
          - {id: aula-india, site: AULA India, root: https://aulaindia.com}
          - {id: cosmic-byte, site: Cosmic Byte, root: https://www.thecosmicbyte.com}
          - {id: meckeys, site: Meckeys, root: https://www.meckeys.com}
          - {id: moskeys, site: Moskeys, root: https://moskeys.com}
          - {id: ninja-dog, site: Ninja Dog, root: https://ninjadog.in}
          - {id: stackskb, site: StacksKB, root: https://stackskb.com}
          - {id: theproaudio, site: Theproaudio, root: https://www.theproaudio.com}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Extract public plugin evidence
        run: node tools/feed-lab/woocommerce_31_plugin_extract.mjs --site "${{ matrix.site }}" --root "${{ matrix.root }}" --out "out/${{ matrix.id }}.json"
      - name: Upload per-site fingerprint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plugin-fingerprint-${{ matrix.id }}
          path: out/${{ matrix.id }}.json
          retention-days: 14

  aggregate:
    name: Aggregate 31-site plugin evidence
    needs: fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: plugin-fingerprint-*
          path: out/fingerprints
          merge-multiple: true
      - uses: actions/setup-node@1e60f620b9541dca7f5b0f7a6e1b3f4f2c37ad5
        with:
          node-version: 20
      - name: Group plugin signals
        shell: bash
        run: |
          node > out/plugin-groups.json <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir='out/fingerprints';
          const files=fs.readdirSync(dir).filter(f=>f.endsWith('.json')).sort();
          const rows=files.map(f=>JSON.parse(fs.readFileSync(path.join(dir,f),'utf8')));
          const groups={};
          for(const r of rows){
            const g=r.primary_group || 'unknown_woocommerce';
            (groups[g]??=[]).push(r.site);
          }
          for(const k of Object.keys(groups)) groups[k].sort();
          const feedLike=rows.map(r=>({
            site:r.site, primary_group:r.primary_group, status:r.status,
            feed_like_plugin_assets:r.feed_like_plugin_assets, feed_family_signals:r.feed_family_signals,
            plugin_assets:r.plugin_assets, readme_metadata:r.readme_metadata,
            wordpress_generator:r.wordpress_generator, public_api_namespaces:r.public_api_namespaces,
            endpoint_summary:r.endpoints.map(x=>({origin:x.origin,endpoint:x.endpoint,status:x.status,finalUrl:x.finalUrl,transport:x.transport,challenge:x.challenge}))
          }));
          const out={
            schema_version:'woocommerce-31-plugin-groups/v2',
            site_count:rows.length,
            excluded_known_feed:'Only SDD (already verified separately)',
            grouping:'strong known feed family > exact feed-like plugin asset > unknown_woocommerce',
            groups,
            sites:feedLike
          };
          fs.writeFileSync('out/plugin-groups.json',JSON.stringify(out,null,2)+'\\n');
          const lines=['# WooCommerce 31 Plugin Extraction','',`Sites: ${rows.length}`,'','## Groups',''];
          for(const [g,sites] of Object.entries(groups).sort()) lines.push(`### ${g}`,'',...sites.map(s=>'- '+s),'');
          lines.push('## Site evidence','','| Site | Group | Status | Feed-like plugin assets | Plugin asset count |','|---|---|---|---|---:|');
          for(const r of rows.sort((a,b)=>a.site.localeCompare(b.site))){
            lines.push(`| ${r.site} | ${r.primary_group} | ${r.status} | ${r.feed_like_plugin_assets.join(', ')||'none'} | ${r.plugin_assets.length} |`);
          }
          fs.writeFileSync('out/plugin-groups.md',lines.join('\\n')+'\\n');
          NODE
          test "$(node -e "console.log(Object.values(require('./out/plugin-groups.json').groups).flat().length)")" -eq 31
          test "$(find out/fingerprints -name '*.json' | wc -l)" -eq 31
          cat out/plugin-groups.md
      - name: Upload aggregated plugin evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: woocommerce31-plugin-extraction
          path: out/
          retention-days: 14
