name: Native Google Feed URL Hunt

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-google-feed-hunt.yml"
      - "tools/native_google_feed_hunt.py"
      - "tools/native_google_feed_hunt_v2.py"
      - "tests/test_native_google_feed_hunt.py"
      - "tests/test_native_google_feed_hunt_v2.py"
  push:
    branches:
      - hunt/native-google-feed-urls-20260927
    paths:
      - ".github/workflows/native-google-feed-hunt.yml"
      - "tools/native_google_feed_hunt_v2.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-google-feed-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run native-only shard
        run: |
          set -euo pipefail
          python tools/native_google_feed_hunt_v2.py --shard "${{ matrix.shard }}" --shards 8 --output-dir "out/shard-${{ matrix.shard }}"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-google-feed-shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: [hunt]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: native-google-feed-shard-*
          path: out/shards
          merge-multiple: false
      - name: Aggregate native-only manifest
        run: |
          set -euo pipefail
          python tools/native_google_feed_hunt_v2.py --aggregate-dir out/shards --output-file out/native-google-feed-manifest.json
          jq -e '.schema == "woocommerce-native-google-feed-manifest/v2" and .native_only == true and .no_reconstruction == true and .sites_present == 32' out/native-google-feed-manifest.json
          echo '=== VERIFIED NATIVE FEED URLS ==='
          jq -r '.verified_native_feeds[] | "\(.site)\t\(.url)"' out/native-google-feed-manifest.json
      - name: Upload consolidated native-only manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-google-feed-manifest
          path: out/native-google-feed-manifest.json
          if-no-files-found: error
          retention-days: 30
