name: Native Google Feed URL Hunt

on:
  push:
    branches:
      - test/wc-feed-recovery-clean-20260927
    paths:
      - ".github/workflows/native-google-feed-hunt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    name: \${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Aarna Computers", root: "https://aarnacomputers.com"}
          - {name: "Ads Store", root: "https://adsstore.in"}
          - {name: "avikaretails", root: "https://avikaretails.com"}
          - {name: "EZPZ Solutions", root: "https://www.ezpzsolutions.in"}
          - {name: "GamesNComps", root: "https://gamesncomps.com"}
          - {name: "Geekbees", root: "https://geekbees.in"}
          - {name: "hotshiftpc", root: "https://hotshiftpc.com"}
          - {name: "itgadgetsonline", root: "https://itgadgetsonline.com"}
          - {name: "ithunt", root: "https://ithunt.in"}
          - {name: "KC Computers", root: "https://kccomputers.co.in"}
          - {name: "KRG KART", root: "https://krgkart.com"}
          - {name: "Kryptronix Gaming", root: "https://kryptronix.in"}
          - {name: "NCL Computer", root: "https://nclcomputer.com"}
          - {name: "networkitstore", root: "https://networkitstore.in"}
          - {name: "nexusinfosys", root: "https://www.mynexusinfosys.com"}
          - {name: "Only SDD", root: "https://onlyssd.com"}
          - {name: "PC Kumar Infotech", root: "https://pckumar.in"}
          - {name: "PC Studio", root: "https://www.pcstudio.in"}
          - {name: "PCHubShop", root: "https://www.pchubshop.com"}
          - {name: "Prime ABGB", root: "https://www.primeabgb.com"}
          - {name: "quickincomputers", root: "https://quickincomputers.com"}
          - {name: "SCL Gaming", root: "https://sclgaming.in"}
          - {name: "solankienterprises", root: "https://solankienterprises.com"}
          - {name: "Variety Infotech", root: "https://varietyinfotech.com"}
          - {name: "Viper PC", root: "https://viperpc.in"}
          - {name: "AULA India", root: "https://aulaindia.com"}
          - {name: "Cosmic Byte", root: "https://www.thecosmicbyte.com"}
          - {name: "Meckeys", root: "https://www.meckeys.com"}
          - {name: "Moskeys", root: "https://moskeys.com"}
          - {name: "Ninja Dog", root: "https://ninjadog.in"}
          - {name: "StacksKB", root: "https://stackskb.com"}
          - {name: "Theproaudio", root: "https://www.theproaudio.com"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Hunt native Google Merchant XML URL
        env:
          SITE_NAME: \${{ matrix.name }}
          ROOT: \${{ matrix.root }}
        run: |
          set -euo pipefail
          mkdir -p out

          cat > /tmp/hunt.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import { gunzipSync } from 'node:zlib';

          const root = process.env.ROOT.replace(/\/$/, '');
          const site = process.env.SITE_NAME;

          const paths = [
            '/?woocommerce_gpf=google',
            '/woocommerce_gpf/google',
            '/google.xml',
            '/google-feed.xml',
            '/google_feed.xml',
            '/google-shopping.xml',
            '/google-shopping-feed.xml',
            '/google-shopping-products.xml',
            '/google_products.xml',
            '/google_products_feed.xml',
            '/googlebase.xml',
            '/google_base.xml',
            '/google-product-feed.xml',
            '/product-feed.xml',
            '/products-feed.xml',
            '/merchant-feed.xml',
            '/merchant_feed.xml',
            '/feeds/google.xml',
            '/feeds/google-feed.xml',
            '/feeds/google-shopping.xml',
            '/feeds/google-product-feed.xml',
            '/feeds/google-products.xml',
            '/feed/google.xml',
            '/feed/google-feed.xml',
            '/feed/google-shopping.xml',
            '/feed/google-products.xml',
            '/wp-content/uploads/woo-feed/google/xml/google-shopping.xml',
            '/wp-content/uploads/woo-feed/google/xml/google.xml',
            '/wp-content/uploads/woo-feed/google/xml/google-shopping-products.xml',
            '/wp-content/uploads/woo-feed/google/xml/shopping.xml',
            '/wp-content/uploads/woo-feed/google/xml/feed.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google-shopping.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google-shopping-feed.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google-products.xml',
            '/wp-content/uploads/codesolz-feeds/google-products.xml',
            '/wp-content/uploads/woo-feed/google/xml/google-shopping-feed.xml'
          ];

          const normalized = [];
          const seen = new Set();

          function sameDomain(u) {
            try {
              const a = new URL(u);
              const b = new URL(root);
              return a.protocol === 'http:' || a.protocol === 'https:'
                ? a.hostname === b.hostname || a.hostname.endsWith('.' + b.hostname)
                : false;
            } catch { return false; }
          }

          function validateXml(text) {
            const low = text.slice(0, 250000).toLowerCase();
            const xmlRoot = /<rss\\b[^>]*>|<feed\\b[^>]*>/.test(low);
            const gns = low.includes('http://base.google.com/ns/1.0');
            const item = low.includes('<item');
            const id = low.includes('<g:id');
            const title = low.includes('<g:title');
            const link = low.includes('<g:link');
            const price = low.includes('<g:price');
            const challenge = /(just a moment|attention required|cf-chl-|turnstile|captcha|access denied)/i.test(low);
            return xmlRoot && gns && item && id && title && link && price && !challenge;
          }

          async function fetchText(url) {
            try {
              const r = await fetch(url, {
                redirect: 'follow',
                signal: AbortSignal.timeout(9000),
                headers: {
                  'User-Agent': 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)',
                  'Accept': 'application/xml,text/xml,text/plain,text/html;q=0.9,*/*;q=0.8'
                }
              });
              const finalUrl = r.url;
              const ct = r.headers.get('content-type') || '';
              const ab = new Uint8Array(await r.arrayBuffer());
              let text;
              if (/gzip/i.test(ct) || url.endsWith('.gz')) {
                try { text = gunzipSync(ab).toString('utf8'); } catch { text = new TextDecoder().decode(ab); }
              } else {
                text = new TextDecoder().decode(ab);
              }
              return {ok:r.ok,status:r.status,url:finalUrl,ct,body:text};
            } catch { return null; }
          }

          async function tryUrl(u, evidence) {
            if (seen.has(u)) return false;
            seen.add(u);
            const r = await fetchText(u);
            if (!r) return false;
            if (r.ok && sameDomain(r.url) && validateXml(r.body)) {
              normalized.push({url:r.url, source:evidence, status:r.status, content_type:r.ct, bytes:r.body.length});
              return true;
            }
            return false;
          }

          for (const p of paths) {
            if (await tryUrl(root + p, 'candidate')) break;
          }

          const dirs = [
            '/wp-content/uploads/woo-feed/google/xml/',
            '/wp-content/uploads/woo-product-feed-pro/xml/'
          ];
          for (const d of dirs) {
            const r = await fetchText(root + d);
            if (!r || !r.ok || !sameDomain(r.url)) continue;
            const matches = [...r.body.matchAll(/href=["']([^"']+\\.xml(?:\\.gz)?)["']/gi)].map(m => m[1]);
            for (const href of matches) {
              let u;
              try { u = new URL(href, r.url).toString(); } catch { continue; }
              if (!sameDomain(u)) continue;
              if (await tryUrl(u, 'public-directory-index')) break;
            }
            if (normalized.length) break;
          }

          const discoveryPages = ['/robots.txt','/','/sitemap_index.xml','/wp-sitemap.xml'];
          for (const p of discoveryPages) {
            const r = await fetchText(root + p);
            if (!r || !r.ok || !sameDomain(r.url)) continue;
            const candidates = new Set();
            for (const m of r.body.matchAll(/https?:[^\s"'<>]+/gi)) {
              const u = m[0].replace(/[),.;]+$/,'');
              if (/\.xml(?:\.gz)?(?:[?#].*)?$/i.test(u) || /google|merchant|shopping|product.?feed|woo.?feed|gpf/i.test(u)) candidates.add(u);
            }
            for (const m of r.body.matchAll(/(?:href|src)=["']([^"']+)["']/gi)) {
              let u;
              try { u = new URL(m[1], r.url).toString(); } catch { continue; }
              if (/\.xml(?:\.gz)?(?:[?#].*)?$/i.test(u) || /google|merchant|shopping|product.?feed|woo.?feed|gpf/i.test(u)) candidates.add(u);
            }
            for (const u of candidates) {
              if (!sameDomain(u)) continue;
              if (await tryUrl(u, 'public-page-reference')) break;
            }
            if (normalized.length) break;
          }

          const result = {
            site,
            root,
            verified_native_feed_url: normalized[0]?.url ?? null,
            evidence: normalized[0] ?? null,
            status: normalized.length ? 'VERIFIED_NATIVE_GOOGLE_XML' : 'NOT_FOUND',
            tested_candidate_count: seen.size
          };

          await fs.writeFile('out/result.json', JSON.stringify(result, null, 2));
          if (normalized.length) await fs.writeFile('out/verified-native-feed-url.txt', normalized[0].url + '\n');
          console.log(JSON.stringify(result));
          NODE

          node /tmp/hunt.mjs

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-feed-\${{ matrix.name }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
