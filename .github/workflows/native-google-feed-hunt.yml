name: Native Google Feed URL Hunt

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Browser Run binding diagnostic
        run: |
          curl -sS --max-time 120 https://feed-origin-probe-20260927.heroic-ai.workers.dev/debug-browser | tee browser-debug.json
      - uses: actions/upload-artifact@v4
        with:
          name: browser-binding-debug-pr
          path: browser-debug.json
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        site: [ads-store, ithunt, kccomputers, krg-kart]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe live Cloudflare egress worker
        env:
          SITE: ${{ matrix.site }}
          WORKER: https://feed-origin-probe-20260927.heroic-ai.workers.dev
        run: |
          set -euo pipefail
          echo "probe-revision=browser-diagnostic"
          mkdir -p out/native
          curl -sS --max-time 300 -D "out/native/${SITE}.headers"             "${WORKER}/native/${SITE}"             -o "out/native/${SITE}.body"
          cat "out/native/${SITE}.headers"
          wc -c "out/native/${SITE}.body"
          if grep -qi '^x-native-feed-url:' "out/native/${SITE}.headers"; then
            cp "out/native/${SITE}.body" "out/native/${SITE}.xml"
            grep -Eqi '<rss|http://base.google.com/ns/1.0|<item|<g:id|<g:title|<g:link|<g:price|<g:image_link'               "out/native/${SITE}.xml" || { echo "strict native validation failed"; exit 1; }
            echo "=== NATIVE FEED FOUND ==="
            grep -i '^x-native-feed-' "out/native/${SITE}.headers" || true
            printf 'site=%s items=%s bytes=%s sha256=' "${SITE}"               "$(grep -Eo '<item\\b' "out/native/${SITE}.xml" | wc -l)"               "$(wc -c < "out/native/${SITE}.xml")"
            sha256sum "out/native/${SITE}.xml" | awk '{print $1}'
          else
            echo "NATIVE_FEED_NOT_VERIFIED=${SITE}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-feed-${{ matrix.site }}-live-worker-debug
          path: out/
          if-no-files-found: error
