name: Native Google Feed URL Hunt v2
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [hunt/native-google-feed-urls-20260927]
    paths:
      - ".github/workflows/native-google-feed-hunt.yml"
      - "tools/woocommerce_native_feed_hunt_v176_fast.mjs"
      - "tools/wc_browser_batch_worker.js"
concurrency:
  group: native-google-feed-hunt-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy stateful Browser Run helper
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          metadata='{"main_module":"wc-browser-single-20260927.mjs","compatibility_date":"2026-09-27","compatibility_flags":["nodejs_compat"],"keep_bindings":["browser"]}'
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/wc-browser-single-20260927" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F "metadata=${metadata};type=application/json" \
            -F "wc-browser-single-20260927.mjs=@tools/wc_browser_batch_worker.js;filename=wc-browser-single-20260927.mjs;type=application/javascript+module" \
            | tee /tmp/deploy-response.json
          jq -e '.success == true' /tmp/deploy-response.json >/dev/null
          echo 'Browser helper deployment: PASS'
  hunt:
    needs: deploy-browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    env:
      BROWSER_WORKER_URL: https://wc-browser-single-20260927.heroic-ai.workers.dev/
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select shard
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          node - <<'NODE' > /tmp/sites.json
          const s=[
          ["Aarna Computers","https://aarnacomputers.com"],["Ads Store","https://adsstore.in"],["avikaretails","https://avikaretails.com"],["EZPZ Solutions","https://www.ezpzsolutions.in"],
          ["GamesNComps","https://gamesncomps.com"],["Geekbees","https://geekbees.in"],["hotshiftpc","https://hotshiftpc.com"],["itgadgetsonline","https://itgadgetsonline.com"],
          ["ithunt","https://ithunt.in"],["KC Computers","https://kccomputers.co.in"],["KRG KART","https://krgkart.com"],["Kryptronix Gaming","https://kryptronix.in"],
          ["NCL Computer","https://nclcomputer.com"],["networkitstore","https://networkitstore.in"],["nexusinfosys","https://www.mynexusinfosys.com"],["Only SDD","https://onlyssd.com"],
          ["PC Kumar Infotech","https://pckumar.in"],["PC Studio","https://www.pcstudio.in"],["PCHubShop","https://www.pchubshop.com"],["Prime ABGB","https://www.primeabgb.com"],
          ["quickincomputers","https://quickincomputers.com"],["SCL Gaming","https://sclgaming.in"],["solankienterprises","https://solankienterprises.com"],["Variety Infotech","https://varietyinfotech.com"],
          ["Viper PC","https://viperpc.in"],["AULA India","https://aulaindia.com"],["Cosmic Byte","https://www.thecosmicbyte.com"],["Meckeys","https://www.meckeys.com"],
          ["Moskeys","https://moskeys.com"],["Ninja Dog","https://ninjadog.in"],["StacksKB","https://stackskb.com"],["Theproaudio","https://www.theproaudio.com"]].map(([name,url])=>({name,url}));
          const n=Number(process.env.SHARD);process.stdout.write(JSON.stringify(s.filter((_,i)=>i%8+1===n)));
          NODE
          echo "SITES_JSON=$(cat /tmp/sites.json)" >> "$GITHUB_ENV"
      - name: Hunt native Google Merchant XML only
        run: node tools/woocommerce_native_feed_hunt_v176_fast.mjs | tee "native-feed-shard-${{ matrix.shard }}.json"
      - name: Upload URL-only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-google-feed-shard-${{ matrix.shard }}
          path: native-feed-shard-${{ matrix.shard }}.json
          retention-days: 14