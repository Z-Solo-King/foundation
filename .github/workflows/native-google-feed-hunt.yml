name: Native Google Feed URL Hunt
# Expanded native-feed candidate set 2026-09-27

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-google-feed-hunt.yml"
  push:
    branches:
      - test/wc-feed-recovery-clean-20260927
    paths:
      - ".github/workflows/native-google-feed-hunt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Aarna Computers", root: "https://aarnacomputers.com"}
          - {name: "Ads Store", root: "https://adsstore.in"}
          - {name: "avikaretails", root: "https://avikaretails.com"}
          - {name: "EZPZ Solutions", root: "https://www.ezpzsolutions.in"}
          - {name: "GamesNComps", root: "https://gamesncomps.com"}
          - {name: "Geekbees", root: "https://geekbees.in"}
          - {name: "hotshiftpc", root: "https://hotshiftpc.com"}
          - {name: "itgadgetsonline", root: "https://itgadgetsonline.com"}
          - {name: "ithunt", root: "https://ithunt.in"}
          - {name: "KC Computers", root: "https://kccomputers.co.in"}
          - {name: "KRG KART", root: "https://krgkart.com"}
          - {name: "Kryptronix Gaming", root: "https://kryptronix.in"}
          - {name: "NCL Computer", root: "https://nclcomputer.com"}
          - {name: "networkitstore", root: "https://networkitstore.in"}
          - {name: "nexusinfosys", root: "https://www.mynexusinfosys.com"}
          - {name: "Only SDD", root: "https://onlyssd.com"}
          - {name: "PC Kumar Infotech", root: "https://pckumar.in"}
          - {name: "PC Studio", root: "https://www.pcstudio.in"}
          - {name: "PCHubShop", root: "https://www.pchubshop.com"}
          - {name: "Prime ABGB", root: "https://www.primeabgb.com"}
          - {name: "quickincomputers", root: "https://quickincomputers.com"}
          - {name: "SCL Gaming", root: "https://sclgaming.in"}
          - {name: "solankienterprises", root: "https://solankienterprises.com"}
          - {name: "Variety Infotech", root: "https://varietyinfotech.com"}
          - {name: "Viper PC", root: "https://viperpc.in"}
          - {name: "AULA India", root: "https://aulaindia.com"}
          - {name: "Cosmic Byte", root: "https://www.thecosmicbyte.com"}
          - {name: "Meckeys", root: "https://www.meckeys.com"}
          - {name: "Moskeys", root: "https://moskeys.com"}
          - {name: "Ninja Dog", root: "https://ninjadog.in"}
          - {name: "StacksKB", root: "https://stackskb.com"}
          - {name: "Theproaudio", root: "https://www.theproaudio.com"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Probe public native feed URLs
        env:
          ROOT: ${{ matrix.root }}
          SITE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/hunt.mjs <<'NODE'
          import fs from 'node:fs/promises';

          const root = process.env.ROOT.replace(/\/$/, '');
          const site = process.env.SITE_NAME;

          const candidates = [
            '/?woocommerce_gpf=google',
            '/woocommerce_gpf/google',
            '/google.xml',
            '/google_feed.xml',
            '/google-feed.xml',
            '/googlebase.xml',
            '/google_base.xml',
            '/google-shopping.xml',
            '/google-shopping-feed.xml',
            '/google-shopping-products.xml',
            '/google-product-feed.xml',
            '/product-feed.xml',
            '/products-feed.xml',
            '/merchant-feed.xml',
            '/merchant_feed.xml',
            '/feeds/google.xml',
            '/feeds/google-feed.xml',
            '/feeds/google-shopping.xml',
            '/feeds/google-product-feed.xml',
            '/feeds/google-products.xml',
            '/feed/google.xml',
            '/feed/google-feed.xml',
            '/feed/google-shopping.xml',
            '/feed/google-products.xml',
            '/wp-content/uploads/woo-feed/google/xml/google-shopping.xml',
            '/wp-content/uploads/woo-feed/google/xml/google.xml',
            '/wp-content/uploads/woo-feed/google/xml/google-shopping-products.xml',
            '/wp-content/uploads/woo-feed/google/xml/shopping.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google-shopping.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google-shopping-feed.xml',
            '/wp-content/uploads/codesolz-feeds/google-products.xml'
            '/google-merchant-feed.xml',
            '/google_merchant_feed.xml',
            '/google-product-feed.xml',
            '/google_product_feed.xml',
            '/google-products-feed.xml',
            '/google-shopping-products.xml',
            '/google.xml.gz',
            '/google-shopping.xml.gz',
            '/product-feed.xml.gz',
            '/products-feed.xml.gz',
            '/merchant-feed.xml.gz',
            '/feeds/google-shopping-feed.xml',
            '/feeds/google-merchant.xml',
            '/feeds/google-merchant-feed.xml',
            '/feeds/merchant.xml',
            '/feeds/merchant-feed.xml',
            '/feeds/products.xml.gz',
            '/feed/googlebase.xml',
            '/feed/google-shopping-feed.xml',
            '/feed/merchant.xml',
            '/feed/merchant-feed.xml',
            '/google-feed/index.xml',
            '/feeds/google/index.xml',
            '/products/google.xml',
            '/products/google-feed.xml',
            '/products/google-shopping.xml',
            '/product-feed/google.xml',
            '/product-feed/google-shopping.xml',
            '/?feed=google',
            '/?feed=google-shopping',
            '/?feed=merchant',
            '/?woocommerce_gpf=google&gpf_start=0&gpf_limit=1000',
            '/?woocommerce_gpf=google&gpf_start=0&gpf_limit=5000',
            '/?woocommerce_gpf=google&gpf_start=1&gpf_limit=1000',
            '/?woocommerce_gpf=google&gpf_start=100&gpf_limit=1000',
            '/?woocommerce_gpf=google&gpf_start=1000&gpf_limit=1000',
            '/wp-content/uploads/woo-feed/google/xml/google-shopping-feed.xml',
            '/wp-content/uploads/woo-feed/google/xml/feed.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google-shopping-feed.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/feed.xml',
            '/wp-content/uploads/codesolz-feeds/google.xml',
          ];

          function sameHost(url) {
            try { return new URL(url).hostname === new URL(root).hostname; }
            catch { return false; }
          }

          function looksGoogleXml(body) {
            const low = body.slice(0, 300000).toLowerCase();
            return (low.includes('<rss') || low.includes('<feed')) &&
              low.includes('http://base.google.com/ns/1.0') &&
              low.includes('<item') &&
              low.includes('<g:id') &&
              low.includes('<g:title') &&
              low.includes('<g:link') &&
              low.includes('<g:price') &&
              !low.includes('just a moment') &&
              !low.includes('cf-chl-') &&
              !low.includes('turnstile');
          }

          async function probe(url) {
            try {
              const r = await fetch(url, {
                redirect: 'follow',
                signal: AbortSignal.timeout(7000),
                headers: {
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'application/xml,text/xml,text/plain,text/html;q=0.8,*/*;q=0.5'
                }
              });
              const body = await r.text();
              return {ok:r.ok,status:r.status,url:r.url,body};
            } catch { return null; }
          }

          let found = null;
          const seen = new Set();

          for (const path of candidates) {
            const url = root + path;
            seen.add(url);
            const r = await probe(url);
            if (r && r.ok && sameHost(r.url) && looksGoogleXml(r.body)) {
              found = {url:r.url,status:r.status,bytes:r.body.length,source:'candidate'};
              break;
            }
          }

          // Public directory listing discovery for custom feed filenames.
          for (const dir of [
            '/wp-content/uploads/woo-feed/google/xml/',
            '/wp-content/uploads/woo-product-feed-pro/xml/'
          ]) {
            if (found) break;
            const r = await probe(root + dir);
            if (!r || !r.ok || !sameHost(r.url)) continue;
            const links = r.body.match(/https?:[^"'<> \t\r\n]+\.xml(?:\.gz)?/gi) || [];
            for (const url of links) {
              if (seen.has(url)) continue;
              seen.add(url);
              const x = await probe(url);
              if (x && x.ok && sameHost(x.url) && looksGoogleXml(x.body)) {
                found = {url:x.url,status:x.status,bytes:x.body.length,source:'directory-index'};
                break;
              }
            }
          }

          // Public robots/homepage/sitemap references can expose custom feed URLs.
          for (const page of ['/robots.txt','/','/sitemap_index.xml','/wp-sitemap.xml']) {
            if (found) break;
            const r = await probe(root + page);
            if (!r || !r.ok || !sameHost(r.url)) continue;
            const refs = r.body.match(/https?:[^"'<> \t\r\n]+/gi) || [];
            for (const url of refs) {
              if (!/xml/i.test(url) || seen.has(url)) continue;
              if (!/google|merchant|shopping|feed|gpf|product/i.test(url)) continue;
              seen.add(url);
              const x = await probe(url);
              if (x && x.ok && sameHost(x.url) && looksGoogleXml(x.body)) {
                found = {url:x.url,status:x.status,bytes:x.body.length,source:'public-reference'};
                break;
              }
            }
          }

          const result = {
            site,
            root,
            status: found ? 'VERIFIED_NATIVE_GOOGLE_XML' : 'NOT_FOUND',
            verified_native_feed_url: found?.url ?? null,
            evidence: found,
            tested_candidates: seen.size
          };

          await fs.writeFile('out/result.json', JSON.stringify(result, null, 2));
          if (found) await fs.writeFile('out/verified-native-feed-url.txt', found.url + '\n');
          console.log(JSON.stringify(result));
          NODE
          node /tmp/hunt.mjs

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-feed-${{ matrix.name }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
