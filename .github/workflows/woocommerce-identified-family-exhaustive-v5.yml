name: WooCommerce Identified Family Exhaustive Guess V5
on:
  push:
    branches:
      - feat/wc-identified-family-exhaustive-v5-20260930
    paths:
      - "tools/woocommerce_identified_family_guess_v5.mjs"
      - "tests/test_woocommerce_identified_family_guess_v5.mjs"
      - ".github/workflows/woocommerce-identified-family-exhaustive-v5.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/woocommerce_identified_family_guess_v5.mjs"
      - "tests/test_woocommerce_identified_family_guess_v5.mjs"
      - ".github/workflows/woocommerce-identified-family-exhaustive-v5.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wc-identified-family-v5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guess:
    name: confirmed standalone families
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Unit tests
        run: node --test tests/test_woocommerce_identified_family_guess_v5.mjs
      - name: Identified-family guessing
        run: SHARD=1 SHARDS=1 node tools/woocommerce_identified_family_guess_v5.mjs
      - name: Copy aggregate
        run: |
          set -euo pipefail
          mkdir -p out/aggregate
          cp out/woocommerce-identified-family-v5/shard-1.json out/aggregate/aggregate.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('out/aggregate/aggregate.json','utf8'));
          if((p.results||[]).length!==4) throw new Error('expected 4 confirmed standalone sites');
          const s={schema:'woocommerce-identified-family-v5-aggregate/v2',target_count:4,native_verified:(p.results||[]).filter(x=>x.candidate_hits?.length).length,native_urls:(p.results||[]).flatMap(x=>x.positive_urls||[]),transport_limited:(p.results||[]).filter(x=>x.status.includes('TRANSPORT_LIMITED')).length,clean_no_hit:(p.results||[]).filter(x=>x.status==='NO_NATIVE_FEED_VERIFIED').length,historical_reference_total:(p.results||[]).reduce((n,x)=>n+(x.historical_reference_count||0),0),results:p.results};
          fs.writeFileSync('out/aggregate/aggregate.json',JSON.stringify(s,null,2)+'\n');
          console.log(JSON.stringify({...s,results:undefined},null,2));
          NODE
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-identified-family-v5-aggregate
          path: out/aggregate/
          retention-days: 30
