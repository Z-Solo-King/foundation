name: WooCommerce Identified Family Exhaustive Guess V5
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/woocommerce_identified_family_guess_v5.mjs"
      - "tests/test_woocommerce_identified_family_guess_v5.mjs"
      - ".github/workflows/woocommerce-identified-family-exhaustive-v5.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wc-identified-family-v5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guess:
    name: confirmed-family guess shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Unit tests
        run: node --test tests/test_woocommerce_identified_family_guess_v5.mjs
      - name: Identified-family guessing
        run: node tools/woocommerce_identified_family_guess_v5.mjs
      - name: Upload shard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-identified-family-v5-shard-${{ matrix.shard }}
          path: out/woocommerce-identified-family-v5/
          retention-days: 30
  aggregate:
    needs: guess
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: woocommerce-identified-family-v5-shard-*
          path: out/shards
          merge-multiple: false
      - name: Aggregate
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const files=[];
          function walk(p){for(const e of fs.readdirSync(p,{withFileTypes:true})){const q=path.join(p,e.name);if(e.isDirectory())walk(q);else if(e.name.endsWith(".json"))files.push(q)}}
          walk("out/shards");
          const rows=files.sort().flatMap(f=>JSON.parse(fs.readFileSync(f,"utf8")).results||[]);
          if(rows.length!==4)throw new Error("expected 4 confirmed-family rows, got "+rows.length);
          const p={schema:"woocommerce-identified-family-v5-aggregate/v1",target_count:rows.length,native_verified:rows.filter(x=>x.candidate_hits?.length).length,native_urls:rows.flatMap(x=>x.positive_urls||[]),transport_limited:rows.filter(x=>x.status.includes("TRANSPORT_LIMITED")).length,clean_no_hit:rows.filter(x=>x.status==="NO_NATIVE_FEED_VERIFIED").length,historical_reference_total:rows.reduce((n,x)=>n+(x.historical_reference_count||0),0),results:rows};
          fs.mkdirSync("out/aggregate",{recursive:true});fs.writeFileSync("out/aggregate/aggregate.json",JSON.stringify(p,null,2)+"\n");console.log(JSON.stringify({...p,results:undefined},null,2));
          NODE
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92e8e0b5a5461e7c
        with:
          name: woocommerce-identified-family-v5-aggregate
          path: out/aggregate/
          retention-days: 30
