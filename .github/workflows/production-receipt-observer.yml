name: Canonical production receipt observer

on:
  workflow_run:
    workflows:
      - "Canonical Heroic AI production release"
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  receipt:
    name: Publish canonical production receipt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture release and job evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
          jobs_json="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          artifacts_json="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"

          job_summary="$(
            jq -c '[.jobs[] | {name, status, conclusion}] | sort_by(.name)' <<<"$jobs_json"
          )"

          artifact_summary="$(
            jq -c '[.artifacts[] | {name, expired, size_in_bytes}] | sort_by(.name)' <<<"$artifacts_json"
          )"

          body="$(
            jq -rn               --arg run "$RUN_NUMBER"               --arg id "$RUN_ID"               --arg sha "$HEAD_SHA"               --arg conclusion "$CONCLUSION"               --arg url "$RUN_URL"               --argjson jobs "$job_summary"               --argjson artifacts "$artifact_summary"               ' 
              "## Canonical production receipt\n\n" +
              "- Run: #" + $run + " (id " + $id + ")\n" +
              "- Conclusion: " + $conclusion + "\n" +
              "- Foundation SHA: " + $sha + "\n" +
              "- URL: " + $url + "\n\n" +
              "### Jobs\n\n" + ($jobs | tojson) + "\n\n" +
              "### Artifacts\n\n" + ($artifacts | tojson)
              '
          )"

          gh issue comment 58 --repo "$REPOSITORY" --body "$body"
          echo "Published canonical production receipt for run $RUN_NUMBER ($RUN_ID), conclusion=$CONCLUSION"
