name: Native Google Feed URL Hunt V3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-google-feed-hunt-v3.yml"
  push:
    branches:
      - test/wc-feed-recovery-clean-20260927
    paths:
      - ".github/workflows/native-google-feed-hunt-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        include:
          - {name: "Aarna Computers", root: "https://aarnacomputers.com"}
          - {name: "Ads Store", root: "https://adsstore.in"}
          - {name: "avikaretails", root: "https://avikaretails.com"}
          - {name: "EZPZ Solutions", root: "https://www.ezpzsolutions.in"}
          - {name: "GamesNComps", root: "https://gamesncomps.com"}
          - {name: "Geekbees", root: "https://geekbees.in"}
          - {name: "hotshiftpc", root: "https://hotshiftpc.com"}
          - {name: "itgadgetsonline", root: "https://itgadgetsonline.com"}
          - {name: "ithunt", root: "https://ithunt.in"}
          - {name: "KC Computers", root: "https://kccomputers.co.in"}
          - {name: "KRG KART", root: "https://krgkart.com"}
          - {name: "Kryptronix Gaming", root: "https://kryptronix.in"}
          - {name: "NCL Computer", root: "https://nclcomputer.com"}
          - {name: "networkitstore", root: "https://networkitstore.in"}
          - {name: "nexusinfosys", root: "https://www.mynexusinfosys.com"}
          - {name: "Only SDD", root: "https://onlyssd.com"}
          - {name: "PC Kumar Infotech", root: "https://pckumar.in"}
          - {name: "PC Studio", root: "https://www.pcstudio.in"}
          - {name: "PCHubShop", root: "https://www.pchubshop.com"}
          - {name: "Prime ABGB", root: "https://www.primeabgb.com"}
          - {name: "quickincomputers", root: "https://quickincomputers.com"}
          - {name: "SCL Gaming", root: "https://sclgaming.in"}
          - {name: "solankienterprises", root: "https://solankienterprises.com"}
          - {name: "Variety Infotech", root: "https://varietyinfotech.com"}
          - {name: "Viper PC", root: "https://viperpc.in"}
          - {name: "AULA India", root: "https://aulaindia.com"}
          - {name: "Cosmic Byte", root: "https://www.thecosmicbyte.com"}
          - {name: "Meckeys", root: "https://www.meckeys.com"}
          - {name: "Moskeys", root: "https://moskeys.com"}
          - {name: "Ninja Dog", root: "https://ninjadog.in"}
          - {name: "StacksKB", root: "https://stackskb.com"}
          - {name: "Theproaudio", root: "https://www.theproaudio.com"}

    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Discover and verify native Google XML URL
        env:
          ROOT: ${{ matrix.root }}
          SITE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/hunt.mjs <<'NODE'
          import fs from 'node:fs/promises';

          const root = process.env.ROOT.replace(/\/$/, '');
          const site = process.env.SITE_NAME;
          const rootHost = new URL(root).hostname.replace(/^www\./,'').toLowerCase();

          const paths = [
            '/?woocommerce_gpf=google','/woocommerce_gpf/google',
            '/?feed=google','/feed/google','/feed/google.xml','/feed/wc_gmc/',
            '/google.xml','/google_feed.xml','/google-feed.xml',
            '/google-products.xml','/google-product-feed.xml',
            '/google-shopping.xml','/google-shopping-feed.xml',
            '/google-shopping-products.xml','/google-merchant.xml',
            '/google-merchant-feed.xml','/googlebase.xml','/google_base.xml',
            '/googlefeed.xml','/googlemerchant.xml','/merchant.xml',
            '/merchant-feed.xml','/merchant_feed.xml','/shopping.xml',
            '/shopping-feed.xml','/product-feed.xml','/products-feed.xml',
            '/productfeed.xml','/feed.xml',
            '/feeds/google.xml','/feeds/google-feed.xml',
            '/feeds/google-shopping.xml','/feeds/google-product-feed.xml',
            '/feeds/google-products.xml','/feed/google.xml',
            '/feed/google-feed.xml','/feed/google-shopping.xml',
            '/feed/google-products.xml',
            '/wp-content/uploads/woo-feed/xml/google-shopping.xml',
            '/wp-content/uploads/woo-feed/xml/google.xml',
            '/wp-content/uploads/woo-feed/xml/google-shopping-feed.xml',
            '/wp-content/uploads/woo-feed/google/xml/google-shopping.xml',
            '/wp-content/uploads/woo-feed/google/xml/google.xml',
            '/wp-content/uploads/woo-feed/google/xml/google-products.xml',
            '/wp-content/uploads/woo-feed/google/xml/google-shopping-feed.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google-shopping.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google-shopping-feed.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google-products.xml',
            '/wp-content/uploads/wppfm-feeds/google.xml',
            '/wp-content/uploads/webtoffee/google.xml',
            '/wp-content/uploads/webtoffee-product-feed/google.xml',
            '/wp-content/uploads/product-feed/google.xml',
            '/wp-content/uploads/product-feeds/google.xml',
            '/wp-content/uploads/feed/google.xml'
          ];

          const seen = new Set();
          const candidates = [];
          const found = [];

          function sameSite(u) {
            try {
              const h = new URL(u).hostname.replace(/^www\./,'').toLowerCase();
              return h === rootHost || h.endsWith('.' + rootHost);
            } catch { return false; }
          }

          function googleXml(body) {
            const low = body.slice(0, 2500000).toLowerCase();
            const rootOk = /<rss\\b[^>]*>|<feed\\b[^>]*>/.test(low);
            const nsOk = low.includes('base.google.com/ns/1.0');
            const itemOk = /<item\\b|<entry\\b/.test(low);
            const idOk = /<g:id\\b|<id\\b/.test(low);
            const titleOk = /<g:title\\b|<title\\b/.test(low);
            const linkOk = /<g:link\\b|<link\\b/.test(low);
            const priceOk = /<g:price\\b|<price\\b/.test(low);
            const bad = /(just a moment|attention required|turnstile|cf-chl-|captcha|access denied)/i.test(low);
            return rootOk && nsOk && itemOk && idOk && titleOk && linkOk && priceOk && !bad;
          }

          async function get(url) {
            try {
              const r = await fetch(url, {
                redirect:'follow',
                signal:AbortSignal.timeout(7500),
                headers:{
                  'User-Agent':'Mozilla/5.0',
                  'Accept':'application/xml,text/xml,text/plain,text/html;q=0.7,*/*;q=0.3'
                }
              });
              const body = await r.text();
              return {status:r.status,ok:r.ok,url:r.url,body,ct:r.headers.get('content-type')||''};
            } catch { return null; }
          }

          async function test(url, source) {
            if (seen.has(url)) return false;
            seen.add(url);
            const r=await get(url);
            if (r && r.ok && sameSite(r.url) && googleXml(r.body)) {
              found.push({url:r.url,source,status:r.status,content_type:r.ct,bytes:r.body.length});
              return true;
            }
            return false;
          }

          for (const p of paths) {
            if (await test(root+p,'standard')) break;
          }

          // Site-visible XML references: homepage, robots, sitemaps.
          const pages = ['/robots.txt','/','/sitemap.xml','/sitemap_index.xml','/wp-sitemap.xml'];
          for (const p of pages) {
            if (found.length) break;
            const r=await get(root+p);
            if (!r || !r.ok || !sameSite(r.url)) continue;
            const text=r.body.replaceAll('\\\\/','/');
            for (const m of text.matchAll(/(?:https?:\/\/|\/)[^"'<>\s]+/gi)) {
              let u;
              try { u=new URL(m[0],r.url).toString(); } catch { continue; }
              if (!sameSite(u)) continue;
              if (/\\.xml(?:\\.gz)?(?:[?#].*)?$/i.test(u) || /google|merchant|shopping|gpf|product.?feed|woo.?feed/i.test(u)) candidates.push(u);
            }
            for (const m of text.matchAll(/(?:href|src)=["']([^"']+)["']/gi)) {
              let u;
              try { u=new URL(m[1],r.url).toString(); } catch { continue; }
              if (!sameSite(u)) continue;
              if (/\\.xml(?:\\.gz)?(?:[?#].*)?$/i.test(u) || /google|merchant|shopping|gpf|product.?feed|woo.?feed/i.test(u)) candidates.push(u);
            }
            for (const u of [...new Set(candidates)].slice(0,300)) {
              if (await test(u,'site-reference')) break;
            }
          }

          // Wayback CDX: use historical URL names only as clues, then request the original URL.
          for (const template of [
            'https://web.archive.org/cdx/search/cdx?url='+encodeURIComponent(rootHost+'/*')+'&output=json&fl=original,statuscode&filter=statuscode:200&collapse=urlkey&limit=500',
            'https://index.commoncrawl.org/CC-MAIN-2026-30-index?url='+encodeURIComponent(rootHost+'/*')+'&output=json&filter=status:200&matchType=prefix'
          ]) {
            if (found.length) break;
            try {
              const rr=await fetch(template,{signal:AbortSignal.timeout(12000),headers:{'User-Agent':'Mozilla/5.0'}});
              if(!rr.ok) continue;
              const body=await rr.text();
              const urls=[];
              try {
                if (template.includes('web.archive.org')) {
                  const rows=JSON.parse(body);
                  for (const row of rows.slice(1)) if(row?.[0]) urls.push(row[0]);
                } else {
                  for (const line of body.split('\\n')) { try { const x=JSON.parse(line); if(x.url) urls.push(x.url); } catch {} }
                }
              } catch {}
              for (const raw of urls) {
                let u;
                try { u=new URL(raw).toString(); } catch { continue; }
                if(!sameSite(u)) continue;
                if(!/\\.xml(?:\\.gz)?(?:[?#].*)?$/i.test(u) && !/google|merchant|shopping|gpf|product.?feed|woo.?feed/i.test(u)) continue;
                candidates.push(u);
              }
              for (const u of [...new Set(candidates)].slice(-400)) {
                if(await test(u,'historical-url-clue')) break;
              }
            } catch {}
          }

          const result={
            site,root,status:found.length?'VERIFIED_NATIVE_GOOGLE_XML':'NOT_FOUND',
            verified_native_feed_url:found[0]?.url??null,evidence:found[0]??null,
            tested_urls:seen.size,discovered_refs:[...new Set(candidates)].slice(0,100)
          };
          await fs.writeFile('out/result.json',JSON.stringify(result,null,2));
          if(found.length) await fs.writeFile('out/verified-native-feed-url.txt',found[0].url+'\\n');
          console.log(JSON.stringify(result));
          NODE
          node /tmp/hunt.mjs

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-v3-${{ matrix.name }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
