name: nightly multi-agent research
run-name: >-
  Nightly research — ${{ github.event_name == 'schedule' && 'scheduled-live' || (inputs.dry_run == true && 'contract-dry-run' || 'production-live') }}

'on':
  schedule:
    # 01:00 IST = 19:30 UTC on the previous day.
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Explicit deterministic dry-run for manual testing only"
        required: false
        default: false
        type: boolean
      target_sha:
        description: "Exact Foundation SHA to research; production release dispatch supplies this"
        required: false
        default: ""
        type: string
      production_release_run_id:
        description: "Exact successful production-release run ID supplied by the release workflow"
        required: false
        default: ""
        type: string
      operations_research_ref:
        description: "Exact Operations revision deployed to the private production runtime"
        required: false
        default: "d0897d13751a092cc68ec7a0479a9000e18cff7d"
        type: string
permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-multi-agent-research-${{ inputs.target_sha || github.sha }}
  # A queued run for a newer immutable main SHA must be able to displace
  # an obsolete run that is permanently blocked on a failed release gate.
  cancel-in-progress: true

env:
  TARGET_FOUNDATION_SHA: ${{ inputs.target_sha || github.sha }}
  PYTHONUNBUFFERED: "1"
  PUBLIC_WORKER_URL: "https://ai-cio.pages.dev"
  RESEARCH_LLM_ENDPOINT: "http://127.0.0.1:8765"
  RESEARCH_LLM_API_KEY: "local-worker-proxy"
  RESEARCH_LLM_MODEL: "@cf/zai-org/glm-4.7-flash"
  OPERATIONS_REPOSITORY: Z-Solo-King/operations
  OPERATIONS_RESEARCH_REF: ${{ inputs.operations_research_ref || 'd0897d13751a092cc68ec7a0479a9000e18cff7d' }}
  OPERATIONS_MIGRATION_TOOLS_REF: f9f8ce0eb88b92a5d4e2e3ea5f2d397eebac5791
  NIGHTLY_RESEARCH_CONTRACT: nightly-research-contract/v2
  MAPPER_RUNTIME_EVIDENCE_CONTRACT: mapper-migration-runtime-receipt/v1
  MODEL_PORTABILITY_EVIDENCE_CONTRACT: model-portability-runtime-receipt/v1
  # Keep the orchestration semaphore aligned with the loopback proxy upstream semaphore.
  # This prevents 20 coordinator slots from queueing behind 6 proxy slots for 180s.
  RESEARCH_MAX_CONCURRENCY: "6"

jobs:
  production_gate:
    name: Verify exact production release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact successful release run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.TARGET_FOUNDATION_SHA }}
          RELEASE_RUN_ID: ${{ inputs.production_release_run_id || '' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Explicit dry-run: production release gate is not required."
            exit 0
          fi
          if [[ -n "$RELEASE_RUN_ID" ]]; then
            for attempt in $(seq 1 30); do
              release_json="$(gh run view "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,workflowName,headSha,headBranch,status,conclusion,jobs)"
              test "$(jq -r '.workflowName' <<<"$release_json")" = "Heroic AI production release"
              test "$(jq -r '.headBranch' <<<"$release_json")" = "main"
              test "$(jq -r '.headSha' <<<"$release_json")" = "$TARGET_SHA"
              release_step="$(jq -r '[.jobs[]? | select(.name == "Canonical Heroic AI production release") | .steps[]? | select(.name == "Run canonical production release") | .conclusion] | .[0] // ""' <<<"$release_json")"
              case "$release_step" in
                success)
                  echo "Exact production release gate: PASS (run $RELEASE_RUN_ID, Foundation $TARGET_SHA; release step success)"
                  exit 0
                  ;;
                failure|cancelled|skipped)
                  echo "Exact production release gate: FAIL (run $RELEASE_RUN_ID, release step $release_step)"
                  exit 1
                  ;;
              esac
              echo "Exact production release run $RELEASE_RUN_ID exists but release step is not final yet; reconciliation attempt $attempt/30."
              sleep 10
            done
            echo "Exact production release step did not reach success within the reconciliation window."
            exit 1
          fi
          for attempt in $(seq 1 12); do
            runs_json="$(gh run list --workflow heroic-ai-production-release.yml --repo "$GITHUB_REPOSITORY" --limit 20 --json databaseId,headSha,headBranch,status,conclusion)"
            matching="$(jq --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha and .headBranch == "main")]' <<<"$runs_json")"
            success_count="$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$matching")"
            if [ "$success_count" -gt 0 ]; then
              release_id="$(jq -r '[.[] | select(.status == "completed" and .conclusion == "success") | .databaseId] | max' <<<"$matching")"
              echo "Exact production release gate: PASS (run $release_id, Foundation $TARGET_SHA)"
              exit 0
            fi
            echo "No matching successful production release for $TARGET_SHA yet; short reconciliation attempt $attempt/12."
            sleep 10
          done
          echo "No successful production release for $TARGET_SHA in the short reconciliation window."
          exit 1

  research:
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: [production_gate]
    name: Nightly research CrossFire (24-program global scheduler)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_FOUNDATION_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify exact deployed research runtime
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTH_TOKEN:-}" || { echo "Missing AUTH_TOKEN; refusing live research."; exit 1; }
          python scripts/nightly_runtime_contract_probe.py \
            --url "$PUBLIC_WORKER_URL" \
            --token "$AUTH_TOKEN" \
            --model "$RESEARCH_LLM_MODEL" \
            --expected-foundation-sha "$TARGET_FOUNDATION_SHA" \
            --expected-operations-ref "$OPERATIONS_RESEARCH_REF" > "$RUNNER_TEMP/nightly-runtime-contract.json"
          cat "$RUNNER_TEMP/nightly-runtime-contract.json"

      - name: Authenticate private research source
        shell: bash
        env:
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPERATIONS_APP_ID:-}" || { echo 'Missing OPERATIONS_APP_ID GitHub Actions secret'; exit 1; }
          test -n "${OPERATIONS_APP_PRIVATE_KEY:-}" || { echo 'Missing OPERATIONS_APP_PRIVATE_KEY GitHub Actions secret'; exit 1; }
          key_file="$RUNNER_TEMP/operations-research-app.pem"
          jwt_file="$RUNNER_TEMP/operations-research-jwt.txt"
          response_file="$RUNNER_TEMP/operations-research-installation.json"
          umask 077
          printf '%s\n' "$OPERATIONS_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          python - "$OPERATIONS_APP_ID" "$key_file" > "$jwt_file" <<'PY'
          import base64
          import json
          import subprocess
          import sys
          import time

          app_id, key_file = sys.argv[1:]

          def b64url(value: bytes) -> str:
              return base64.urlsafe_b64encode(value).rstrip(b"=").decode("ascii")

          now = int(time.time())
          header = {"alg": "RS256", "typ": "JWT"}
          payload = {"iat": now - 60, "exp": now + 540, "iss": app_id}
          unsigned = f"{b64url(json.dumps(header, separators=(",", ":")).encode())}.{b64url(json.dumps(payload, separators=(",", ":")).encode())}".encode()
          signed = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", key_file],
              input=unsigned,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=True,
          )
          print(unsigned.decode() + "." + b64url(signed.stdout))
          PY
          app_jwt=$(cat "$jwt_file")
          installation_output="$RUNNER_TEMP/operations-installation-id.txt"
          installation_error="$RUNNER_TEMP/operations-installation-id.err"
          set +e
          OPERATIONS_APP_JWT="$app_jwt" python scripts/resolve_operations_installation.py >"$installation_output" 2>"$installation_error"
          installation_status=$?
          set -e
          if [ "$installation_status" -ne 0 ]; then
            echo "GitHub App installation discovery failed (exit $installation_status)"
            cat "$installation_error" 2>/dev/null || true
            exit 1
          fi
          installation_id="$(tr -d "\r\n" < "$installation_output")"
          test -n "$installation_id" || { echo 'GitHub App installation discovery returned an empty installation id'; exit 1; }
          installation_response=$(curl -fsS \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${app_jwt}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/app/installations/${installation_id}/access_tokens")
          printf '%s\n' "$installation_response" > "$response_file"
          github_app_token=$(python - "$response_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["token"])
          PY
          )
          test -n "$github_app_token"
          echo "::add-mask::$github_app_token"
          token_file="$RUNNER_TEMP/operations-research-token.txt"
          printf '%s\n' "$github_app_token" > "$token_file"
          chmod 600 "$token_file"
          repo_response=$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${github_app_token}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OPERATIONS_REPOSITORY}")
          jq -e --arg repo "$OPERATIONS_REPOSITORY" '.full_name == $repo and .private == true' <<<"$repo_response" >/dev/null
          ref_response=$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${github_app_token}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OPERATIONS_REPOSITORY}/git/commits/${OPERATIONS_RESEARCH_REF}")
          jq -e --arg expected "$OPERATIONS_RESEARCH_REF" '.sha == $expected' <<<"$ref_response" >/dev/null
          echo "private research source access: PASS (${OPERATIONS_RESEARCH_REF})"
      - name: Checkout pinned private research implementation
        shell: bash
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/git-askpass-operations-research.sh"
          umask 077
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) cat "$RUNNER_TEMP/operations-research-token.txt" ;;
            *) printf '%s\n' '' ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          rm -rf "$RUNNER_TEMP/operations-research"
          git clone --no-checkout "https://github.com/${OPERATIONS_REPOSITORY}.git" "$RUNNER_TEMP/operations-research"
          git -C "$RUNNER_TEMP/operations-research" fetch --no-tags --depth=1 origin "$OPERATIONS_RESEARCH_REF"
          git -C "$RUNNER_TEMP/operations-research" checkout --detach "$OPERATIONS_RESEARCH_REF"
          test "$(git -C "$RUNNER_TEMP/operations-research" rev-parse HEAD)" = "$OPERATIONS_RESEARCH_REF"
      - name: Research mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "Manual explicit dry-run requested; no live findings are being produced."
          else
            echo "mode=live" >> "$GITHUB_OUTPUT"
            echo "Scheduled/live research mode selected."
          fi
      - name: Validate pinned Operations research contract
        working-directory: ${{ runner.temp }}/operations-research
        shell: bash
        run: |
          set -euo pipefail
          test -f private/chatbot/chat_endpoint.py
          test -f private/chatbot/live_answer.py
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          endpoint = Path("private/chatbot/chat_endpoint.py").read_text(encoding="utf-8")
          live = Path("private/chatbot/live_answer.py").read_text(encoding="utf-8")

          endpoint_compact = re.sub(r"\s+", "", endpoint)
          assert 'research_agent=bool(payload.get("research_agent",False))' in endpoint_compact
          assert 'research_agent=research_agent' in endpoint_compact

          tree = ast.parse(live)
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          assert "_output_token_limit" in functions
          limit_source = ast.unparse(functions["_output_token_limit"])
          assert "research_agent" in limit_source
          assert "CHAT_RESEARCH_MAX_OUTPUT_TOKENS" in limit_source

          provider_source = ast.unparse(functions.get("_execute_provider") or functions.get("generate_answer"))
          assert "research_agent" in provider_source
          assert '"response_format"' in live
          assert '"findings"' in live
          assert '"follow_up_questions"' in live
          assert '"note"' in live
          assert "if research_agent" in live
          print("pinned Operations research-agent contract: PASS (semantic validation)")
          PY

      - name: Require live research executor configuration
        id: preflight
        if: ${{ steps.mode.outputs.mode == 'live' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RESEARCH_LLM_ENDPOINT:-}" || { echo 'Missing RESEARCH_LLM_ENDPOINT; refusing silent dry-run.'; exit 1; }
          test -n "${RESEARCH_LLM_API_KEY:-}" || { echo 'Missing RESEARCH_LLM_API_KEY; refusing silent dry-run.'; exit 1; }
          test -n "${RESEARCH_LLM_MODEL:-}" || { echo 'Missing RESEARCH_LLM_MODEL; refusing silent dry-run.'; exit 1; }
          case "$RESEARCH_LLM_ENDPOINT" in
            http://*|https://*) ;;
            *) echo 'RESEARCH_LLM_ENDPOINT must be HTTP(S).'; exit 1 ;;
          esac
          echo "live research executor configuration: PASS"
      - name: Start authenticated Workers AI research proxy
        id: research_proxy
        if: ${{ steps.mode.outputs.mode == 'live' }}
        shell: bash
        env:
          RESEARCH_PROXY_AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${RESEARCH_PROXY_AUTH_TOKEN:-}" || { echo "Missing AUTH_TOKEN; refusing live research."; exit 1; }
          nohup python scripts/research_worker_proxy.py \
            --public-worker-url "${PUBLIC_WORKER_URL}" \
            --port 8765 \
            --max-upstream-concurrency "${RESEARCH_MAX_CONCURRENCY}" \
            > "$RUNNER_TEMP/research-worker-proxy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/research-worker-proxy.pid"
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8765/health >/dev/null; then
              echo "authenticated Workers AI research proxy: READY"
              break
            fi
            sleep 1
          done
          probe_payload=$(jq -nc '{model:"@cf/zai-org/glm-4.7-flash",messages:[{role:"user",content:"Return the smallest valid research object with findings as an empty array, follow_up_questions as an empty array, and note as probe."}],max_tokens:96,temperature:0}')
          probe_response_file="$RUNNER_TEMP/research-worker-probe.json"
          probe_status=$(curl -sS --max-time 90 -o "$probe_response_file" -w '%{http_code}' -H "Authorization: Bearer local-worker-proxy" -H "Content-Type: application/json" -d "$probe_payload" http://127.0.0.1:8765/chat/completions)
          echo "Authenticated Worker-backed Workers AI research-contract probe -> HTTP ${probe_status}"
          if [ "${probe_status}" = "200" ] && jq -e '
              (.provider | type == "string" and length > 0) and
              (.model == "@cf/zai-org/glm-4.7-flash") and
              (.execution_id | type == "string" and length > 0) and
              (.choices[0].message.content | type == "string" and length > 0) and
              ((.choices[0].message.content | fromjson) | type == "object") and
              ((.choices[0].message.content | fromjson) | has("findings") and has("follow_up_questions") and has("note")) and
              (((.choices[0].message.content | fromjson).findings) | type == "array") and
              (((.choices[0].message.content | fromjson).follow_up_questions) | type == "array") and
              (((.choices[0].message.content | fromjson).note) | type == "string")
            ' "$probe_response_file" >/dev/null 2>&1; then
            echo "Authenticated Worker-backed Workers AI research contract: PASS"
          else
            echo "Authenticated Worker-backed Workers AI research contract: FAIL"
            jq -c '.' "$probe_response_file" 2>/dev/null || true
            exit 1
          fi
      - name: Run complete crossfire research
        id: run_crossfire
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          args=(--crossfire --global-capacity "$RESEARCH_MAX_CONCURRENCY" --output .runtime/nightly-crossfire.jsonl)
          if [[ "${{ steps.mode.outputs.mode }}" == "dry-run" ]]; then args+=(--dry-run); fi
          PYTHONPATH="$RUNNER_TEMP/operations-research" python -m private.multi_agent.runner "${args[@]}"
      - name: Materialize and validate lane artifacts
        id: materialize
        if: ${{ always() }}
        shell: python
        env:
          MODE: ${{ steps.mode.outputs.mode || 'unknown' }}
          PREFLIGHT: ${{ steps.preflight.outcome || 'skipped' }}
          RUN_CROSSFIRE: ${{ steps.run_crossfire.outcome || 'skipped' }}
          FOUNDATION_REVISION: ${{ env.TARGET_FOUNDATION_SHA }}
          OPERATIONS_REVISION: ${{ env.OPERATIONS_RESEARCH_REF }}
          NIGHTLY_RUN_ID: ${{ github.run_id }}
        run: |
          import json, os
          from pathlib import Path
          root=Path('.runtime'); root.mkdir(parents=True, exist_ok=True)
          combined=root/'nightly-crossfire.jsonl'
          rows=[json.loads(x) for x in combined.read_text(encoding='utf-8').splitlines() if x.strip()] if combined.exists() else []
          mode=os.environ['MODE']; preflight=os.environ['PREFLIGHT']; runner=os.environ['RUN_CROSSFIRE']
          expected_all={f'lane{lane}-slot{slot}' for lane in range(3) for slot in range(8)}
          observed_all=[r.get('program_id') for r in rows]
          observed_set={item for item in observed_all if isinstance(item,str)}
          coverage={
              'schema':'nightly-research-coverage/v1',
              'contract':'nightly-research-contract/v2',
              'run_id':os.environ['NIGHTLY_RUN_ID'],
              'foundation_revision':os.environ['FOUNDATION_REVISION'],
              'operations_revision':os.environ['OPERATIONS_REVISION'],
              'mode':mode,
              'expected_program_count':24,
              'observed_program_count':len(rows),
              'unique_program_count':len(observed_set),
              'duplicate_program_ids':sorted({x for x in observed_all if isinstance(x,str) and observed_all.count(x)>1}),
              'missing_program_ids':sorted(expected_all-observed_set),
              'unexpected_program_ids':sorted(observed_set-expected_all),
              'status':'complete' if observed_set==expected_all and len(rows)==24 and len(observed_set)==24 else 'incomplete',
              'evidence_rule':'transport/challenge/provider failures are execution states, not negative findings.'
          }
          (root/'nightly-research-coverage.json').write_text(json.dumps(coverage,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          requirements={
              'schema':'nightly-research-acceptance-requirements/v1',
              'run_id':os.environ['NIGHTLY_RUN_ID'],
              'foundation_revision':os.environ['FOUNDATION_REVISION'],
              'operations_research_revision':os.environ['OPERATIONS_REVISION'],
              'issues':{
                  'foundation_58':{'status':'derived_tracker','requires':['foundation_157','operations_597','operations_603']},
                  'foundation_157':{'status':'live_24_program_acceptance','program_count':24,'lanes':3,'programs_per_lane':8,'provider_execution_required':True,'dry_run_acceptable':False,'exact_revision_required':True,'artifact_attestation_required':True},
                  'operations_597':{'status':'pending_external_runtime','receipt_contract':'mapper-migration-runtime-receipt/v1','cases':32,'repeats_min':3,'cold_start':True,'raw_samples':True,'parity':['functional','error_taxonomy','security','policy','provenance','cancellation','timeout'],'performance_resource_measurements':True,'shadow':True,'canary':True,'rollback':True},
                  'operations_603':{'status':'pending_external_runtime','receipt_contract':'model-portability-runtime-receipt/v1','cases':32,'repeats_min':3,'parity':['functional','security','policy','provenance','cancellation'],'serialization_conversion_measurement':True,'no_model_specific_hidden_assumptions':True,'one_canonical_authority':True,'shadow':True,'canary':True,'rollback':True}
              },
              'closure_rule':'This artifact never closes #58, #157, #597, or #603 by itself; required live/external evidence remains mandatory.'
          }
          (root/'nightly-research-acceptance-requirements.json').write_text(json.dumps(requirements,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          allowed={'acquisition','mapper','chatbot','search','models','agents','architecture','infrastructure','performance','alternatives','evaluation'}
          errors=[]
          for lane in range(3):
              lane_rows=[r for r in rows if int(r.get('lane',-1))==lane]
              lane_rows.sort(key=lambda r:(int(r.get('slot',-1)),str(r.get('program_id',''))))
              (root/f'nightly-lane-{lane}.jsonl').write_text(''.join(json.dumps(r,sort_keys=True,ensure_ascii=False)+'\n' for r in lane_rows),encoding='utf-8')
              expected={f'lane{lane}-slot{slot}' for slot in range(8)}
              completed={r.get('program_id') for r in lane_rows if r.get('status')=='completed'}
              valid=(completed==expected and len(lane_rows)==8 and all(isinstance(r.get('research_type'),str) and r.get('research_type') in allowed and isinstance(r.get('topic'),str) and r.get('topic','').strip() for r in lane_rows))
              validation='success' if valid else 'failed'
              state='blocked_before_execution' if mode=='live' and preflight!='success' else ('lane_failure' if runner!='success' else ('dry_run' if mode=='dry-run' else ('live_research_executed' if valid else 'lane_failure')))
              if mode=='live' and (preflight!='success' or runner!='success' or not valid): errors.append(f'lane{lane}')
              status={'schema':'nightly-research-lane-status/v1','contract':'nightly-research-contract/v2','run_id':os.environ['NIGHTLY_RUN_ID'],'foundation_revision':os.environ['FOUNDATION_REVISION'],'lane':lane,'mode':mode,'state':state,'preflight':preflight,'runner':runner,'validation':validation,'program_count':len(lane_rows),'programs':[r.get('program_id') for r in lane_rows],'operations_revision':os.environ['OPERATIONS_REVISION'],'execution_strategy':'crossfire','global_capacity':20}
              (root/f'nightly-lane-{lane}-status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          if mode=='live' and errors: raise SystemExit('Live CrossFire research did not satisfy the 24-program evidence contract')
      - name: Upload nightly research acceptance manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-research-acceptance-manifests
          path: |
            .runtime/nightly-research-coverage.json
            .runtime/nightly-research-acceptance-requirements.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload nightly research lane 0
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-research-lane-0
          path: |
            .runtime/nightly-lane-0.jsonl
            .runtime/nightly-lane-0-status.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload nightly research lane 1
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-research-lane-1
          path: |
            .runtime/nightly-lane-1.jsonl
            .runtime/nightly-lane-1-status.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload nightly research lane 2
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-research-lane-2
          path: |
            .runtime/nightly-lane-2.jsonl
            .runtime/nightly-lane-2-status.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest lane 0
        if: ${{ steps.materialize.outcome == 'success' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-lane-0.jsonl
      - name: Attest lane 1
        if: ${{ steps.materialize.outcome == 'success' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-lane-1.jsonl
      - name: Attest lane 2
        if: ${{ steps.materialize.outcome == 'success' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-lane-2.jsonl
      - name: Remove private research checkout and credentials
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/operations-research" "$RUNNER_TEMP/operations-research-app.pem" "$RUNNER_TEMP/operations-research-jwt.txt" "$RUNNER_TEMP/operations-research-installation.json" "$RUNNER_TEMP/operations-research-token.txt" "$RUNNER_TEMP/git-askpass-operations-research.sh"

  migration_review:
    name: Nightly polyglot migration review
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_FOUNDATION_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Authenticate private migration review source
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout pinned Operations migration tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ env.OPERATIONS_MIGRATION_TOOLS_REF }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Verify Operations migration-tools revision
        working-directory: operations
        shell: bash
        env:
          EXPECTED: ${{ env.OPERATIONS_MIGRATION_TOOLS_REF }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Install Operations package
        working-directory: operations
        run: python -m pip install --disable-pip-version-check -e . --no-deps
      - name: Run deterministic migration review sweep
        env:
          PYTHONPATH: ${{ github.workspace }}/operations
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python operations/private/multi_agent/migration_review.py \
            --foundation "$GITHUB_WORKSPACE" \
            --operations "$GITHUB_WORKSPACE/operations" \
            --matrix "$GITHUB_WORKSPACE/benchmark/polyglot/migration_matrix_40.json" \
            --output .runtime/nightly-migration-review.json
      - name: Publish explicit #597/#603 runtime-evidence requirements
        shell: python
        env:
          NIGHTLY_RUN_ID: ${{ github.run_id }}
          FOUNDATION_REVISION: ${{ env.TARGET_FOUNDATION_SHA }}
          MIGRATION_REVISION: ${{ env.OPERATIONS_MIGRATION_TOOLS_REF }}
        run: |
          import json
          import os
          from pathlib import Path
          payload = {
              "schema": "migration-runtime-evidence-requirements/v1",
              "run_id": os.environ["NIGHTLY_RUN_ID"],
              "foundation_revision": os.environ["FOUNDATION_REVISION"],
              "operations_revision": os.environ["MIGRATION_REVISION"],
              "issue_597": {
                  "status": "pending_external_runtime",
                  "receipt_contract": "mapper-migration-runtime-receipt/v1",
                  "cases": 32,
                  "repeats_min": 3,
                  "cold_start": True,
                  "raw_samples": True,
                  "parity": ["functional", "error_taxonomy", "security", "policy", "provenance", "cancellation", "timeout"],
                  "performance_resource_measurements": True,
                  "shadow": True,
                  "canary": True,
                  "rollback": True,
              },
              "issue_603": {
                  "status": "pending_external_runtime",
                  "receipt_contract": "model-portability-runtime-receipt/v1",
                  "cases": 32,
                  "repeats_min": 3,
                  "parity": ["functional", "security", "policy", "provenance", "cancellation"],
                  "serialization_conversion_measurement": True,
                  "no_model_specific_hidden_assumptions": True,
                  "one_canonical_authority": True,
                  "shadow": True,
                  "canary": True,
                  "rollback": True,
              },
              "closure_rule": "Deterministic repository CI is supporting evidence only; it cannot substitute for required private/local runtime receipts.",
          }
          Path(".runtime/migration-runtime-evidence-requirements.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
      - name: Validate migration review receipt
        shell: python
        run: |
          import json
          from pathlib import Path
          receipt = json.loads(Path(".runtime/nightly-migration-review.json").read_text(encoding="utf-8"))
          assert receipt["schema"] == "nightly-migration-review/v1"
          assert receipt["matrix"]["case_count"] == 40
          assert receipt["capacity_sweep"]["agent_capacities"] == [1, 2, 4, 8]
          assert receipt["capacity_sweep"]["execution_modes"] == ["serial", "parallel"]
          assert receipt["capacity_sweep"]["repeats"] == 3
          assert receipt["capacity_sweep"]["all_cases_completed"] is True
          # The current capacity sweep uses the deterministic executor. It validates
          # scheduling/capacity structure only and must never be treated as runtime
          # latency, token, source-count, or answer-quality benchmark evidence.
          assert receipt["capacity_sweep"]["evidence_class"] == "deterministic-structural"
          assert receipt["capacity_sweep"]["runtime_performance_valid"] is False
          assert receipt["capacity_sweep"]["executor"] == "deterministic_executor"
          assert all(row["evidence_class"] == "deterministic-structural" for row in receipt["capacity_sweep"]["results"])
          assert all(row["runtime_performance_valid"] is False for row in receipt["capacity_sweep"]["results"])
          assert len(receipt["language_review"]) == 40
          assert receipt["polyglot_audit"]["language_scoreboard"]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-migration-runtime-evidence-requirements
          path: .runtime/migration-runtime-evidence-requirements.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/migration-runtime-evidence-requirements.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-migration-review
          path: .runtime/nightly-migration-review.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-migration-review.json

  project-summary:
    name: Diagnose nightly Heroic AI research
    needs: [research, migration_review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_FOUNDATION_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Authenticate private project-research source
        shell: bash
        env:
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPERATIONS_APP_ID:-}" || { echo 'Missing OPERATIONS_APP_ID GitHub Actions secret'; exit 1; }
          test -n "${OPERATIONS_APP_PRIVATE_KEY:-}" || { echo 'Missing OPERATIONS_APP_PRIVATE_KEY GitHub Actions secret'; exit 1; }
          key_file="$RUNNER_TEMP/operations-summary-app.pem"
          jwt_file="$RUNNER_TEMP/operations-summary-jwt.txt"
          response_file="$RUNNER_TEMP/operations-summary-installation.json"
          umask 077
          printf '%s\n' "$OPERATIONS_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          python - "$OPERATIONS_APP_ID" "$key_file" > "$jwt_file" <<'PY'
          import base64
          import json
          import subprocess
          import sys
          import time

          app_id, key_file = sys.argv[1:]

          def b64url(value: bytes) -> str:
              return base64.urlsafe_b64encode(value).rstrip(b"=").decode("ascii")

          now = int(time.time())
          header = {"alg": "RS256", "typ": "JWT"}
          payload = {"iat": now - 60, "exp": now + 540, "iss": app_id}
          unsigned = f"{b64url(json.dumps(header, separators=(",", ":")).encode())}.{b64url(json.dumps(payload, separators=(",", ":")).encode())}".encode()
          signed = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", key_file],
              input=unsigned,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=True,
          )
          print(unsigned.decode() + "." + b64url(signed.stdout))
          PY
          app_jwt=$(cat "$jwt_file")
          installation_output="$RUNNER_TEMP/operations-installation-id.txt"
          installation_error="$RUNNER_TEMP/operations-installation-id.err"
          set +e
          OPERATIONS_APP_JWT="$app_jwt" python scripts/resolve_operations_installation.py >"$installation_output" 2>"$installation_error"
          installation_status=$?
          set -e
          if [ "$installation_status" -ne 0 ]; then
            echo "GitHub App installation discovery failed (exit $installation_status)"
            cat "$installation_error" 2>/dev/null || true
            exit 1
          fi
          installation_id="$(tr -d "\r\n" < "$installation_output")"
          test -n "$installation_id" || { echo 'GitHub App installation discovery returned an empty installation id'; exit 1; }
          installation_response=$(curl -fsS \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${app_jwt}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/app/installations/${installation_id}/access_tokens")
          printf '%s\n' "$installation_response" > "$response_file"
          github_app_token=$(python - "$response_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["token"])
          PY
          )
          test -n "$github_app_token"
          echo "::add-mask::$github_app_token"
          token_file="$RUNNER_TEMP/operations-summary-token.txt"
          printf '%s\n' "$github_app_token" > "$token_file"
          chmod 600 "$token_file"
          repo_response=$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${github_app_token}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OPERATIONS_REPOSITORY}")
          jq -e --arg repo "$OPERATIONS_REPOSITORY" '.full_name == $repo and .private == true' <<<"$repo_response" >/dev/null
          ref_response=$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${github_app_token}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OPERATIONS_REPOSITORY}/git/commits/${OPERATIONS_RESEARCH_REF}")
          jq -e --arg expected "$OPERATIONS_RESEARCH_REF" '.sha == $expected' <<<"$ref_response" >/dev/null
          echo "private project-research source access: PASS (${OPERATIONS_RESEARCH_REF})"
      - name: Checkout pinned private project-research implementation
        shell: bash
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/git-askpass-operations-summary.sh"
          umask 077
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) cat "$RUNNER_TEMP/operations-summary-token.txt" ;;
            *) printf '%s\n' '' ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          rm -rf "$RUNNER_TEMP/operations-research"
          git clone --no-checkout "https://github.com/${OPERATIONS_REPOSITORY}.git" "$RUNNER_TEMP/operations-research"
          git -C "$RUNNER_TEMP/operations-research" fetch --no-tags --depth=1 origin "$OPERATIONS_RESEARCH_REF"
          git -C "$RUNNER_TEMP/operations-research" checkout --detach "$OPERATIONS_RESEARCH_REF"
          test "$(git -C "$RUNNER_TEMP/operations-research" rev-parse HEAD)" = "$OPERATIONS_RESEARCH_REF"
      - name: Download all research lane artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: nightly-research-lane-*
          path: .runtime/artifacts
          merge-multiple: true
      - name: Download migration review artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: nightly-migration-review
          path: .runtime/migration-review
      - name: Build truthful nightly diagnosis
        shell: python
        run: |
          import json
          from pathlib import Path

          research_result = "${{ needs.research.result }}"
          statuses = []
          for lane in range(3):
              path = Path(f'.runtime/artifacts/nightly-lane-{lane}-status.json')
              if path.exists():
                  statuses.append(json.loads(path.read_text()))
                  continue
              if research_result in {'cancelled', 'skipped'}:
                  expected = [f"lane{lane}-slot{slot}" for slot in range(8)]
                  statuses.append({
                      'schema': 'nightly-research-lane-status/v1',
                      'run_id': '${{ github.run_id }}',
                      'lane': lane,
                      'mode': 'live',
                      'state': 'blocked_before_execution',
                      'preflight': 'blocked_by_production_gate',
                      'runner': 'cancelled',
                      'validation': 'skipped',
                      'program_count': 8,
                      'programs': expected,
                      'operations_revision': '${{ env.OPERATIONS_RESEARCH_REF }}',
                      'artifact_missing': True,
                  })
                  continue
              raise FileNotFoundError(path)

          states = {item['state'] for item in statuses}
          if 'lane_failure' in states:
              aggregate = 'lane_specific_failure'
          elif 'blocked_before_execution' in states:
              aggregate = 'blocked_before_execution'
          elif states == {'dry_run'}:
              aggregate = 'dry_run'
          elif states == {'live_research_executed'}:
              aggregate = 'live_research_executed'
          else:
              aggregate = 'partial_or_mixed'

          migration_path = Path('.runtime/migration-review/nightly-migration-review.json')
          migration_review = (
              json.loads(migration_path.read_text())
              if migration_path.exists()
              else {
                  'review_score_0_to_100': 0,
                  'capacity_sweep': {'cases': 0},
                  'language_review': [],
              }
          )
          matrix_case_count = migration_review.get('matrix', {}).get('case_count', 0)
          capacity_case_count = migration_review.get('capacity_sweep', {}).get('cases', 0)

          blockers = []
          if 'blocked_before_execution' in states:
              blockers.append('research_preflight_blocked')
          if 'lane_failure' in states:
              blockers.append('research_lane_failure')
          if '${{ needs.research.result }}' != 'success':
              blockers.append('research_job_not_successful')
          if '${{ needs.migration_review.result }}' != 'success':
              blockers.append('migration_review_job_not_successful')
          # The 40-case migration matrix and the 24-case capacity sweep are
          # distinct evidence dimensions. Only the matrix is required to have
          # exactly 40 migration-review cases.
          if matrix_case_count != 40:
              blockers.append('migration_review_incomplete')
          if any(item.get('validation') != 'success' for item in statuses):
              blockers.append('lane_validation_incomplete')
          blockers = sorted(set(blockers))[:8]
          diagnosis = {
              'schema': 'nightly-research-diagnosis/v1',
              'run_id': '${{ github.run_id }}',
              'aggregate_state': aggregate,
              'research_job_result': '${{ needs.research.result }}',
              'migration_review_job_result': '${{ needs.migration_review.result }}',
              'migration_review_score_0_to_100': migration_review['review_score_0_to_100'],
              'migration_review_cases': matrix_case_count,
              'migration_review_capacity_cases': capacity_case_count,
              'migration_review_languages': sorted({item['language'] for item in migration_review['language_review']}),
              'blockers': blockers,
              'lanes': statuses,
              'operations_revision': '${{ env.OPERATIONS_RESEARCH_REF }}',
              'real_research_findings_allowed': aggregate == 'live_research_executed' and '${{ inputs.dry_run == true }}' != 'true',
              'historical_dry_run_findings_are_real_research': False,
              'evidence_rule': 'LLM output is candidate-only until deterministic acquisition/evidence receipt qualification.',
          }
          Path('.runtime/nightly-diagnosis.json').write_text(json.dumps(diagnosis, indent=2) + '\n')
          print(json.dumps(diagnosis, indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-diagnosis
          path: .runtime/nightly-diagnosis.json
          retention-days: 30
      - name: Build project research only from complete live research
        if: ${{ needs.research.result == 'success' && inputs.dry_run != true }}
        run: |
          PYTHONPATH="$RUNNER_TEMP/operations-research" python -m private.multi_agent.project_research \
            --input \
              .runtime/artifacts/nightly-lane-0.jsonl \
              .runtime/artifacts/nightly-lane-1.jsonl \
              .runtime/artifacts/nightly-lane-2.jsonl \
            --output .runtime/nightly-project-improvement.json \
            --run-id "${GITHUB_RUN_ID}"
      - name: Validate and publish complete-live project research
        if: ${{ needs.research.result == 'success' && inputs.dry_run != true }}
        shell: python
        run: |
          import json
          from pathlib import Path
          summary = json.loads(Path('.runtime/nightly-project-improvement.json').read_text())
          assert summary['schema'] == 'project-improvement-research/v1'
          assert summary['research_mode'] == 'project_improvement'
          assert summary['project_snapshot']['revision']
          assert summary['program_count'] == 24
          assert 'improvement_signals' in summary
          assert summary['evidence_policy']['llm_findings'] == 'candidate_only_until_acquisition_receipt'
      - name: Download previous successful nightly baseline
        if: ${{ needs.research.result == 'success' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_run="$(gh run list --workflow nightly-multi-agent-research-v3.yml --status success --limit 20 --json databaseId --jq 'map(select(.databaseId != (env.GITHUB_RUN_ID|tonumber))) | .[0].databaseId // empty')"
          if [ -z "$previous_run" ]; then
            echo 'No previous successful nightly run is available; producing NO_BASELINE.'
            mkdir -p .runtime/previous
            printf '%s\n' '{"decision":"NO_BASELINE"}' > .runtime/previous/nightly-baseline-placeholder.json
            exit 0
          fi
          mkdir -p .runtime/previous
          if ! gh run download "$previous_run" --name nightly-project-improvement --dir .runtime/previous; then
            echo 'Previous nightly run exists but has no downloadable project-improvement artifact; producing NO_BASELINE.'
            rm -rf .runtime/previous
            mkdir -p .runtime/previous
          fi
      - name: Compare current run with previous baseline
        if: ${{ needs.research.result == 'success' && inputs.dry_run != true }}
        run: |
          previous='.runtime/previous/nightly-project-improvement.json'
          if [[ ! -f "$previous" ]]; then
            printf '%s\n' '{"schema":"project-improvement-baseline/v1","decision":"NO_BASELINE"}' > .runtime/nightly-baseline.json
          else
            python -m benchmark.multi_agent.baseline \
              --current .runtime/nightly-project-improvement.json \
              --previous "$previous" \
              --output .runtime/nightly-baseline.json
          fi
      - name: Validate baseline contract
        if: ${{ needs.research.result == 'success' && inputs.dry_run != true }}
        shell: python
        run: |
          import json
          from pathlib import Path
          baseline = json.loads(Path('.runtime/nightly-baseline.json').read_text())
          assert baseline['schema'] == 'project-improvement-baseline/v1'
          assert baseline['decision'] in {'NO_BASELINE', 'IMPROVED', 'REGRESSED', 'STABLE'}
      - name: Validate complete nightly artifact bundle
        if: ${{ needs.research.result == 'success' && inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          python -m benchmark.research_artifact_validator --root .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ needs.research.result == 'success' && inputs.dry_run != true }}
        with:
          name: nightly-project-improvement
          path: .runtime/nightly-project-improvement.json
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ needs.research.result == 'success' && inputs.dry_run != true }}
        with:
          name: nightly-project-improvement-baseline
          path: .runtime/nightly-baseline.json
          retention-days: 30
      - name: Attest project improvement summary
        if: ${{ needs.research.result == 'success' && inputs.dry_run != true }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-project-improvement.json
      - name: Attest project improvement baseline
        if: ${{ needs.research.result == 'success' && inputs.dry_run != true }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-baseline.json
      - name: Remove private project-research checkout and credentials
        if: ${{ always() }}
        shell: bash
        run: rm -rf "$RUNNER_TEMP/operations-research" "$RUNNER_TEMP/operations-summary-app.pem" "$RUNNER_TEMP/operations-summary-jwt.txt" "$RUNNER_TEMP/operations-summary-installation.json" "$RUNNER_TEMP/operations-summary-token.txt" "$RUNNER_TEMP/git-askpass-operations-summary.sh"

  final-gate:
    name: Preserve truthful nightly result
    needs: [research, migration_review, project-summary]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify research and diagnosis outcomes
        shell: bash
        run: |
          set -euo pipefail
          echo "research=${{ needs.research.result }}"
          echo "diagnosis=${{ needs.project-summary.result }}"
          echo "migration-review=${{ needs.migration_review.result }}"
          test "${{ needs.migration_review.result }}" = "success" || { echo "Nightly migration review failed; truthful migration evidence remains failed."; exit 1; }
          test "${{ needs.project-summary.result }}" = "success" || { echo 'Nightly diagnosis failed.'; exit 1; }
          test "${{ needs.research.result }}" = "success" || { echo 'One or more research lanes failed/blocked; truthful nightly result remains failed.'; exit 1; }