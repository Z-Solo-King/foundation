name: Main push Actions control

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  control:
    name: Control job
    runs-on: ubuntu-latest
    steps:
      - name: Confirm main push runner starts
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${GITHUB_SHA}"
          echo "MAIN_PUSH_CONTROL=PASS"
