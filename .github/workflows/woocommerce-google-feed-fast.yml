name: WooCommerce Google Feed Fast Hybrid

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-a:
    name: Fast A (8)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_START: "0"
      TARGET_COUNT: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Extract public Google XML feeds
        run: node tools/woocommerce_google_feed_fast.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-google-feed-fast-a
          path: out/fast/
          if-no-files-found: warn
          retention-days: 14

  fast-b:
