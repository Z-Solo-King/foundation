name: Temporary matrix Prettier autofix

on:
  push:
    branches:
      - fix/live-provider-crossfire-automation-routing-2026-10-03

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Prettier') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/live-provider-crossfire-automation-routing-2026-10-03
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Apply exact Prettier
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.9 --write docs/PROJECT_IMPROVEMENT_MATRIX.json
          git diff --check
          if git diff --quiet -- docs/PROJECT_IMPROVEMENT_MATRIX.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_IMPROVEMENT_MATRIX.json
          git commit -m "style: normalize provider benchmark matrix formatting"
          git push origin HEAD:fix/live-provider-crossfire-automation-routing-2026-10-03
