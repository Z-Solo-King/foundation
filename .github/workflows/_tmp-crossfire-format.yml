name: Temporary format repair for current CrossFire PR
# trigger formatting run

on:
  push:
    branches:
      - fix/live-provider-crossfire-current-main-2026-10-03

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/fix/live-provider-crossfire-current-main-2026-10-03'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.9

      - name: Format changed files mechanically
        run: |
          set -euo pipefail
          ruff format tests/test_crossfire_workflows.py
          npx --yes prettier@3.9.9 --write .github/workflows/live-ai-provider-crossfire.yml
          git diff --check

      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/live-ai-provider-crossfire.yml tests/test_crossfire_workflows.py
          git commit -m "chore: normalize crossfire workflow formatting"
          git push