name: deploy-skeleton

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for public-tests for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..3}; do
            runs=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${GITHUB_SHA}&per_page=20")
            status=$(jq -r '.workflow_runs[0].status // "missing"' <<<"$runs")
            conclusion=$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$runs")
            echo "public-tests status=${status} conclusion=${conclusion} attempt=${attempt}"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo 'public-tests did not pass'; exit 1; }
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
