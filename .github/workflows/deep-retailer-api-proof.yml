name: Deep retailer API and feed discovery

on:
  pull_request:
  push:
    branches:
      - diag/multi-retailer-api-proof-v3-2026-09-26

permissions:
  contents: read

jobs:
  deep-discovery:
    name: Deep API/feed proof (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - Apple
          - Acer
          - ASUS
          - Dell
          - Flipkart
          - HP
          - Samsung
          - "Vijay Sales"
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Deep API/feed discovery
        run: node scripts/multi_retailer_api_probe_deep.mjs
      - name: Upload deep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retailer-api-deep-${{ matrix.target }}
          path: deep-probe-result.json
          if-no-files-found: warn
          retention-days: 14
