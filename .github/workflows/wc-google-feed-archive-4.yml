name: WooCommerce Google Feed Archive Discovery 4

on:
  push:
    branches:
      - fix/wc-google-feed-focus-4-20260929
    paths:
      - ".github/workflows/wc-google-feed-archive-4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Archive discovery ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {site: "Ads Store", host: "adsstore.in"}
          - {site: "ithunt", host: "ithunt.in"}
          - {site: "KC Computers", host: "kccomputers.co.in"}
          - {site: "KRG KART", host: "krgkart.com"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Query Common Crawl indexes
        env:
          SITE: ${{ matrix.site }}
          HOST: ${{ matrix.host }}
        run: |
          mkdir -p out/wc-google-feed-archive
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { gunzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';

          const host = process.env.HOST;
          const site = process.env.SITE;
          const outDir = 'out/wc-google-feed-archive';
          const ua = 'Mozilla/5.0 (compatible; WCFeedArchiveDiscovery/2026.09)';
          const feedLike = /(?:\.xml(?:\?|$)|\.rss(?:\?|$)|feed|google|merchant|shopping|woo(?:commerce)?|wppfm|codesolz|feedcraft|product[-_]?feed)/i;
          const nativeValid = (body) => {
            const x = String(body || '');
            return /<(?:rss|feed)\b/i.test(x) &&
              x.toLowerCase().includes('base.google.com/ns/1.0') &&
              /<item\b[\s\S]*?<title\b/i.test(x) &&
              /<(?:[\w.-]+:)?price\b/i.test(x);
          };
          const itemCount = (x) => (String(x || '').match(/<item\b/gi) || []).length;

          async function get(url, opts={}) {
            const r = await fetch(url, {headers:{'User-Agent':ua,'Accept':'application/json,text/plain,*/*'}, ...opts});
            const text = await r.text();
            return {status:r.status,headers:r.headers,text,url:r.url};
          }

          await mkdir(outDir, {recursive:true});
          const coll = await get('https://index.commoncrawl.org/collinfo.json');
          if (coll.status !== 200) throw new Error('Common Crawl collection list failed: ' + coll.status);
          const collections = JSON.parse(coll.text).
            map(x => x.id).
            filter(x => /^CC-MAIN-2026-/.test(x)).
            slice(0, 6);

          const seen = new Map();
          for (const id of collections) {
            const u = new URL('https://index.commoncrawl.org/' + id + '-index');
            u.searchParams.set('url', host + '/*');
            u.searchParams.set('output', 'json');
            u.searchParams.set('filter', 'status:200');
            u.searchParams.set('collapse', 'urlkey');
            u.searchParams.set('matchType', 'prefix');
            const r = await get(u.href, {signal:AbortSignal.timeout(30000)});
            if (r.status !== 200) continue;
            for (const line of r.text.split('\n')) {
              if (!line.trim()) continue;
              let x; try { x = JSON.parse(line); } catch { continue; }
              if (!feedLike.test(x.url || '')) continue;
              const key = x.url;
              if (!seen.has(key)) seen.set(key, {collection:id, ...x});
            }
          }

          const candidates = [...seen.values()].slice(0, 60);
          const validated = [];
          for (const c of candidates) {
            try {
              const start = Number(c.offset);
              const length = Number(c.length);
              if (!c.filename || !Number.isFinite(start) || !Number.isFinite(length) || length <= 0 || length > 50000000) continue;
              const rr = await fetch('https://data.commoncrawl.org/' + c.filename, {
                headers:{'User-Agent':ua,'Range':`bytes=${start}-${start+length-1}`},
                signal:AbortSignal.timeout(30000)
              });
              if (!rr.ok) continue;
              let buf = Buffer.from(await rr.arrayBuffer());
              try { buf = gunzipSync(buf); } catch {}
              const raw = buf.toString('utf8');
              const bodyMarker = raw.indexOf('\r\n\r\n');
              const body = bodyMarker >= 0 ? raw.slice(bodyMarker + 4) : raw;
              if (!nativeValid(body)) continue;
              validated.push({
                source:'commoncrawl', collection:c.collection, original_url:c.url,
                bytes:Buffer.byteLength(body), item_count:itemCount(body),
                sha256:createHash('sha256').update(body).digest('hex')
              });
            } catch {}
          }

          const report = {site,host,collections,candidate_count:candidates.length,validated_native_archives:validated};
          await writeFile(outDir + '/' + host.replace(/[^a-z0-9]+/gi,'-') + '.json', JSON.stringify(report,null,2) + '\n');
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Upload archive evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wc-google-feed-archive-${{ matrix.site }}
          path: out/wc-google-feed-archive/
          if-no-files-found: warn
          retention-days: 14
