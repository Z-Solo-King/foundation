name: Temporary automation formatting repair
on:
  push:
    branches:
      - fix/session-independent-automation-2026-10-03
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Repair and format changed files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = ".github/workflows/migration-factory.yml";
          let s = fs.readFileSync(path, "utf8");
          s = s.replace(/fs\.writeFileSync\("\.runtime\/migration-factory-summary\.json",JSON\.stringify\(summary,null,2\)+"[\\s\\n]*"\);/s, 'fs.writeFileSync(".runtime/migration-factory-summary.json",JSON.stringify(summary,null,2)+"\\n");');
          fs.writeFileSync(path, s);
          NODE
          files="$(git diff --name-only origin/main...HEAD -- '*.yml' '*.yaml' '*.md' '*.json' '*.js' '*.mjs' '*.ts' '*.tsx' | grep -v '^\.github/workflows/_tmp-' | tr '\n' ' ')"
          if [ -n "$files" ]; then
            npx --yes prettier --write $files
          fi
          python -m pip install --disable-pip-version-check ruff==0.16.9
          pyfiles="$(git diff --name-only origin/main...HEAD -- '*.py' | tr '\n' ' ')"
          if [ -n "$pyfiles" ]; then
            ruff format $pyfiles
          fi
      - name: Remove temporary repair workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-automation-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize automation workflow and tests"
          git push