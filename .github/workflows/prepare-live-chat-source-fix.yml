name: Prepare live chatbot source fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-live-chat-source-fix.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-live-chat-source-fix
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, 'live chatbot source fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply Foundation public-chat patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("worker.py")
          source = path.read_text(encoding="utf-8")

          old = '''def _chat_headers(request):
              headers = {"Content-Type": "application/json"}
              token = _bearer_token(request)
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              idempotency_key = request.headers.get("Idempotency-Key")
              if idempotency_key:
                  headers["Idempotency-Key"] = idempotency_key
              return headers
          '''
          new = '''def _chat_headers(request, env):
              headers = {"Content-Type": "application/json"}
              backend_token = str(getattr(env, "CHAT_BACKEND_TOKEN", "") or getattr(env, "AUTH_TOKEN", "") or "").strip()
              if backend_token:
                  headers["Authorization"] = f"Bearer {backend_token}"
              idempotency_key = request.headers.get("Idempotency-Key")
              if idempotency_key:
                  headers["Idempotency-Key"] = idempotency_key
              return headers


          def _anonymous_chat_enabled(env):
              return str(getattr(env, "PUBLIC_CHAT_ANONYMOUS", "") or "").strip().casefold() == "true"


          def _public_chat_subject(request):
              token_subject = authenticated_subject_fingerprint(request)
              if token_subject:
                  return token_subject
              ip = str(request.headers.get("CF-Connecting-IP", "") or "anonymous").split(",", 1)[0].strip() or "anonymous"
              user_agent = str(request.headers.get("User-Agent", "") or "unknown")[:512]
              return hashlib.sha256(f"anonymous|{ip}|{user_agent}".encode("utf-8")).hexdigest()
          '''
          assert old in source, "Foundation _chat_headers contract not found"
          source = source.replace(old, new, 1)
          assert "headers = _chat_headers(request)" in source, "Foundation chat proxy call not found"
          source = source.replace("headers = _chat_headers(request)", "headers = _chat_headers(request, env)", 1)

          old_stream = '''        if request.method == "POST" and path.endswith("/api/v1/chat/stream"):
              if not _authorized(request, self.env):
                  return _authenticated_json({"ok": False, "error": "unauthorized"}, status=401)
          '''
          new_stream = '''        if request.method == "POST" and path.endswith("/api/v1/chat/stream"):
              anonymous = _anonymous_chat_enabled(self.env)
              if not anonymous and not _authorized(request, self.env):
                  return _authenticated_json({"ok": False, "error": "unauthorized"}, status=401)
          '''
          assert old_stream in source, "Foundation stream auth contract not found"
          source = source.replace(old_stream, new_stream, 1)

          old_chat = '''        if request.method == "POST" and path.endswith("/api/v1/chat"):
              if not _authorized(request, self.env):
                  return _authenticated_json({"ok": False, "error": "unauthorized"}, status=401)
          '''
          new_chat = '''        if request.method == "POST" and path.endswith("/api/v1/chat"):
              anonymous = _anonymous_chat_enabled(self.env)
              if not anonymous and not _authorized(request, self.env):
                  return _authenticated_json({"ok": False, "error": "unauthorized"}, status=401)
          '''
          assert old_chat in source, "Foundation chat auth contract not found"
          source = source.replace(old_chat, new_chat, 1)

          old_subject = '            subject = authenticated_subject_fingerprint(request) or "development-local"'
          new_subject_stream = '            subject = _public_chat_subject(request) if anonymous else (authenticated_subject_fingerprint(request) or "development-local")'
          assert source.count(old_subject) >= 2, "Foundation chat subject contracts not found"
          source = source.replace(old_subject, new_subject_stream, 2)

          path.write_text(source, encoding="utf-8")

      - name: Verify Foundation source
        run: python -m py_compile worker.py

      - name: Create Foundation source-fix PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="fix/live-public-chat-anonymous-$(date +%s)"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.py
          git commit -m "fix: allow governed anonymous public chat"
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch"             --title "fix: allow governed anonymous public chat"             --body "Allow only the public chat/chat-stream routes to use the D1 admission boundary without a browser-held admin token. Private dashboard, memory, research-readback and diagnostics remain authenticated. Public-to-private chat uses the dedicated CHAT_BACKEND_TOKEN binding."

  operations-source:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Create Operations write token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Apply private chat backend-token patch
        working-directory: operations
        shell: python
        run: |
          from pathlib import Path

          path = Path("worker.py")
          source = path.read_text(encoding="utf-8")

          assert "from urllib.parse import urlparse" in source
          source = source.replace(
              "from urllib.parse import urlparse\n",
              "import hmac\nfrom urllib.parse import urlparse\n",
              1,
          )

          helper = '''


          def authorized_chat_request(request, env):
              backend_expected = str(getattr(env, "CHAT_BACKEND_TOKEN", "") or "").strip()
              authorization = str(getattr(request, "headers", {}).get("Authorization", "") or "").strip()
              scheme, _, value = authorization.partition(" ")
              if backend_expected and scheme.casefold() == "bearer" and value and hmac.compare_digest(value.encode("utf-8"), backend_expected.encode("utf-8")):
                  return True
              return authorized_request(request, env)
          '''
          marker = "\n\nclass Default(WorkerEntrypoint):\n"
          assert marker in source, "Operations worker class marker not found"
          source = source.replace(marker, helper + marker, 1)

          old = '''            if not authorized_request(request, self.env):
                  return Response.json({"ok": False, "error": "unauthorized"}, status=401)
              payload = await read_json_object(request)
          '''
          new = '''            if not authorized_chat_request(request, self.env):
                  return Response.json({"ok": False, "error": "unauthorized"}, status=401)
              payload = await read_json_object(request)
          '''
          assert old in source, "Operations chat authorization contract not found"
          source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")

      - name: Verify Operations source
        working-directory: operations
        run: python -m py_compile worker.py

      - name: Create Operations source-fix PR
        env:
          GH_TOKEN: ${{ steps.operations-app.outputs.token }}
        working-directory: operations
        shell: bash
        run: |
          set -euo pipefail
          branch="fix/chat-backend-token-acceptance-$(date +%s)"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.py
          git commit -m "fix: accept dedicated public chat backend token"
          git push origin "$branch"
          gh pr create --repo Z-Solo-King/operations --base main --head "$branch"             --title "fix: accept dedicated public chat backend token"             --body "Accept the dedicated CHAT_BACKEND_TOKEN only for private chat/chat-stream service traffic. Existing AUTH_TOKEN authorization remains required for dashboard, memory, diagnostics and other protected control-plane APIs."
