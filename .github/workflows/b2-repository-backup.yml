name: B2 repository backup

'on':
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: b2-repository-backup
  cancel-in-progress: false

env:
  B2_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  backup:
    name: Mirror repositories to B2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify backup tools
        shell: bash
        run: |
          set -euo pipefail
          command -v git >/dev/null
          command -v curl >/dev/null
          command -v jq >/dev/null
          command -v aws >/dev/null || { echo 'AWS CLI is unavailable on the runner'; exit 1; }
          echo 'backup tools: PASS'

      - name: Authenticate GitHub App for private Operations backup
        shell: bash
        env:
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPERATIONS_APP_ID:-}" || { echo 'Missing OPERATIONS_APP_ID GitHub Actions secret'; exit 1; }
          test -n "${OPERATIONS_APP_PRIVATE_KEY:-}" || { echo 'Missing OPERATIONS_APP_PRIVATE_KEY GitHub Actions secret'; exit 1; }
          key_file="$RUNNER_TEMP/operations-backup-app.pem"
          jwt_file="$RUNNER_TEMP/operations-backup-jwt.txt"
          installation_output="$RUNNER_TEMP/operations-backup-installation-id.txt"
          installation_error="$RUNNER_TEMP/operations-backup-installation-id.err"
          response_file="$RUNNER_TEMP/operations-backup-installation-response.json"
          umask 077
          printf '%s\n' "$OPERATIONS_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          python scripts/create_github_app_jwt.py "$OPERATIONS_APP_ID" "$key_file" > "$jwt_file"
          app_jwt="$(cat "$jwt_file")"
          set +e
          OPERATIONS_APP_JWT="$app_jwt" python scripts/resolve_operations_installation.py >"$installation_output" 2>"$installation_error"
          installation_status=$?
          set -e
          if [ "$installation_status" -ne 0 ]; then
            echo "GitHub App installation discovery failed (exit $installation_status)"
            cat "$installation_error" 2>/dev/null || true
            exit 1
          fi
          installation_id="$(tr -d '\r\n' < "$installation_output")"
          test -n "$installation_id"
          installation_response="$(curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${app_jwt}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/app/installations/${installation_id}/access_tokens")"
          printf '%s\n' "$installation_response" > "$response_file"
          github_app_token="$(jq -r '.token // empty' "$response_file")"
          test -n "$github_app_token"
          echo "::add-mask::$github_app_token"
          echo 'GITHUB_APP_TOKEN<<EOF' >> "$GITHUB_ENV"
          printf '%s\n' "$github_app_token" >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"
          response="$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${github_app_token}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Z-Solo-King/operations')"
          jq -e '.private == true and .full_name == "Z-Solo-King/operations"' <<<"$response" >/dev/null
          echo 'GitHub App private Operations API access: PASS'
          echo 'GitHub App private Operations credential: PASS'
      - name: Verify required B2 credentials
        shell: bash
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          test -n "${B2_KEY_ID:-}" || { echo 'Missing B2_KEY_ID GitHub secret'; exit 1; }
          test -n "${B2_APPLICATION_KEY:-}" || { echo 'Missing B2_APPLICATION_KEY GitHub secret'; exit 1; }
          test -n "${B2_BUCKET:-}" || { echo 'Missing B2_BUCKET GitHub secret'; exit 1; }
          aws s3api head-bucket --bucket "$B2_BUCKET" --endpoint-url "$B2_ENDPOINT" >/dev/null
          echo 'B2 credential/bucket check: PASS'

      - name: Mirror both repositories
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_APP_TOKEN:-}"
          rm -rf backup-work backup-output remote-restore
          mkdir -p backup-work backup-output remote-restore
          for repo in foundation operations; do
            if [[ "$repo" == "operations" ]]; then
              basic="$(printf 'x-access-token:%s' "$GITHUB_APP_TOKEN" | base64 -w0)"
              git -c "http.extraHeader=Authorization: Basic $basic" clone --mirror "https://github.com/Z-Solo-King/${repo}.git" "backup-work/${repo}.git"
            else
              git clone --mirror "https://github.com/Z-Solo-King/${repo}.git" "backup-work/${repo}.git"
            fi
            git -C "backup-work/${repo}.git" fsck --full --no-dangling
            sha="$(git -C "backup-work/${repo}.git" rev-parse --verify refs/heads/main)"
            refs="$(git -C "backup-work/${repo}.git" show-ref --head | wc -l)"
            test -n "$sha" && test "$refs" -gt 0
            echo "${repo} mirror integrity: PASS (${sha}; ${refs} refs)"
          done
      - name: Create immutable archives and manifests
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          : > backup-output/uploaded.tsv
          for repo in foundation operations; do
            mirror="backup-work/${repo}.git"
            sha="$(git -C "$mirror" rev-parse --verify refs/heads/main)"
            tree="$(git -C "$mirror" show -s --format=%T "$sha")"
            refs="$(git -C "$mirror" show-ref --head | wc -l)"
            archive="backup-output/${repo}-${sha}-${timestamp}.tar.gz"
            tar -C backup-work -czf "$archive" "${repo}.git"
            sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
            size="$(stat -c '%s' "$archive")"
            manifest="backup-output/${repo}-${sha}-${timestamp}.json"
            # "remote_b2_restore_verified": False — this manifest starts as unverified; restore verification is a separate acceptance step.
            jq -n --arg repo "$repo" --arg commit "$sha" --arg tree "$tree" --arg created "$timestamp" --arg archive "$(basename "$archive")" --arg sha256 "$sha256" --argjson size "$size" --argjson refs "$refs" '{schema:"repository-backup/v2",repository:("Z-Solo-King/"+$repo),visibility:(if $repo=="foundation" then "public" else "private" end),ref:"main",commit:$commit,tree:$tree,created_at:$created,archive:$archive,sha256:$sha256,size_bytes:$size,ref_count:$refs,restore_test:{local_git_fsck:true,main_ref_verified:true,remote_b2_restore_verified:false}}' > "$manifest"
            printf 'repository-backup/%s\t%s\t%s\t%s\n' "$(basename "$archive")" "$archive" "$sha256" "$size" >> backup-output/uploaded.tsv
            printf 'repository-backup/%s\t%s\t%s\t%s\n' "$(basename "$manifest")" "$manifest" "$(sha256sum "$manifest" | cut -d' ' -f1)" "$(stat -c '%s' "$manifest")" >> backup-output/uploaded.tsv
            echo "${repo} archive + manifest: PASS"
          done

      - name: Upload archives and manifests to B2
        shell: bash
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key file _sha256 _size; do
            aws s3api put-object --bucket "$B2_BUCKET" --key "$key" --body "$file" --endpoint-url "$B2_ENDPOINT" --content-type application/octet-stream >/dev/null
            echo "uploaded: $key"
          done < backup-output/uploaded.tsv
          echo 'B2 upload: PASS'

      - name: Verify uploaded object metadata and size
        shell: bash
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key file expected_sha256 expected_size; do
            metadata="$(aws s3api head-object --bucket "$B2_BUCKET" --key "$key" --endpoint-url "$B2_ENDPOINT")"
            remote_size="$(jq -r '.ContentLength // empty' <<< "$metadata")"
            test "$remote_size" = "$expected_size" || { echo "Size mismatch: $key"; exit 1; }
            local_sha256="$(sha256sum "$file" | cut -d' ' -f1)"
            test "$local_sha256" = "$expected_sha256" || { echo "Local SHA-256 changed: $key"; exit 1; }
            echo "verified: $key"
          done < backup-output/uploaded.tsv
          echo 'B2 object metadata/size verification: PASS'

      - name: Verify remote restore from every repository archive
        shell: bash
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key _file expected_sha256 _size; do
            case "$key" in
              repository-backup/*.tar.gz)
                name="$(basename "$key")"
                mkdir -p remote-restore
                aws s3api get-object --bucket "$B2_BUCKET" --key "$key" "remote-restore/$name" --endpoint-url "$B2_ENDPOINT" >/dev/null
                actual_sha256="$(sha256sum "remote-restore/$name" | cut -d' ' -f1)"
                test "$actual_sha256" = "$expected_sha256" || { echo "Remote SHA-256 mismatch: $key"; exit 1; }
                rm -rf remote-restore/extracted
                mkdir -p remote-restore/extracted
                tar -xzf "remote-restore/$name" -C remote-restore/extracted
                repo_dir="$(find remote-restore/extracted -mindepth 1 -maxdepth 1 -type d -name '*.git' | head -n 1)"
                test -n "$repo_dir"
                git -C "$repo_dir" fsck --full --no-dangling
                test -n "$(git -C "$repo_dir" rev-parse --verify refs/heads/main)"
                echo "remote restore: PASS: $name"
                ;;
            esac
          done < backup-output/uploaded.tsv
          echo 'remote B2 restore verification: PASS'

      - name: Write non-sensitive run summary
        if: always()
        run: |
          {
            echo '### B2 repository backup'
            echo
            echo 'Foundation and Operations mirrors were created.'
            echo 'Credential-purpose verification, B2 upload metadata checks, SHA-256 restore verification and Git integrity were checked.'
          } >> "$GITHUB_STEP_SUMMARY"