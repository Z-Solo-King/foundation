name: B2 repository backup

on:
  schedule:
    # 02:00 IST = 20:30 UTC, inside the planned 01:00-09:00 overnight window.
    - cron: "30 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b2-repository-backup.yml'
      - 'backup/**'

permissions:
  contents: read

concurrency:
  group: b2-repository-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Mirror repositories to B2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      GITHUB_BACKUP_TOKEN: ${{ secrets.GITHUB_BACKUP_TOKEN }}
    steps:
      - name: Verify backup credentials and tooling
        shell: bash
        run: |
          set -euo pipefail
          test -n "${B2_KEY_ID:-}" || { echo 'Missing B2_KEY_ID GitHub secret'; exit 1; }
          test -n "${B2_APPLICATION_KEY:-}" || { echo 'Missing B2_APPLICATION_KEY GitHub secret'; exit 1; }
          test -n "${B2_BUCKET:-}" || { echo 'Missing B2_BUCKET GitHub secret'; exit 1; }
          test -n "${GITHUB_BACKUP_TOKEN:-}" || { echo 'Missing GITHUB_BACKUP_TOKEN GitHub secret'; exit 1; }
          command -v git >/dev/null
          command -v curl >/dev/null
          command -v jq >/dev/null
          echo 'backup prerequisites: PASS'

      - name: Verify both repository sources are readable
        shell: bash
        run: |
          set -euo pipefail
          for repo in foundation operations; do
            metadata=$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_BACKUP_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/Z-Solo-King/${repo}")
            jq -e --arg repo "$repo" '.full_name == ("Z-Solo-King/" + $repo)' <<<"$metadata" >/dev/null
            git -c http.extraHeader="Authorization: Bearer ${GITHUB_BACKUP_TOKEN}" \
              ls-remote "https://github.com/Z-Solo-King/${repo}.git" HEAD >/dev/null
            echo "GitHub read access: ${repo}: PASS"
          done

      - name: Authorize B2 and resolve private bucket
        shell: bash
        run: |
          set -euo pipefail
          auth=$(curl -fsS -u "${B2_KEY_ID}:${B2_APPLICATION_KEY}" \
            'https://api.backblazeb2.com/b2api/v2/b2_authorize_account')
          B2_API_URL=$(jq -r '.apiUrl // empty' <<<"$auth")
          B2_DOWNLOAD_URL=$(jq -r '.downloadUrl // empty' <<<"$auth")
          B2_AUTH_TOKEN=$(jq -r '.authorizationToken // empty' <<<"$auth")
          B2_ACCOUNT_ID=$(jq -r '.accountId // empty' <<<"$auth")
          test -n "$B2_API_URL"
          test -n "$B2_DOWNLOAD_URL"
          test -n "$B2_AUTH_TOKEN"
          test -n "$B2_ACCOUNT_ID"
          bucket=$(curl -fsS \
            -H "Authorization: ${B2_AUTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg accountId "$B2_ACCOUNT_ID" '{accountId:$accountId,bucketTypes:["allPrivate"]}')" \
            "${B2_API_URL}/b2api/v2/b2_list_buckets")
          B2_BUCKET_ID=$(jq -r --arg name "$B2_BUCKET" '[.buckets[]? | select(.bucketName == $name and .bucketType == "allPrivate") | .bucketId] | if length == 1 then .[0] else empty end' <<<"$bucket")
          test -n "$B2_BUCKET_ID" || { echo "Expected exactly one private B2 bucket named ${B2_BUCKET}"; exit 1; }
          {
            echo "B2_API_URL=${B2_API_URL}"
            echo "B2_DOWNLOAD_URL=${B2_DOWNLOAD_URL}"
            echo "B2_AUTH_TOKEN=${B2_AUTH_TOKEN}"
            echo "B2_ACCOUNT_ID=${B2_ACCOUNT_ID}"
            echo "B2_BUCKET_ID=${B2_BUCKET_ID}"
          } >> "$GITHUB_ENV"
          echo 'B2 authorization and bucket resolution: PASS'

      - name: Mirror both repositories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backup-work
          mkdir -p backup-work
          for repo in foundation operations; do
            target="backup-work/${repo}.git"
            git -c http.extraHeader="Authorization: Bearer ${GITHUB_BACKUP_TOKEN}" \
              clone --mirror "https://github.com/Z-Solo-King/${repo}.git" "$target"
            git -C "$target" fsck --full --no-dangling
            main_sha=$(git -C "$target" rev-parse --verify refs/heads/main)
            test -n "$main_sha"
            ref_count=$(git -C "$target" show-ref --head | wc -l)
            test "$ref_count" -gt 0
            echo "${repo} mirror integrity: PASS (${main_sha}; ${ref_count} refs)"
          done

      - name: Create immutable archives and manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backup-output
          mkdir -p backup-output
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          for repo in foundation operations; do
            mirror="backup-work/${repo}.git"
            sha=$(git -C "$mirror" rev-parse --verify refs/heads/main)
            tree=$(git -C "$mirror" show -s --format=%T "$sha")
            ref_count=$(git -C "$mirror" show-ref --head | wc -l)
            archive="backup-output/${repo}-${sha}-${timestamp}.tar.gz"
            tar -C backup-work -czf "$archive" "${repo}.git"
            sha1=$(sha1sum "$archive" | cut -d' ' -f1)
            sha256=$(sha256sum "$archive" | cut -d' ' -f1)
            size=$(stat -c '%s' "$archive")
            curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_BACKUP_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/Z-Solo-King/${repo}" \
              > "backup-output/${repo}-${sha}-${timestamp}-repository.json"
            jq -n \
              --arg schema 'repository-backup/v2' \
              --arg repository "Z-Solo-King/${repo}" \
              --arg visibility "$(test "$repo" = foundation && echo public || echo private)" \
              --arg ref main \
              --arg commit "$sha" \
              --arg tree "$tree" \
              --arg created "$timestamp" \
              --arg archive "$(basename "$archive")" \
              --arg sha1 "$sha1" \
              --arg sha256 "$sha256" \
              --arg size "$size" \
              --arg refs "$ref_count" \
              '{schema:$schema,repository:$repository,visibility:$visibility,ref:$ref,commit:$commit,tree:$tree,created_at:$created,archive:$archive,sha1:$sha1,sha256:$sha256,size_bytes:($size|tonumber),ref_count:($refs|tonumber),restore_test:{local_git_fsck:true,main_ref_verified:true,remote_b2_restore_verified:false}}' \
              > "backup-output/${repo}-${sha}-${timestamp}.json"
            echo "${repo} archive: PASS"
          done

      - name: Upload archives and manifests to B2
        shell: bash
        run: |
          set -euo pipefail
          upload=$(curl -fsS \
            -H "Authorization: ${B2_AUTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg bucketId "$B2_BUCKET_ID" '{bucketId:$bucketId}')" \
            "${B2_API_URL}/b2api/v2/b2_get_upload_url")
          B2_UPLOAD_URL=$(jq -r '.uploadUrl // empty' <<<"$upload")
          B2_UPLOAD_AUTH_TOKEN=$(jq -r '.authorizationToken // empty' <<<"$upload")
          test -n "$B2_UPLOAD_URL"
          test -n "$B2_UPLOAD_AUTH_TOKEN"
          : > backup-output/uploaded.tsv
          for file in backup-output/*.tar.gz backup-output/*.json; do
            sha1=$(sha1sum "$file" | cut -d' ' -f1)
            sha256=$(sha256sum "$file" | cut -d' ' -f1)
            key="repository-backup/$(basename "$file")"
            encoded=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")
            response=$(curl -fsS -X POST "$B2_UPLOAD_URL" \
              -H "Authorization: ${B2_UPLOAD_AUTH_TOKEN}" \
              -H "X-Bz-File-Name: ${encoded}" \
              -H 'Content-Type: application/octet-stream' \
              -H "X-Bz-Content-Sha1: ${sha1}" \
              -H "X-Bz-Info-sha256: ${sha256}" \
              --data-binary "@$file")
            file_id=$(jq -r '.fileId // empty' <<<"$response")
            test -n "$file_id"
            printf '%s\t%s\t%s\t%s\n' "$key" "$file_id" "$sha1" "$sha256" >> backup-output/uploaded.tsv
          done
          echo 'B2 upload: PASS'

      - name: Verify B2 objects by metadata and checksums
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key file_id local_sha1 local_sha256; do
            info=$(curl -fsS \
              -H "Authorization: ${B2_AUTH_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$(jq -cn --arg fileId "$file_id" '{fileId:$fileId}')" \
              "${B2_API_URL}/b2api/v2/b2_get_file_info")
            remote_sha1=$(jq -r '.contentSha1 // empty' <<<"$info")
            remote_sha256=$(jq -r '.fileInfo.sha256 // empty' <<<"$info")
            remote_size=$(jq -r '.contentLength // -1' <<<"$info")
            local_size=$(stat -c '%s' "backup-output/$(basename "$key")")
            test "$remote_sha1" = "$local_sha1" || { echo "SHA-1 mismatch: $key"; exit 1; }
            test "$remote_sha256" = "$local_sha256" || { echo "SHA-256 mismatch: $key"; exit 1; }
            test "$remote_size" = "$local_size" || { echo "Size mismatch: $key"; exit 1; }
            echo "verified: $key"
          done < backup-output/uploaded.tsv
          echo 'B2 remote metadata verification: PASS'

      - name: Verify restoration from every uploaded repository archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remote-restore
          while IFS=$'\t' read -r key file_id expected_sha1 expected_sha256; do
            case "$key" in
              repository-backup/*.tar.gz)
                filename=$(basename "$key")
                curl -fsS \
                  -H "Authorization: ${B2_AUTH_TOKEN}" \
                  "${B2_DOWNLOAD_URL}/b2api/v4/b2_download_file_by_id?fileId=${file_id}" \
                  -o "remote-restore/${filename}"
                actual_sha1=$(sha1sum "remote-restore/${filename}" | cut -d' ' -f1)
                actual_sha256=$(sha256sum "remote-restore/${filename}" | cut -d' ' -f1)
                test "$actual_sha1" = "$expected_sha1" || { echo "Remote restore SHA-1 mismatch: $key"; exit 1; }
                test "$actual_sha256" = "$expected_sha256" || { echo "Remote restore SHA-256 mismatch: $key"; exit 1; }
                rm -rf remote-restore/extracted
                mkdir -p remote-restore/extracted
                tar -xzf "remote-restore/${filename}" -C remote-restore/extracted
                repo_dir=$(find remote-restore/extracted -mindepth 1 -maxdepth 1 -type d -name '*.git' | head -n 1)
                test -n "$repo_dir"
                git -C "$repo_dir" fsck --full --no-dangling
                test -n "$(git -C "$repo_dir" rev-parse --verify refs/heads/main)"
                echo "remote restore verification: PASS: $key"
                ;;
            esac
          done < backup-output/uploaded.tsv
          echo 'remote B2 restore verification: PASS'

      - name: Write non-sensitive run summary
        shell: bash
        run: |
          {
            echo '### B2 repository backup'
            echo
            echo 'foundation + operations full Git mirrors were created.'
            echo 'Local Git integrity, B2 upload, remote SHA-1/SHA-256/size verification, and remote archive restore were checked.'
          } >> "$GITHUB_STEP_SUMMARY"
