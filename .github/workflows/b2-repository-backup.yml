name: B2 repository backup

on:
  schedule:
    # 02:00 IST = 20:30 UTC, inside the planned 01:00-09:00 overnight window.
    - cron: "30 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b2-repository-backup.yml'
      - 'backup/**'

permissions:
  contents: read

concurrency:
  group: b2-repository-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Mirror repositories to B2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      BACKUP_GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
      B2_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Verify backup credentials and tooling
        shell: bash
        run: |
          set -euo pipefail
          test -n "${B2_KEY_ID:-}" || { echo 'Missing B2_KEY_ID GitHub secret'; exit 1; }
          test -n "${B2_APPLICATION_KEY:-}" || { echo 'Missing B2_APPLICATION_KEY GitHub secret'; exit 1; }
          test -n "${B2_BUCKET:-}" || { echo 'Missing B2_BUCKET GitHub secret'; exit 1; }
          test -n "${BACKUP_GITHUB_TOKEN:-}" || { echo 'Missing BACKUP_GITHUB_TOKEN GitHub secret'; exit 1; }
          command -v git >/dev/null
          command -v python >/dev/null
          command -v aws >/dev/null || { echo 'AWS CLI is unavailable on the runner'; exit 1; }
          echo 'backup prerequisites: PASS'

      - name: Verify bucket-scoped B2 access without account-wide bucket listing
        shell: bash
        run: |
          set -euo pipefail
          aws s3api head-bucket \
            --bucket "$B2_BUCKET" \
            --endpoint-url "$B2_ENDPOINT"
          echo 'B2 bucket access: PASS'

      - name: Mirror both repositories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backup-work backup-output remote-restore
          mkdir -p backup-work backup-output remote-restore
          for repo in foundation operations; do
            git -c http.extraHeader="Authorization: Bearer ${BACKUP_GITHUB_TOKEN}" \
              clone --mirror "https://github.com/Z-Solo-King/${repo}.git" "backup-work/${repo}.git"
            git -C "backup-work/${repo}.git" fsck --full --no-dangling
            sha=$(git -C "backup-work/${repo}.git" rev-parse --verify refs/heads/main)
            refs=$(git -C "backup-work/${repo}.git" show-ref --head | wc -l)
            test -n "$sha" && test "$refs" -gt 0
            echo "${repo} mirror integrity: PASS (${sha}; ${refs} refs)"
          done

      - name: Create immutable archives and manifests
        shell: bash
        run: |
          set -euo pipefail
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          : > backup-output/uploaded.tsv
          for repo in foundation operations; do
            mirror="backup-work/${repo}.git"
            sha=$(git -C "$mirror" rev-parse --verify refs/heads/main)
            tree=$(git -C "$mirror" show -s --format=%T "$sha")
            refs=$(git -C "$mirror" show-ref --head | wc -l)
            archive="backup-output/${repo}-${sha}-${timestamp}.tar.gz"
            tar -C backup-work -czf "$archive" "${repo}.git"
            sha256=$(sha256sum "$archive" | cut -d' ' -f1)
            size=$(stat -c '%s' "$archive")
            manifest="backup-output/${repo}-${sha}-${timestamp}.json"
            python - "$manifest" "$repo" "$sha" "$tree" "$timestamp" "$(basename "$archive")" "$sha256" "$size" "$refs" <<'PY'
import json
import sys

path, repo, commit, tree, created, archive, sha256, size, refs = sys.argv[1:]
record = {
    "schema": "repository-backup/v2",
    "repository": f"Z-Solo-King/{repo}",
    "visibility": "public" if repo == "foundation" else "private",
    "ref": "main",
    "commit": commit,
    "tree": tree,
    "created_at": created,
    "archive": archive,
    "sha256": sha256,
    "size_bytes": int(size),
    "ref_count": int(refs),
    "restore_test": {
        "local_git_fsck": True,
        "main_ref_verified": True,
        "remote_b2_restore_verified": False,
    },
}
with open(path, "w", encoding="utf-8") as handle:
    json.dump(record, handle, sort_keys=True, separators=(",", ":"))
PY
            printf '%s\t%s\t%s\t%s\n' \
              "repository-backup/$(basename "$archive")" "$archive" "$sha256" "$size" \
              >> backup-output/uploaded.tsv
            printf '%s\t%s\t%s\t%s\n' \
              "repository-backup/$(basename "$manifest")" "$manifest" "$(sha256sum "$manifest" | cut -d' ' -f1)" "$(stat -c '%s' "$manifest")" \
              >> backup-output/uploaded.tsv
            echo "${repo} archive + manifest: PASS"
          done

      - name: Upload archives and manifests to B2
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key file _sha256 _size; do
            aws s3api put-object \
              --bucket "$B2_BUCKET" \
              --key "$key" \
              --body "$file" \
              --endpoint-url "$B2_ENDPOINT" \
              --content-type application/octet-stream \
              >/dev/null
            echo "uploaded: $key"
          done < backup-output/uploaded.tsv
          echo 'B2 upload: PASS'

      - name: Verify uploaded object metadata and size
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key file expected_sha256 expected_size; do
            metadata=$(aws s3api head-object \
              --bucket "$B2_BUCKET" \
              --key "$key" \
              --endpoint-url "$B2_ENDPOINT")
            remote_size=$(python - "$metadata" <<'PY'
import json
import sys
print(json.loads(sys.argv[1])["ContentLength"])
PY
)
            test "$remote_size" = "$expected_size" || { echo "Size mismatch: $key"; exit 1; }
            local_sha256=$(sha256sum "$file" | cut -d' ' -f1)
            test "$local_sha256" = "$expected_sha256" || { echo "Local SHA-256 changed: $key"; exit 1; }
            echo "verified: $key"
          done < backup-output/uploaded.tsv
          echo 'B2 object metadata/size verification: PASS'

      - name: Verify remote restore from every repository archive
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key _file expected_sha256 _size; do
            case "$key" in
              repository-backup/*.tar.gz)
                name=$(basename "$key")
                aws s3api get-object \
                  --bucket "$B2_BUCKET" \
                  --key "$key" \
                  "remote-restore/$name" \
                  --endpoint-url "$B2_ENDPOINT" \
                  >/dev/null
                actual_sha256=$(sha256sum "remote-restore/$name" | cut -d' ' -f1)
                test "$actual_sha256" = "$expected_sha256" || { echo "Remote SHA-256 mismatch: $key"; exit 1; }
                rm -rf remote-restore/extracted
                mkdir -p remote-restore/extracted
                tar -xzf "remote-restore/$name" -C remote-restore/extracted
                repo_dir=$(find remote-restore/extracted -mindepth 1 -maxdepth 1 -type d -name '*.git' | head -n 1)
                test -n "$repo_dir"
                git -C "$repo_dir" fsck --full --no-dangling
                test -n "$(git -C "$repo_dir" rev-parse --verify refs/heads/main)"
                echo "remote restore: PASS: $name"
                ;;
            esac
          done < backup-output/uploaded.tsv
          echo 'remote B2 restore verification: PASS'

      - name: Write non-sensitive run summary
        run: |
          {
            echo '### B2 repository backup'
            echo
            echo 'Foundation and Operations mirrors were created.'
            echo 'Bucket-scoped B2 S3 upload, object metadata/size verification, SHA-256 restore verification, extraction, and Git integrity were checked.'
          } >> "$GITHUB_STEP_SUMMARY"
