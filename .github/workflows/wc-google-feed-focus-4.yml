name: WooCommerce Google Feed Focus 4

on:
  push:
    branches:
      - fix/wc-google-feed-focus-4-20260929
    paths:
      - ".github/workflows/wc-google-feed-focus-4.yml"
      - "tools/woocommerce_32_cross_runner_feed_recovery.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wc-google-feed-focus-4.yml"
      - "tools/woocommerce_32_cross_runner_feed_recovery.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Extract ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        site:
          - "Ads Store"
          - ithunt
          - kccomputers
          - "KRG KART"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Run current WooCommerce recovery
        run: node tools/woocommerce_32_cross_runner_feed_recovery.mjs --site "$SITE"
        env:
          SITE: ${{ matrix.site }}

      - name: Upload focused extraction
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wc-google-feed-focus-${{ matrix.site }}
          path: out/woocommerce-32-cross-runner/
          if-no-files-found: warn
          retention-days: 14
