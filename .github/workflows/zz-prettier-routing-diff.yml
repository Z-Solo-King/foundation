name: Temporary routing Prettier diff

on:
  push:
    branches:
      - fix/live-provider-crossfire-automation-routing-2026-10-03

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/live-provider-crossfire-automation-routing-2026-10-03
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Show exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.9 --write tools/autonomous_engineering_supervisor.mjs tests/autonomous_engineering_supervisor.test.mjs
          git diff -- tools/autonomous_engineering_supervisor.mjs tests/autonomous_engineering_supervisor.test.mjs
