name: Temporary release-quality formatter
on:
  push:
    branches:
      - fix/workflow-regressions-current-main-2026-10-03
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Emit Prettier-normalized workflow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier --write .github/workflows/release-quality-regression.yml
          echo '---BEGIN_FORMATTED_FILE---'
          base64 -w0 .github/workflows/release-quality-regression.yml
          echo
          echo '---END_FORMATTED_FILE---'