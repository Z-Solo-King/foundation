name: Temporary formatting repair
on:
  push:
    branches:
      - fix/workflow-regressions-current-main-2026-10-03
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Format changed workflow files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          files="$(git diff --name-only origin/main...HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | tr '\n' ' ')"
          if [ -n "$files" ]; then
            npx --yes prettier --write $files
          fi
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize workflow formatting"
          git push