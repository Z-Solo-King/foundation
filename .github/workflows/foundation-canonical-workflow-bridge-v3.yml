name: Foundation canonical workflow bridge v3

on:
  workflow_dispatch:
    inputs:
      target:
        description: Canonical Foundation acceptance target
        required: true
        type: choice
        options:
          - main-push-actions-control-plane-probe-v2.yml
          - nightly-multi-agent-research-v2.yml
        default: main-push-actions-control-plane-probe-v2.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Canonical bridge proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate target registration
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          target_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET}")"
          state="$(jq -r '.state // empty' <<<"$target_json")"
          test -n "$state"
          echo "target=$TARGET state=$state"
          case "$state" in active|disabled_inactivity|disabled_manually) ;; *) exit 1 ;; esac

      - name: Dispatch target workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          FOUNDATION_REF: main
        run: |
          set -euo pipefail
          expected_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${FOUNDATION_REF}" --jq '.object.sha')"
          test "$expected_sha" = "${GITHUB_SHA}"
          dispatch_epoch="$(date -u +%s)"
          payload="$(jq -nc --arg ref "$FOUNDATION_REF" '{ref:$ref}')"
          dispatch_status=$(curl -sS -o "$RUNNER_TEMP/target-dispatch-response.json" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET}/dispatches")
          echo "target dispatch -> HTTP ${dispatch_status}"
          test "$dispatch_status" = "204"

          target_run_id=""
          for _ in {1..24}; do
            target_runs="$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET}/runs?event=workflow_dispatch&branch=${FOUNDATION_REF}&per_page=20")"
            target_run_id="$(jq -r --argjson epoch "$dispatch_epoch" --arg sha "$expected_sha" '.workflow_runs[] | select(.head_sha==$sha) | select((.created_at|fromdateiso8601) >= ($epoch-30)) | .id' <<<"$target_runs" | head -n1)"
            [[ -n "$target_run_id" ]] && break
            sleep 5
          done
          test -n "$target_run_id"

          job_count=0
          for _ in {1..12}; do
            jobs_json="$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${target_run_id}/jobs?per_page=100")"
            job_count="$(jq '.total_count // (.jobs | length) // 0' <<<"$jobs_json")"
            [[ "$job_count" -gt 0 ]] && break
            sleep 5
          done
          test "$job_count" -gt 0

          mkdir -p .runtime
          jq -n \
            --arg target "$TARGET" \
            --arg sha "$expected_sha" \
            --argjson target_run "$target_run_id" \
            --argjson jobs "$job_count" \
            '{schema:"foundation-workflow-dispatch-bridge-receipt/v2",target:$target,foundation_sha:$sha,target_run_id:$target_run,target_job_count:$jobs,status:"success"}' \
            > .runtime/bridge-receipt.json

      - name: Upload bridge receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-bridge-v3-receipt
          path: .runtime/bridge-receipt.json
          if-no-files-found: error
          retention-days: 30
