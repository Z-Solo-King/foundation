name: Cleanup accidental public feed release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-public-feed-release.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete public feed release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete wc-google-feed-latest --repo "$GH_REPO" --yes || true
          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/wc-google-feed-latest" || true
