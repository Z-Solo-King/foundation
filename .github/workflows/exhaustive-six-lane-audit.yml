name: Exhaustive six-lane repository audit
# Scanner revision: 2026-09-22 mapper/extractor cross-audit v5 — multi-offer, digest, browser resource/page-budget and non-finite numeric invariants
# The audit is report-only at the workflow boundary; generated patches remain artifacts for reviewed promotion.
# Mutable issue inventory is sourced from Operations main; runtime/source scans may use an explicit candidate ref.

on:
  pull_request:
    paths:
      - "**"
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Optional Operations branch or immutable SHA; blank resolves audit branch when present, otherwise main
        required: false
        default: ""
        type: string
      auto_fix:
        description: Apply only targeted mechanical safe fixes to files implicated by deterministic findings
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: foundation-exhaustive-audit-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Six-lane exhaustive audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Foundation audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: foundation-repo

      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
          permission-issues: read

      - name: Resolve Operations audit revision
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_REF: ${{ inputs.operations_ref }}
        with:
          github-token: ${{ steps.operations-app.outputs.token }}
          script: |
            const requested = (process.env.REQUESTED_REF || "").trim();
            if (requested) {
              core.setOutput("ref", requested);
              return;
            }
            // Never infer a cross-repository branch from the Foundation PR branch name.
            // Default to Operations main; an explicit operations_ref may override it.
            core.setOutput("ref", "main");

      - name: Checkout Operations runtime/source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ steps.resolve.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations-repo

      - name: Snapshot live open issues at audit start
        id: issue-snapshot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.operations-app.outputs.token }}
          script: |
            const fs = require("fs");
            const capturedAt = new Date().toISOString();
            const actual = [];
            for (const repo of ["foundation", "operations"]) {
              const issues = await github.paginate(
                github.rest.issues.listForRepo,
                { owner: "Z-Solo-King", repo, state: "open", per_page: 100 }
              );
              for (const issue of issues) {
                if (!issue.pull_request) {
                  actual.push({ repo, number: issue.number, title: issue.title });
                }
              }
            }
            actual.sort((a, b) => (a.repo + "#" + a.number).localeCompare(b.repo + "#" + b.number));
            fs.mkdirSync(".runtime/exhaustive-audit", { recursive: true });
            fs.writeFileSync(
              ".runtime/exhaustive-audit/live_open_issues_snapshot.json",
              JSON.stringify({
                schema: "live-open-issue-snapshot/v1",
                captured_at: capturedAt,
                source: "live GitHub issue search",
                actual,
              }, null, 2) + "\n",
              "utf8"
            );
            core.setOutput("captured_at", capturedAt);
            core.setOutput("count", String(actual.length));

      - name: Fetch live Operations issue register from main
        id: issue-register
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.operations-app.outputs.token }}
          script: |
            const fs = require("fs");
            const path = "operations-repo/benchmark/polyglot/current_open_issue_inventory.json";
            const response = await github.rest.repos.getContent({
              owner: "Z-Solo-King",
              repo: "operations",
              path: "benchmark/polyglot/current_open_issue_inventory.json",
              ref: "main",
            });
            if (Array.isArray(response.data) || response.data.encoding !== "base64") {
              core.setFailed("Operations live issue inventory is not a regular base64 file on main");
              return;
            }
            const registerText = Buffer.from(response.data.content, "base64").toString("utf8");
            const register = JSON.parse(registerText);
            if (register.source !== "live GitHub issue search") {
              core.setFailed("Operations issue inventory does not identify live GitHub issue search as its source");
              return;
            }
            fs.mkdirSync("operations-repo/benchmark/polyglot", { recursive: true });
            fs.writeFileSync(path, registerText.endsWith("\n") ? registerText : registerText + "\n", "utf8");
            fs.mkdirSync(".runtime/exhaustive-audit", { recursive: true });
            fs.writeFileSync(
              ".runtime/exhaustive-audit/issue_register_provenance.json",
              JSON.stringify({
                schema: "live-open-issue-register-provenance/v1",
                source_repository: "Z-Solo-King/operations",
                source_ref: "main",
                source_path: "benchmark/polyglot/current_open_issue_inventory.json",
                source_blob_sha: response.data.sha,
                expected_open_issue_count: register.expected_open_issue_count,
              }, null, 2) + "\n",
              "utf8"
            );
            core.setOutput("sha", response.data.sha);

      - name: Verify live open-issue register
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.operations-app.outputs.token }}
          script: |
            const fs = require("fs");
            fs.mkdirSync(".runtime/exhaustive-audit", { recursive: true });
            const inventoryPath = "operations-repo/benchmark/polyglot/current_open_issue_inventory.json";
            const register = JSON.parse(fs.readFileSync(inventoryPath, "utf8"));
            const snapshot = JSON.parse(
              fs.readFileSync(".runtime/exhaustive-audit/live_open_issues_snapshot.json", "utf8")
            );
            const expected = [];
            for (const [repo, rows] of Object.entries(register.repositories || {})) {
              for (const row of rows) {
                expected.push({ repo, number: Number(row.number), title: row.title });
              }
            }
            const actual = Array.isArray(snapshot.actual) ? snapshot.actual : [];
            const key = x => x.repo + "#" + x.number;
            const exp = new Map(expected.map(x => [key(x), x]));
            const act = new Map(actual.map(x => [key(x), x]));
            const unregisteredAtSnapshot = [...act.keys()].filter(k => !exp.has(k));
            const registeredNotInSnapshot = [...exp.keys()].filter(k => !act.has(k));
            const titleMismatch = [...act.keys()]
              .filter(k => exp.has(k) && exp.get(k).title !== act.get(k).title)
              .map(k => ({ key: k, expected: exp.get(k).title, actual: act.get(k).title }));
            fs.writeFileSync(
              ".runtime/exhaustive-audit/live_open_issues.json",
              JSON.stringify({
                expected,
                actual,
                unregistered_at_snapshot: unregisteredAtSnapshot,
                registered_not_in_snapshot: registeredNotInSnapshot,
                titleMismatch,
                snapshot_captured_at: snapshot.captured_at,
                snapshot_source: snapshot.source,
                register_expected_open_issue_count: register.expected_open_issue_count,
                snapshot_open_issue_count: actual.length,
              }, null, 2) + "\n",
              "utf8"
            );
            if (unregisteredAtSnapshot.length || titleMismatch.length) {
              core.setFailed(JSON.stringify({
                unregisteredAtSnapshot,
                registeredNotInSnapshot,
                titleMismatch,
                registerExpectedCount: register.expected_open_issue_count,
                snapshotCount: actual.length,
                snapshotCapturedAt: snapshot.captured_at,
              }));
            }

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: operations-repo/requirements.txt

      - name: Install Operations package
        working-directory: operations-repo
        run: python -m pip install --disable-pip-version-check -e . --no-deps

      - name: Clean audit-generated package metadata
        run: rm -rf operations-repo/*.egg-info foundation-repo/*.egg-info

      - name: Prepare audit artifact directory
        run: mkdir -p .runtime/exhaustive-audit

      - name: Record scanned revisions
        run: |
          printf 'foundation=%s\noperations=%s\nissue_register=%s\n' "$(git -C foundation-repo rev-parse HEAD)" "$(git -C operations-repo rev-parse HEAD)" "${{ steps.issue-register.outputs.sha }}" > .runtime/exhaustive-audit/scanned_revisions.txt

      - name: Compile exhaustive audit tools
        working-directory: operations-repo
        run: |
          python -m py_compile tools/exhaustive_audit.py
          python -m py_compile tools/mapper_extractor_cross_audit.py

      - name: Run mapper/extractor cross-audit
        env:
          PYTHONPATH: ${{ github.workspace }}/operations-repo
        run: |
          set -euo pipefail
          mkdir -p .runtime/exhaustive-audit/mapper-extractor
          python operations-repo/tools/mapper_extractor_cross_audit.py             --foundation "${{ github.workspace }}/foundation-repo"             --operations "${{ github.workspace }}/operations-repo"             --output "${{ github.workspace }}/.runtime/exhaustive-audit/mapper-extractor/receipt.json"

      - name: Test exhaustive audit contract
        working-directory: operations-repo
        run: python -m unittest -v tests.test_exhaustive_audit_contract

      - name: Run six concurrent lanes
        env:
          AUTO_FIX_INPUT: ${{ inputs.auto_fix }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PYTHONPATH: ${{ github.workspace }}/operations-repo
        run: |
          set -euo pipefail
          args=(
            --foundation "${GITHUB_WORKSPACE}/foundation-repo"
            --operations "${GITHUB_WORKSPACE}/operations-repo"
            --surface-map "${GITHUB_WORKSPACE}/operations-repo/benchmark/polyglot/open_issue_surface_map.json"
            --issue-inventory "${GITHUB_WORKSPACE}/operations-repo/benchmark/polyglot/current_open_issue_inventory.json"
            --output-dir "${GITHUB_WORKSPACE}/.runtime/exhaustive-audit"
          )
          if [[ "${AUTO_FIX_INPUT}" == "true" || "${HEAD_BRANCH}" == exhaustive-audit/* ]]; then args+=(--auto-fix); fi
          python operations-repo/tools/exhaustive_audit.py "${args[@]}"

      - name: Generate Operations patch artifact
        if: always()
        run: |
          set +e
          git -C operations-repo diff --binary > .runtime/exhaustive-audit/operations-autofix.patch
          git -C foundation-repo diff --binary > .runtime/exhaustive-audit/foundation-autofix.patch
          git -C operations-repo status --short > .runtime/exhaustive-audit/operations-status.txt
          git -C foundation-repo status --short > .runtime/exhaustive-audit/foundation-status.txt
          exit 0

      - name: Upload exhaustive audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exhaustive-six-lane-audit
          path: .runtime/exhaustive-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Print final summary
        if: always()
        run: |
          if [[ -f .runtime/exhaustive-audit/SUMMARY.json ]]; then cat .runtime/exhaustive-audit/SUMMARY.json; else echo "SUMMARY.json was not produced"; fi