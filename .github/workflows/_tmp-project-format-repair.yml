name: Temporary GitHub workspace formatter
on:
  push:
    branches:
      - feat/chatbot-github-ui-2026-10-03
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Format changed files
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --diff-filter=ACMRTUXB --name-only HEAD^ -- '*.yml' '*.yaml' '*.md' '*.json' '*.js' '*.mjs' '*.ts' '*.tsx' '*.css' '*.html' | tr '\n' ' ')"
          if [ -n "$files" ]; then npx --yes prettier --write $files; fi
          python -m pip install --disable-pip-version-check ruff==0.16.9
          pyfiles="$(git diff --diff-filter=ACMRTUXB --name-only HEAD^ -- '*.py' | tr '\n' ' ')"
          if [ -n "$pyfiles" ]; then ruff format $pyfiles; fi
      - name: Remove formatter and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-project-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize GitHub workspace formatting"
          git push