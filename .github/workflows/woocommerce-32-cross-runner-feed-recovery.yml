name: WC 32 Cross Runner Feed Recovery

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wc-32-cross-runner-latest
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.os }} / ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - {slug: ads-store, site: "Ads Store"}
          - {slug: ithunt, site: "ithunt"}
          - {slug: kccomputers, site: "kccomputers"}
          - {slug: krg-kart, site: "KRG KART"}
          - {slug: pc-kumar-infotech, site: "PC Kumar Infotech"}
          - {slug: pchubshop, site: "PCHubShop"}
          - {slug: scl-gaming, site: "SCL Gaming"}
          - {slug: variety-infotech, site: "Variety Infotech"}
          - {slug: moskeys, site: "Moskeys"}
          - {slug: theproaudio, site: "Theproaudio"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24"}
      - name: Run cross-runner public feed recovery
        env:
          TARGET_SITE: ${{ matrix.site }}
        shell: bash
        run: |
          node tools/woocommerce_32_cross_runner_feed_recovery.mjs --site "$TARGET_SITE"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wc32-${{ matrix.slug }}-${{ matrix.os }}
          path: out/woocommerce-32-cross-runner/
          retention-days: 30
