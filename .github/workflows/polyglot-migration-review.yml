name: Polyglot migration review

on:
  push:
    branches: [main]
    paths:
      - "polyglot/**"
      - "benchmark/polyglot/**"
      - "experiments/rust_*"
      - "experiments/go_http_fanout/**"
      - "worker.py"
      - "scripts/research_worker_proxy.py"
      - ".github/workflows/polyglot-migration-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "polyglot/**"
      - "benchmark/polyglot/**"
      - "experiments/rust_*"
      - "experiments/go_http_fanout/**"
      - "worker.py"
      - "scripts/research_worker_proxy.py"
      - ".github/workflows/polyglot-migration-review.yml"
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Optional immutable Operations revision; blank uses current main SHA resolved at run start
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  resolve_operations_ref:
    name: Resolve immutable Operations revision
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Resolve Operations ref
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.operations-app.outputs.token }}
          script: |
            const requested = (context.payload.inputs?.operations_ref || "").trim();
            if (requested) {
              core.setOutput("ref", requested);
              return;
            }
            const response = await github.rest.repos.getBranch({
              owner: "Z-Solo-King",
              repo: "operations",
              branch: "main",
            });
            core.setOutput("ref", response.data.commit.sha);

  private_entry_ts:
    needs: resolve_operations_ref
    name: P1 private entry — TypeScript edge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout pinned Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Execute private entry TypeScript lane
        working-directory: operations/polyglot/edge-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts
          npx --yes -p typescript@7.0.2 tsc --noEmit -p tsconfig.json
          npm test
      - name: Emit lane receipt
        run: |
          mkdir -p .runtime/four-lane
          printf '%s\n' '{"schema":"polyglot-lane-receipt/v1","lane":"P1_PRIVATE_ENTRY","language":"typescript","direction":"entry_to_core","status":"pass","operations_ref":"${{ needs.resolve_operations_ref.outputs.ref }}"}' > .runtime/four-lane/private-entry-ts.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: four-lane-private-entry-ts
          path: .runtime/four-lane/private-entry-ts.json
          retention-days: 30

  private_leaf_rust:
    needs: resolve_operations_ref
    name: P2 private leaf — Rust candidates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - rust_text_normalization
          - rust_html_kernel
          - rust_jsonld_product
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout pinned Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
      - name: Execute private Rust leaf candidate
        working-directory: operations
        shell: bash
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            rust_text_normalization) cargo test --manifest-path experiments/rust_text_normalization/Cargo.toml ;;
            rust_html_kernel) cargo test --manifest-path experiments/rust_html_kernel/Cargo.toml ;;
            rust_jsonld_product) cargo test --manifest-path benchmark/polyglot/rust_jsonld_product/Cargo.toml ;;
            *) echo "unknown candidate: $CANDIDATE"; exit 2 ;;
          esac
      - name: Emit lane receipt
        run: |
          mkdir -p .runtime/four-lane
          printf '%s\n' '{"schema":"polyglot-lane-receipt/v1","lane":"P2_PRIVATE_LEAF","language":"rust","direction":"leaf_to_core","candidate":"${{ matrix.candidate }}","status":"pass","operations_ref":"${{ needs.resolve_operations_ref.outputs.ref }}"}' > .runtime/four-lane/private-leaf-rust-${{ matrix.candidate }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: four-lane-private-leaf-rust-${{ matrix.candidate }}
          path: .runtime/four-lane/private-leaf-rust-${{ matrix.candidate }}.json
          retention-days: 30

  public_entry_ts:
    name: P3 public entry — TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Execute public TypeScript edge lane
        working-directory: polyglot/edge-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm test
      - name: Execute public frontend-state lane
        working-directory: polyglot/frontend-state
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm test
      - name: Emit lane receipt
        run: |
          mkdir -p .runtime/four-lane
          printf '%s\n' '{"schema":"polyglot-lane-receipt/v1","lane":"P3_PUBLIC_ENTRY","language":"typescript","direction":"entry_to_core","status":"pass","foundation_ref":"$GITHUB_SHA"}' > .runtime/four-lane/public-entry-ts.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: four-lane-public-entry-ts
          path: .runtime/four-lane/public-entry-ts.json
          retention-days: 30

  public_leaf_rust:
    needs: resolve_operations_ref
    name: P4 public leaf — Rust candidates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - rust_url_identity
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout pinned Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Checkout Foundation at current lane revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: foundation
          ref: ${{ github.sha }}
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Execute public Rust leaf candidate
        working-directory: foundation
        shell: bash
        env:
          CANDIDATE: ${{ matrix.candidate }}
          PYTHONPATH: ${{ github.workspace }}/foundation:${{ github.workspace }}/operations
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            rust_url_identity) python tools/verify_rust_url_identity_parity.py && cargo test --manifest-path ../operations/benchmark/polyglot/rust_url_identity/Cargo.toml ;;
            rust_html_kernel) cargo test --manifest-path ../operations/experiments/rust_html_kernel/Cargo.toml ;;
            *) echo "unknown candidate: $CANDIDATE"; exit 2 ;;
          esac
      - name: Emit lane receipt
        run: |
          mkdir -p .runtime/four-lane
          printf '%s\n' '{"schema":"polyglot-lane-receipt/v1","lane":"P4_PUBLIC_LEAF","language":"rust","direction":"leaf_to_core","candidate":"${{ matrix.candidate }}","status":"pass","foundation_ref":"$GITHUB_SHA","operations_ref":"${{ needs.resolve_operations_ref.outputs.ref }}"}' > .runtime/four-lane/public-leaf-rust-${{ matrix.candidate }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: four-lane-public-leaf-rust-${{ matrix.candidate }}
          path: .runtime/four-lane/public-leaf-rust-${{ matrix.candidate }}.json
          retention-days: 30

  go_tooling:
    needs: resolve_operations_ref
    name: P5 Go fan-out tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout pinned Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25"
      - name: Execute bounded Go fan-out suite
        working-directory: operations/experiments/go_http_fanout
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go test -race ./...
          go vet ./...
      - name: Emit lane receipt
        run: |
          mkdir -p .runtime/four-lane
          printf '%s\n' '{"schema":"polyglot-lane-receipt/v1","lane":"P5_GO_TOOLING","language":"go","direction":"fanout_tooling","status":"pass","operations_ref":"${{ needs.resolve_operations_ref.outputs.ref }}"}' > .runtime/four-lane/go-tooling.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: four-lane-go-tooling
          path: .runtime/four-lane/go-tooling.json
          retention-days: 30

  four_lane_gate:
    name: Five-lane convergence gate
    needs: [private_entry_ts, private_leaf_rust, public_entry_ts, public_leaf_rust, go_tooling]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all five lanes to pass
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.private_entry_ts.result }}" = success
          test "${{ needs.private_leaf_rust.result }}" = success
          test "${{ needs.public_entry_ts.result }}" = success
          test "${{ needs.public_leaf_rust.result }}" = success
          test "${{ needs.go_tooling.result }}" = success

  review:
    needs: [resolve_operations_ref, four_lane_gate]
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Cross-language migration review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPERATIONS_REF: ${{ needs.resolve_operations_ref.outputs.ref }}
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: operations/requirements.txt

      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout immutable Operations review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ env.OPERATIONS_REF }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Verify immutable Operations revision
        working-directory: operations
        env:
          EXPECTED: ${{ env.OPERATIONS_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Install Operations package
        working-directory: operations
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate Operations migration registry
        working-directory: operations
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.runtime"
          python tools/validate_polyglot_registry.py --repo-root "$GITHUB_WORKSPACE/operations" > "$GITHUB_WORKSPACE/.runtime/polyglot-registry-integrity.json"
          cat "$GITHUB_WORKSPACE/.runtime/polyglot-registry-integrity.json"

      - name: Validate current five-lane migration grid
        working-directory: operations
        shell: python
        run: |
          import json
          from pathlib import Path

          grid = json.loads(
              Path("docs/POLYGLOT_MIGRATION_EXECUTION_GRID_2026-09-28.json").read_text(encoding="utf-8")
          )
          assert grid["schema"] == "polyglot-migration-execution-grid/v1"
          lanes = {row["id"]: row for row in grid["lanes"]}
          expected = {
              "P1_PRIVATE_ENTRY": ("typescript", "entry_to_core"),
              "P2_PRIVATE_LEAF": ("rust", "leaf_to_core"),
              "P3_PUBLIC_ENTRY": ("typescript", "entry_to_core"),
              "P4_PUBLIC_LEAF": ("rust", "leaf_to_core"),
              "P5_TOOLING_FANOUT": ("go", "tooling_fanout"),
          }
          assert set(lanes) == set(expected)
          assert grid["orchestration"]["active_lanes"] == 5
          for lane_id, (language, direction) in expected.items():
              assert lanes[lane_id]["primary_language"] == language
              assert lanes[lane_id]["direction"] == direction
          assert grid["authority_rules"]["new_candidate_freeze"] is True
          assert grid["authority_rules"]["promotion_authority"] == "single_existing_authority"
          print(json.dumps({"schema":grid["schema"],"active_lanes":sorted(lanes)}, sort_keys=True))

      - name: Setup Node for TypeScript migration evidence
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate TypeScript edge HTTP and SSE runtime
        working-directory: operations/polyglot/edge-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm test
      - name: Run TypeScript observation contract differential
        working-directory: operations/polyglot/observation-contract-strict
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm test
          mkdir -p .runtime
          npm run differential
          npm run differential:python
          npm run differential:compare
          python - <<'PY'
          import json
          from pathlib import Path

          ts = [json.loads(line) for line in Path(".runtime/ts.json").read_text(encoding="utf-8").splitlines() if line]
          py = [json.loads(line) for line in Path(".runtime/python.json").read_text(encoding="utf-8").splitlines() if line]
          assert len(ts) == 32 and len(py) == 32
          assert {row["id"] for row in ts} == {row["id"] for row in py}
          receipt = {
              "schema": "observation-contract-differential/v1",
              "candidate": "typescript-observation-contract-strict",
              "case_count": len(ts),
              "typecheck": True,
              "tests": True,
              "differential": True,
              "exact_compare": True,
          }
          output = Path(__import__("os").environ["GITHUB_WORKSPACE"]) / ".runtime" / "observation-contract" / "receipt.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload TypeScript observation contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: observation-contract-differential
          path: .runtime/observation-contract/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate Operations migration evidence claims
        working-directory: operations
        run: |
          set -euo pipefail
          python tools/validate_migration_evidence.py
          python tools/validate_polyglot_registry.py --repo-root "$GITHUB_WORKSPACE/operations"

      - name: Run TypeScript observation contract benchmark
        working-directory: operations/polyglot/observation-contract-strict
        shell: bash
        run: |
          set -euo pipefail
          BENCHMARK_ITERATIONS=200 npm run benchmark

      - name: Upload TypeScript observation contract benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: observation-contract-benchmark
          path: operations/polyglot/observation-contract-strict/.runtime/benchmark.json
          if-no-files-found: error
          retention-days: 30

      - name: Run TypeScript acquisition planner differential
        working-directory: operations/polyglot/acquisition-planner
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm test
          npm run differential
          npm run differential:python
          npm run differential:compare
          BENCHMARK_ITERATIONS=200 npm run benchmark
          mkdir -p "$GITHUB_WORKSPACE/.runtime/typescript-acquisition-planner"
          cp .runtime/differential-receipt.json "$GITHUB_WORKSPACE/.runtime/typescript-acquisition-planner/differential-receipt.json"
          cp .runtime/benchmark.json "$GITHUB_WORKSPACE/.runtime/typescript-acquisition-planner/benchmark.json"

      - name: Validate TypeScript acquisition planner evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path(".runtime/typescript-acquisition-planner")
          differential = json.loads((root / "differential-receipt.json").read_text(encoding="utf-8"))
          benchmark = json.loads((root / "benchmark.json").read_text(encoding="utf-8"))

          assert differential["schema"] == "typescript-acquisition-planner-differential/v1"
          assert differential["candidate"] == "typescript-acquisition-planner"
          assert differential["authority"] == "python-reference"
          assert differential["case_count"] == 32
          assert differential["exact_match"] is True
          assert benchmark["schema"] == "typescript-acquisition-planner-benchmark/v1"
          assert benchmark["case_count"] == 32
          assert benchmark["iterations"] == 200

      - name: Upload TypeScript acquisition planner evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typescript-acquisition-planner-evidence
          path: .runtime/typescript-acquisition-planner/
          if-no-files-found: error
          retention-days: 30

      - name: Run TypeScript public endpoint discovery differential
        working-directory: operations/polyglot/public-endpoint-discovery
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm test
          npm run differential
          npm run differential:python
          npm run differential:compare
          npm run benchmark

          mkdir -p "$GITHUB_WORKSPACE/.runtime/typescript-public-endpoint-discovery"
          cp .runtime/differential-receipt.json "$GITHUB_WORKSPACE/.runtime/typescript-public-endpoint-discovery/differential-receipt.json"
          cp .runtime/benchmark.json "$GITHUB_WORKSPACE/.runtime/typescript-public-endpoint-discovery/benchmark.json"

      - name: Validate TypeScript public endpoint discovery evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path(".runtime/typescript-public-endpoint-discovery")
          differential = json.loads((root / "differential-receipt.json").read_text(encoding="utf-8"))
          benchmark = json.loads((root / "benchmark.json").read_text(encoding="utf-8"))

          assert differential["schema"] == "typescript-public-endpoint-discovery-differential/v1"
          assert differential["candidate"] == "typescript-public-endpoint-discovery"
          assert differential["authority"] == "python-reference"
          assert differential["case_count"] == 32
          assert differential["exact_match"] is True
          assert benchmark["schema"] == "typescript-public-endpoint-discovery-benchmark/v1"
          assert benchmark["case_count"] == 32
          assert benchmark["repeats"] == 3

      - name: Upload TypeScript public endpoint discovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typescript-public-endpoint-discovery-evidence
          path: .runtime/typescript-public-endpoint-discovery/
          if-no-files-found: error
          retention-days: 30

      - name: Run migration review
        env:
          PYTHONPATH: ${{ github.workspace }}/operations
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python operations/private/multi_agent/migration_review.py \
            --foundation "$GITHUB_WORKSPACE" \
            --operations "$GITHUB_WORKSPACE/operations" \
            --matrix "$GITHUB_WORKSPACE/benchmark/polyglot/migration_matrix_40.json" \
            --output .runtime/polyglot-migration-review.json

      - name: Validate migration review
        shell: python
        run: |
          import json
          from pathlib import Path
          receipt = json.loads(Path(".runtime/polyglot-migration-review.json").read_text(encoding="utf-8"))
          assert receipt["schema"] == "nightly-migration-review/v1"
          assert receipt["matrix"]["case_count"] == 40
          assert receipt["matrix"]["agent_counts"] == [1, 2, 4, 8]
          assert receipt["matrix"]["execution_modes"] == ["serial", "parallel"]
          assert receipt["matrix"]["repeats"] == 3
          assert receipt["capacity_sweep"]["cases"] == 24
          assert receipt["capacity_sweep"]["all_cases_completed"] is True
          assert len(receipt["language_review"]) == 40
          assert len(receipt["polyglot_audit"]["language_scoreboard"]) == 10
          assert receipt["polyglot_audit"]["project"]["migration_candidates"] >= 0

      - name: Upload machine-readable review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: polyglot-migration-review
          path: .runtime/polyglot-migration-review.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest migration review
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .runtime/polyglot-migration-review.json
