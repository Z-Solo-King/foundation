name: Temporary Heroic Pages network probe # postfix-browser-regression

on:
  push:
    branches: [probe/heroic-pages-live-2026-10-02]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Pages endpoint
        shell: bash
        run: |
          set -euo pipefail
          base="https://heroic-ai.pages.dev"
          curl -fsS --max-time 20 -D /tmp/root.headers -o /tmp/root.html "$base/"
          grep -qi '^content-type: text/html' /tmp/root.headers
          grep -q '<title>Heroic AI' /tmp/root.html
          for asset in ./styles.css ./ui_overrides.css ./dashboard.css ./frontend_state.js ./generated/feedback.js ./generated/lifecycle.js ./markdown_renderer.js ./chat_store.js ./chat_view.js ./workspace_view.js ./composer.js ./app.js ./dashboard.js ./generated/ui_guards.js ./lifecycle_controller.js ./generated/lifecycle_queue_controls.js ./feedback_bridge.js ./ux_enhancements.js; do
            curl -fsS --max-time 20 -o /dev/null "$base/$asset"
          done
          echo "PUBLIC_PAGES_ROOT_AND_ASSETS=PASS"
          echo "ROOT_BYTES=$(wc -c < /tmp/root.html)"
      - name: Probe public backend route shape
        shell: bash
        run: |
          set -euo pipefail
          base="https://heroic-ai.pages.dev"
          code="$(curl -sS --max-time 20 -o /tmp/health.body -w '%{http_code}' "$base/health" || true)"
          echo "HEALTH_HTTP=$code"
          test "$code" != "000"
          code="$(curl -sS --max-time 20 -o /tmp/readiness.body -w '%{http_code}' "$base/readiness" || true)"
          echo "READINESS_HTTP=$code"
          test "$code" != "000"
          code="$(curl -sS --max-time 20 -o /tmp/chat.body -w '%{http_code}' -H 'Content-Type: application/json' -d '{"chat_id":"public-probe","request_id":"public-probe","message":"ping","mode":"chat","strict_zero_cost_only":true}' "$base/api/v1/chat" || true)"
          echo "CHAT_HTTP=$code"
          test "$code" != "000"
      - name: Browser-load diagnostic
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const events = [];
            page.on('request', r => { if (/\.js(?:\?|$)|\.css(?:\?|$)|\/$/.test(r.url())) events.push({type:'request',url:r.url()}); });
            page.on('requestfinished', r => { if (/\.js(?:\?|$)|\.css(?:\?|$)|\/$/.test(r.url())) events.push({type:'finished',url:r.url()}); });
            page.on('requestfailed', r => { if (/\.js(?:\?|$)|\.css(?:\?|$)|\/$/.test(r.url())) events.push({type:'failed',url:r.url(),error:r.failure()?.errorText}); });
            page.on('console', msg => { if (msg.type() === 'error') events.push({type:'console_error',text:msg.text()}); });
            page.on('pageerror', err => events.push({type:'pageerror',text:String(err)}));
            const response = await page.goto('https://heroic-ai.pages.dev/?browser_probe=diagnostic', { waitUntil: 'commit', timeout: 30000 });
            await page.waitForTimeout(5000);
            let state = 'evaluate_timeout';
            let details = null;
            try {
              details = await page.evaluate(() => ({
                readyState: document.readyState,
                title: document.title,
                prompt: Boolean(document.querySelector('#prompt')),
                appShell: Boolean(document.querySelector('.app-shell')),
                appState: window.RIEFrontend?.state || null,
              }), { timeout: 5000 });
              state = 'evaluate_ok';
            } catch (err) {
              details = {error:String(err)};
            }
            console.log(JSON.stringify({status: state, http_status: response?.status(), details, events}, null, 2));
            await browser.close();
            if (state !== 'evaluate_ok') process.exit(1);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Browser guest lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error' && !msg.text().includes("frame-ancestors")) consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err)));
            const response = await page.goto('https://heroic-ai.pages.dev/?browser_probe=guest', { waitUntil: 'domcontentloaded', timeout: 30000 });
            const title = await page.title();
            if (!response || response.status() !== 200) throw new Error('root HTTP status was not 200');
            if (title !== 'Heroic AI — Chat & Research') throw new Error('unexpected title: ' + title);
            await page.locator('.guest-test-button').click();
            const guestText = await page.locator('.guest-test-button').innerText();
            if (guestText !== 'Exit guest test mode') throw new Error('guest mode did not activate');
            await page.locator('#prompt').fill('browser guest lifecycle probe');
            await page.locator('[data-action="send"]').click();
            await page.waitForTimeout(500);
            const conversation = await page.locator('#conversation-scroll').innerText();
            const state = await page.evaluate(() => ({ mode: window.RIEFrontend?.state?.mode, guestTestMode: window.RIEFrontend?.state?.guestTestMode, submitting: window.RIEFrontend?.state?.submitting, activeChatId: window.RIEFrontend?.state?.activeChatId, messages: window.RIEFrontend?.state?.chats?.find(c => c.id === window.RIEFrontend?.state?.activeChatId)?.messages?.map(m => ({role:m.role,text:m.text,meta:m.meta})) || [] }));
            console.log(JSON.stringify({browser_guest_load:'PASS', response_status:response.status(), title, guest_button:guestText, conversation, state, pageErrors, consoleErrors, ready_state:await page.evaluate(()=>document.readyState)}, null, 2));
            if (!conversation.includes('Guest test mode is active.') && !state.messages.some(m => String(m.text || '').includes('Guest test mode is active.'))) throw new Error('guest chat lifecycle did not render');
            if (pageErrors.length || consoleErrors.length) throw new Error(JSON.stringify({pageErrors, consoleErrors}));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
