name: Temporary formatting capture

on:
  push:
    branches:
      - fix/live-crossfire-workflow-hardening-2026-10-03

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - name: Format exact files
        run: |
          set -euo pipefail
          ruff format tests/test_crossfire_workflows.py
          npx --yes prettier@3.9.9 --write .github/workflows/browser-engine-runtime-evidence.yml .github/workflows/nightly-benchmark-ai-crossfire.yml
          git diff --check
      - name: Emit canonical file payloads
        run: |
          set -euo pipefail
          for f in .github/workflows/browser-engine-runtime-evidence.yml .github/workflows/nightly-benchmark-ai-crossfire.yml tests/test_crossfire_workflows.py; do
            echo "===FILE:$f==="
            base64 -w0 "$f"
            echo
            echo "===END:$f==="
          done
