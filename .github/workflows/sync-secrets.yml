name: Sync provider secrets

# Manual, environment-gated workflow; never invoked by repository events.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SYNC to authorize the secret fan-out"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-secret-sync-production
  cancel-in-progress: false

jobs:
  sync:
    # Privileged secret fan-out may only execute from the protected main branch.
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'SYNC' }}
    runs-on: ubuntu-latest
    environment: production-secret-sync
    timeout-minutes: 10
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify protected execution context
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Z-Solo-King/foundation"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "PyNaCl==1.5.0"

      - name: Validate required configuration
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
        run: |
          set -euo pipefail
          test -n "$GH_ADMIN_TOKEN"
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          test -n "$PROVIDER_KEYS_JSON"
          python - <<'PY'
          import json, os
          value = json.loads(os.environ["PROVIDER_KEYS_JSON"])
          assert isinstance(value, dict) and value
          print(f"validated provider count: {len(value)}")
          PY

      - name: Resolve and verify private Operations utility
        env:
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          OPERATIONS_REPOSITORY: Z-Solo-King/operations
          OPERATIONS_SECRET_SYNC_REF: cb6220fec89d1aa913bfd06fc0da52fda0f176c6
        run: |
          set -euo pipefail
          test -n "$OPERATIONS_APP_ID"
          test -n "$OPERATIONS_APP_PRIVATE_KEY"
          key_file="$RUNNER_TEMP/operations-app.pem"
          jwt_file="$RUNNER_TEMP/operations-app-jwt.txt"
          umask 077
          printf '%s\n' "$OPERATIONS_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          python scripts/create_github_app_jwt.py "$OPERATIONS_APP_ID" "$key_file" > "$jwt_file"
          app_jwt="$(cat "$jwt_file")"
          installation_id="$(OPERATIONS_APP_JWT="$app_jwt" python scripts/resolve_operations_installation.py)"
          test -n "$installation_id"
          token_response="$(curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/app/installations/${installation_id}/access_tokens")"
          github_app_token="$(printf '%s' "$token_response" | jq -r '.token // empty')"
          test -n "$github_app_token"
          echo '::add-mask::'"$github_app_token"
          rm -rf "$RUNNER_TEMP/operations"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$github_app_token" | base64 -w0)" \
            clone --filter=blob:none "https://github.com/${OPERATIONS_REPOSITORY}.git" "$RUNNER_TEMP/operations"
          actual_ref="$(git -C "$RUNNER_TEMP/operations" rev-parse HEAD)"
          test "$actual_ref" = "$OPERATIONS_SECRET_SYNC_REF"
          test -f "$RUNNER_TEMP/operations/tools/sync_provider_secrets.py"
          test ! -e tools/sync_provider_secrets.py

      - name: Validate required configuration
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
        run: |
          set -euo pipefail
          test -n "$GH_ADMIN_TOKEN"
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          test -n "$PROVIDER_KEYS_JSON"
          python - <<'PY'
          import json, os
          value = json.loads(os.environ["PROVIDER_KEYS_JSON"])
          assert isinstance(value, dict) and value
          print(f"validated provider count: {len(value)}")
          PY

      - name: Synchronize secrets with private Operations utility
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          GITHUB_OWNER: Z-Solo-King
          GITHUB_REPOSITORY_NAME: foundation
          CLOUDFLARE_SCRIPT_NAME: operations
        run: python "$RUNNER_TEMP/operations/tools/sync_provider_secrets.py"