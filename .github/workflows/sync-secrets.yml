name: Sync provider secrets

# Privileged bridge only. The implementation is private Operations code; this
# public workflow is intentionally limited to protected execution and handoff.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SYNC to authorize the secret fan-out"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-secret-sync-production
  cancel-in-progress: false

env:
  OPERATIONS_REPOSITORY: Z-Solo-King/operations
  OPERATIONS_SECRET_SYNC_REF: a2f9614cac0e4ba7118de8b6b7d86c82ee2cd6f9
  OPERATIONS_SECRET_SYNC_PATH: tools/sync_provider_secrets.py

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'SYNC' }}
    runs-on: ubuntu-latest
    environment: production-secret-sync
    timeout-minutes: 10
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify protected execution context
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Z-Solo-King/foundation"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$OPERATIONS_REPOSITORY" = "Z-Solo-King/operations"
          test "$OPERATIONS_SECRET_SYNC_REF" = "a2f9614cac0e4ba7118de8b6b7d86c82ee2cd6f9"
          test "$OPERATIONS_SECRET_SYNC_PATH" = "tools/sync_provider_secrets.py"

      - name: Verify Operations GitHub App inputs
        env:
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPERATIONS_APP_ID"
          test -n "$OPERATIONS_APP_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$OPERATIONS_APP_PRIVATE_KEY" > "$RUNNER_TEMP/operations-app.pem"
          python - "$OPERATIONS_APP_ID" "$RUNNER_TEMP/operations-app.pem" > "$RUNNER_TEMP/github-app-jwt.txt" <<'PY'
          import base64, json, subprocess, sys, time
          app_id, key_file = sys.argv[1:]
          def b64url(value):
              return base64.urlsafe_b64encode(value).rstrip(b"=").decode("ascii")
          now = int(time.time())
          header = {"alg": "RS256", "typ": "JWT"}
          payload = {"iat": now - 60, "exp": now + 540, "iss": app_id}
          header_b64 = b64url(json.dumps(header, separators=(",", ":")).encode())
          payload_b64 = b64url(json.dumps(payload, separators=(",", ":")).encode())
          unsigned = f"{header_b64}.{payload_b64}".encode()
          proc = subprocess.run(["openssl", "dgst", "-sha256", "-sign", key_file], input=unsigned, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True)
          print(unsigned.decode() + "." + b64url(proc.stdout))
          PY
          echo "GitHub App JWT generated"

      - name: Resolve Operations installation
        run: |
          set -euo pipefail
          export OPERATIONS_APP_JWT="$(cat "$RUNNER_TEMP/github-app-jwt.txt")"
          python scripts/resolve_operations_installation.py > "$RUNNER_TEMP/operations-installation-id.txt"
          test -s "$RUNNER_TEMP/operations-installation-id.txt"
          echo "Operations GitHub App installation resolved"

      - name: Mint least-privilege Operations token
        run: |
          set -euo pipefail
          app_jwt="$(cat "$RUNNER_TEMP/github-app-jwt.txt")"
          installation_id="$(cat "$RUNNER_TEMP/operations-installation-id.txt")"
          status="$(curl -sS -o "$RUNNER_TEMP/operations-token.json" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/app/installations/$installation_id/access_tokens" \
            --data '{"repositories":["operations"]}')"
          test "$status" = "201"
          python - "$RUNNER_TEMP/operations-token.json" <<'PY' > "$RUNNER_TEMP/operations-token.txt"
          import json, sys
          token=json.load(open(sys.argv[1], encoding="utf-8")).get("token")
          if not isinstance(token, str) or not token:
              raise SystemExit("installation token missing")
          print(token)
          PY
          test -s "$RUNNER_TEMP/operations-token.txt"
          echo "::add-mask::$(cat "$RUNNER_TEMP/operations-token.txt")"

      - name: Fetch and verify private sync implementation
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/operations-token.txt")"
          commit_status="$(curl -sS -o "$RUNNER_TEMP/operations-commit.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $token" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$OPERATIONS_REPOSITORY/git/commits/$OPERATIONS_SECRET_SYNC_REF")"
          test "$commit_status" = "200"
          jq -e --arg expected "$OPERATIONS_SECRET_SYNC_REF" '.sha == $expected' "$RUNNER_TEMP/operations-commit.json" >/dev/null

          response_status="$(curl -sS -o "$RUNNER_TEMP/operations-sync-file.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $token" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$OPERATIONS_REPOSITORY/contents/$OPERATIONS_SECRET_SYNC_PATH?ref=$OPERATIONS_SECRET_SYNC_REF")"
          test "$response_status" = "200"
          jq -e --arg path "$OPERATIONS_SECRET_SYNC_PATH" '.type == "file" and .path == $path and .size > 0' "$RUNNER_TEMP/operations-sync-file.json" >/dev/null
          jq -r '.content' "$RUNNER_TEMP/operations-sync-file.json" | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/sync_provider_secrets.py"
          test -s "$RUNNER_TEMP/sync_provider_secrets.py"
          python -m py_compile "$RUNNER_TEMP/sync_provider_secrets.py"
          echo "Private sync implementation verified at immutable Operations revision"

      - name: Validate required target configuration
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
        run: |
          set -euo pipefail
          test -n "$GH_ADMIN_TOKEN"
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          test -n "$PROVIDER_KEYS_JSON"
          python - <<'PY'
          import json, os
          value = json.loads(os.environ["PROVIDER_KEYS_JSON"])
          assert isinstance(value, dict) and value
          print(f"validated provider count: {len(value)}")
          PY

      - name: Execute private secret synchronization
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          GITHUB_OWNER: Z-Solo-King
          GITHUB_REPOSITORY_NAME: foundation
          CLOUDFLARE_SCRIPT_NAME: operations
        run: python "$RUNNER_TEMP/sync_provider_secrets.py"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/operations-app.pem" \
                "$RUNNER_TEMP/github-app-jwt.txt" \
                "$RUNNER_TEMP/operations-installation-id.txt" \
                "$RUNNER_TEMP/operations-token.txt" \
                "$RUNNER_TEMP/operations-token.json" \
                "$RUNNER_TEMP/operations-commit.json" \
                "$RUNNER_TEMP/operations-sync-file.json" \
                "$RUNNER_TEMP/sync_provider_secrets.py"
