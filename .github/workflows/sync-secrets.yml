name: Sync provider secrets

# Manual, environment-gated workflow; never invoked by repository events.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SYNC to authorize the secret fan-out"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-secret-sync-production
  cancel-in-progress: false

jobs:
  sync:
    # Privileged secret fan-out may only execute from the protected main branch.
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'SYNC' }}
    runs-on: ubuntu-latest
    environment: production-secret-sync
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify protected execution context
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Z-Solo-King/foundation"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "PyNaCl==1.5.0"

      - name: Validate required configuration
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
        run: |
          set -euo pipefail
          test -n "$GH_ADMIN_TOKEN"
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          test -n "$PROVIDER_KEYS_JSON"
          python - <<'PY'
          import json, os
          value = json.loads(os.environ["PROVIDER_KEYS_JSON"])
          assert isinstance(value, dict) and value
          print(f"validated provider count: {len(value)}")
          PY

      - name: Synchronize secrets
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          GITHUB_OWNER: Z-Solo-King
          GITHUB_REPOSITORY_NAME: foundation
          CLOUDFLARE_SCRIPT_NAME: operations
        run: python tools/sync_provider_secrets.py