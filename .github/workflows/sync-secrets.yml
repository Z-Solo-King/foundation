name: Sync provider secrets
# One-time protected provider sync marker; remove after successful acceptance.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SYNC to authorize the secret fan-out"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-secret-sync-production
  cancel-in-progress: false

env:
  OPERATIONS_REPOSITORY: Z-Solo-King/operations
  OPERATIONS_SECRET_SYNC_REF: ${{ vars.OPERATIONS_SECRET_SYNC_REF }}
  OPERATIONS_SECRET_SYNC_PATH: ${{ vars.OPERATIONS_SECRET_SYNC_PATH }}

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' && (inputs.confirm == 'SYNC' || contains(github.event.head_commit.message, '[PROVIDER-SYNC-20260930]')) }}
    runs-on: ubuntu-latest
    environment: production-secret-sync
    timeout-minutes: 10
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned private sync dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "PyNaCl==1.5.0"

      - name: Create short-lived Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Materialize protected sync pin defaults
        shell: bash
        run: |
          set -euo pipefail
          ref="$OPERATIONS_SECRET_SYNC_REF"
          path="$OPERATIONS_SECRET_SYNC_PATH"
          test -n "$ref" || ref="c4f63352c56c919767eb2c6cb70b70d27eed4c11"
          test -n "$path" || path="tools/sync_provider_secrets.py"
          printf 'OPERATIONS_SECRET_SYNC_REF=%s\n' "$ref" >> "$GITHUB_ENV"
          printf 'OPERATIONS_SECRET_SYNC_PATH=%s\n' "$path" >> "$GITHUB_ENV"

      - name: Validate protected target configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPERATIONS_REPOSITORY"
          test -n "$OPERATIONS_SECRET_SYNC_REF"
          test -n "$OPERATIONS_SECRET_SYNC_PATH"
          printf '%s' "$OPERATIONS_SECRET_SYNC_REF" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$OPERATIONS_SECRET_SYNC_PATH" | grep -Eq '^[A-Za-z0-9_./-]+$'

      - name: Checkout private sync implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.OPERATIONS_REPOSITORY }}
          ref: ${{ env.OPERATIONS_SECRET_SYNC_REF }}
          token: ${{ steps.operations-app.outputs.token }}
          persist-credentials: false
          path: operations-private

      - name: Verify private sync implementation
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0600 "operations-private/$OPERATIONS_SECRET_SYNC_PATH" "$RUNNER_TEMP/sync_provider_secrets.py"
          python -m py_compile "$RUNNER_TEMP/sync_provider_secrets.py"
          echo "private sync implementation: PASS"

      - name: Validate target inputs
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          python - <<'PY'
          import json, os
          value = json.loads(os.environ["PROVIDER_KEYS_JSON"])
          assert isinstance(value, dict) and value
          print("provider configuration: PASS")
          PY

      - name: Execute private Cloudflare runtime synchronization
        env:
          SKIP_GITHUB_SYNC: "1"
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          GITHUB_OWNER: Z-Solo-King
          GITHUB_REPOSITORY_NAME: foundation
          CLOUDFLARE_SCRIPT_NAME: operations
        run: python "$RUNNER_TEMP/sync_provider_secrets.py"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -rf operations-private
          rm -f "$RUNNER_TEMP/sync_provider_secrets.py"
