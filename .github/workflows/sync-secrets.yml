name: Sync provider secrets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SYNC to authorize the secret fan-out"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-secret-sync-production
  cancel-in-progress: false

env:
  OPERATIONS_REPOSITORY: Z-Solo-King/operations
  OPERATIONS_SECRET_SYNC_REF: ${{ vars.OPERATIONS_SECRET_SYNC_REF }}
  OPERATIONS_SECRET_SYNC_PATH: ${{ vars.OPERATIONS_SECRET_SYNC_PATH }}

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'SYNC' }}
    runs-on: ubuntu-latest
    environment: production-secret-sync
    timeout-minutes: 10
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned private sync dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "PyNaCl==1.5.0"

      - name: Create short-lived Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Materialize protected sync pin defaults
        shell: bash
        run: |
          set -euo pipefail
          ref="$OPERATIONS_SECRET_SYNC_REF"
          path="$OPERATIONS_SECRET_SYNC_PATH"
          test -n "$ref" || ref="425d6e2c589d652e45ad80dd251a598315923659"
          test -n "$path" || path="tools/sync_provider_secrets.py"
          printf 'OPERATIONS_SECRET_SYNC_REF=%s\n' "$ref" >> "$GITHUB_ENV"
          printf 'OPERATIONS_SECRET_SYNC_PATH=%s\n' "$path" >> "$GITHUB_ENV"

      - name: Validate protected target configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPERATIONS_REPOSITORY"
          test -n "$OPERATIONS_SECRET_SYNC_REF"
          test -n "$OPERATIONS_SECRET_SYNC_PATH"
          printf '%s' "$OPERATIONS_SECRET_SYNC_REF" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$OPERATIONS_SECRET_SYNC_PATH" | grep -Eq '^[A-Za-z0-9_./-]+$'

      - name: Checkout private sync implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.OPERATIONS_REPOSITORY }}
          ref: ${{ env.OPERATIONS_SECRET_SYNC_REF }}
          token: ${{ steps.operations-app.outputs.token }}
          persist-credentials: false
          path: operations-private

      - name: Verify private sync implementation
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0600 "operations-private/$OPERATIONS_SECRET_SYNC_PATH" "$RUNNER_TEMP/sync_provider_secrets.py"
          python -m py_compile "$RUNNER_TEMP/sync_provider_secrets.py"
          echo "private sync implementation: PASS"

      - name: Validate target inputs
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          test -n "$NVIDIA_NIM_API_KEY"
          test -n "$HF_TOKEN"
          test -n "$COHERE_API_KEY"
          test -n "$CEREBRAS_API_KEY"
          test -n "$SILICONFLOW_API_KEY"
          python - <<'PY'
          import json, os
          value = json.loads(os.environ["PROVIDER_KEYS_JSON"])
          assert isinstance(value, dict) and value
          print("provider configuration: PASS")
          PY

      - name: Assemble merged provider configuration
        env:
          BASE_PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          payload = json.loads(os.environ["BASE_PROVIDER_KEYS_JSON"])
          assert isinstance(payload, dict) and payload
          payload.pop("mistral_free", None)

          payload["nvidia_nim"] = {
              "endpoint": "https://integrate.api.nvidia.com/v1/chat/completions",
              "api_key": os.environ["NVIDIA_NIM_API_KEY"],
              "model": "deepseek-ai/deepseek-v4.1-flash",
              "zero_cost": True,
          }
          payload["huggingface_free"] = {
              "endpoint": "https://router.huggingface.co/v1/chat/completions",
              "api_key": os.environ["HF_TOKEN"],
              "model": "openai/gpt-oss-120b",
              "zero_cost": True,
          }
          payload["cohere_free"] = {
              "endpoint": "https://api.cohere.ai/compatibility/v1/chat/completions",
              "api_key": os.environ["COHERE_API_KEY"],
              "model": "command-a-plus-05-2026",
              "zero_cost": True,
          }
          payload["cerebras"] = {
              "endpoint": "https://api.cerebras.ai/v1/chat/completions",
              "api_key": os.environ["CEREBRAS_API_KEY"],
              "model": "gpt-oss-120b",
              "zero_cost": True,
          }
          payload["siliconflow"] = {
              "endpoint": "https://api.siliconflow.cn/v1/chat/completions",
              "api_key": os.environ["SILICONFLOW_API_KEY"],
              "model": "Qwen/Qwen3.5-4B",
              "zero_cost": True,
          }

          target = Path(os.environ["RUNNER_TEMP"]) / "provider_keys.json"
          target.write_text(json.dumps(payload, separators=(",", ":")), encoding="utf-8")
          target.chmod(0o600)
          print("provider configuration assembly: PASS")
          PY

      - name: Execute private Cloudflare runtime synchronization
        env:
          SKIP_GITHUB_SYNC: "1"
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON_FILE: ${{ runner.temp }}/provider_keys.json
          GITHUB_OWNER: Z-Solo-King
          GITHUB_REPOSITORY_NAME: foundation
          CLOUDFLARE_SCRIPT_NAME: operations
        run: python "$RUNNER_TEMP/sync_provider_secrets.py"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -rf operations-private
          rm -f "$RUNNER_TEMP/sync_provider_secrets.py" "$RUNNER_TEMP/provider_keys.json"
