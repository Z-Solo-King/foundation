name: WooCommerce SVMPForge Historical Guess V8
on:
  push:
    branches: [feat/wc-svmpforge-historical-guess-v8-20261001]
    paths:
      - "tools/woocommerce_svmpforge_historical_v8.mjs"
      - "tests/test_woocommerce_svmpforge_historical_v8.mjs"
      - ".github/workflows/woocommerce-svmpforge-historical-v8.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/woocommerce_svmpforge_historical_v8.mjs"
      - "tests/test_woocommerce_svmpforge_historical_v8.mjs"
      - ".github/workflows/woocommerce-svmpforge-historical-v8.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wc-svmpforge-v8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guess:
    name: SVMPForge historical shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Unit tests
        run: node --test tests/test_woocommerce_svmpforge_historical_v8.mjs
      - name: SVMPForge historical recovery
        run: node tools/woocommerce_svmpforge_historical_v8.mjs
      - name: Upload shard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-svmpforge-v8-shard-${{ matrix.shard }}
          path: out/woocommerce-svmpforge-v8/
          retention-days: 30
  aggregate:
    needs: guess
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: woocommerce-svmpforge-v8-shard-*
          path: out/shards
          merge-multiple: false
      - name: Aggregate
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path';
          const files=[]; function walk(p){for(const e of fs.readdirSync(p,{withFileTypes:true})){const q=path.join(p,e.name);if(e.isDirectory())walk(q);else if(e.name.endsWith('.json'))files.push(q);}} walk('out/shards');
          const rows=files.sort().flatMap(f=>JSON.parse(fs.readFileSync(f,'utf8')).results||[]);const u=new Map(rows.map(x=>[x.root,x]));const a=[...u.values()].sort((x,y)=>x.root.localeCompare(y.root));if(a.length!==17)throw new Error('expected 17 targets, got '+a.length);
          const out={schema:'woocommerce-svmpforge-v8-aggregate/v1',target_count:17,native_verified:a.filter(x=>x.hits?.length).length,native_urls:a.flatMap(x=>x.positive_urls||[]),historical_reference_total:a.reduce((n,x)=>n+x.historical_reference_count,0),transport_limited:a.filter(x=>x.status.includes('TRANSPORT_LIMITED')).length,clean_no_hit:a.filter(x=>x.status==='NO_NATIVE_FEED_VERIFIED').length,results:a};fs.mkdirSync('out/aggregate',{recursive:true});fs.writeFileSync('out/aggregate/aggregate.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify({...out,results:undefined},null,2));
          NODE
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-svmpforge-v8-aggregate
          path: out/aggregate/
          retention-days: 30
