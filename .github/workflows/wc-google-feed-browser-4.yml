name: WooCommerce Google Feed Browser 4

on:
  push:
    branches:
      - fix/wc-google-feed-focus-4-20260929
    paths:
      - ".github/workflows/wc-google-feed-browser-4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser feed probe ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {site: "Ads Store", host: "adsstore.in"}
          - {site: "ithunt", host: "ithunt.in"}
          - {site: "KC Computers", host: "kccomputers.co.in"}
          - {site: "KRG KART", host: "krgkart.com"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Browser Rendering native-feed probe
        env:
          SITE: ${{ matrix.site }}
          HOST: ${{ matrix.host }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p out/wc-google-feed-browser
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token) throw new Error('Missing Cloudflare Browser Rendering credentials');
          const host=process.env.HOST, site=process.env.SITE, base='https://'+host;
          const candidates=[
            '/?woocommerce_gpf=google',
            '/woocommerce_gpf/google',
            '/google.xml',
            '/google_feed.xml',
            '/google-product-feed.xml',
            '/google-products.xml',
            '/google-shopping.xml',
            '/google-shopping-feed.xml',
            '/product-feed.xml',
            '/products-feed.xml',
            '/merchant-feed.xml',
            '/feed/google.xml',
            '/feeds/google.xml',
            '/feeds/google-products.xml',
            '/wp-content/uploads/codesolz-feeds/google.xml',
            '/wp-content/uploads/codesolz-feeds/google-products.xml',
            '/wp-content/uploads/woo-feed/google/xml/google.xml',
            '/wp-content/uploads/woo-product-feed-pro/xml/google.xml',
            '/wp-content/uploads/wppfm-feeds/google.xml',
            '/wp-json/feedcraft-product-feed/v1/xml'
          ];
          const discovery=['/','/robots.txt','/sitemap.xml','/wp-sitemap.xml'];
          const api='https://api.cloudflare.com/client/v4/accounts/'+account+'/browser-rendering/content';
          async function render(url){
            const r=await fetch(api,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({url,gotoOptions:{waitUntil:'domcontentloaded',timeout:30000},actionTimeout:30000}),signal:AbortSignal.timeout(45000)});
            const j=await r.json().catch(()=>({}));
            const val=j?.result?.content ?? j?.result?.html ?? j?.result?.text ?? j?.result ?? '';
            return {http_status:r.status,success:Boolean(j?.success),text:typeof val==='string'?val:JSON.stringify(val)};
          }
          const out={site,host,discovery:[],tested:[],feed:null};
          const found=new Set();
          for(const p of discovery){
            try{const x=await render(new URL(p,base).href);out.discovery.push({path:p,http_status:x.http_status,success:x.success,preview:x.text.slice(0,6000)});
              for(const m of x.text.matchAll(/(?:https?:\/\/|href=["']|src=["'])[^\s"'<>]+/gi)){
                let raw=m[0].replace(/^href=["']|^src=["']/i,'');
                try{const u=new URL(raw,base); if(u.origin===new URL(base).origin && /xml|feed|google|merchant|shopping|product|woo|wppfm|codesolz|feedcraft/i.test(u.pathname+u.search)) found.add(u.pathname+u.search);}catch{}
              }
            }catch(e){out.discovery.push({path:p,error:e?.name||String(e)});} 
          }
          const paths=[...new Set([...found,...candidates])].slice(0,32);
          function nativeValid(s){const x=String(s||'');return /(?:<\?xml[\s\S]*?>\s*)?<rss\b/i.test(x)&&x.toLowerCase().includes('base.google.com/ns/1.0')&&/<item\b/i.test(x)&&/<(?:g:)?price\b/i.test(x)&&/<(?:g:)?(?:id|title|link)\b/i.test(x);}
          for(const p of paths){
            if(out.feed) break;
            try{const x=await render(new URL(p,base).href);
              const hit={path:p,http_status:x.http_status,success:x.success,bytes:Buffer.byteLength(x.text),preview:x.text.slice(0,1200)};
              if(x.http_status===200 && nativeValid(x.text)){out.feed={path:p,url:new URL(p,base).href,bytes:Buffer.byteLength(x.text),item_count:(x.text.match(/<item\b/gi)||[]).length,xml:x.text};hit.valid=true;out.tested.push(hit);break;}
              hit.valid=false;out.tested.push(hit);
            }catch(e){out.tested.push({path:p,error:e?.name||String(e)});}
          }
          await writeFile('out/wc-google-feed-browser/'+host+'.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({...out,feed:out.feed?{path:out.feed.path,url:out.feed.url,bytes:out.feed.bytes,item_count:out.feed.item_count}:null},null,2));
          NODE
      - name: Upload browser probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wc-google-feed-browser-${{ matrix.site }}
          path: out/wc-google-feed-browser/
          if-no-files-found: warn
          retention-days: 14
