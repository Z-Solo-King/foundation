name: Live AI provider cross-fire benchmark
run-name: Live AI provider cross-fire — ${{ github.event_name }}

on:
  push:
    branches:
      - bench/live-provider-execution-2026-10-03
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Optional immutable private Operations revision
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: live-ai-provider-crossfire
  cancel-in-progress: false

jobs:
  crossfire:
    name: Private provider speed-quality cross-fire
    runs-on: ubuntu-latest
    environment: production-secret-sync
    timeout-minutes: 15
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Mint read-only Operations App token
        id: operations-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: operations
          permission-contents: read
      - name: Resolve immutable Operations revision
        id: operations
        shell: bash
        env:
          REQUESTED_OPERATIONS_REF: ${{ inputs.operations_ref }}
          GH_TOKEN: ${{ steps.operations-token.outputs.token }}
        run: |
          set -euo pipefail
          ref="${REQUESTED_OPERATIONS_REF:-}"
          if [ -z "$ref" ]; then ref="$(gh api repos/Z-Solo-King/operations/commits/main --jq '.sha')"; fi
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Operations revision must be a 40-hex immutable SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private Operations benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ steps.operations.outputs.ref }}
          token: ${{ steps.operations-token.outputs.token }}
          path: operations-provider-benchmark
          persist-credentials: false
      - name: Install private benchmark
        working-directory: operations-provider-benchmark
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Validate six-provider matrix
        working-directory: operations-provider-benchmark
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/operations-provider-benchmark
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from private.chatbot.platform_access import validate_platform_matrix, crossfire_lanes
          catalog = json.loads(Path("private/chatbot/provider_transport_catalog.json").read_text())
          required = {"openrouter_free","groq","gemini","cerebras","nvidia_nim","cohere_free"}
          ids = {item["id"] for item in catalog["providers"]}
          assert required <= ids
          assert len(validate_platform_matrix()) == 22
          lanes = crossfire_lanes()
          assert len(lanes) == 6 and all(lane.independent for lane in lanes)
          print({"selected_provider_cap":6,"platforms":22,"lanes":6})
          PY
      - name: Run live six-provider cross-fire
        working-directory: operations-provider-benchmark
        env:
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/operations-provider-benchmark
        run: |
          set -euo pipefail
          mkdir -p ../.runtime/live-ai-crossfire
          python private/benchmark/ai_provider_crossfire.py --providers-max 6 --repeats 3 --workers 18 --output ../.runtime/live-ai-crossfire/private.json
          jq '{schema,generated_at,concurrency_workers,providers_tested,provider_target,crossfire_strength,independent_execution,shared_result_feedback,task_count,repeats,call_count,batch_wall_ms,providers:[.providers[]|{provider,model,calls,successes,failures,quality_passes,quality_total,quality_score,latency_ms,provider_batch_ms,errors}],task_agreement}' ../.runtime/live-ai-crossfire/private.json > ../.runtime/live-ai-crossfire/public-summary.json
          jq -e '.providers_tested|length==6' ../.runtime/live-ai-crossfire/private.json
          jq -e '.call_count==54' ../.runtime/live-ai-crossfire/private.json
          jq -e 'all(.providers[]; .calls==9)' ../.runtime/live-ai-crossfire/private.json
      - name: Upload live benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-ai-provider-crossfire-2026-10-03
          path: .runtime/live-ai-crossfire
          retention-days: 30
          if-no-files-found: error
      - name: Print sanitized result
        if: always()
        run: cat .runtime/live-ai-crossfire/public-summary.json
