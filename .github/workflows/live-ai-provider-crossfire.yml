name: Live AI provider cross-fire benchmark

on:
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Optional immutable private Operations revision
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: live-ai-provider-crossfire
  cancel-in-progress: true

jobs:
  crossfire:
    name: Private provider speed-quality cross-fire
    runs-on: ubuntu-latest
    environment: production-secret-sync
    timeout-minutes: 12
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Mint read-only Operations App token
        id: operations-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: operations
          permission-contents: read

      - name: Resolve immutable Operations revision
        id: operations
        shell: bash
        env:
          REQUESTED_OPERATIONS_REF: ${{ inputs.operations_ref }}
          GH_TOKEN: ${{ steps.operations-token.outputs.token }}
        run: |
          set -euo pipefail
          ref="${REQUESTED_OPERATIONS_REF:-}"
          if [ -z "$ref" ]; then ref="$(gh api repos/Z-Solo-King/operations/commits/main --jq '.sha')"; fi
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Operations revision must be a 40-hex immutable SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private Operations benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ steps.operations.outputs.ref }}
          token: ${{ steps.operations-token.outputs.token }}
          path: ${{ runner.temp }}/operations-provider-benchmark
          persist-credentials: false

      - name: Run private provider cross-fire
        env:
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          HEROIC_AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          OPERATIONS_CROSSFIRE_RUNNER: ${{ runner.temp }}/operations-provider-benchmark/private/benchmark/ai_provider_crossfire.py
        run: |
          set -euo pipefail
          mkdir -p .runtime/live-ai-crossfire
          python benchmark/ai_provider_crossfire.py --providers-max 5 --repeats 3 --workers 12 --output .runtime/live-ai-crossfire/private.json

      - name: Create public-safe summary
        if: always()
        run: |
          set -euo pipefail
          test -s .runtime/live-ai-crossfire/private.json
          jq '{schema:"live-ai-provider-crossfire-summary/v1",generated_at,provider_count:(.providers|length),call_count,batch_wall_ms,successful_calls:([.providers[].successes]|add),failed_calls:([.providers[].failures]|add),quality_passes:([.providers[].quality_passes]|add),quality_total:([.providers[].quality_total]|add)}' .runtime/live-ai-crossfire/private.json > .runtime/live-ai-crossfire/summary.json

      - name: Upload public-safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-ai-provider-crossfire
          path: .runtime/live-ai-crossfire/summary.json
          retention-days: 30
          if-no-files-found: error
