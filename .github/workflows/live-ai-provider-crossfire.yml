name: Live AI provider cross-fire benchmark
run-name: Live AI provider cross-fire — ${{ github.event_name }}

on:
  schedule:
    # 22:00 IST target; GitHub may delay scheduled runs during load.
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Optional immutable private Operations revision
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  crossfire:
    name: Private provider speed-quality cross-fire
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/chatbot-post-release-crossfire.yml
    with:
      operations_ref: ${{ inputs.operations_ref }}
    secrets: inherit
