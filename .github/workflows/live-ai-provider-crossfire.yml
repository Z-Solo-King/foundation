name: Live AI provider cross-fire benchmark
run-name: Live AI provider cross-fire — ${{ github.event_name }}

on:
  push:
    branches: [fix/chatbot-live-crossfire-browser-2026-10-03]
    paths:
      - ".github/workflows/live-ai-provider-crossfire.yml"
  schedule:
    # 22:00 IST target; GitHub may delay scheduled runs during load.
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Optional immutable private Operations revision
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: live-ai-provider-crossfire
  cancel-in-progress: false

jobs:
  crossfire:
    name: Private provider speed-quality cross-fire
    runs-on: ubuntu-latest
    environment: production-secret-sync
    timeout-minutes: 12
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Mint read-only Operations App token
        id: operations-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: operations
          permission-contents: read

      - name: Resolve immutable Operations revision
        id: operations
        shell: bash
        env:
          REQUESTED_OPERATIONS_REF: ${{ inputs.operations_ref }}
          GH_TOKEN: ${{ steps.operations-token.outputs.token }}
        run: |
          set -euo pipefail
          ref="${REQUESTED_OPERATIONS_REF:-}"
          if [ -z "$ref" ]; then ref="$(gh api repos/Z-Solo-King/operations/commits/main --jq '.sha')"; fi
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Operations revision must be a 40-hex immutable SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private Operations benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ steps.operations.outputs.ref }}
          token: ${{ steps.operations-token.outputs.token }}
          path: operations-provider-benchmark
          persist-credentials: false

      - name: Validate platform access cross-fire contract
        working-directory: operations-provider-benchmark
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/operations-provider-benchmark
        run: |
          set -euo pipefail
          python - <<'PY'
          from private.chatbot.platform_access import validate_platform_matrix, crossfire_lanes
          platforms = validate_platform_matrix()
          lanes = crossfire_lanes()
          assert len(platforms) == 22
          assert len(lanes) == 6
          assert all(lane.independent for lane in lanes)
          print({"platforms": len(platforms), "lanes": len(lanes)})
          PY

      - name: Run private provider cross-fire
        env:
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          HEROIC_AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          OPERATIONS_CROSSFIRE_RUNNER: ${{ github.workspace }}/operations-provider-benchmark/private/benchmark/ai_provider_crossfire.py
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/operations-provider-benchmark
        run: |
          set +e
          python - <<'PY'
          import json, os
          from pathlib import Path
          specs = {x["id"]: x for x in json.loads(Path("private/chatbot/provider_transport_catalog.json").read_text())["providers"]}
          raw = os.environ.get("PROVIDER_KEYS_JSON", "").strip()
          try:
              payload = json.loads(raw) if raw else {}
          except json.JSONDecodeError:
              payload = {}
              print("PROVIDER_KEYS_JSON parse: INVALID")
          if not isinstance(payload, dict):
              payload = {}
          env_keys = {
              "openrouter_free":"OPENROUTER_API_KEY","groq":"GROQ_API_KEY","gemini":"GEMINI_API_KEY",
              "cerebras":"CEREBRAS_API_KEY","nvidia_nim":"NVIDIA_NIM_API_KEY","cohere_free":"COHERE_API_KEY",
              "huggingface_free":"HF_TOKEN","siliconflow":"SILICONFLOW_API_KEY"
          }
          admitted=set()
          for name,value in sorted(payload.items()):
              spec=specs.get(name)
              if not spec or not isinstance(value,dict):
                  print(name + ": REJECT unknown_or_invalid_shape")
                  continue
              if not all(isinstance(value.get(k),str) and value.get(k).strip() for k in ("endpoint","api_key","model")):
                  print(name + ": REJECT missing_endpoint_model_or_key")
                  continue
              if value.get("zero_cost") is False:
                  print(name + ": REJECT zero_cost_false")
                  continue
              if value.get("endpoint") != spec["endpoint"]:
                  print(name + ": REJECT endpoint_mismatch")
                  continue
              if value.get("model") != spec["model"]:
                  print(name + ": REJECT model_mismatch")
                  continue
              admitted.add(name)
              print(name + ": ADMITTED_FROM_JSON")
          for name,key in env_keys.items():
              present=bool(os.environ.get(key,"").strip())
              print(name + ": direct_env=" + ("PRESENT" if present else "EMPTY"))
              if present:
                  admitted.add(name)
          print("ADMITTED_PROVIDER_NAMES:", sorted(admitted))
          print("ADMITTED_PROVIDER_COUNT:", len(admitted))
          PY
          mkdir -p .runtime/live-ai-crossfire
          python benchmark/ai_provider_crossfire.py --providers-max 6 --repeats 3 --workers 12 --output .runtime/live-ai-crossfire/private.json > .runtime/live-ai-crossfire/runner.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q '^need at least 2 configured AI providers for cross-fire;' .runtime/live-ai-crossfire/runner.log; then
              provider_count=$(sed -n 's/.*found \([0-9][0-9]*\)$/\1/p' .runtime/live-ai-crossfire/runner.log | tail -1)
              provider_count="${provider_count:-0}"
              jq -n --argjson provider_count "$provider_count" '{
                schema:"live-ai-provider-crossfire-summary/v1",
                generated_at:(now|todate),
                comparison_state:"comparison_unavailable",
                limitation:"fewer than two configured direct providers; comparative cross-fire is not claimed",
                provider_count:$provider_count,
                providers:[],
                call_count:0,
                batch_wall_ms:null
              }' > .runtime/live-ai-crossfire/private.json
              echo "Provider cross-fire comparison unavailable; recorded bounded non-comparative receipt."
            else
              cat .runtime/live-ai-crossfire/runner.log
              exit "$status"
            fi
          fi
          test -s .runtime/live-ai-crossfire/private.json

      - name: Create public-safe summary
        if: always()
        run: |
          set -euo pipefail
          test -s .runtime/live-ai-crossfire/private.json
          jq '{schema:"live-ai-provider-crossfire-summary/v1",generated_at,comparison_state:(.comparison_state // "complete"),limitation:(.limitation // null),provider_count:(.providers|length),call_count,batch_wall_ms,successful_calls:([.providers[]?.successes]|add // 0),failed_calls:([.providers[]?.failures]|add // 0),quality_passes:([.providers[]?.quality_passes]|add // 0),quality_total:([.providers[]?.quality_total]|add // 0)}' .runtime/live-ai-crossfire/private.json > .runtime/live-ai-crossfire/summary.json

      - name: Enforce comparative availability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .runtime/live-ai-crossfire/summary.json
          comparison_state="$(jq -r '.comparison_state // "complete"' .runtime/live-ai-crossfire/summary.json)"
          provider_count="$(jq -r '.provider_count // 0' .runtime/live-ai-crossfire/summary.json)"
          test "$comparison_state" != "comparison_unavailable"
          test "$provider_count" -ge 5

      - name: Upload public-safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-ai-provider-crossfire
          path: .runtime/live-ai-crossfire/summary.json
          retention-days: 30
          if-no-files-found: error