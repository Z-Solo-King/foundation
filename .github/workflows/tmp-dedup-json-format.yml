name: Temporary canonical JSON formatter

on:
  push:
    branches:
      - fix/current-state-continuity-20261003

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Format JSON
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.9 --write docs/FAMILY_SYNC_STATE.json
      - name: Commit and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FAMILY_SYNC_STATE.json
          rm .github/workflows/tmp-dedup-json-format.yml
          git add -u .github/workflows/tmp-dedup-json-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply canonical Prettier JSON formatting"
          git push origin HEAD:fix/current-state-continuity-20261003
