name: WooCommerce Historical Feed URL Recovery V10
on:
  push:
    branches: [feat/wc-historical-feed-url-recovery-v10-20261001]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Unit tests
        run: node --test tests/test_woocommerce_historical_feed_url_recovery_v10.mjs
      - name: Historical feed URL recovery
        run: node tools/woocommerce_historical_feed_url_recovery_v10.mjs
      - name: Upload result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-historical-feed-url-v10-results
          path: out/woocommerce-historical-feed-url-v10/
          retention-days: 30
