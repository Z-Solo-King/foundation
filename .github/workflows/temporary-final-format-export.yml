name: Temporary final-format export

on:
  push:
    branches:
      - fix/final-family-reconcile-20261003

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Format canonical documents
        run: |
          npx --yes prettier@3.9.9 --write docs/FAMILY_SYNC_STATE.json docs/CURRENT_SOURCE_OF_TRUTH.md
      - name: Show diff
        run: git diff --unified=6 -- docs/FAMILY_SYNC_STATE.json docs/CURRENT_SOURCE_OF_TRUTH.md
      - name: Upload canonical output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-format-output
          path: |
            docs/FAMILY_SYNC_STATE.json
            docs/CURRENT_SOURCE_OF_TRUTH.md
          if-no-files-found: error
          retention-days: 1
