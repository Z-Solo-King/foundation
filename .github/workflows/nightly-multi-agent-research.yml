name: nightly multi-agent research

on:
  schedule:
    # 01:00 IST = 19:30 UTC on the previous day.
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: nightly-multi-agent-research
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  RESEARCH_LLM_ENDPOINT: ${{ secrets.RESEARCH_LLM_ENDPOINT }}
  RESEARCH_LLM_API_KEY: ${{ secrets.RESEARCH_LLM_API_KEY }}
  RESEARCH_LLM_MODEL: ${{ secrets.RESEARCH_LLM_MODEL }}

jobs:
  research-a:
    name: Dynamic research hours 01-05 IST
    runs-on: ubuntu-latest
    timeout-minutes: 265
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Require live research executor configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RESEARCH_LLM_ENDPOINT:-}" || { echo 'Missing RESEARCH_LLM_ENDPOINT; refusing silent dry-run.'; exit 1; }
          test -n "${RESEARCH_LLM_API_KEY:-}" || { echo 'Missing RESEARCH_LLM_API_KEY; refusing silent dry-run.'; exit 1; }
          test -n "${RESEARCH_LLM_MODEL:-}" || { echo 'Missing RESEARCH_LLM_MODEL; refusing silent dry-run.'; exit 1; }
          case "$RESEARCH_LLM_ENDPOINT" in
            http://*|https://*) ;;
            *) echo 'RESEARCH_LLM_ENDPOINT must be HTTP(S).'; exit 1 ;;
          esac
          echo 'live research executor configuration: PASS'
      - name: Run adaptive research and capacity comparisons
        run: python -m benchmark.multi_agent.runner --start-slot 0 --slots 4 --global-capacity 20 --compare --output .runtime/nightly-a.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-research-a
          path: .runtime/nightly-a.jsonl
          retention-days: 30
      - name: Attest research-a artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-a.jsonl

  research-b:
    name: Dynamic research hours 05-09 IST
    needs: research-a
    runs-on: ubuntu-latest
    timeout-minutes: 265
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Require live research executor configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RESEARCH_LLM_ENDPOINT:-}" || { echo 'Missing RESEARCH_LLM_ENDPOINT; refusing silent dry-run.'; exit 1; }
          test -n "${RESEARCH_LLM_API_KEY:-}" || { echo 'Missing RESEARCH_LLM_API_KEY; refusing silent dry-run.'; exit 1; }
          test -n "${RESEARCH_LLM_MODEL:-}" || { echo 'Missing RESEARCH_LLM_MODEL; refusing silent dry-run.'; exit 1; }
          echo 'live research executor configuration: PASS'
      - name: Run adaptive research and capacity comparisons
        run: python -m benchmark.multi_agent.runner --start-slot 4 --slots 4 --global-capacity 20 --compare --output .runtime/nightly-b.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-research-b
          path: .runtime/nightly-b.jsonl
          retention-days: 30
      - name: Attest research-b artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-b.jsonl

  project-summary:
    name: Build project improvement evidence report
    needs: [research-a, research-b]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download research artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nightly-research-*
          path: .runtime/artifacts
          merge-multiple: true
      - name: Build auditable project research summary
        run: |
          python -m benchmark.multi_agent.project_research \
            --input .runtime/artifacts/nightly-a.jsonl .runtime/artifacts/nightly-b.jsonl \
            --output .runtime/nightly-project-improvement.json \
            --run-id "${GITHUB_RUN_ID}"
      - name: Download previous successful nightly baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_run="$(gh run list --workflow nightly-multi-agent-research.yml --status success --limit 20 --json databaseId --jq 'map(select(.databaseId != (env.GITHUB_RUN_ID|tonumber))) | .[0].databaseId // empty')"
          if [ -z "$previous_run" ]; then
            echo 'No previous successful nightly run is available; producing NO_BASELINE.'
            exit 0
          fi
          mkdir -p .runtime/previous
          if ! gh run download "$previous_run" --name nightly-project-improvement --dir .runtime/previous; then
            echo 'Previous nightly run exists but has no downloadable project-improvement artifact; producing NO_BASELINE.'
            rm -rf .runtime/previous
          fi
      - name: Compare current run with previous baseline
        run: |
          python -m benchmark.multi_agent.baseline \
            --current .runtime/nightly-project-improvement.json \
            --previous .runtime/previous/nightly-project-improvement.json \
            --output .runtime/nightly-baseline.json
      - name: Validate summary and baseline contracts
        shell: python
        run: |
          import json
          from pathlib import Path
          summary = json.loads(Path('.runtime/nightly-project-improvement.json').read_text())
          baseline = json.loads(Path('.runtime/nightly-baseline.json').read_text())
          assert summary['schema'] == 'project-improvement-research/v1'
          assert summary['research_mode'] == 'project_improvement'
          assert summary['project_snapshot']['revision']
          assert summary['program_count'] > 0
          assert 'improvement_signals' in summary
          assert summary['evidence_policy']['llm_findings'] == 'candidate_only_until_acquisition_receipt'
          assert baseline['schema'] == 'project-improvement-baseline/v1'
          assert baseline['decision'] in {'NO_BASELINE', 'IMPROVED', 'REGRESSED', 'STABLE'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-project-improvement
          path: .runtime/nightly-project-improvement.json
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-project-improvement-baseline
          path: .runtime/nightly-baseline.json
          retention-days: 30
      - name: Attest project improvement summary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-project-improvement.json
      - name: Attest project improvement baseline
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-baseline.json
