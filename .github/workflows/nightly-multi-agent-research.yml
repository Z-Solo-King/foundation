name: nightly multi-agent research

on:
  schedule:
    # 01:00 IST = 19:30 UTC on the previous day.
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Explicit deterministic orchestration test only; never enabled by schedule."
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: nightly-multi-agent-research
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  RESEARCH_LLM_ENDPOINT: ${{ secrets.RESEARCH_LLM_ENDPOINT }}
  RESEARCH_LLM_API_KEY: ${{ secrets.RESEARCH_LLM_API_KEY }}
  RESEARCH_LLM_MODEL: ${{ secrets.RESEARCH_LLM_MODEL }}

jobs:
  research:
    name: Nightly research lane ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 380
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: 0
            capacity: 6
          - lane: 1
            capacity: 6
          - lane: 2
            capacity: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Detect live research executor configuration
        id: executor
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          test -n "${RESEARCH_LLM_ENDPOINT:-}" || ready=false
          test -n "${RESEARCH_LLM_API_KEY:-}" || ready=false
          test -n "${RESEARCH_LLM_MODEL:-}" || ready=false
          if [ -n "${RESEARCH_LLM_ENDPOINT:-}" ]; then
            case "$RESEARCH_LLM_ENDPOINT" in
              https://*) ;;
              *) ready=false ;;
            esac
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            echo 'Live research executor configuration: PASS'
          else
            echo 'Live research executor configuration: BLOCKED; this lane will be recorded independently and will not block sibling lanes.'
          fi
      - name: Run live research lane
        if: ${{ steps.executor.outputs.ready == 'true' }}
        continue-on-error: true
        run: |
          python -m benchmark.multi_agent.runner \
            --lane "${{ matrix.lane }}" \
            --global-capacity "${{ matrix.capacity }}" \
            --output ".runtime/nightly-lane-${{ matrix.lane }}.jsonl"
      - name: Run explicit deterministic test lane
        if: ${{ inputs.test_mode == true && steps.executor.outputs.ready != 'true' }}
        run: |
          python -m benchmark.multi_agent.runner \
            --lane "${{ matrix.lane }}" \
            --global-capacity "${{ matrix.capacity }}" \
            --dry-run \
            --output ".runtime/nightly-lane-${{ matrix.lane }}.jsonl"
      - name: Materialize complete lane status
        if: ${{ always() }}
        shell: python
        env:
          LANE: ${{ matrix.lane }}
          EXECUTOR_READY: ${{ steps.executor.outputs.ready }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: |
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          lane = int(os.environ['LANE'])
          ready = os.environ.get('EXECUTOR_READY') == 'true'
          test_mode = os.environ.get('TEST_MODE', '').lower() == 'true'
          path = Path(f'.runtime/nightly-lane-{lane}.jsonl')
          path.parent.mkdir(parents=True, exist_ok=True)
          existing = []
          if path.exists():
              existing = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          observed = {str(row.get('program_id')) for row in existing if row.get('program_id')}
          status = 'completed' if existing else ('blocked_runtime' if not ready and not test_mode else 'failed_runtime')
          now = datetime.now(timezone.utc).isoformat()
          with path.open('w', encoding='utf-8') as handle:
              for row in existing:
                  handle.write(json.dumps(row, ensure_ascii=False) + '\n')
              for slot in range(8):
                  program_id = f'lane{lane}-slot{slot}'
                  if program_id in observed:
                      continue
                  row = {
                      'program_id': program_id,
                      'lane': lane,
                      'slot': slot,
                      'started_at': now,
                      'completed_at': now,
                      'status': status,
                      'allocated_agents': 0,
                      'agent_results': [],
                      'findings': [],
                      'follow_up_questions': [
                          'Live research executor was unavailable before this program could execute.'
                          if status == 'blocked_runtime'
                          else 'Research execution failed before this program produced a complete result.'
                      ],
                  }
                  handle.write(json.dumps(row, ensure_ascii=False) + '\n')
          rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert {row.get('program_id') for row in rows} == {f'lane{lane}-slot{slot}' for slot in range(8)}
          print(f'lane {lane}: materialized 8/8 program records with status={status}')
      - name: Validate lane coverage
        if: ${{ always() }}
        shell: python
        env:
          LANE: ${{ matrix.lane }}
        run: |
          import json
          import os
          from pathlib import Path

          lane = int(os.environ['LANE'])
          rows = [json.loads(line) for line in Path(f'.runtime/nightly-lane-{lane}.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          expected = {f'lane{lane}-slot{slot}' for slot in range(8)}
          observed = {row['program_id'] for row in rows}
          assert observed == expected, f'lane {lane} coverage mismatch: expected {expected}, got {observed}'
          allowed = {'completed', 'blocked_runtime', 'failed_runtime'}
          assert all(row.get('status') in allowed for row in rows)
          print(f'lane {lane}: 8/8 programs accounted for')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: nightly-research-lane-${{ matrix.lane }}
          path: .runtime/nightly-lane-${{ matrix.lane }}.jsonl
          retention-days: 30
      - name: Attest lane artifact
        if: ${{ always() && hashFiles(format('.runtime/nightly-lane-{0}.jsonl', matrix.lane)) != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-lane-${{ matrix.lane }}.jsonl
      - name: Record nightly research runtime status
        if: ${{ always() }}
        shell: python
        env:
          LANE: ${{ matrix.lane }}
          JOB_STATUS: ${{ job.status }}
          EXECUTOR_ENDPOINT: ${{ secrets.RESEARCH_LLM_ENDPOINT }}
          EXECUTOR_KEY: ${{ secrets.RESEARCH_LLM_API_KEY }}
          EXECUTOR_MODEL: ${{ secrets.RESEARCH_LLM_MODEL }}
        run: |
          import json
          import os
          from pathlib import Path

          Path('.runtime').mkdir(parents=True, exist_ok=True)
          endpoint = os.environ.get('EXECUTOR_ENDPOINT', '')
          key = os.environ.get('EXECUTOR_KEY', '')
          model = os.environ.get('EXECUTOR_MODEL', '')
          lane = int(os.environ['LANE'])
          rows = [json.loads(line) for line in Path(f'.runtime/nightly-lane-{lane}.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          payload = {
              'schema': 'nightly-research-runtime-status/v2',
              'lane': lane,
              'job_status': os.environ.get('JOB_STATUS', ''),
              'live_executor_configured': bool(endpoint and key and model),
              'endpoint_configured': bool(endpoint),
              'api_key_configured': bool(key),
              'model_configured': bool(model),
              'program_count': len(rows),
              'completed_program_count': sum(row.get('status') == 'completed' for row in rows),
              'blocked_program_count': sum(row.get('status') == 'blocked_runtime' for row in rows),
              'failed_program_count': sum(row.get('status') == 'failed_runtime' for row in rows),
              'research_executed': any(row.get('status') == 'completed' and row.get('agent_results') for row in rows),
              'note': 'Configuration presence only; secret values are never recorded.',
          }
          Path(f'.runtime/nightly-research-runtime-status-lane-{lane}.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: nightly-research-runtime-status-${{ matrix.lane }}
          path: .runtime/nightly-research-runtime-status-lane-${{ matrix.lane }}.json
          retention-days: 30

  project-summary:
    name: Build nightly Heroic AI improvement evidence
    if: ${{ always() }}
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download all research lane artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: nightly-research-lane-*
          path: .runtime/artifacts
          merge-multiple: true
      - name: Verify all lane artifacts are present
        shell: bash
        run: |
          set -euo pipefail
          for lane in 0 1 2; do
            test -f ".runtime/artifacts/nightly-lane-${lane}.jsonl" || { echo "Missing lane ${lane} artifact"; exit 1; }
          done
      - name: Build auditable project research summary
        run: |
          python -m benchmark.multi_agent.project_research \
            --input \
              .runtime/artifacts/nightly-lane-0.jsonl \
              .runtime/artifacts/nightly-lane-1.jsonl \
              .runtime/artifacts/nightly-lane-2.jsonl \
            --output .runtime/nightly-project-improvement.json \
            --run-id "${GITHUB_RUN_ID}"
      - name: Validate complete nightly coverage
        shell: python
        run: |
          import json
          from pathlib import Path
          summary = json.loads(Path('.runtime/nightly-project-improvement.json').read_text())
          assert summary['schema'] == 'project-improvement-research/v1'
          assert summary['research_mode'] == 'project_improvement'
          assert summary['project_snapshot']['revision']
          assert summary['program_count'] == 24
          assert 'improvement_signals' in summary
          assert summary['evidence_policy']['llm_findings'] == 'candidate_only_until_acquisition_receipt'
      - name: Download previous successful nightly baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_run="$(gh run list --workflow nightly-multi-agent-research.yml --status success --limit 20 --json databaseId --jq 'map(select(.databaseId != (env.GITHUB_RUN_ID|tonumber))) | .[0].databaseId // empty')"
          if [ -z "$previous_run" ]; then
            echo 'No previous successful nightly run is available; producing NO_BASELINE.'
            exit 0
          fi
          mkdir -p .runtime/previous
          if ! gh run download "$previous_run" --name nightly-project-improvement --dir .runtime/previous; then
            echo 'Previous nightly run exists but has no downloadable project-improvement artifact; producing NO_BASELINE.'
            rm -rf .runtime/previous
          fi
      - name: Compare current run with previous baseline
        run: |
          python -m benchmark.multi_agent.baseline \
            --current .runtime/nightly-project-improvement.json \
            --previous .runtime/previous/nightly-project-improvement.json \
            --output .runtime/nightly-baseline.json
      - name: Validate baseline contract
        shell: python
        run: |
          import json
          from pathlib import Path
          baseline = json.loads(Path('.runtime/nightly-baseline.json').read_text())
          assert baseline['schema'] == 'project-improvement-baseline/v1'
          assert baseline['decision'] in {'NO_BASELINE', 'IMPROVED', 'REGRESSED', 'STABLE'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-project-improvement
          path: .runtime/nightly-project-improvement.json
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-project-improvement-baseline
          path: .runtime/nightly-baseline.json
          retention-days: 30
      - name: Attest project improvement summary
        if: ${{ hashFiles('.runtime/nightly-project-improvement.json') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-project-improvement.json
      - name: Attest project improvement baseline
        if: ${{ hashFiles('.runtime/nightly-baseline.json') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .runtime/nightly-baseline.json

  runtime-diagnostic:
    name: Publish nightly research runtime diagnosis
    if: ${{ always() }}
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download lane runtime status artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: nightly-research-runtime-status-*
          path: .runtime/runtime-status
          merge-multiple: true
      - name: Build runtime diagnosis
        shell: python
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          import json
          import os
          from pathlib import Path

          root = Path('.runtime/runtime-status')
          rows = []
          if root.exists():
              for path in sorted(root.glob('nightly-research-runtime-status-lane-*.json')):
                  rows.append(json.loads(path.read_text(encoding='utf-8')))
          configured = bool(rows) and all(row.get('live_executor_configured') for row in rows)
          executed = bool(rows) and all(row.get('research_executed') for row in rows)
          diagnosis = {
              'schema': 'nightly-research-runtime-diagnosis/v2',
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'lane_count_observed': len(rows),
              'live_executor_configured': configured,
              'research_executed': executed,
              'research_findings_available': executed,
              'status': 'research_available' if executed else 'runtime_blocked_before_research',
              'lanes': rows,
          }
          Path('.runtime').mkdir(parents=True, exist_ok=True)
          Path('.runtime/nightly-research-runtime-diagnosis.json').write_text(
              json.dumps(diagnosis, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-research-runtime-diagnosis
          path: .runtime/nightly-research-runtime-diagnosis.json
          retention-days: 30
