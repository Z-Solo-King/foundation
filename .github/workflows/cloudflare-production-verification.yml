name: cloudflare-production-verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for same-commit public tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            runs=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${GITHUB_SHA}&per_page=20")
            status=$(jq -r '.workflow_runs[0].status // "missing"' <<<"$runs")
            conclusion=$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$runs")
            echo "public-tests status=${status} conclusion=${conclusion} attempt=${attempt}"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo 'public-tests did not pass; refusing deployment'; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for public-tests'
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user/tokens/verify | jq -e '.success == true and .result.status == "active"' >/dev/null

      - name: Discover public D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          databases=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")
          database_id=$(jq -r '.result[] | select(.name == "research-intelligence") | .uuid' <<<"$databases" | head -n 1)
          test -n "$database_id" && test "$database_id" != null
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Generate production config
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.production.generated.toml <<EOF
name = "research-intelligence-engine-public"
main = "worker.py"
compatibility_date = "2026-09-09"
compatibility_flags = ["python_workers"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "research-intelligence"
database_id = "${D1_DATABASE_ID}"

[vars]
ENVIRONMENT = "production"
STRICT_ZERO_COST_ONLY = "true"
B2_BUCKET = "SoloKing"
B2_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
EOF

      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.131.1 d1 migrations apply research-intelligence --remote --config wrangler.production.generated.toml

      - name: Deploy public Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.131.1 deploy --config wrangler.production.generated.toml

      - name: Verify public Worker health
        run: |
          set -euo pipefail
          curl -fsS https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/health | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json

      - name: Verify Cloudflare D1 and B2 through chatbot bridge
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AUTH_TOKEN:-}" || { echo 'Missing AUTH_TOKEN'; exit 1; }
          status=$(curl -sS -o /tmp/chatbot.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"operation":"infrastructure_verify_public_test"}' \
            https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/api/v1/chatbot/diagnostic)
          cat /tmp/chatbot.json
          test "$status" = "200"
          jq -e '
            .ok == true and
            .status == "ok" and
            (.checks | map(select(.ok != true)) | length == 0) and
            ([.checks[].name] | index("public_chatbot")) and
            ([.checks[].name] | index("cloudflare_d1")) and
            ([.checks[].name] | index("backblaze_b2_lifecycle"))
          ' /tmp/chatbot.json
