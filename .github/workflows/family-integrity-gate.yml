name: Family integrity gate

on:
  push:
    branches: [main]
  schedule:
    - cron: "45 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: family-integrity-gate
  cancel-in-progress: true

jobs:
  family-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
          permission-issues: read
      - name: Snapshot live issue universe at run start
        run: |
          set -euo pipefail
          mkdir -p .runtime/family-integrity
          gh api --paginate "repos/Z-Solo-King/foundation/issues?state=open&per_page=100" > /tmp/foundation-open.json
          gh api --paginate "repos/Z-Solo-King/operations/issues?state=open&per_page=100" > /tmp/operations-open.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for repo, path in (("foundation", "/tmp/foundation-open.json"), ("operations", "/tmp/operations-open.json")):
              for item in json.loads(Path(path).read_text(encoding="utf-8")):
                  if "pull_request" not in item:
                      rows.append({"repo": repo, "number": item["number"], "title": item["title"]})
          rows.sort(key=lambda x: (x["repo"], x["number"]))
          Path(".runtime/family-integrity/live_open_issues_snapshot.json").write_text(
              json.dumps({"schema": "live-open-issue-snapshot/v1", "actual": rows}, indent=2) + "\n",
              encoding="utf-8"
          )
          PY
      - name: Verify family contracts and frozen live issue inventory
        env:
          FOUNDATION_GH_TOKEN: ${{ github.token }}
          OPERATIONS_GH_TOKEN: ${{ steps.operations-app.outputs.token }}
          LIVE_ISSUE_SNAPSHOT: .runtime/family-integrity/live_open_issues_snapshot.json
        run: node scripts/family_integrity_check.js
      - name: Upload integrity receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: family-integrity-receipt-${{ github.run_id }}
          path: |
            docs/FAMILY_INTEGRATION_GRAPH.json
            docs/OPEN_ISSUE_ACCEPTANCE_MATRIX.json
            docs/FAMILY_SYNC_STATE.json
            .runtime/family-integrity/live_open_issues_snapshot.json
          retention-days: 30
          if-no-files-found: error
