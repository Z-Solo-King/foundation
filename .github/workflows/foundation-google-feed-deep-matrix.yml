name: Foundation Google Feed Deep Matrix

on:
  push:
    branches:
      - feat/foundation-google-feed-matrix-20260926
    paths:
      - tools/google_feed_deep_probe.mjs
      - .github/workflows/foundation-google-feed-deep-matrix.yml

permissions:
  contents: read

jobs:
  deep:
    name: "${{ matrix.site }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - {site: "BuildMyPC", roots: "https://www.buildmypc.in"}
          - {site: "Easy Shoppi", roots: "https://www.easyshoppi.com"}
          - {site: "Fingers", roots: "https://www.fingers.co.in"}
          - {site: "LebyoPC", roots: "https://lebyopc.com"}
          - {site: "ArcadeX", roots: "https://www.arcadex.in"}
          - {site: "altf4gear", roots: "https://altf4gear.com"}
          - {site: "Shivam IT Service", roots: "https://shivamitservice.com,https://api.shivamitservice.in"}
          - {site: "Logtech", roots: "https://logtech.in"}
          - {site: "DigiBuggy", roots: "https://digibuggy.com"}
          - {site: "TheValueStore", roots: "https://thevaluestore.in"}
          - {site: "Furtados", roots: "https://www.furtadosonline.com"}
          - {site: "KeySync", roots: "https://keysync.co,https://api.keysync.co"}
          - {site: "The Rhythm House", roots: "https://www.therhythmhouse.co.in"}
          - {site: "CloudTechAsia", roots: "https://cloudtechasia.in,https://api.hyperinvento.com"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Deep source mining
        env:
          SITE_NAME: "${{ matrix.site }}"
          ROOTS: "${{ matrix.roots }}"
        run: node tools/google_feed_deep_probe.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: google-feed-deep-${{ strategy.job-index }}-${{ matrix.site }}
          path: artifacts/google-feed-deep/
          retention-days: 14
