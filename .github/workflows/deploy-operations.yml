name: deploy-operations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-operations.yml"

permissions:
  contents: read

concurrency:
  group: operations-production
  cancel-in-progress: false

env:
  OPERATIONS_REPOSITORY: Z-Solo-King/operations
  OPERATIONS_REF: cf28a28cb40de527aff1cd87f96e103669635f70

jobs:
  deploy:
    name: Deploy Operations production Worker
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | jq -e '.success == true and .result.status == "active"' >/dev/null

      - name: Configure ephemeral Git authentication
        shell: bash
        env:
          BACKUP_GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_GITHUB_TOKEN:-}" || { echo 'Missing BACKUP_GITHUB_TOKEN'; exit 1; }
          askpass="$RUNNER_TEMP/git-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$BACKUP_GITHUB_TOKEN" ;;
            *) printf '%s\n' '' ;;
          esac
          EOF
          chmod 700 "$askpass"
          printf 'GIT_ASKPASS=%s\n' "$askpass" >> "$GITHUB_ENV"
          printf 'GIT_TERMINAL_PROMPT=0\n' >> "$GITHUB_ENV"

      - name: Checkout exact Operations revision
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/operations"
          git clone --no-checkout "https://github.com/${OPERATIONS_REPOSITORY}.git" "$RUNNER_TEMP/operations"
          git -C "$RUNNER_TEMP/operations" fetch --no-tags --depth=1 origin "$OPERATIONS_REF"
          git -C "$RUNNER_TEMP/operations" checkout --detach "$OPERATIONS_REF"
          actual=$(git -C "$RUNNER_TEMP/operations" rev-parse HEAD)
          test "$actual" = "$OPERATIONS_REF"

      - name: Apply canonical resource-governance schema
        working-directory: ${{ runner.temp }}/operations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.1 d1 execute research-intelligence --remote \
            --file=docs/RESOURCE_GOVERNANCE_D1_SCHEMA.sql \
            --config=wrangler.toml

      - name: Deploy exact Operations Worker revision
        working-directory: ${{ runner.temp }}/operations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pywrangler deploy \
            --config wrangler.toml \
            --message "github:${OPERATIONS_REF}"

      - name: Sync shared authentication secret
        working-directory: ${{ runner.temp }}/operations
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${AUTH_TOKEN:-}" || { echo 'Missing AUTH_TOKEN GitHub secret'; exit 1; }
          printf '%s' "$AUTH_TOKEN" | npx --yes wrangler@4.131.1 secret put AUTH_TOKEN --config wrangler.toml

      - name: Verify deployment metadata without exposing secrets
        working-directory: ${{ runner.temp }}/operations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.1 deployments list --name research-intelligence-engine-private --config wrangler.toml | head -80

      - name: Remove private checkout and authentication helper
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/operations" "$RUNNER_TEMP/git-askpass.sh"
