name: Monitor OEM Spec API Validation
on:
  push:
    branches:
      - probe/monitor-oem-api-20260926
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate monitor specification APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > validate.py <<'PY'
          import urllib.request, urllib.parse, json, re, os, time

          H = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36",
              "Accept": "application/json,text/html,application/xml,text/xml,*/*",
              "Accept-Language": "en-IN,en;q=0.9",
              "X-Requested-With": "XMLHttpRequest",
          }

          def get(url, headers=None, timeout=18):
              hh = dict(H); hh.update(headers or {})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=hh), timeout=timeout)
                  b = r.read(12000000).decode("utf-8", "replace")
                  return {"status": r.status, "ctype": r.headers.get("content-type",""), "bytes": len(b), "body": b}
              except Exception as e:
                  return {"status": 0, "ctype": "", "bytes": 0, "body": "", "error": type(e).__name__ + ":" + str(e)}

          def post(url, obj, headers=None, timeout=20):
              hh = dict(H); hh["Content-Type"]="application/json"; hh.update(headers or {})
              try:
                  data=json.dumps(obj).encode()
                  r=urllib.request.urlopen(urllib.request.Request(url,data=data,headers=hh,method="POST"),timeout=timeout)
                  b=r.read(12000000).decode("utf-8","replace")
                  return {"status":r.status,"ctype":r.headers.get("content-type",""),"bytes":len(b),"body":b}
              except Exception as e:
                  return {"status":0,"ctype":"","bytes":0,"body":"","error":type(e).__name__+":"+str(e)}

          def js(body):
              try:return json.loads(body)
              except:return None

          out={}

          # ROG: exact contract from current bundle source
          rogu = "https://api-rog.asus.com/recent-data/search-api/v1/ResultV1/in/Product/50/1/1/1?SearchKey=monitor&systemCode=rog"
          rr=get(rogu)
          rj=js(rr["body"]) or {}
          robj=((rj.get("result") or {}).get("obj") or [])
          rres={"search":{"status":rr["status"],"bytes":rr["bytes"],"count":((rj.get("result") or {}).get("count")),"objects":len(robj),"sample":robj[:3]},"detail":[]}
          for p in robj[:3]:
              m1=p.get("productId") or p.get("id"); part=(p.get("partNo") or (p.get("skus") or [{}])[0].get("partNo"))
              for label,url in [
                  ("spec_v5","https://api-rog.asus.com/recent-data/api/v5/Product/Spec?"+urllib.parse.urlencode({"m1Id":m1,"WebsiteCode":"in"})),
                  ("model_spec_v5","https://api-rog.asus.com/recent-data/api/v5/Product/ModelSpec?"+urllib.parse.urlencode({"m1Id":m1,"WebsiteCode":"in"})),
                  ("common_spec_v4","https://api-rog.asus.com/recent-data/api/v4/Common/Spec?"+urllib.parse.urlencode({"WebsiteCode":"in","PartNo":part})),
                  ("info_v4","https://api-rog.asus.com/recent-data/api/v4/Product/Info?"+urllib.parse.urlencode({"m1Id":m1,"WebsiteCode":"in"})),
                  ("tabs_v4","https://api-rog.asus.com/recent-data/api/v4/Product/Tabs?"+urllib.parse.urlencode({"m1Id":m1,"WebsiteCode":"in"})),
              ]:
                  x=get(url)
                  rres["detail"].append({"productId":m1,"partNo":part,"type":label,"url":url,"status":x["status"],"ctype":x["ctype"],"bytes":x["bytes"],"sample":x["body"][:12000]})
          out["rog"]=rres

          # ASUS exact search contract
          au="https://odinapi.asus.com/recent-data/apiv2/SearchResult?"+urllib.parse.urlencode({
              "SystemCode":"asus","WebsiteCode":"in","SearchKey":"monitor","SearchType":"products",
              "SearchPDLine":"","SearchPDLine2":"","PDLineFilter":"","TopicFilter":"","CateFilter":"",
              "PageSize":100,"Pages":1,"LocalFlag":0,"siteID":"www","sitelang":""
          })
          ar=get(au); aj=js(ar["body"]) or {}
          out["asus"]={"url":au,"status":ar["status"],"bytes":ar["bytes"],"topKeys":list(aj)[:30],"sample":ar["body"][:18000]}

          # Samsung current search + product/full + guessed specification resource names
          su="https://p1-smi-api-cdn.shop.samsung.com/tokocommercewebservices/v2/in/products/search?"+urllib.parse.urlencode({"query":"odyssey:relevance","pageSize":100,"currentPage":0,"fields":"FULL"})
          sr=get(su); sj=js(sr["body"]) or {}; sproducts=sj.get("products") or []
          sres={"search":{"status":sr["status"],"bytes":sr["bytes"],"pagination":sj.get("pagination"),"products":len(sproducts),"first":sproducts[:2]},"details":[]}
          for p in sproducts[:2]:
              code=p.get("code")
              for path in [
                  "/products/"+urllib.parse.quote(str(code),safe=""),
                  "/products/"+urllib.parse.quote(str(code),safe="")+"/specifications",
                  "/products/"+urllib.parse.quote(str(code),safe="")+"/specs",
                  "/products/"+urllib.parse.quote(str(code),safe="")+"/techSpecs",
                  "/products/"+urllib.parse.quote(str(code),safe="")+"/technicalSpecifications",
              ]:
                  url="https://p1-smi-api-cdn.shop.samsung.com/tokocommercewebservices/v2/in"+path+"?fields=FULL"
                  x=get(url)
                  sres["details"].append({"code":code,"url":url,"status":x["status"],"ctype":x["ctype"],"bytes":x["bytes"],"hasTechSpecs":("techSpecs" in x["body"]),"sample":x["body"][:7000]})
          out["samsung"]=sres

          # Dell product API with monitor search and custom attributes
          filters=[
              ("searchCriteria[filterGroups][0][filters][0][field]","name"),
              ("searchCriteria[filterGroups][0][filters][0][value]","%25Monitor%25"),
              ("searchCriteria[filterGroups][0][filters][0][conditionType]","like"),
              ("searchCriteria[pageSize]","50"),
              ("searchCriteria[currentPage]","1"),
          ]
          du="https://www.dellstore.com/rest/V1/products?"+urllib.parse.urlencode(filters)
          dr=get(du); dj=js(dr["body"]) or {}; ditem=dj.get("items") or []
          dres={"url":du,"status":dr["status"],"bytes":dr["bytes"],"items":len(ditem),"sample":[]}
          for p in ditem[:5]:
              attrs={a.get("attribute_code"):a.get("value") for a in (p.get("custom_attributes") or []) if isinstance(a,dict)}
              dres["sample"].append({"sku":p.get("sku"),"name":p.get("name"),"price":attrs.get("price") or p.get("price"),"attrKeys":list(attrs)[:100],"attrs":attrs})
              if p.get("sku"):
                  ss=get("https://www.dellstore.com/rest/V1/stockStatuses/"+urllib.parse.quote(str(p["sku"]),safe=""))
                  dres["sample"][-1]["stock"]={"status":ss["status"],"sample":ss["body"][:3000]}
          out["dell"]=dres

          # LG exact Ask-LG contract from live JS: locale + sku + product_name + category
          lurl="https://www.lg.com/in/monitors/ultragear-gaming-oled-monitors/27gx790a-b/"
          lp=get(lurl); body=lp["body"]
          mdids=sorted(set(re.findall(r"MD[0-9]{8,}",body)))
          skus=sorted(set(re.findall(r"\b(?:27GX790A-B|27GX[0-9A-Z-]+)\b",body,re.I)))
          lres={"pageStatus":lp["status"],"mdids":mdids[:20],"skus":skus[:20],"tests":[]}
          sku=skus[0] if skus else "27GX790A-B"
          for cat in ["monitors","monitor","monitors/ultragear","ultragear","ultragear-gaming-oled-monitors"]:
              q={"locale":"in","sku":sku,"product_name":sku,"category":cat}
              url="https://www.lg.com/api/commerce/content/pdp_items?"+urllib.parse.urlencode(q)
              x=get(url,{"Referer":lurl,"Origin":"https://www.lg.com"})
              lres["tests"].append({"url":url,"status":x["status"],"ctype":x["ctype"],"bytes":x["bytes"],"sample":x["body"][:8000]})
          out["lg"]=lres

          # Acer GraphQL introspection
          gi="https://store.acer.com/en-in/graphql"
          schemaq={"query":"{ __schema { queryType { fields { name args { name type { kind name ofType { kind name } } } } } } }"}
          gx=post(gi,schemaq)
          gjson=js(gx["body"]) or {}
          out["acer"]={"status":gx["status"],"bytes":gx["bytes"],"schema":gjson.get("data"),"errors":gjson.get("errors"),"sample":gx["body"][:16000]}

          # AOC source page: capture exact API parameter names from HTML
          ap="https://www.aoc.com/in/gaming/monitors/27g4"
          ax=get(ap); ab=ax["body"]
          terms=["price-data","screen-size-variants","/api/asset/pi"]
          ares={"pageStatus":ax["status"],"bytes":ax["bytes"],"contexts":[]}
          for term in terms:
              start=0
              while True:
                  i=ab.lower().find(term.lower(),start)
                  if i<0:break
                  ares["contexts"].append({"term":term,"context":ab[max(0,i-900):i+2200]})
                  start=i+len(term)
                  if len(ares["contexts"])>=30:break
          out["aoc"]=ares

          # MSI source page: capture API-looking URLs from current specification page
          mp="https://www.msi.com/Monitor/MAG-274UPF/Specification"
          mx=get(mp); mb=mx["body"]
          mres={"pageStatus":mx["status"],"bytes":mx["bytes"],"contexts":[]}
          for term in ["/api/","Product","Specification","datasheet","storage-asset","json"]:
              start=0
              while True:
                  i=mb.lower().find(term.lower(),start)
                  if i<0:break
                  mres["contexts"].append({"term":term,"context":mb[max(0,i-700):i+1800]})
                  start=i+len(term)
                  if len(mres["contexts"])>=35:break
          out["msi"]=mres

          # BenQ source: look for embedded structured state/API markers
          bp="https://www.benq.com/en-in/monitor/gaming/ex271/spec.html"
          bx=get(bp); bb=bx["body"]
          bres={"pageStatus":bx["status"],"bytes":bx["bytes"],"markers":[]}
          for term in ["g6-product-spec-page","__NEXT_DATA__","product","specifications","api/","graphql"]:
              start=0
              while True:
                  i=bb.lower().find(term.lower(),start)
                  if i<0:break
                  bres["markers"].append({"term":term,"context":bb[max(0,i-500):i+1600]})
                  start=i+len(term)
                  if len(bres["markers"])>=40:break
          out["benq"]=bres

          os.makedirs("out",exist_ok=True)
          open("out/monitor-spec-api-validation.json","w").write(json.dumps(out,indent=2,default=str))
          print(json.dumps(out,indent=2,default=str)[:120000])
          PY
          python3 validate.py
          test -s out/monitor-spec-api-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-spec-api-validation-20260926
          path: out/monitor-spec-api-validation.json
          retention-days: 14
