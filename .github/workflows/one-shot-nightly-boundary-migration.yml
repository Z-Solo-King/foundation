name: one-shot nightly boundary migration

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create audited nightly boundary update PR
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_REF: b6a519742e57e7e68db64ab10535d76372bcbdb1
          NEW_REF: e34cd63d47e7eb9dd5049a9e2a90bd7d3caab4ee
          UPDATE_BRANCH: chore/nightly-boundary-update-2026-09-17
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/nightly-multi-agent-research.yml
          if ! grep -Fq "$OLD_REF" "$workflow"; then
            echo 'Nightly workflow is already current; no migration required.'
            exit 0
          fi
          if gh pr list --state open --head "$UPDATE_BRANCH" --json number --jq 'length' | grep -q '^1$'; then
            echo 'Nightly boundary update PR already exists.'
            exit 0
          fi

          git fetch origin main
          git checkout -B "$UPDATE_BRANCH" origin/main
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('.github/workflows/nightly-multi-agent-research.yml')
          text = path.read_text(encoding='utf-8')
          old_ref = os.environ['OLD_REF']
          new_ref = os.environ['NEW_REF']
          if text.count(old_ref) != 1:
              raise SystemExit(f'expected exactly one stale Operations revision, found {text.count(old_ref)}')
          text = text.replace(old_ref, new_ref, 1)
          marker = '''      - name: Validate live lane coverage\n'''
          insertion = '''      - name: Validate public research artifact boundary\n        id: public_boundary\n        if: ${{ steps.run_lane.outcome == 'success' }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          python benchmark/public_runner_boundary.py ".runtime/nightly-lane-${{ matrix.lane }}.jsonl" --lane "${{ matrix.lane }}"\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one live coverage marker')
          if 'benchmark/public_runner_boundary.py' in text:
              raise SystemExit('public boundary validator is already integrated')
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text, encoding='utf-8')
          
          migration = Path('.github/workflows/one-shot-nightly-boundary-migration.yml')
          migration.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/nightly-multi-agent-research.yml .github/workflows/one-shot-nightly-boundary-migration.yml
          git commit -m 'security: advance nightly Operations pin and validate public artifacts'
          git push --set-upstream origin "$UPDATE_BRANCH"
          gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title 'security: advance nightly Operations pin and enforce public artifact boundary' \
            --body 'Updates the canonical nightly research workflow to the current Operations main revision and validates every lane artifact against the Foundation-owned public schema before upload. The one-shot migration workflow deletes itself in this PR after producing the update. Protected main remains unchanged until normal required checks pass.'
