name: main push Actions secret probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-job-graph:
    name: Secret-bearing job graph probe
    runs-on: ubuntu-latest
    env:
      PROBE_TOKEN: ${{ secrets.AUTH_TOKEN }}
    steps:
      - name: Verify runner and secret binding without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA:-}"
          if [ -n "${PROBE_TOKEN:-}" ]; then
            echo 'secret binding: present'
          else
            echo 'secret binding: absent'
          fi
