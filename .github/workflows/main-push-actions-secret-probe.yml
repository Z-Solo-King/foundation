name: main push Actions secret probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-job-graph:
    name: Secret-bearing job graph probe
    runs-on: ubuntu-latest
    env:
      PROBE_TOKEN: ${{ secrets.AUTH_TOKEN }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
    steps:
      - name: Verify runner and secret binding without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA:-}"
          if [ -n "${PROBE_TOKEN:-}" ]; then
            echo 'AUTH_TOKEN binding: present'
          else
            echo 'AUTH_TOKEN binding: absent'
            exit 1
          fi
          test -n "${B2_KEY_ID:-}" || { echo 'B2_KEY_ID binding: absent'; exit 1; }
          test -n "${B2_APPLICATION_KEY:-}" || { echo 'B2_APPLICATION_KEY binding: absent'; exit 1; }
          test -n "${B2_BUCKET:-}" || { echo 'B2_BUCKET binding: absent'; exit 1; }
          echo 'B2 secret bindings: present'
          aws s3api head-bucket             --bucket "$B2_BUCKET"             --endpoint-url 'https://s3.eu-central-003.backblazeb2.com'
          echo 'B2 credential/bucket authentication: PASS'
