name: Autonomous engineering supervisor

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan and validate only; do not dispatch a child workflow"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: autonomous-engineering-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    name: Plan, dispatch and reconcile one mission
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUBLIC_WORKER_URL: https://ai-cio.pages.dev
      MAX_PLANNING_CYCLES: "6"
      MAX_WORKFLOW_ATTEMPTS: "3"
    steps:
      - name: Checkout Foundation main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate autonomous router
        run: node --test tests/autonomous_mission_router.test.mjs

      - name: Snapshot open work and child runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/autonomous
          git fetch --no-tags origin main
          git checkout --detach origin/main
          git rev-parse HEAD > .runtime/autonomous/foundation_sha.txt
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"[autonomous-mission]" in:title' --json number,title,body,updatedAt --limit 5 > .runtime/autonomous/active_missions.json
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title,body,labels,updatedAt --limit 20 > .runtime/autonomous/open_issues.json
          gh run list --repo "$GITHUB_REPOSITORY" --limit 35 --json databaseId,name,status,conclusion,headSha,event,createdAt,url > .runtime/autonomous/recent_runs.json

      - name: Resolve active mission
        shell: python
        run: |
          import json, re
          from pathlib import Path
          active = json.loads(Path('.runtime/autonomous/active_missions.json').read_text())
          mission = active[0] if active else None
          state = {}
          if mission:
              body = mission.get('body') or ''
              match = re.search(r'<!-- autonomous-mission-state:start -->\s*```json\s*([\s\S]*?)\s*```\s*<!-- autonomous-mission-state:end -->', body)
              if match:
                  state = json.loads(match.group(1))
          payload = {'issue': mission, 'state': state}
          Path('.runtime/autonomous/active.json').write_text(json.dumps(payload, indent=2, sort_keys=True))
          print(json.dumps(payload, indent=2))

      - name: Create mission when queue is clear
        if: ${{ fromJSON(steps.none.outputs.no_active || 'false') == true }}
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mission_id="mission-${GITHUB_RUN_ID}"
          printf '%s\n' "$mission_id" > .runtime/autonomous/mission_id.txt
          cat > .runtime/autonomous/new_issue.md <<EOF
          # Autonomous engineering mission

          <!-- autonomous-mission-state:start -->
          ```json
          {
            "schema": "autonomous-mission-state/v1",
            "mission_id": "$mission_id",
            "mission_type": null,
            "state": "planning",
            "foundation_sha": "$(cat .runtime/autonomous/foundation_sha.txt)",
            "cycle": 0,
            "workflow_attempts": {},
            "child_runs": [],
            "last_plan_digest": null,
            "last_provider": null,
            "last_summary": "mission created by autonomous supervisor",
            "terminal_reason": null
          }
          ```
          <!-- autonomous-mission-state:end -->
          EOF
          url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "[autonomous-mission] $mission_id" --body-file .runtime/autonomous/new_issue.md)"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "[autonomous-mission] $mission_id in:title" --json number --limit 1 --jq '.[0].number')"
          test -n "$number"
          printf '%s\n' "$number" > .runtime/autonomous/issue_number.txt
          echo "Created mission issue #$number: $url"

      - name: Prepare mission identity
        id: none
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.issue != null' .runtime/autonomous/active.json >/dev/null; then
            number="$(jq -r '.issue.number' .runtime/autonomous/active.json)"
            mission_id="$(jq -r '.state.mission_id // empty' .runtime/autonomous/active.json)"
            if [[ -z "$mission_id" ]]; then mission_id="mission-${GITHUB_RUN_ID}"; fi
            printf '%s\n' "$number" > .runtime/autonomous/issue_number.txt
            printf '%s\n' "$mission_id" > .runtime/autonomous/mission_id.txt
            echo "no_active=false" >> "$GITHUB_OUTPUT"
          else
            echo "no_active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-read mission after possible creation
        if: ${{ steps.none.outputs.no_active == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="$(cat .runtime/autonomous/issue_number.txt)"
          gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json number,title,body,updatedAt > .runtime/autonomous/mission.json

      - name: Reconcile child workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > .runtime/autonomous/child_runs.jsonl
          ids="$(jq -r '.state.child_runs[]? // empty' .runtime/autonomous/active.json 2>/dev/null || true)"
          if [[ -f .runtime/autonomous/mission.json ]]; then ids=""; fi
          if [[ -n "$ids" ]]; then
            while read -r id; do
              [[ -z "$id" ]] && continue
              gh run view "$id" --repo "$GITHUB_REPOSITORY" --json databaseId,name,status,conclusion,headSha,event,url > ".runtime/autonomous/run-$id.json"
              cat ".runtime/autonomous/run-$id.json" >> .runtime/autonomous/child_runs.jsonl
              printf '\n' >> .runtime/autonomous/child_runs.jsonl
            done <<< "$ids"
          fi

      - name: Build planner context
        shell: python
        run: |
          import json, re
          from pathlib import Path
          active = json.loads(Path('.runtime/autonomous/active.json').read_text())
          mission = json.loads(Path('.runtime/autonomous/mission.json').read_text()) if Path('.runtime/autonomous/mission.json').exists() else active.get('issue')
          state = active.get('state') or {}
          issues = json.loads(Path('.runtime/autonomous/open_issues.json').read_text())
          runs = json.loads(Path('.runtime/autonomous/recent_runs.json').read_text())
          # Keep planner context compact; ChatGPT context is explicitly disposable.
          trimmed_issues = []
          for item in issues[:20]:
              trimmed_issues.append({"number":item.get("number"),"title":item.get("title"),"body":re.sub(r'\s+',' ',item.get('body') or '')[:1400],"updatedAt":item.get("updatedAt")})
          trimmed_runs = []
          for item in runs[:35]:
              trimmed_runs.append({k:item.get(k) for k in ('databaseId','name','status','conclusion','headSha','event','createdAt','url')})
          child = []
          p = Path('.runtime/autonomous/child_runs.jsonl')
          if p.exists():
              for line in p.read_text().splitlines():
                  if line.strip(): child.append(json.loads(line))
          context = {
              "mission": state,
              "foundation_sha": Path('.runtime/autonomous/foundation_sha.txt').read_text().strip(),
              "open_issues": trimmed_issues,
              "recent_runs": trimmed_runs,
              "child_runs": child,
              "constraints": {"max_planning_cycles":6,"max_same_workflow_dispatches":3,"workflow_inputs":{},"production_release_allowed":False,"secrets_or_policy_mutation_allowed":False},
              "instruction": "Choose one bounded next engineering step. Prefer novel evidence over repeating a known blocked action. Never invent evidence. Return JSON only using schema autonomous-mission-plan/v1. A nonterminal plan may dispatch only an allowlisted workflow with empty inputs.",
          }
          Path('.runtime/autonomous/planner-context.json').write_text(json.dumps(context, ensure_ascii=False, indent=2))

      - name: Call governed AI planner
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AUTH_TOKEN" || { echo "AUTH_TOKEN is required for autonomous planner; no mutation performed."; exit 1; }
          mission_id="$(cat .runtime/autonomous/mission_id.txt)"
          cycle="$(jq -r '.state.cycle // 0' .runtime/autonomous/active.json 2>/dev/null || echo 0)"
          if [[ -f .runtime/autonomous/mission.json ]]; then cycle="$(python - <<'PY'
import json
from pathlib import Path
b=Path('.runtime/autonomous/mission.json').read_text()
import re
m=re.search(r'<!-- autonomous-mission-state:start -->\s*```json\s*([\s\S]*?)\s*```\s*<!-- autonomous-mission-state:end -->',b)
print(json.loads(m.group(1)).get('cycle',0) if m else 0)
PY
)"; fi
          context="$(cat .runtime/autonomous/planner-context.json)"
          python - "$PUBLIC_WORKER_URL" "$AUTH_TOKEN" "$mission_id" "$cycle" "$context" <<'PY' > .runtime/autonomous/planner-response.json
import json, sys, urllib.request, urllib.error
url, token, mission_id, cycle, context = sys.argv[1:]
payload = {
  'chat_id': mission_id,
  'request_id': f'autonomous-plan:{mission_id}:{cycle}',
  'message': 'AUTONOMOUS_ENGINEERING_PLAN_V1\nReturn JSON only. '+context,
  'mode': 'chat',
  'operation': 'knowledge',
  'strict_zero_cost_only': True,
  'require_model_generation': True,
  'metadata': {'autonomous':'true','plan_version':'v1'},
}
request = urllib.request.Request(url + '/api/v1/chat', data=json.dumps(payload).encode(), headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Idempotency-Key':payload['request_id']}, method='POST')
try:
    with urllib.request.urlopen(request, timeout=90) as response:
        print(response.read().decode())
except urllib.error.HTTPError as exc:
    print(json.dumps({'ok':False,'error':f'planner_http_{exc.code}'}))
    raise SystemExit(2)
except Exception as exc:
    print(json.dumps({'ok':False,'error':'planner_transport_failure','detail':type(exc).__name__}))
    raise SystemExit(2)
PY

      - name: Validate AI plan
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          node tools/autonomous_mission_router.mjs .runtime/autonomous/planner-response.json > .runtime/autonomous/normalized-plan.json
          sha256sum .runtime/autonomous/normalized-plan.json | cut -d' ' -f1 > .runtime/autonomous/plan_digest.txt

      - name: Enforce mission bounds and persist state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(cat .runtime/autonomous/issue_number.txt)"
          python - "$number" <<'PY'
import json, os, re, subprocess
from pathlib import Path
number=os.environ['1'] if '1' in os.environ else None
PY
          python - <<'PY'
import json, re, subprocess, os
from pathlib import Path
issue_no=Path('.runtime/autonomous/issue_number.txt').read_text().strip()
plan=json.loads(Path('.runtime/autonomous/normalized-plan.json').read_text())
active=json.loads(Path('.runtime/autonomous/active.json').read_text())
state=active.get('state') or {}
cycle=int(state.get('cycle') or 0)+1
attempts=dict(state.get('workflow_attempts') or {})
children=list(state.get('child_runs') or [])
for action in plan['actions']:
    w=action['workflow']; attempts[w]=int(attempts.get(w,0))+1
    if attempts[w] > 3: raise SystemExit(f'same-workflow dispatch bound exceeded: {w}')
if cycle > 6: raise SystemExit('planning cycle bound exceeded')
new_state={
  'schema':'autonomous-mission-state/v1',
  'mission_id':state.get('mission_id') or f'mission-{os.environ.get("GITHUB_RUN_ID")}',
  'mission_type':plan['mission_type'],
  'state':'blocked' if plan['terminal']=='blocked' else ('complete' if plan['terminal']=='complete' else 'planned'),
  'foundation_sha':Path('.runtime/autonomous/foundation_sha.txt').read_text().strip(),
  'cycle':cycle,
  'workflow_attempts':attempts,
  'child_runs':children,
  'last_plan_digest':Path('.runtime/autonomous/plan_digest.txt').read_text().strip(),
  'last_provider':None,
  'last_summary':plan['summary'],
  'terminal_reason':plan.get('stop_reason'),
  'planner_workflow_run':os.environ.get('GITHUB_RUN_ID'),
}
Path('.runtime/autonomous/new_state.json').write_text(json.dumps(new_state,indent=2,sort_keys=True))
body='''# Autonomous engineering mission\n\n## Last plan\n\n{summary}\n\n<!-- autonomous-mission-state:start -->\n```json\n{state}\n```\n<!-- autonomous-mission-state:end -->\n'''.format(summary=plan['summary'],state=json.dumps(new_state,indent=2,sort_keys=True))
Path('.runtime/autonomous/issue-body.md').write_text(body)
PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$number" --input <(python - <<'PY'
import json
from pathlib import Path
print(json.dumps({'body':Path('.runtime/autonomous/issue-body.md').read_text()}))
PY
)

      - name: Dispatch allowlisted workflows
        if: ${{ inputs.dry_run != true && steps.validate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(cat .runtime/autonomous/issue_number.txt)"
          plan='.runtime/autonomous/normalized-plan.json'
          terminal="$(jq -r '.terminal' "$plan")"
          if [[ "$terminal" != "null" ]]; then
            if [[ "$terminal" == "complete" ]]; then gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed; fi
            exit 0
          fi
          while read -r workflow; do
            [[ -z "$workflow" ]] && continue
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" -f ref=main >/dev/null
            echo "Dispatched $workflow at main"
          done < <(jq -r '.actions[].workflow' "$plan")

      - name: Discover dispatched child runs
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(cat .runtime/autonomous/issue_number.txt)"
          sha="$(cat .runtime/autonomous/foundation_sha.txt)"
          created="$(date -u +%s)"
          child_ids='[]'
          for workflow in $(jq -r '.actions[].workflow' .runtime/autonomous/normalized-plan.json); do
            found='[]'
            for attempt in 1 2 3 4 5; do
              runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --limit 20 --json databaseId,headSha,status,conclusion,event,createdAt,url,name)"
              found="$(jq --arg sha "$sha" '[.[] | select(.headSha==$sha and .event=="workflow_dispatch")] | .[0] // empty' <<<"$runs")"
              [[ -n "$found" ]] && break
              sleep 2
            done
            if [[ -n "$found" ]]; then
              child_ids="$(jq --argjson x "$found" '. + [$x.databaseId]' <<<"$child_ids")"
            fi
          done
          state="$(jq --argjson ids "$child_ids" '.child_runs=$ids | .state="executing"' .runtime/autonomous/new_state.json)"
          printf '%s\n' "$state" > .runtime/autonomous/new_state.json
          python - <<'PY'
import json
from pathlib import Path
s=json.loads(Path('.runtime/autonomous/new_state.json').read_text())
body=Path('.runtime/autonomous/issue-body.md').read_text()
import re
body=re.sub(r'<!-- autonomous-mission-state:start -->\s*```json\s*[\s\S]*?\s*```\s*<!-- autonomous-mission-state:end -->', '<!-- autonomous-mission-state:start -->\n```json\n'+json.dumps(s,indent=2,sort_keys=True)+'\n```\n<!-- autonomous-mission-state:end -->', body, count=1)
Path('.runtime/autonomous/issue-body.md').write_text(body)
PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$number" --input <(python - <<'PY'
import json
from pathlib import Path
print(json.dumps({'body':Path('.runtime/autonomous/issue-body.md').read_text()}))
PY
)

      - name: Upload autonomous mission receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: autonomous-mission-${{ github.run_id }}
          path: .runtime/autonomous/
          if-no-files-found: warn
          retention-days: 30