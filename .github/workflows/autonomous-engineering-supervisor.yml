name: autonomous-engineering-supervisor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm task workflow is paused
        run: |
          echo "Autonomous engineering supervisor is paused by policy."
          echo "No task, benchmark, provider cross-fire, research, dispatch, mutation, or self-improvement work is executed by this workflow."
