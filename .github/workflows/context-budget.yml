name: Foundation context budget

on:
  pull_request:
    paths:
      - 'tools/check_context_budget.py'
      - 'tests/test_context_budget.py'
      - 'backend/**/*.py'
      - 'tests/**/*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-context-budget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest workers-py
      - name: Unit test budget checker
        run: python -m pytest -q tests/test_context_budget.py
      - name: Enforce context budget
        run: python tools/check_context_budget.py
