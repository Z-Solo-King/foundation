name: public-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest pytest-asyncio coverage workers-py workers-runtime-sdk
      - name: Compile every Python source
        run: python -m compileall -q backend worker.py
      - name: Run tests with line and branch coverage
        run: coverage run --branch --source=. --omit='tests/*' -m pytest tests/ -v
      - name: Enforce complete production coverage
        run: coverage report --show-missing --fail-under=100 --omit='tests/*'
      - name: Public boundary scan
        shell: bash
        run: |
          set -euo pipefail
          test ! -e backend/learning/promotion.py
          paths=(backend worker.py wrangler.toml migrations tests)
          if grep -RniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|CLOUDFLARE_API_TOKEN|AWS_SECRET_ACCESS_KEY|github_pat_[A-Za-z0-9_]+' "${paths[@]}" 2>/dev/null; then
            echo 'Potential credential material found in public source/test tree.'
            exit 1
          fi
          if find backend tests migrations -type f \( -path '*/secrets/*' -o -path '*/credentials/*' -o -path '*/private-data/*' \) -print -quit | grep -q .; then
            echo 'Protected artifact directory found in public source tree.'
            exit 1
          fi
