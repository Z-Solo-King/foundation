name: public-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio coverage workers-py workers-runtime-sdk
      - name: Compile every Python source
        run: python -m compileall -q backend foundation_core worker.py
      - name: Verify package installation
        run: python -c "import foundation_core; print(foundation_core.__all__)"
      - name: Run product tests
        run: coverage run --branch --source=backend,foundation_core,worker --omit='tests/*,backend/persistence/artifacts.py' -m pytest tests/ -v
      - name: Enforce complete product coverage
        run: coverage report --show-missing --fail-under=100 --omit='tests/*,backend/persistence/artifacts.py'
      - name: Public boundary scan
        shell: bash
        run: |
          set -euo pipefail
          test ! -e backend/learning/promotion.py
          paths=(backend foundation_core worker.py wrangler.toml migrations tests)
          if grep -RniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|CLOUDFLARE_API_TOKEN|AWS_SECRET_ACCESS_KEY|github_pat_[A-Za-z0-9_]+' "${paths[@]}" 2>/dev/null; then
            echo 'Potential credential material found in public source/test tree.'
            exit 1
          fi
          if find backend foundation_core tests migrations -type f \( -path '*/secrets/*' -o -path '*/credentials/*' -o -path '*/private-data/*' \) -print -quit | grep -q .; then
            echo 'Protected artifact directory found in public source tree.'
            exit 1
          fi
          if grep -RniE 'operations|extractor_mapper|private\.chatbot|resource_ledger|promotion\.py|trust_boundary|CONTROL_PLANE|research-intelligence-engine-private' foundation_core backend worker.py wrangler.toml 2>/dev/null; then
            echo 'Private control-plane references found in public product source tree.'
            exit 1
          fi
      - name: Resolve production Cloudflare account and D1 database
        id: d1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is required'; exit 1; }
          account_id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$account_id" ]; then
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
              https://api.cloudflare.com/client/v4/user/tokens/verify | jq -e '.success == true and .result.status == "active"' >/dev/null
            accounts=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
              'https://api.cloudflare.com/client/v4/accounts?per_page=100')
            count=$(jq '.result | length' <<<"$accounts")
            test "$count" -eq 1 || { echo "Expected one accessible Cloudflare account; found $count"; exit 1; }
            account_id=$(jq -r '.result[0].id' <<<"$accounts")
          fi
          d1=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database")
          database_id=$(jq -r '.result[] | select(.name == "research-intelligence") | .uuid' <<<"$d1" | head -n 1)
          test -n "$database_id" && test "$database_id" != null
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
      - name: Generate production Wrangler configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cat > wrangler.production.generated.toml <<EOF
name = "research-intelligence-engine-public"
main = "worker.py"
compatibility_date = "2026-09-09"
compatibility_flags = ["python_workers"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "research-intelligence"
database_id = "${D1_DATABASE_ID}"

[secrets]
required = ["AUTH_TOKEN", "B2_KEY_ID", "B2_APPLICATION_KEY"]

[vars]
ENVIRONMENT = "production"
STRICT_ZERO_COST_ONLY = "true"
B2_BUCKET = "SoloKing"
B2_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
EOF
      - name: Apply D1 migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.d1.outputs.account_id }}
        run: npx wrangler@4.131.1 d1 migrations apply research-intelligence --remote --config wrangler.production.generated.toml
      - name: Deploy public Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.d1.outputs.account_id }}
        run: uv run pywrangler deploy --config wrangler.production.generated.toml
