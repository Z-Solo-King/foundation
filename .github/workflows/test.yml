name: public-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: pytest tests/ -v
      - name: Public boundary scan
        shell: bash
        run: |
          set -euo pipefail
          test ! -e backend/learning/promotion.py
          paths=(backend worker.py wrangler.toml migrations tests)
          if grep -RniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|CLOUDFLARE_API_TOKEN|AWS_SECRET_ACCESS_KEY|github_pat_[A-Za-z0-9_]+' "${paths[@]}" 2>/dev/null; then
            echo 'Potential credential material found in public source/test tree.'
            exit 1
          fi
          if find backend tests migrations -type f \( -path '*/secrets/*' -o -path '*/credentials/*' -o -path '*/private-data/*' \) -print -quit | grep -q .; then
            echo 'Protected artifact directory found in public source tree.'
            exit 1
          fi
