name: public-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: pytest tests/ -v
      - name: Public boundary scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '(^|/)(secrets|credentials|private-data)/|backend/learning/promotion\.py|holdout|golden.*evaluation' --exclude-dir=.git .; then
            echo 'Potential private-authority or protected-evaluation content found in public repository.'
            exit 1
          fi
