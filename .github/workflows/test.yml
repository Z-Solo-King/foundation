name: public-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio coverage workers-py workers-runtime-sdk
      - name: Compile every Python source
        run: python -m compileall -q backend foundation_core worker.py
      - name: Verify package installation
        run: python -c "import foundation_core; print(foundation_core.__all__)"
      - name: Run product tests
        run: coverage run --branch --source=backend,foundation_core,worker --omit='tests/*,backend/persistence/artifacts.py' -m pytest tests/ -v
      - name: Enforce complete product coverage
        run: coverage report --show-missing --fail-under=100 --omit='tests/*,backend/persistence/artifacts.py'
      - name: Public boundary scan
        shell: bash
        run: |
          set -euo pipefail
          test ! -e backend/learning/promotion.py
          paths=(backend foundation_core worker.py wrangler.toml migrations tests)
          if grep -RniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|CLOUDFLARE_API_TOKEN|AWS_SECRET_ACCESS_KEY|github_pat_[A-Za-z0-9_]+' "${paths[@]}" 2>/dev/null; then
            echo 'Potential credential material found in public source/test tree.'
            exit 1
          fi
          if find backend foundation_core tests migrations -type f \( -path '*/secrets/*' -o -path '*/credentials/*' -o -path '*/private-data/*' \) -print -quit | grep -q .; then
            echo 'Protected artifact directory found in public source tree.'
            exit 1
          fi
          if grep -RniE 'operations|extractor_mapper|private\.chatbot|resource_ledger|promotion\.py|trust_boundary' foundation_core 2>/dev/null; then
            echo 'Private control-plane references found in public deterministic package.'
            exit 1
          fi
      - name: Live deployed Cloudflare readiness and D1/B2 persistence probe
        shell: bash
        run: |
          set -euo pipefail
          base='https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev'
          curl -fsS "$base/health" | tee /tmp/live-health.json
          jq -e '.ok == true' /tmp/live-health.json
          status=$(curl -sS -o /tmp/live-readiness.json -w '%{http_code}' "$base/readiness")
          cat /tmp/live-readiness.json
          test "$status" = "200"
          jq -e '.ready == true and .control_plane == true' /tmp/live-readiness.json
          status=$(curl -sS -o /tmp/live-research.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"question":"CI live D1/B2 integration probe","depth":"quick","require_citations":false,"max_sources":1,"max_evidence_items":4,"strict_zero_cost_only":true,"source_urls":["https://example.com/"]}' \
            "$base/api/v1/research")
          cat /tmp/live-research.json
          test "$status" = "200"
          jq -e '.ok == true and (.run_id | length > 0) and (.sources | length == 1)' /tmp/live-research.json
          run_id=$(jq -r '.run_id' /tmp/live-research.json)
          status=$(curl -sS -o /tmp/live-run.json -w '%{http_code}' "$base/api/v1/research/$run_id")
          cat /tmp/live-run.json
          test "$status" = "200"
          jq -e '.ok == true and (.observations | length == 1) and .observations[0].integrity_state == "verified"' /tmp/live-run.json
