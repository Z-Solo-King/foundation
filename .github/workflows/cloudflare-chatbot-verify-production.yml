name: cloudflare-chatbot-verify-production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for same-commit Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            runs=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/cloudflare-deploy-production.yml/runs?head_sha=${GITHUB_SHA}&per_page=20")
            status=$(jq -r '.workflow_runs[0].status // "missing"' <<<"$runs")
            conclusion=$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$runs")
            echo "cloudflare-deploy-production status=${status} conclusion=${conclusion} attempt=${attempt}"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo 'Cloudflare deployment did not succeed; refusing verification'; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for same-commit Cloudflare deployment'
          exit 1

      - name: Verify public Worker health
        run: |
          set -euo pipefail
          curl -fsS https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/health | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json

      - name: Verify Cloudflare and B2 through the established chatbot bridge
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AUTH_TOKEN:-}" || { echo 'Missing AUTH_TOKEN'; exit 1; }
          status=$(curl -sS -o /tmp/chatbot.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"operation":"infrastructure_verify_public_test"}' \
            https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/api/v1/chatbot/diagnostic)
          cat /tmp/chatbot.json
          test "$status" = "200"
          jq -e '
            .ok == true and
            .status == "ok" and
            (.checks | map(select(.ok != true)) | length == 0) and
            ([.checks[].name] | index("public_chatbot")) and
            ([.checks[].name] | index("cloudflare_d1")) and
            ([.checks[].name] | index("backblaze_b2_lifecycle"))
          ' /tmp/chatbot.json
