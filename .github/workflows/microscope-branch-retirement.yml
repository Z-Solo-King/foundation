name: Microscope branch retirement

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      execute:
        description: Execute eligible branch deletions
        required: true
        type: boolean
        default: false
      min_age_hours:
        description: Minimum age for merged or exact-duplicate branches
        required: false
        default: "24"
        type: string

jobs:
  scan:
    # Normal pushes are evidence-only. This job has no write permission.
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fetch all branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Run microscope retirement scan
        env:
          GH_TOKEN: ${{ github.token }}
          MICROSCOPE_MIN_AGE_HOURS: "24"
        run: |
          set -euo pipefail
          node tools/retire_microscope_branches.mjs --report microscope-branch-retirement-report.json

      - name: Upload scan receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microscope-branch-scan-receipt
          path: microscope-branch-retirement-report.json

  retire:
    # Destructive execution is available only from an explicit manual dispatch.
    if: github.event_name == 'workflow_dispatch' && inputs.execute == true
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fetch all branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Run microscope retirement execution
        env:
          GH_TOKEN: ${{ github.token }}
          MICROSCOPE_MIN_AGE_HOURS: ${{ inputs.min_age_hours || '24' }}
        run: |
          set -euo pipefail
          node tools/retire_microscope_branches.mjs --report microscope-branch-retirement-report.json --execute

      - name: Upload retirement receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microscope-branch-retirement-receipt
          path: microscope-branch-retirement-report.json
