name: Native Google Feed Archive URL Hunt

on:
  push:
    branches:
      - hunt/native-google-feed-urls-20260927
    paths:
      - ".github/workflows/native-google-feed-archive-hunt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive_hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Discover historical feed URLs and recheck live
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/archive
          : > out/verified-native-feed-urls.tsv

          valid_feed() {
            local f="$1"
            grep -Eqi 'http://base.google.com/ns/1.0|https://base.google.com/ns/1.0' "$f" &&
            grep -Eqi '<rss\b|<feed\b' "$f" &&
            grep -Eqi '<item\b|<entry\b' "$f" &&
            grep -Eqi '<g:id\b' "$f" &&
            grep -Eqi '<g:title\b' "$f" &&
            grep -Eqi '<g:link\b' "$f" &&
            grep -Eqi '<g:price\b' "$f" &&
            ! grep -Eqi 'just a moment|cf-chl-|turnstile|captcha|access denied|attention required|checking your browser' "$f"
          }

          hunt_site() {
            site="$1"
            root="$2"
            safe="$3"

            domain=$(printf '%s' "$root" | sed -E 's#^https?://##; s#/.*$##')
            cdx="out/archive/$safe.cdx"
            candidates="out/archive/$safe.candidates"

            curl -ksSL -4 --connect-timeout 6 --max-time 18 -A 'Mozilla/5.0'               --get 'https://web.archive.org/cdx/search/cdx'               --data-urlencode "url=$domain/*"               --data 'output=json'               --data 'fl=timestamp,original,statuscode,mimetype'               --data 'filter=statuscode:200'               --data 'collapse=urlkey'               --data 'limit=400'               -o "$cdx" 2>/dev/null || true

            if [ ! -s "$cdx" ]; then
              printf '%s\tNO_ARCHIVE_DATA\n' "$site" > "out/archive/$safe.report"
              return
            fi

            python3 - "$cdx" "$domain" > "$candidates" <<'PY'
          import json, sys
          from urllib.parse import urlsplit
          p, domain = sys.argv[1], sys.argv[2]
          try:
              rows = json.load(open(p, encoding="utf-8"))
          except Exception:
              rows = []
          seen = set()
          if isinstance(rows, list) and rows and isinstance(rows[0], list):
              rows = rows[1:]
          for row in rows if isinstance(rows, list) else []:
              if not isinstance(row, list) or len(row) < 2:
                  continue
              u = str(row[1]).strip()
              try:
                  if urlsplit(u).hostname != domain:
                      continue
              except Exception:
                  continue
              low = u.lower()
              if not any(x in low for x in (
                  ".xml", "google", "merchant", "shopping", "feed",
                  "product-feed", "products-feed", "woo-feed", "wppfm", "gpf"
              )):
                  continue
              if u not in seen:
                  seen.add(u)
                  print(u)
          PY

            : > "out/archive/$safe.rechecked"
            while IFS= read -r candidate; do
              [ -z "$candidate" ] && continue
              body=$(mktemp)
              meta=$(mktemp)
              curl -ksSL -4 --connect-timeout 3 --max-time 4 -A 'Mozilla/5.0'                 -H 'Accept: application/xml,text/xml,text/plain,*/*;q=0.3'                 -o "$body" -w '%{http_code}\t%{url_effective}' "$candidate" > "$meta" 2>/dev/null || {
                  rm -f "$body" "$meta"
                  continue
                }
              IFS=$'\t' read -r code final < "$meta"
              host_a=$(printf '%s' "$root" | sed -E 's#^https?://##; s#/.*$##; s/^www\.//')
              host_b=$(printf '%s' "$final" | sed -E 's#^https?://##; s#/.*$##; s/^www\.//')
              if [ "$code" = "200" ] && [ "$host_a" = "$host_b" ] && valid_feed "$body"; then
                printf '%s\t%s\n' "$site" "$final" >> out/verified-native-feed-urls.tsv
                printf '%s\t%s\t200\n' "$site" "$final" > "out/archive/$safe.hit"
                rm -f "$body" "$meta"
                return
              fi
              printf '%s\t%s\t%s\n' "$code" "$final" "$candidate" >> "out/archive/$safe.rechecked"
              rm -f "$body" "$meta"
            done < "$candidates"

            printf '%s\tNO_LIVE_NATIVE_MATCH\n' "$site" > "out/archive/$safe.report"
          }

          while IFS='|' read -r site root; do
            safe=$(printf '%s' "$site" | tr ' /' '__')
            hunt_site "$site" "$root" "$safe" &
          done <<'SITES'
          Aarna Computers|https://aarnacomputers.com
          Ads Store|https://adsstore.in
          avikaretails|https://avikaretails.com
          EZPZ Solutions|https://www.ezpzsolutions.in
          GamesNComps|https://gamesncomps.com
          Geekbees|https://geekbees.in
          hotshiftpc|https://hotshiftpc.com
          itgadgetsonline|https://itgadgetsonline.com
          ithunt|https://ithunt.in
          KC Computers|https://kccomputers.co.in
          KRG KART|https://krgkart.com
          Kryptronix Gaming|https://kryptronix.in
          NCL Computer|https://nclcomputer.com
          networkitstore|https://networkitstore.in
          nexusinfosys|https://www.mynexusinfosys.com
          Only SDD|https://onlyssd.com
          PC Kumar Infotech|https://pckumar.in
          PC Studio|https://www.pcstudio.in
          PCHubShop|https://www.pchubshop.com
          Prime ABGB|https://www.primeabgb.com
          quickincomputers|https://quickincomputers.com
          SCL Gaming|https://sclgaming.in
          solankienterprises|https://solankienterprises.com
          Variety Infotech|https://varietyinfotech.com
          Viper PC|https://viperpc.in
          AULA India|https://aulaindia.com
          Cosmic Byte|https://www.thecosmicbyte.com
          Meckeys|https://www.meckeys.com
          Moskeys|https://moskeys.com
          Ninja Dog|https://ninjadog.in
          StacksKB|https://stackskb.com
          Theproaudio|https://www.theproaudio.com
          SITES
          wait

          sort -u out/verified-native-feed-urls.tsv -o out/verified-native-feed-urls.tsv
          echo '=== VERIFIED NATIVE FEEDS FROM ARCHIVE REDISCOVERY ==='
          cat out/verified-native-feed-urls.tsv
      - name: Upload archive evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-google-feed-archive-results
          path: out/archive/
          retention-days: 14
          if-no-files-found: warn
