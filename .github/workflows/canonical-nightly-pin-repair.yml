name: Canonical nightly workflow pin repair

'on':
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the canonical Operations main SHA to the nightly workflow"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: foundation-canonical-nightly-pin-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Repair stale Operations pin through a PR
        env:
          GH_TOKEN: ${{ steps.operations-app.outputs.token }}
          APPLY: ${{ inputs.apply }}
          REPO: ${{ github.repository }}
          TARGET_PATH: .github/workflows/nightly-multi-agent-research-v3.yml
          CONTRACT_PATH_CHAT: private/chatbot/chat_endpoint.py
          CONTRACT_PATH_LIVE: private/chatbot/live_answer.py
        run: |
          set -euo pipefail
          [[ "$APPLY" == "true" ]] || { echo 'apply=false; refusing mutation.'; exit 0; }
          branch="repair/nightly-operations-pin-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          SOURCE_REF="$(gh api repos/Z-Solo-King/operations/git/ref/heads/main --jq '.object.sha')"
          test -n "$SOURCE_REF"

          # Newer is not automatically compatible. Validate the exact consumer-side
          # research contract before changing an immutable runtime pin.
          for contract_path in "$CONTRACT_PATH_CHAT" "$CONTRACT_PATH_LIVE"; do
            contract_file="$RUNNER_TEMP/$(basename "$contract_path")"
            gh api "repos/Z-Solo-King/operations/contents/$contract_path?ref=$SOURCE_REF" --jq '.content' | tr -d '\n' | base64 --decode > "$contract_file"
            test -s "$contract_file"
          done
          python - "$RUNNER_TEMP/chat_endpoint.py" "$RUNNER_TEMP/live_answer.py" <<'PY'
          import ast
          import re
          import sys
          from pathlib import Path

          endpoint = Path(sys.argv[1]).read_text(encoding="utf-8")
          live = Path(sys.argv[2]).read_text(encoding="utf-8")
          compact = re.sub(r"\s+", "", endpoint)
          if 'research_agent=bool(payload.get("research_agent",False))' not in compact:
              raise SystemExit("candidate Operations revision lacks the research-agent request flag")
          if 'research_agent=research_agent' not in compact:
              raise SystemExit("candidate Operations revision does not forward research_agent")
          tree = ast.parse(live)
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          limit = functions.get("_output_token_limit")
          provider = functions.get("_execute_provider") or functions.get("generate_answer")
          if limit is None or provider is None:
              raise SystemExit("candidate Operations revision lacks required research execution functions")
          limit_src = ast.unparse(limit)
          provider_src = ast.unparse(provider)
          required = [
              "research_agent",
              "CHAT_RESEARCH_MAX_OUTPUT_TOKENS",
          ]
          if not all(token in limit_src for token in required):
              raise SystemExit("candidate Operations revision lacks the research token-budget contract")
          if "research_agent" not in provider_src:
              raise SystemExit("candidate Operations revision does not propagate research_agent into provider execution")
          for marker in ('"response_format"', '"findings"', '"follow_up_questions"', '"note"', "if research_agent"):
              if marker not in live:
                  raise SystemExit(f"candidate Operations revision lacks required structured research marker: {marker}")
          print("candidate Operations revision is compatible with nightly research contract: semantic validation")
          PY

          echo "candidate Operations revision is compatible with nightly research contract: $SOURCE_REF"

          python - "$TARGET_PATH" "$SOURCE_REF" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          new_ref = sys.argv[2]
          text = path.read_text()
          needle = 'OPERATIONS_RESEARCH_REF: '
          lines = text.splitlines()
          for i, line in enumerate(lines):
            if line.startswith(needle):
              old = line[len(needle):].strip()
              if old == new_ref:
                raise SystemExit('nightly workflow already pinned to canonical Operations SHA')
              lines[i] = needle + new_ref
              break
          else:
            raise SystemExit('OPERATIONS_RESEARCH_REF not found')
          path.write_text('\n'.join(lines) + '\n')
          print(f'updated Operations research pin: {old} -> {new_ref}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_PATH"
          git commit -m 'fix: pin nightly research to canonical Operations revision'
          git push --set-upstream origin "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" --title 'fix: pin nightly research to canonical Operations revision' --body 'Updates the nightly private research checkout from the obsolete Operations revision to the current canonical Operations main revision. Retains existing workflow permissions and exact-SHA verification.'