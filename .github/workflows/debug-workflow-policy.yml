name: Debug workflow policy assertions

on:
  push:
    branches:
      - fix/chatbot-production-source-sync-20260922

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        test:
          - test_all_third_party_actions_are_sha_pinned
          - test_production_deployment_has_one_owner
          - test_canonical_operations_production_pin_is_current_and_immutable
          - test_production_generates_private_operations_service_binding
          - test_operations_installation_is_discovered_from_app_jwt
          - test_operations_checkout_uses_github_app_installation_credential
          - test_production_release_has_one_minimal_main_push_job
          - test_production_release_fails_closed_and_retains_chat_policy_receipts
          - test_public_worker_propagates_client_request_cancellation_to_operations
          - test_public_production_deploy_injects_required_b2_secrets
          - test_public_worker_static_assets_binding_is_declared
          - test_production_script_preserves_static_asset_binding_and_diagnostic_smokes
          - test_private_operations_deployment_verifies_cloudflare_provenance
          - test_private_operations_handoff_is_preflighted_and_diagnostic_runs_last
          - test_public_foundation_is_the_only_github_actions_bridge_owner
    name: policy ${{ matrix.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<10"
      - run: python -m pytest -q "tests/test_workflow_policy.py::${{ matrix.test }}"
