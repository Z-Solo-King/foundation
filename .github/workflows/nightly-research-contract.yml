name: nightly research contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-nightly-research-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lane-isolation:
    name: Lane isolation contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify matrix and failure isolation
        run: node --test tests/test_nightly_runtime_acceptance_contract.mjs

  diagnosis-contract:
    name: Diagnosis and always-run contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify summary and truthful failure handling
        run: node --test tests/test_nightly_runtime_acceptance_contract.mjs

  dry-run-contract:
    name: Dry-run and truthful evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify scheduled live mode and explicit dry-run boundary
        run: node --test tests/test_nightly_runtime_acceptance_contract.mjs
