name: nightly research contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-nightly-research-contract-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lane-isolation:
    name: Lane isolation contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest workers-py workers-runtime-sdk
      - name: Verify matrix and failure isolation
        run: python -m pytest tests/test_nightly_research_workflow_contract.py -q -k 'matrix or lane_status'

  diagnosis-contract:
    name: Diagnosis and always-run contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest workers-py workers-runtime-sdk
      - name: Verify summary and truthful failure handling
        run: python -m pytest tests/test_nightly_research_workflow_contract.py -q -k 'summary or incomplete'

  dry-run-contract:
    name: Dry-run and truthful evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest workers-py workers-runtime-sdk
      - name: Verify scheduled live mode and explicit dry-run boundary
        run: python -m pytest tests/test_nightly_research_workflow_contract.py -q -k 'dry_run or scheduled'

  multi-retailer-api-proof:
    name: Live API proof (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        target:
          - Acer
          - Apple
          - ASUS
          - Croma
          - Dell
          - Flipkart
          - HP
          - Lenovo
          - "Reliance Digital"
          - Samsung
          - "Vijay Sales"
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Execute live retailer API discovery and replay
        run: node scripts/multi_retailer_api_probe.mjs
      - name: Upload retailer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retailer-api-proof-${{ matrix.target }}
          path: probe-result.json
          if-no-files-found: warn
          retention-days: 14