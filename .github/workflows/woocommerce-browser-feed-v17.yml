name: WooCommerce Browser Feed Recovery V17
on:
  pull_request:
    branches: [main]
    paths:
      - tools/woocommerce_browser_feed_v17.mjs
      - tests/test_woocommerce_browser_feed_v17.mjs
      - .github/workflows/woocommerce-browser-feed-v17.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx playwright install chromium
      - run: node --test tests/test_woocommerce_browser_feed_v17.mjs
      - run: node tools/woocommerce_browser_feed_v17.mjs
      - run: |
          set -euo pipefail
          test -f out/woocommerce-browser-feed-v17/report.json
          jq -e '.schema == "woocommerce-browser-feed-recovery-v17/v1" and .target_count == 30' out/woocommerce-browser-feed-v17/report.json >/dev/null
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-browser-feed-v17
          path: out/woocommerce-browser-feed-v17/
          if-no-files-found: error
          retention-days: 30
