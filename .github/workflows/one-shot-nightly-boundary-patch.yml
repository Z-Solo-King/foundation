name: one-shot nightly boundary patch

on:
  push:
    branches:
      - feat/public-runner-boundary-hardening-2026-09-17

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.ref == 'refs/heads/feat/public-runner-boundary-hardening-2026-09-17' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply exact nightly boundary update once
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import subprocess

          path = Path('.github/workflows/nightly-multi-agent-research.yml')
          text = path.read_text(encoding='utf-8')
          old_ref = 'b6a519742e57e7e68db64ab10535d76372bcbdb1'
          new_ref = 'e34cd63d47e7eb9dd5049a9e2a90bd7d3caab4ee'
          if old_ref not in text:
              print('nightly boundary patch already applied; no mutation required')
              raise SystemExit(0)

          text = text.replace(old_ref, new_ref, 1)
          marker = '''      - name: Validate live lane coverage\n'''
          insertion = '''      - name: Validate public research artifact boundary\n        id: public_boundary\n        if: ${{ steps.run_lane.outcome == 'success' }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          python benchmark/public_runner_boundary.py ".runtime/nightly-lane-${{ matrix.lane }}.jsonl" --lane "${{ matrix.lane }}"\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one live coverage marker')
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text, encoding='utf-8')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', str(path)], check=True)
          subprocess.run(['git', 'commit', '-m', 'security: pin nightly research and validate public artifact before upload'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:feat/public-runner-boundary-hardening-2026-09-17'], check=True)
