name: family schema registry

on:
  pull_request:
    branches: [main]
    paths:
      - "schemas/**"
      - "scripts/validate_schema_registry.py"
      - "tests/test_schema_registry.py"
      - ".github/workflows/family-schema-registry.yml"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "scripts/validate_schema_registry.py"
      - "tests/test_schema_registry.py"
      - ".github/workflows/family-schema-registry.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.14"}
      - run: python -m pip install "jsonschema>=4,<5"
      - run: python scripts/validate_schema_registry.py
      - run: python -m pytest -q tests/test_schema_registry.py
