name: Debug Browser Binding
on:
  push:
    branches:
      - feat/wc-google-feed-egress-bridge-20260929
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Call browser binding diagnostic
        run: |
          set -e
          curl -sS --max-time 120 https://feed-origin-probe-20260927.heroic-ai.workers.dev/debug-browser | tee browser-debug.json
      - uses: actions/upload-artifact@v4
        with:
          name: browser-binding-debug
          path: browser-debug.json
          if-no-files-found: error
