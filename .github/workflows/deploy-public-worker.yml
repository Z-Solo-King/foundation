name: deploy-public-worker

on:
  workflow_run:
    workflows: [public-tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN GitHub secret'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID GitHub secret'; exit 1; }
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | jq -e '.success == true and .result.status == "active"' >/dev/null

      - name: Discover public D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          databases=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")
          database_id=$(jq -r '.result[] | select(.name == "research-intelligence") | .uuid' <<<"$databases" | head -n 1)
          test -n "$database_id" && test "$database_id" != null
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Generate deployment config
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.production.generated.toml <<EOF
name = "research-intelligence-engine-public"
main = "worker.py"
compatibility_date = "2026-09-09"
compatibility_flags = ["python_workers"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "research-intelligence"
database_id = "${D1_DATABASE_ID}"

[secrets]
required = ["AUTH_TOKEN", "B2_KEY_ID", "B2_APPLICATION_KEY"]

[vars]
ENVIRONMENT = "production"
STRICT_ZERO_COST_ONLY = "true"
B2_BUCKET = "SoloKing"
B2_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
EOF

      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.131.1 d1 migrations apply research-intelligence --remote --config wrangler.production.generated.toml

      - name: Deploy public Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.131.1 deploy --config wrangler.production.generated.toml
