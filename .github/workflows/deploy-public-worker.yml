name: deploy-public-worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: public-worker-deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for public-tests for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            runs=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${GITHUB_SHA}&per_page=20")
            status=$(jq -r '.workflow_runs[0].status // "missing"' <<<"$runs")
            conclusion=$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$runs")
            echo "public-tests status=${status} conclusion=${conclusion} attempt=${attempt}"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo 'public-tests did not pass; refusing deployment'; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for public-tests for this commit'
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Python Worker tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install Python Worker tooling
        run: python -m pip install --upgrade pip workers-py

      - name: Resolve Cloudflare account ID and verify token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VARIABLE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN GitHub secret'; exit 1; }
          account_id="${SECRET_ACCOUNT_ID:-${VARIABLE_ACCOUNT_ID:-}}"
          test -n "$account_id" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID: configure it as a repository secret or variable'; exit 1; }
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | jq -e '.success == true and .result.status == "active"' >/dev/null
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Discover public D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          databases=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")
          database_id=$(jq -r '.result[] | select(.name == "research-intelligence") | .uuid' <<<"$databases" | head -n 1)
          test -n "$database_id" && test "$database_id" != null
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Persist public D1 resource identifier
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          current_id=$(sed -n 's/^database_id = "\(.*\)"$/\1/p' wrangler.toml | head -n 1)
          current_name=$(sed -n 's/^database_name = "\(.*\)"$/\1/p' wrangler.toml | head -n 1)
          test -n "$D1_DATABASE_ID"
          if [[ "$current_id" != "$D1_DATABASE_ID" || "$current_name" != "research-intelligence" ]]; then
            sed -i 's/database_name = "REPLACE_WITH_PUBLIC_DATABASE_NAME"/database_name = "research-intelligence"/' wrangler.toml
            sed -i "s/database_id = \"REPLACE_WITH_D1_DATABASE_ID\"/database_id = \"${D1_DATABASE_ID}\"/" wrangler.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wrangler.toml
            git commit -m "chore(cloudflare): persist public D1 binding identifier"
            git push origin HEAD:main
            echo 'Public D1 binding identifier updated in main; current run continues with generated production config.'
          else
            echo 'Public D1 binding identifier already matches live Cloudflare resource.'
          fi

      - name: Generate deployment config
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.production.generated.toml <<EOF
name = "research-intelligence-engine-public"
main = "worker.py"
compatibility_date = "2026-09-09"
compatibility_flags = ["python_workers"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "research-intelligence"
database_id = "${D1_DATABASE_ID}"

[secrets]
required = ["AUTH_TOKEN", "B2_KEY_ID", "B2_APPLICATION_KEY"]

[vars]
ENVIRONMENT = "production"
STRICT_ZERO_COST_ONLY = "true"
B2_BUCKET = "SoloKing"
B2_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
EOF

      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: npx wrangler@4.131.1 d1 migrations apply research-intelligence --remote --config wrangler.production.generated.toml

      - name: Deploy public Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: pywrangler deploy --config wrangler.production.generated.toml
