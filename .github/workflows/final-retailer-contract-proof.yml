name: final retailer contract proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  proof:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        target: [Acer, ASUS, Dell, Flipkart]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Run direct contract proof
        run: node scripts/final_retailer_contracts.mjs
