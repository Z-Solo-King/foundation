name: Diagnose matrix contract failure

'on':
  push:
    branches:
      - fix/nightly-research-topic-type-contract-20260923

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.app.outputs.token }}
          path: operations
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run each matrix test
        id: tests
        continue-on-error: true
        working-directory: operations
        run: |
          python - <<'PY' > /tmp/results.txt 2>&1
          import traceback
          from tests import test_open_issue_polyglot_scan as t
          tests = [
              t.test_open_issue_matrix_covers_all_issues_and_four_lanes,
              t.test_open_issue_scan_methods_are_broader_than_language_only_checks,
              t.test_all_open_issue_policies_have_lane_coverage_and_requirements,
              t.test_open_issue_surface_map_matches_scan_contract,
          ]
          for fn in tests:
              print(f"=== {fn.__name__} ===")
              try:
                  fn()
                  print("PASS")
              except Exception:
                  print("FAIL")
                  traceback.print_exc()
          PY
          cat /tmp/results.txt
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1011 --repo "Z-Solo-King/foundation" --body-file /tmp/results.txt
