name: Diagnose exhaustive audit

'on':
  push:
    branches:
      - fix/nightly-research-topic-type-contract-20260923

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: foundation
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: foundation-repo

      - id: app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
          permission-issues: read

      - id: operations
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.app.outputs.token }}
          path: operations-repo

      - id: python
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: operations-repo/requirements.txt

      - id: install
        continue-on-error: true
        working-directory: operations-repo
        run: python -m pip install --disable-pip-version-check -e . --no-deps

      - id: clean
        continue-on-error: true
        run: rm -rf operations-repo/*.egg-info foundation-repo/*.egg-info

      - id: compile
        continue-on-error: true
        working-directory: operations-repo
        run: |
          python -m py_compile tools/exhaustive_audit.py
          python -m py_compile tools/mapper_extractor_cross_audit.py

      - id: mapper
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/operations-repo
        run: |
          mkdir -p .runtime/exhaustive-audit/mapper-extractor
          python operations-repo/tools/mapper_extractor_cross_audit.py             --foundation "${{ github.workspace }}/foundation-repo"             --operations "${{ github.workspace }}/operations-repo"             --output "${{ github.workspace }}/.runtime/exhaustive-audit/mapper-extractor/receipt.json"

      - id: contract
        continue-on-error: true
        working-directory: operations-repo
        run: python -m unittest -v tests.test_exhaustive_audit_contract

      - id: live
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          register=json.loads(Path("operations-repo/benchmark/polyglot/current_open_issue_inventory.json").read_text())
          expected=[]
          for repo, rows in register.get("repositories",{}).items():
              expected.extend((repo,int(row["number"]),row["title"]) for row in rows)
          print("registered",len(expected),expected)
          PY

      - id: audit
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/operations-repo
        run: |
          set +e
          mkdir -p .runtime/exhaustive-audit
          python operations-repo/tools/exhaustive_audit.py             --foundation "${GITHUB_WORKSPACE}/foundation-repo"             --operations "${GITHUB_WORKSPACE}/operations-repo"             --surface-map "${GITHUB_WORKSPACE}/operations-repo/benchmark/polyglot/open_issue_surface_map.json"             --issue-inventory "${GITHUB_WORKSPACE}/operations-repo/benchmark/polyglot/current_open_issue_inventory.json"             --output-dir "${GITHUB_WORKSPACE}/.runtime/exhaustive-audit"             > .runtime/exhaustive-audit/runner.out 2>&1
          echo "runner_exit=$?" >> .runtime/exhaustive-audit/runner-status.txt
          tail -c 12000 .runtime/exhaustive-audit/runner.out || true
          cat .runtime/exhaustive-audit/SUMMARY.json 2>/dev/null || true
          cat .runtime/exhaustive-audit/PROGRESS.log 2>/dev/null || true

      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > report.txt
          import os, json
          from pathlib import Path
          keys = [
              "foundation","app","operations","python","install","clean",
              "compile","mapper","contract","live","audit"
          ]
          print("## Exhaustive audit wrapper diagnostic")
          for key in keys:
              print(f"- {key}: {os.environ.get('STEP_'+key.upper(),'unknown')}")
          root=Path(".runtime/exhaustive-audit")
          for name in ("runner-status.txt","SUMMARY.json","PROGRESS.log"):
              p=root/name
              if p.exists():
                  print(f"\n### {name}\n")
                  print(p.read_text(errors="replace")[-12000:])
          PY
          gh pr comment 1011 --repo "Z-Solo-King/foundation" --body-file report.txt
        env:
          STEP_FOUNDATION: ${{ steps.foundation.outcome }}
          STEP_APP: ${{ steps.app.outcome }}
          STEP_OPERATIONS: ${{ steps.operations.outcome }}
          STEP_PYTHON: ${{ steps.python.outcome }}
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_CLEAN: ${{ steps.clean.outcome }}
          STEP_COMPILE: ${{ steps.compile.outcome }}
          STEP_MAPPER: ${{ steps.mapper.outcome }}
          STEP_CONTRACT: ${{ steps.contract.outcome }}
          STEP_LIVE: ${{ steps.live.outcome }}
          STEP_AUDIT: ${{ steps.audit.outcome }}
