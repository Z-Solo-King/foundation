name: Diagnose Operations deep scan

'on':
  push:
    branches:
      - fix/nightly-research-topic-type-contract-20260923

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run exact four-lane scan diagnostically
        id: scan
        continue-on-error: true
        working-directory: operations
        run: |
          set +e
          mkdir -p .runtime/diagnostic
          for lane in L1 L2 L3 L4; do
            python tools/open_issue_polyglot_scan.py               --foundation "$GITHUB_WORKSPACE"               --operations "$GITHUB_WORKSPACE/operations"               --matrix "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_matrix_52.json"               --surface-map "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_surface_map.json"               --lane "$lane"               --output ".runtime/diagnostic/$lane.json" > ".runtime/diagnostic/$lane.out" 2>&1
            echo "lane=$lane exit=$?"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".runtime/diagnostic")
          summary = {"schema":"diagnostic-open-issue-scan/v1","lanes":{},"failed_cases":[],"review_cases":[]}
          for lane in ("L1","L2","L3","L4"):
              receipt = root / f"{lane}.json"
              data = json.loads(receipt.read_text())
              summary["lanes"][lane] = {
                  "case_count": data.get("case_count"),
                  "expected_case_count": data.get("expected_case_count"),
                  "issue_count": data.get("issue_count"),
                  "failed_cases": data.get("failed_cases"),
                  "review_cases": data.get("review_cases"),
                  "missing_cases": data.get("missing_cases"),
              }
              for row in data.get("results", []):
                  if row.get("status") == "FAIL":
                      summary["failed_cases"].append({
                          "issue": row.get("issue"),
                          "lane": row.get("lane"),
                          "findings": row.get("findings", []),
                      })
                  elif row.get("status") == "REVIEW":
                      summary["review_cases"].append({
                          "issue": row.get("issue"),
                          "lane": row.get("lane"),
                          "findings": row.get("findings", []),
                      })
          Path(".runtime/diagnostic/summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Report exact scanner failures and remove diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          summary="$(cat operations/.runtime/diagnostic/summary.json 2>/dev/null || echo '{"error":"summary not produced"}')"
          python - "$summary" <<'PY' > /tmp/comment.txt
          import json
          import sys
          try:
              data=json.loads(sys.argv[1])
          except Exception:
              data={"error":sys.argv[1]}
          print("Operations deep-scan diagnostic")
          print()
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
          gh pr comment 1011 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.txt
          git rm -f .github/workflows/diagnose-operations-access.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary Operations deep-scan diagnostic' || true
          git push || true
