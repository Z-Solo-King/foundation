name: Diagnose Operations deep scan

'on':
  push:
    branches:
      - fix/nightly-research-topic-type-contract-20260923

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Foundation
        id: foundation
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Operations read token
        id: operations-app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        id: operations
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Python
        id: python
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run exact four-lane scan diagnostically
        id: scan
        continue-on-error: true
        run: |
          set +e
          mkdir -p operations/.runtime/diagnostic
          for lane in L1 L2 L3 L4; do
            (
              cd operations
              python tools/open_issue_polyglot_scan.py                 --foundation "$GITHUB_WORKSPACE"                 --operations "$GITHUB_WORKSPACE/operations"                 --matrix "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_matrix_52.json"                 --surface-map "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_surface_map.json"                 --lane "$lane"                 --output ".runtime/diagnostic/$lane.json"
            ) > "operations/.runtime/diagnostic/$lane.out" 2>&1
            echo "$?" > "operations/.runtime/diagnostic/$lane.exit"
          done

      - name: Build diagnostic summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("operations/.runtime/diagnostic")
          summary={
              "checkout_foundation":"${{ steps.foundation.outcome }}",
              "operations_app":"${{ steps.operations-app.outcome }}",
              "checkout_operations":"${{ steps.operations.outcome }}",
              "setup_python":"${{ steps.python.outcome }}",
              "scan_step":"${{ steps.scan.outcome }}",
              "lanes":{},
          }
          for lane in ("L1","L2","L3","L4"):
              receipt=root/f"{lane}.json"
              output=root/f"{lane}.out"
              exit_file=root/f"{lane}.exit"
              summary["lanes"][lane]={
                  "exit": exit_file.read_text().strip() if exit_file.exists() else "missing",
                  "receipt": receipt.exists(),
                  "output_tail": output.read_text(errors="replace")[-8000:] if output.exists() else "",
              }
          Path(".runtime-diagnostic-summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Report exact diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1011 --repo "${GITHUB_REPOSITORY}" --body-file .runtime-diagnostic-summary.json
