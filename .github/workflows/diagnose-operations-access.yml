name: Diagnose Operations deep scan results

'on':
  push:
    branches:
      - fix/nightly-research-topic-type-contract-20260923

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run scanner and publish exact failures
        working-directory: operations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/diagnostic
          for lane in L1 L2 L3 L4; do
            set +e
            python tools/open_issue_polyglot_scan.py               --foundation "$GITHUB_WORKSPACE"               --operations "$GITHUB_WORKSPACE/operations"               --matrix "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_matrix_52.json"               --surface-map "$GITHUB_WORKSPACE/operations/benchmark/polyglot/open_issue_surface_map.json"               --lane "$lane"               --output ".runtime/diagnostic/$lane.json"               > ".runtime/diagnostic/$lane.out" 2>&1
            rc=$?
            set -e
            echo "$rc" > ".runtime/diagnostic/$lane.exit"
          done

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".runtime/diagnostic")
          out = {"lanes": {}, "failed_cases": [], "review_cases": []}
          for lane in ("L1","L2","L3","L4"):
              data = json.loads((root / f"{lane}.json").read_text())
              out["lanes"][lane] = {
                  "exit": (root / f"{lane}.exit").read_text().strip(),
                  "case_count": data["case_count"],
                  "issue_count": data["issue_count"],
                  "failed_cases": data["failed_cases"],
                  "review_cases": data["review_cases"],
                  "missing_cases": data["missing_cases"],
              }
              for row in data["results"]:
                  if row["status"] == "FAIL":
                      out["failed_cases"].append({
                          "issue": row["issue"],
                          "lane": row["lane"],
                          "findings": row["findings"],
                          "structural": row["structural"],
                      })
                  elif row["status"] == "REVIEW":
                      out["review_cases"].append({
                          "issue": row["issue"],
                          "lane": row["lane"],
                          "findings": row["findings"],
                      })
          Path(".runtime/diagnostic-summary.json").write_text(json.dumps(out, indent=2, sort_keys=True))
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

          gh pr comment 1011 --repo "Z-Solo-King/foundation" --body-file .runtime/diagnostic-summary.json
