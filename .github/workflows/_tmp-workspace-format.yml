name: Temporary workspace formatter
on:
  push:
    branches:
      - feat/chatbot-github-ui-2026-10-03
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Format workspace files
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          files=$(git diff --name-only --diff-filter=ACMRTUXB origin/main...HEAD)
          npx --yes prettier --write $files
          git diff --binary > /tmp/prettier.patch
      - name: Upload format patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-prettier-patch
          path: /tmp/prettier.patch