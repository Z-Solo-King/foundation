name: National PC Feed Zero and Extended IDs
on:
  push:
    branches: [probe/opencart-feed-full-20260926]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe default and extended feed IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, urllib.request, re, json, time, os
          root='https://nationalpc.in'
          vals=['','0','-1','all']+[str(x) for x in range(101,201)]
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36','Accept':'application/xml,text/xml,application/rss+xml,*/*'}
          def one(v):
              q='&feed_id='+v if v!='' else ''
              url=root+'/index.php?route=extension/module/google_all_feed'+q
              try:
                  req=urllib.request.Request(url,headers=H)
                  with urllib.request.urlopen(req,timeout=8) as r:b=r.read(10000000).decode('utf-8','replace'); st=r.status
                  items=len(re.findall(r'<item\\b',b,re.I))
                  rss=bool(re.search(r'<rss\\b',b,re.I)); goog='http://base.google.com/ns/1.0' in b
                  fields={k:len(re.findall(fr'<(?:g:)?{k}>',b,re.I)) for k in ['id','title','link','price','availability','image_link','brand']}
                  return {'feed_id':v or '(blank)','url':url,'status':st,'bytes':len(b),'rss':rss,'google_namespace':goog,'items':items,'fields':fields,'sample':re.sub(r'\\s+',' ',b[:300])}
              except Exception as e:return {'feed_id':v or '(blank)','url':url,'status':0,'error':type(e).__name__+':'+str(e)[:100]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex: rows=list(ex.map(one,vals))
          rows.sort(key=lambda x: (x['feed_id']=='(blank)', str(x['feed_id'])))
          good=[x for x in rows if x.get('items',0)>0]
          print(json.dumps({'tested':len(rows),'nonempty':good,'zero_status':sum(x.get('status')==0 for x in rows)},indent=2))
          os.makedirs('out',exist_ok=True)
          open('out/national-feed-extended.json','w').write(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: national-feed-extended-20260926
          path: out/national-feed-extended.json
          retention-days: 14
