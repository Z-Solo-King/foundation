name: Native Google Feed Asset Hunt v182
on:
  push:
    branches: [hunt/native-google-feed-urls-20260927]
    paths:
      - "tools/native_google_feed_asset_hunt_v182.py"
      - ".github/workflows/native-google-feed-asset-hunt.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install chromium
      - name: Select shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -c 'import json,os; s=[["Aarna Computers","https://aarnacomputers.com"],["Ads Store","https://adsstore.in"],["avikaretails","https://avikaretails.com"],["EZPZ Solutions","https://www.ezpzsolutions.in"],["GamesNComps","https://gamesncomps.com"],["Geekbees","https://geekbees.in"],["hotshiftpc","https://hotshiftpc.com"],["itgadgetsonline","https://itgadgetsonline.com"],["ithunt","https://ithunt.in"],["KC Computers","https://kccomputers.co.in"],["KRG KART","https://krgkart.com"],["Kryptronix Gaming","https://kryptronix.in"],["NCL Computer","https://nclcomputer.com"],["networkitstore","https://networkitstore.in"],["nexusinfosys","https://www.mynexusinfosys.com"],["Only SDD","https://onlyssd.com"],["PC Kumar Infotech","https://pckumar.in"],["PC Studio","https://www.pcstudio.in"],["PCHubShop","https://www.pchubshop.com"],["Prime ABGB","https://www.primeabgb.com"],["quickincomputers","https://quickincomputers.com"],["SCL Gaming","https://sclgaming.in"],["solankienterprises","https://solankienterprises.com"],["Variety Infotech","https://varietyinfotech.com"],["Viper PC","https://viperpc.in"],["AULA India","https://aulaindia.com"],["Cosmic Byte","https://www.thecosmicbyte.com"],["Meckeys","https://www.meckeys.com"],["Moskeys","https://moskeys.com"],["Ninja Dog","https://ninjadog.in"],["StacksKB","https://stackskb.com"],["Theproaudio","https://www.theproaudio.com"]]; n=int(os.environ["SHARD"]); print(json.dumps([{"name":x[0],"url":x[1]} for i,x in enumerate(s) if i%8+1==n]))' > /tmp/sites.json
          echo "SITES_JSON=$(cat /tmp/sites.json)" >> "$GITHUB_ENV"
      - name: Run v182 asset-only native hunt
        run: |
          set -o pipefail
          python tools/native_google_feed_asset_hunt_v182.py | tee "asset-shard-${{ matrix.shard }}.json"
      - name: Upload URL-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-asset-google-feed-shard-${{ matrix.shard }}
          path: asset-shard-${{ matrix.shard }}.json
          retention-days: 14