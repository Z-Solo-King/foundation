name: Shopify Google Feed Discovery

on:
  push:
    branches: [probe/monitor-oem-api-20260926]
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shop:
          - bitkart.com
          - elitehubs.com
          - www.genesispc.in
          - getrightpc.com
          - hardwarenest.in
          - mehtabrothers.in
          - tlggaming.com
          - tpstech.in
          - vajawatcomputers.com
          - vishalperipherals.com
          - acekbd.com
          - www.amkette.com
          - antesports.com
          - conceptkart.com
          - credkeys.com
          - ctrlshiftstore.com
          - curiositycaps.in
          - cybeart.in
          - fictioo.com
          - genesispc.in
          - hardwarecorpus.in
          - keebsmod.com
          - www.keychron.in
          - keyora.store
          - kreo-tech.com
          - lethalblack.com
          - neomacro.in
          - www.nmpc.in
          - www.portronics.com
          - www.redragon.in
          - ryugear.in
          - senpaiarts.com
          - thethockshop.com
          - store.tvselectronics.in
          - urx.co.in
          - varmiloindia.com
          - vrkaa.com
          - waimers.in
          - zebronics.com
          - zukabus.com
          - virtualracinghub.com
          - avstore.in
          - www.bajaao.com
          - www.boat-lifestyle.com
          - goboult.co.in
          - headphonezone.in
          - www.jamsticks.com
          - www.mivi.in
          - www.gonoise.com
          - ptron.in
          - www.theaudiostore.in
          - theaudio.co
    steps:
      - uses: actions/checkout@v4

      - name: Probe Shopify feed and sitemap routes
        env:
          SHOP: ${{ matrix.shop }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          shop=os.environ["SHOP"]
          base="https://"+shop
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; Googlebot/2.1; +https://www.google.com/bot.html)","Accept":"*/*"})
          routes=[
            "/feeds/products.xml",
            "/feed/products.xml",
            "/google-shopping-feed.xml",
            "/google-product-feed.xml",
            "/google-feed.xml",
            "/merchant-feed.xml",
            "/product-feed.xml",
            "/sitemap.xml",
            "/sitemap_products_1.xml",
            "/products.json",
            "/products.json?limit=250",
          ]
          out={"shop":shop,"routes":[],"discovered":[]}
          for route in routes:
            try:
              r=s.get(base+route,timeout=15,allow_redirects=True)
              ct=r.headers.get("content-type","")
              head=r.text[:12000] if "text" in ct or "xml" in ct or "json" in ct else ""
              is_xml=("xml" in ct.lower() or head.lstrip().startswith("<?xml") or "<rss" in head[:1000].lower())
              is_google=("<g:" in head or "base.google.com/ns/1.0" in head or "<item>" in head and "<channel>" in head)
              out["routes"].append({"route":route,"status":r.status_code,"bytes":len(r.content),"final":r.url,"content_type":ct[:120],"is_xml":is_xml,"looks_google":is_google})
              if r.status_code==200 and route=="/sitemap.xml":
                for m in re.findall(r"https?://[^<\s]+(?:sitemap[^<\s]*\.xml)", r.text, re.I):
                  out["discovered"].append(m)
              if r.status_code==200 and (is_google or (is_xml and "product" in route)):
                Path("hits").mkdir(exist_ok=True)
                Path("hits/"+shop.replace("/","_")+".txt").write_text(r.text[:200000],encoding="utf-8")
            except Exception as e:
              out["routes"].append({"route":route,"error":str(e)[:300]})

          # Inspect robots and homepage for app/feed clues.
          for route in ["/robots.txt","/"]:
            try:
              r=s.get(base+route,timeout=15)
              txt=r.text
              for pat in [r'https?://[^\s<>"]+(?:feed|google|merchant|shopping)[^\s<>"]*',
                          r'(?:/[^\s<>"]*(?:feed|google|merchant|shopping)[^\s<>"]*)']:
                for x in re.findall(pat,txt,re.I):
                  if x not in out["discovered"]:
                    out["discovered"].append(x[:500])
              if route=="/":
                for x in re.findall(r'(?:href|src)=["\']([^"\']+)["\']',txt,re.I):
                  if re.search(r'(?:feed|google|merchant|shopping)',x,re.I):
                    out["discovered"].append(urllib.parse.urljoin(base,x))
            except Exception as e:
              out["discovered"].append("ERROR "+route+" "+str(e)[:150])

          print(json.dumps(out,indent=2,ensure_ascii=False))
          Path("result.json").write_text(json.dumps(out,indent=2),encoding="utf-8")
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: shopify-feed-${{ matrix.shop }}
          path: |
            result.json
            hits/
          if-no-files-found: warn
