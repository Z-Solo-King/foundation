name: frontend-ui

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ui.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: write

jobs:
  contract:
    name: Frontend UI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax and contract tests
        run: npm test

      - name: Dispatch re-registered production workflow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-publish-v2.yml --repo "$GITHUB_REPOSITORY" --ref main
          for attempt in $(seq 1 12); do
            run_json=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow production-publish-v2.yml \
              --branch main \
              --limit 1 \
              --json databaseId,status,conclusion,event,headSha)
            database_id=$(jq -r '.[0].databaseId // empty' <<<"$run_json")
            head_sha=$(jq -r '.[0].headSha // empty' <<<"$run_json")
            event=$(jq -r '.[0].event // empty' <<<"$run_json")
            if [ "$head_sha" = "$GITHUB_SHA" ] && [ "$event" = "workflow_dispatch" ] && [ -n "$database_id" ]; then
              echo "PRODUCTION_PUBLISH_DISPATCHED=$database_id"
              exit 0
            fi
            sleep 5
          done
          echo 'Re-registered production publish workflow dispatch was not observed for the current main SHA'
          exit 1
