name: frontend-ui

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ui.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: write

jobs:
  contract:
    name: Frontend UI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax and contract tests
        run: npm test
      - name: Dispatch final production workflow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-release-final.yml --repo "$GITHUB_REPOSITORY" --ref main
          for attempt in $(seq 1 12); do
            run_json=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow production-release-final.yml \
              --branch main \
              --limit 10 \
              --json databaseId,event,headSha,status,conclusion)
            matching=$(jq -c --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha and .event == "workflow_dispatch")] | sort_by(.databaseId) | reverse | .[0] // empty' <<<"$run_json")
            if [ -n "$matching" ]; then
              database_id=$(jq -r '.databaseId' <<<"$matching")
              echo "PRODUCTION_RELEASE_DISPATCHED=$database_id"
              exit 0
            fi
            sleep 5
          done
          echo 'Final production workflow dispatch was not observed for current main SHA'
          exit 1
