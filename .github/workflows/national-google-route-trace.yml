name: National Google Route Trace
on:
  push:
    branches: [probe/opencart-feed-full-20260926]
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trace route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trace
          UA='Mozilla/5.0 Chrome/120 Safari/537.36'
          curl -L --silent --show-error --max-time 15 -A "$UA" https://nationalpc.in/ -o trace/home.html
          grep -oE '<script[^>]+src=["'\''][^"'\'']+["'\'']' trace/home.html | sed -E 's/.*src=["'\'']([^"'\'']+)["'\''].*/\1/' | sort -u > trace/scripts.txt || true
          : > trace/matches.txt
          while IFS= read -r s; do
            clean=$(printf '%s' "$s" | sed 's#^/##')
            case "$s" in http*) u="$s";; *) u="https://nationalpc.in/$clean";; esac
            body=$(curl -L --silent --show-error --max-time 15 -A "$UA" "$u" || true)
            if printf '%s' "$body" | grep -qi 'google_all'; then
              echo "SCRIPT=$u" >> trace/matches.txt
              printf '%s\n' "$body" | grep -in -C 8 'google_all' >> trace/matches.txt || true
            fi
          done < trace/scripts.txt
          cat trace/matches.txt
      - uses: actions/upload-artifact@v4
        with:
          name: national-google-route-trace-20260926
          path: trace/
          retention-days: 14
