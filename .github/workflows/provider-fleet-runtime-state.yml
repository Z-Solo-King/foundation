name: Provider fleet runtime state

on:
  schedule:
    - cron: "17 */4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-fleet-runtime-state.yml"
      - "docs/AI_PROVIDER_FLEET_2026-09-30.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-fleet-runtime-state-production
  cancel-in-progress: true

env:
  OPERATIONS_REPOSITORY: Z-Solo-King/operations
  OPERATIONS_PROVIDER_FLEET_REF: b95e419254a9071beaeef57a1b0da22ba7dd2c4f
  OPERATIONS_PROVIDER_FLEET_PATH: tools/provider_fleet_runtime_probe.py
  CLOUDFLARE_SCRIPT_NAME: operations

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production-secret-sync
    timeout-minutes: 10
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify protected inputs
        id: validate-config
        env:
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Z-Solo-King/foundation"
          test "$GITHUB_REF" = "refs/heads/main" || test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test -n "$OPERATIONS_APP_ID"
          test -n "$OPERATIONS_APP_PRIVATE_KEY"
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          test -n "$PROVIDER_KEYS_JSON"
          python - <<'PY'
          import json, os
          from pathlib import Path

          allowed = {"openrouter_free","groq","gemini","nvidia_nim","cohere_free","huggingface_free","siliconflow"}
          raw = os.environ["PROVIDER_KEYS_JSON"].strip()
          base_ok = True
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              payload = {}
              base_ok = False
              print(f"base provider config parse: BLOCKED ({exc.msg}; line={exc.lineno}; column={exc.colno})")
          if not isinstance(payload, dict):
              base_ok = False
              payload = {}
              print("base provider config shape: BLOCKED (expected object)")
          unknown = sorted(set(payload) - allowed)
          if unknown:
              raise SystemExit(f"unsupported providers: {unknown}")
          explicit = {
              "nvidia_nim": os.environ.get("NVIDIA_NIM_API_KEY", "").strip(),
              "huggingface_free": os.environ.get("HF_TOKEN", "").strip(),
              "cohere_free": os.environ.get("COHERE_API_KEY", "").strip(),
              "siliconflow": os.environ.get("SILICONFLOW_API_KEY", "").strip(),
          }
          explicit_count = sum(bool(value) for value in explicit.values())
          if not payload and explicit_count == 0:
              raise SystemExit("no usable provider configuration remains after base parse")
          Path(os.environ["GITHUB_OUTPUT"]).write_text(f"base_config_valid={str(base_ok).lower()}\n", encoding="utf-8")
          print(f"base provider entries: {len(payload)}")
          print(f"explicit provider overrides available: {explicit_count}")
          print(f"base provider configuration valid: {base_ok}")
          PY

      - name: Assemble merged provider configuration
        env:
          BASE_PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          raw = os.environ["BASE_PROVIDER_KEYS_JSON"].strip()
          base_config_valid = True
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              payload = {}
              base_config_valid = False
          if not isinstance(payload, dict):
              payload = {}
              base_config_valid = False
          payload.pop("mistral_free", None)
          payload.pop("cerebras", None)

          optional = {
              "nvidia_nim": ("NVIDIA_NIM_API_KEY", "https://integrate.api.nvidia.com/v1/chat/completions", "deepseek-ai/deepseek-v4.1-flash"),
              "huggingface_free": ("HF_TOKEN", "https://router.huggingface.co/v1/chat/completions", "openai/gpt-oss-120b"),
              "cohere_free": ("COHERE_API_KEY", "https://api.cohere.ai/compatibility/v1/chat/completions", "command-a-plus-05-2026"),
              "siliconflow": ("SILICONFLOW_API_KEY", "https://api.siliconflow.cn/v1/chat/completions", "Qwen/Qwen3.5-4B"),
          }
          for provider, (env_name, endpoint, model) in optional.items():
              api_key = os.environ.get(env_name, "").strip()
              if api_key:
                  payload[provider] = {"endpoint": endpoint, "api_key": api_key, "model": model, "zero_cost": True}

          if not payload:
              raise SystemExit("no usable provider configuration remains after assembly")
          target = Path(os.environ["RUNNER_TEMP"]) / "provider_keys.json"
          target.write_text(json.dumps(payload, separators=(",", ":")), encoding="utf-8")
          target.chmod(0o600)
          receipt = {
              "schema": "provider-config-assembly/v1",
              "base_config_valid": base_config_valid,
              "provider_count": len(payload),
              "providers": sorted(payload),
              "overrides_present": sorted(provider for provider, (env_name, _, _) in optional.items() if os.environ.get(env_name, "").strip()),
          }
          Path("provider-config-receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"provider configuration assembly: PASS ({len(payload)} providers; base_config_valid={base_config_valid})")
          PY

      - name: Classify live provider transport results
        if: always()
        env:
          PROVIDER_KEYS_JSON_FILE: ${{ runner.temp }}/provider_keys.json
        run: |
          set +e
          python - <<'PY'
          import json, time, urllib.error, urllib.request
          from pathlib import Path

          path = Path(__import__("os").environ["PROVIDER_KEYS_JSON_FILE"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          results = []
          for provider in sorted(payload):
              cfg = payload[provider]
              endpoint = cfg.get("endpoint")
              model = cfg.get("model")
              request_body = json.dumps({
                  "model": model,
                  "messages": [{"role": "user", "content": "Return exactly OK."}],
                  "temperature": 0,
                  "max_tokens": 8,
                  "stream": False,
              }).encode()
              request = urllib.request.Request(
                  endpoint,
                  data=request_body,
                  method="POST",
                  headers={
                      "Authorization": "Bearer " + str(cfg.get("api_key", "")),
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "heroic-ai-provider-benchmark/1",
                  },
              )
              started = time.monotonic()
              row = {
                  "provider": provider,
                  "model": model,
                  "latency_ms": None,
                  "http_status": None,
                  "transport_error": None,
              }
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      row["http_status"] = int(response.status)
                      response.read(4096)
              except urllib.error.HTTPError as exc:
                  row["http_status"] = int(exc.code)
              except Exception as exc:
                  row["transport_error"] = type(exc).__name__
              row["latency_ms"] = max(0, int((time.monotonic() - started) * 1000))
              results.append(row)

          Path("provider-probe-diagnostic.json").write_text(
              json.dumps(
                  {"schema": "provider-probe-diagnostic/v1", "results": results},
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(results, indent=2, sort_keys=True))
          PY
          exit 0

      - name: Record benchmark publication gate
        env:
          BASE_CONFIG_VALID: ${{ steps.validate-config.outputs.base_config_valid }}
        run: |
          set -euo pipefail
          echo "base_config_valid=${BASE_CONFIG_VALID}"
          if [ "$BASE_CONFIG_VALID" != "true" ]; then
            echo "Runtime-state publication scope: explicit-provider-only (base configuration malformed)."
            echo "Only sanitized runtime state from explicitly configured providers will be published."
          else
            echo "Runtime-state publication scope: full configured provider set."
          fi

      - name: Upload provider benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-fleet-benchmark-${{ github.run_id }}
          path: |
            provider-config-receipt.json
            provider-probe-diagnostic.json
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub App token
        env:
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$OPERATIONS_APP_PRIVATE_KEY" > "$RUNNER_TEMP/operations-app.pem"
          python - "$OPERATIONS_APP_ID" "$RUNNER_TEMP/operations-app.pem" > "$RUNNER_TEMP/github-app-jwt.txt" <<'PY'
          import base64, json, subprocess, sys, time
          app_id, key_file = sys.argv[1:]
          def b64url(value):
              return base64.urlsafe_b64encode(value).rstrip(b"=").decode("ascii")
          now = int(time.time())
          header = {"alg":"RS256","typ":"JWT"}
          payload = {"iat":now-60,"exp":now+540,"iss":app_id}
          unsigned = f"{b64url(json.dumps(header,separators=(',',':')).encode())}.{b64url(json.dumps(payload,separators=(',',':')).encode())}".encode()
          signed = subprocess.run(["openssl","dgst","-sha256","-sign",key_file],input=unsigned,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout
          print(unsigned.decode()+"."+b64url(signed))
          PY

      - name: Resolve Operations installation and token
        run: |
          set -euo pipefail
          app_jwt="$(cat "$RUNNER_TEMP/github-app-jwt.txt")"
          installation_id="$(curl -sS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/app/installations | \
            jq -r '.[] | select(.account.login == "Z-Solo-King") | .id' | head -n1)"
          test -n "$installation_id"
          status="$(curl -sS -o "$RUNNER_TEMP/operations-token.json" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/app/installations/$installation_id/access_tokens" \
            --data '{"repositories":["operations"]}')"
          test "$status" = "201"
          jq -r '.token' "$RUNNER_TEMP/operations-token.json" > "$RUNNER_TEMP/operations-token.txt"
          test -s "$RUNNER_TEMP/operations-token.txt"
          echo "::add-mask::$(cat "$RUNNER_TEMP/operations-token.txt")"

      - name: Fetch immutable private provider probe
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/operations-token.txt")"
          response_status="$(curl -sS -o "$RUNNER_TEMP/provider-probe-file.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $token" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$OPERATIONS_REPOSITORY/contents/$OPERATIONS_PROVIDER_FLEET_PATH?ref=$OPERATIONS_PROVIDER_FLEET_REF")"
          test "$response_status" = "200"
          jq -e --arg path "$OPERATIONS_PROVIDER_FLEET_PATH" '.type == "file" and .path == $path and .size > 0' "$RUNNER_TEMP/provider-probe-file.json" >/dev/null
          jq -r '.content' "$RUNNER_TEMP/provider-probe-file.json" | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/provider_fleet_probe.py"
          python -m py_compile "$RUNNER_TEMP/provider_fleet_probe.py"
          echo "Provider fleet probe verified at immutable Operations ref $OPERATIONS_PROVIDER_FLEET_REF"

      - name: Probe configured providers and build runtime state
        env:
          PROVIDER_KEYS_JSON_FILE: ${{ runner.temp }}/provider_keys.json
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/provider_fleet_probe.py" \
            --output provider-runtime-state.json \
            --receipt provider-fleet-probe.json

          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("provider-runtime-state.json").read_text())
          receipt=json.loads(Path("provider-fleet-probe.json").read_text())
          assert state["schema"] == "provider-runtime-state/v1"
          assert receipt["schema"] == "provider-fleet-probe/v1"
          encoded=json.dumps(state, sort_keys=True)
          assert "api_key" not in encoded
          assert "secret" not in encoded.lower()
          print(f"runtime state providers: {len(state['providers'])}")
          print(f"successful probes: {receipt['success_count']}/{receipt['configured_count']}")
          PY

      - name: Publish runtime state to private Operations Worker
        if: always() && hashFiles('provider-runtime-state.json') != ''
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          state="$(cat provider-runtime-state.json)"
          response_status="$(curl -sS -o "$RUNNER_TEMP/provider-runtime-state-publish.json" -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$CLOUDFLARE_SCRIPT_NAME/secrets" \
            --data "$(jq -cn --arg text "$state" '{name:"CHAT_PROVIDER_RUNTIME_STATE",text:$text,type:"secret_text"}')")"
          test "$response_status" = "200" || test "$response_status" = "201"
          jq -e '.success == true' "$RUNNER_TEMP/provider-runtime-state-publish.json" >/dev/null
          echo "Cloudflare provider runtime-state secret API accepted the write (HTTP $response_status)."
          echo "Published sanitized provider runtime state to private Operations Worker."

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-fleet-runtime-${{ github.run_id }}
          path: |
            provider-fleet-probe.json
            provider-runtime-state.json
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/provider_keys.json" \
                "$RUNNER_TEMP/operations-app.pem" \
                "$RUNNER_TEMP/github-app-jwt.txt" \
                "$RUNNER_TEMP/operations-token.json" \
                "$RUNNER_TEMP/operations-token.txt" \
                "$RUNNER_TEMP/provider-probe-file.json" \
                "$RUNNER_TEMP/provider_fleet_probe.py"