name: Provider fleet runtime state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm provider runtime task is paused
        run: |
          echo "Provider fleet runtime-state task workflow is paused by policy."
          echo "No provider calls, secret assembly, Cloudflare mutation, benchmark execution, or runtime-state publication is performed."
