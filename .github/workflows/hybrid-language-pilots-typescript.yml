  typescript_public_endpoint_differential:
        name: TypeScript endpoint Python differential parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install runtimes
        working-directory: operations
        run: |
          python -m pip install --disable-pip-version-check -e ".[test]"
          cd polyglot/public-endpoint-discovery
          npm install --ignore-scripts --no-audit --no-fund
      - name: Determine pinned Foundation public-core revision
        id: foundation-core-pin
        working-directory: operations
        shell: python
        run: |
          import ast, os
          from pathlib import Path
          tree = ast.parse(Path("scripts/sync_public_core.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "FOUNDATION_COMMIT":
                          Path(os.environ["GITHUB_OUTPUT"]).write_text(f"ref={node.value.value}\n", encoding="utf-8")
                          raise SystemExit
          raise SystemExit("FOUNDATION_COMMIT not found")
  
      - name: Checkout exact pinned Foundation public core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/foundation
          ref: ${{ steps.foundation-core-pin.outputs.ref }}
          token: ${{ github.token }}
          path: foundation-core
          fetch-depth: 1
  
      - name: Ensure exact Foundation Git object is present
        working-directory: foundation-core
        shell: bash
        env:
          FOUNDATION_COMMIT: ${{ steps.foundation-core-pin.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$FOUNDATION_COMMIT"
          git cat-file -e "$FOUNDATION_COMMIT^{commit}"
          git cat-file -e "$FOUNDATION_COMMIT:foundation_core/__init__.py"
  
      - name: Materialize pinned public foundation_core
        working-directory: operations
        env:
          FOUNDATION_CORE_GIT: ${{ github.workspace }}/foundation-core
        run: |
          set -euo pipefail
          python scripts/sync_public_core.py
          test -f foundation_core/__init__.py
  
      - name: Generate Python reference
        working-directory: operations
        run: python polyglot/public-endpoint-discovery/python_reference.py polyglot/public-endpoint-discovery/corpus.jsonl python-endpoint.jsonl
      - name: Generate TypeScript candidate
        working-directory: operations/polyglot/public-endpoint-discovery
        run: npm run differential -- ../public-endpoint-discovery/corpus.jsonl endpoint-ts.jsonl
      - name: Compare outputs
        working-directory: operations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          py = [json.loads(v) for v in Path("python-endpoint.jsonl").read_text().splitlines() if v]
          ts = [json.loads(v) for v in Path("polyglot/public-endpoint-discovery/endpoint-ts.jsonl").read_text().splitlines() if v]
          assert len(py) == len(ts) == 32
          assert py == ts, "TypeScript public endpoint discovery diverges from Python"
          print("endpoint differential parity: PASS (32/32)")
          PY
  
