name: Hybrid language pilots — Typescript

'on':
  workflow_call:
    inputs:
      operations_ref:
        description: Immutable Operations revision resolved by the canonical parent workflow
        required: true
        type: string
    secrets:
      OPERATIONS_APP_ID:
        required: true
      OPERATIONS_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  typescript:
        name: TypeScript search adapter shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
  
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
  
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
  
      - name: Install and typecheck
        working-directory: operations/polyglot/search-adapters
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
  
  
