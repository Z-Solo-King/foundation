  typescript_next_data_differential:
        name: TypeScript Next.js Python differential parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Materialize pinned Foundation public core
        working-directory: operations
        run: python scripts/sync_public_core.py
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install runtimes
        working-directory: operations
        run: |
          python -m pip install --disable-pip-version-check -e ".[test]"
          cd polyglot/next-data-product
          npm install --ignore-scripts --no-audit --no-fund
      - name: Generate Python reference
        working-directory: operations
        run: python polyglot/next-data-product/python_reference.py polyglot/next-data-product/corpus.jsonl python-next.jsonl
      - name: Generate TypeScript candidate
        working-directory: operations/polyglot/next-data-product
        run: npm run differential ../next-data-product/corpus.jsonl next-ts.jsonl
      - name: Compare outputs
        working-directory: operations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          py = [json.loads(v) for v in Path("python-next.jsonl").read_text().splitlines() if v]
          ts = [json.loads(v) for v in Path("polyglot/next-data-product/next-ts.jsonl").read_text().splitlines() if v]
          assert len(py) == len(ts) == 32
          assert py == ts, "TypeScript Next.js candidate diverges from Python"
          print("Next.js differential parity: PASS (32/32)")
          PY
  
