name: Apply live chatbot source synchronization

on:
  push:
    branches:
      - fix/chatbot-production-source-sync-20260922

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python scripts/patch_live_chatbot_source.py
      - name: Validate patched source
        run: |
          python -m py_compile worker.py
          python -m pytest -q tests/test_live_chatbot_contract.py
          for f in frontend/app.js frontend/composer.js frontend/ux_enhancements.js; do node --check "$f"; done
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.py wrangler.toml scripts/production_release.sh frontend/app.js frontend/composer.js frontend/ux_enhancements.js tests/test_live_chatbot_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: make production chatbot usable and source-aligned"
          git push origin HEAD:$GITHUB_REF_NAME
