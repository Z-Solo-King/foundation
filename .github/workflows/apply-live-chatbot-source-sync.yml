name: Apply live chatbot source synchronization

on:
  push:
    branches:
      - fix/live-chatbot-final-20260922

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python scripts/patch_live_chatbot_source.py
      - run: |
          python -m py_compile worker.py
          python -m pytest -q tests/test_live_chatbot_contract.py
          node --check frontend/app.js
          node --check frontend/composer.js
          node --check frontend/ux_enhancements.js
          node --check frontend/chat_view.js
      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.py wrangler.toml scripts/production_release.sh frontend/app.js frontend/composer.js frontend/ux_enhancements.js frontend/chat_view.js tests/test_live_chatbot_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: synchronize production chatbot source"
          git push origin HEAD:$GITHUB_REF_NAME
