name: Finalize live chatbot source synchronization

on:
  push:
    branches:
      - fix/chatbot-production-source-sync-20260922

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Normalize UI submit wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("frontend/ux_enhancements.js")
          text=path.read_text(encoding="utf-8")
          old="This backend requires a session token. Open Settings to enter one, or enable Guest test mode to try Heroic AI locally without credentials."
          text=text.replace(old,"Public chat does not require a session token. Protected operational views still do.")
          bad="""  async function enhancedSubmitChat(text, chatId) {
    stopRequested = false;
        try {
      return await api.__originalSubmitChat(text, chatId);
    } catch (error) {
      if (stopRequested) submitGuidedMessage('Response stopped by you. The backend request was cancelled.');
      else if (/unauthorized|401/i.test(String(error?.message || error))) {
        submitGuidedMessage('Public chat does not require a session token. The protected backend surface may still be unavailable; check Backend status and retry.');
      }
      throw error;
    } finally {
      }
  }
"""
          good="""  async function enhancedSubmitChat(text, chatId) {
    stopRequested = false;
    try {
      return await api.__originalSubmitChat(text, chatId);
    } catch (error) {
      if (stopRequested) submitGuidedMessage('Response stopped by you. The backend request was cancelled.');
      else if (/unauthorized|401/i.test(String(error?.message || error))) {
        submitGuidedMessage('Public chat does not require a session token. The protected backend surface may still be unavailable; check Backend status and retry.');
      }
      throw error;
    }
  }
"""
          if bad in text:
              text=text.replace(bad,good,1)
          path.write_text(text,encoding="utf-8")
          PY

      - name: Normalize production policy test
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("tests/test_workflow_policy.py")
          text=path.read_text(encoding="utf-8")
          old='operations_deploy = deployment.index("pywrangler deploy --config wrangler.toml --secrets-file")'
          new='operations_deploy = deployment.index("pywrangler deploy --config \"$operations_wrangle\" --secrets-file")'
          if old in text:
              text=text.replace(old,new,1)
          expected='operations_deploy = deployment.index("pywrangler deploy --config \"$operations_wrangle\" --secrets-file")'
          if expected not in text:
              raise SystemExit("production policy test marker was not normalized")
          path.write_text(text,encoding="utf-8")
          PY

      - name: Validate final source
        run: |
          python -m py_compile worker.py
          python -m pytest -q tests/test_workflow_policy.py tests/test_live_chatbot_contract.py tests/test_live_chatbot_runtime_contract.py tests/test_frontend_ux_completeness.py
          for f in frontend/app.js frontend/composer.js frontend/chat_view.js frontend/ux_enhancements.js; do node --check "$f"; done
          bash -n scripts/production_release.sh

      - name: Remove temporary tooling and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-live-chatbot-source-sync.yml .github/workflows/align-deployment-policy-marker.yml scripts/patch_live_chatbot_source.py 2>/dev/null || true
          git add worker.py wrangler.toml scripts/production_release.sh frontend/app.js frontend/composer.js frontend/chat_view.js frontend/ux_enhancements.js tests/test_workflow_policy.py tests/test_frontend_ux_completeness.py tests/test_live_chatbot_contract.py tests/test_live_chatbot_runtime_contract.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: finalize production chatbot source and policy"
          git push origin HEAD:$GITHUB_REF_NAME
