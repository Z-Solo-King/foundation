name: Apply live chatbot production source fix

on:
  push:
    branches: [fix/live-chatbot-final-20260922]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Patch canonical chatbot source
        shell: python
        run: |
          from pathlib import Path

          root = Path(".").resolve()

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one source marker")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          worker = root / "worker.py"

          replace_once(
              worker,
              """def _chat_headers(request):
    headers = {"Content-Type": "application/json"}
    token = _bearer_token(request)
    if token:
        headers["Authorization"] = f"Bearer {token}"
    idempotency_key = request.headers.get("Idempotency-Key")
    if idempotency_key:
        headers["Idempotency-Key"] = idempotency_key
    return headers
""",
              """def _chat_headers(request, env):
    headers = {"Content-Type": "application/json"}
    backend_token = str(getattr(env, "CHAT_BACKEND_TOKEN", "") or getattr(env, "AUTH_TOKEN", "") or "").strip()
    if backend_token:
        headers["Authorization"] = f"Bearer {backend_token}"
    idempotency_key = request.headers.get("Idempotency-Key")
    if idempotency_key:
        headers["Idempotency-Key"] = idempotency_key
    return headers


def _anonymous_chat_enabled(env):
    return str(getattr(env, "PUBLIC_CHAT_ANONYMOUS", "") or "").strip().casefold() == "true"


def _public_chat_subject(request):
    token_subject = authenticated_subject_fingerprint(request)
    if token_subject:
        return token_subject
    ip = str(request.headers.get("CF-Connecting-IP", "") or "anonymous").split(",", 1)[0].strip() or "anonymous"
    user_agent = str(request.headers.get("User-Agent", "") or "unknown")[:512]
    return hashlib.sha256(f"anonymous|{ip}|{user_agent}".encode("utf-8")).hexdigest()
""",
              "public chat helper",
          )

          replace_once(
              worker,
              "    headers = _chat_headers(request)\n",
              "    headers = _chat_headers(request, env)\n",
              "backend credential forwarding",
          )

          replace_once(
              worker,
              """        if request.method == "POST" and path.endswith("/api/v1/chat/stream"):
            if not _authorized(request, self.env):
                return _authenticated_json({"ok": False, "error": "unauthorized"}, status=401)
""",
              """        if request.method == "POST" and path.endswith("/api/v1/chat/stream"):
            anonymous = _anonymous_chat_enabled(self.env)
            if not anonymous and not _authorized(request, self.env):
                return _authenticated_json({"ok": False, "error": "unauthorized"}, status=401)
""",
              "stream authorization",
          )

          replace_once(
              worker,
              """            subject = authenticated_subject_fingerprint(request) or "development-local"
            event_id = request.headers.get("Idempotency-Key") or req.request_id or uuid.uuid4().hex
            decision, lease = await _public_admit(self.env, AdmissionRoute.STREAM, subject, event_id)
""",
              """            subject = _public_chat_subject(request) if anonymous else (authenticated_subject_fingerprint(request) or "development-local")
            event_id = request.headers.get("Idempotency-Key") or req.request_id or uuid.uuid4().hex
            decision, lease = await _public_admit(self.env, AdmissionRoute.STREAM, subject, event_id)
""",
              "stream subject",
          )

          replace_once(
              worker,
              """        if request.method == "POST" and path.endswith("/api/v1/chat"):
            if not _authorized(request, self.env):
                return _authenticated_json({"ok": False, "error": "unauthorized"}, status=401)
""",
              """        if request.method == "POST" and path.endswith("/api/v1/chat"):
            anonymous = _anonymous_chat_enabled(self.env)
            if not anonymous and not _authorized(request, self.env):
                return _authenticated_json({"ok": False, "error": "unauthorized"}, status=401)
""",
              "chat authorization",
          )

          replace_once(
              worker,
              """            subject = authenticated_subject_fingerprint(request) or "development-local"
            event_id = request.headers.get("Idempotency-Key") or req.request_id or uuid.uuid4().hex
            decision, lease = await _public_admit(self.env, AdmissionRoute.CHAT, subject, event_id)
""",
              """            subject = _public_chat_subject(request) if anonymous else (authenticated_subject_fingerprint(request) or "development-local")
            event_id = request.headers.get("Idempotency-Key") or req.request_id or uuid.uuid4().hex
            decision, lease = await _public_admit(self.env, AdmissionRoute.CHAT, subject, event_id)
""",
              "chat subject",
          )

          wrangler = root / "wrangler.toml"
          text = wrangler.read_text(encoding="utf-8")
          if 'PUBLIC_CHAT_ANONYMOUS = "true"' not in text:
              wrangler.write_text(
                  text.replace('STRICT_ZERO_COST_ONLY = "true"\n', 'STRICT_ZERO_COST_ONLY = "true"\nPUBLIC_CHAT_ANONYMOUS = "true"\n', 1),
                  encoding="utf-8",
              )

          composer = root / "frontend" / "composer.js"
          replace_once(
              composer,
              "Chat uses the authenticated Heroic AI backend and canonical Operations routing.",
              "Chat uses the public governed Heroic AI endpoint; a session token is only needed for protected operational features.",
              "composer wording",
          )

          chat_view = root / "frontend" / "chat_view.js"
          replace_once(
              chat_view,
              "Session authentication is held only in session storage for this browser session.",
              "Protected operational features use a browser-session token; public chat does not require one.",
              "settings wording",
          )

          ux = root / "frontend" / "ux_enhancements.js"
          text = ux.read_text(encoding="utf-8")
          old_guidance = "This backend requires a session token. Open Settings to enter one, or enable Guest test mode to try Heroic AI locally without credentials."
          if old_guidance in text:
              ux.write_text(text.replace(old_guidance, "Public chat does not require a session token. Protected operational views still do.", 1), encoding="utf-8")

          app = root / "frontend" / "app.js"
          text = app.read_text(encoding="utf-8")
          old_cleanup = """    buffer += decoder.decode();
    if (buffer.trim()) dispatch(buffer);
    if (signal) signal.removeEventListener('abort', onAbort);
"""
          new_cleanup = """    try {
      buffer += decoder.decode();
      if (buffer.trim()) dispatch(buffer);
    } finally {
      if (signal) signal.removeEventListener('abort', onAbort);
    }
"""
          if new_cleanup not in text and text.count(old_cleanup) == 1:
              app.write_text(text.replace(old_cleanup, new_cleanup, 1), encoding="utf-8")

          release = root / "scripts" / "production_release.sh"
          text = release.read_text(encoding="utf-8")
          if 'PUBLIC_CHAT_ANONYMOUS = "true"' not in text:
              text = text.replace(
                  '  \'STRICT_ZERO_COST_ONLY = "true"\' \\\n',
                  '  \'STRICT_ZERO_COST_ONLY = "true"\' \\\n  \'PUBLIC_CHAT_ANONYMOUS = "true"\' \\\n',
                  1,
              )
          if "wrangler.chatbot.production.generated.toml" not in text:
              opsref = "$" + "{OPERATIONS_REF}"
              old = '(cd "$RUNNER_TEMP/operations" && pywrangler deploy --config wrangler.toml --secrets-file "$secret_file" --message "github:' + opsref + '" --tag "github:' + opsref + '")'
              new = """operations_wrangle="$RUNNER_TEMP/operations/wrangler.chatbot.production.generated.toml"
python - "$RUNNER_TEMP/operations/wrangler.toml" "$operations_wrangle" <<'PY'
from pathlib import Path
import sys
src, dst = map(Path, sys.argv[1:])
text = src.read_text(encoding="utf-8")
if "[ai]" not in text:
    text = text.replace("preview_urls = false\n", "preview_urls = false\n\n[ai]\nbinding = \"AI\"\n", 1)
provider_lines = (
    'CHAT_LLM_PROVIDERS = "cloudflare_workers_ai"\n'
    'CHAT_CLOUDFLARE_WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"\n'
    'CHAT_MODERATION_MODE = "observe"\n'
)
if 'CHAT_LLM_PROVIDERS = "cloudflare_workers_ai"' not in text:
    text = text.replace('STRICT_ZERO_COST_ONLY = "true"\n', 'STRICT_ZERO_COST_ONLY = "true"\n' + provider_lines, 1)
dst.write_text(text, encoding="utf-8")
PY
grep -q '^binding = "AI"$' "$operations_wrangle"
grep -q '^CHAT_LLM_PROVIDERS = "cloudflare_workers_ai"$' "$operations_wrangle"
grep -q '^CHAT_CLOUDFLARE_WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"$' "$operations_wrangle"
(cd "$RUNNER_TEMP/operations" && pywrangler deploy --config "$operations_wrangle" --secrets-file "$secret_file" --message "github:$OPERATIONS_REF" --tag "github:$OPERATIONS_REF")"""
              if old not in text:
                  raise SystemExit("Operations deploy line not found")
              text = text.replace(old, new, 1)
          release.write_text(text, encoding="utf-8")

      - name: Validate source syntax
        run: |
          python -m py_compile worker.py
          bash -n scripts/production_release.sh
          node --check frontend/app.js
          node --check frontend/composer.js
          node --check frontend/chat_view.js
          node --check frontend/ux_enhancements.js

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.py wrangler.toml scripts/production_release.sh frontend/app.js frontend/composer.js frontend/chat_view.js frontend/ux_enhancements.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: make production chatbot live and source-aligned"
          git push origin HEAD:$GITHUB_REF_NAME
