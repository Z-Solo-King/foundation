name: WooCommerce Wayback Feed Inventory V23
on:
  push:
    branches: [feat/woocommerce-adaptive-feed-recovery-v16-20261001]
    paths: [tools/woocommerce_wayback_feed_v23.mjs,tests/test_woocommerce_wayback_feed_v23.mjs,.github/workflows/woocommerce-wayback-feed-v23.yml]
  pull_request:
    branches: [main]
    paths: [tools/woocommerce_wayback_feed_v23.mjs,tests/test_woocommerce_wayback_feed_v23.mjs,.github/workflows/woocommerce-wayback-feed-v23.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wayback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "22", package-manager-cache: false}
      - run: node --test tests/test_woocommerce_wayback_feed_v23.mjs
      - run: node tools/woocommerce_wayback_feed_v23.mjs
      - run: jq -e '.schema=="woocommerce-wayback-feed-inventory-v23/v1" and .target_count==30' out/woocommerce-wayback-feed-v23/report.json >/dev/null
      - run: jq -r '.results[] | select(.winner != null) | [.site,.status,.winner.final_url] | @tsv' out/woocommerce-wayback-feed-v23/report.json || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-wayback-v23
          path: out/woocommerce-wayback-feed-v23/
          if-no-files-found: error
          retention-days: 30