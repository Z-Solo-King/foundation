name: WooCommerce Google Feed Archive Discovery 4 v3

on:
  push:
    branches:
      - fix/wc-google-feed-focus-4-20260929
    paths:
      - ".github/workflows/wc-google-feed-archive-4-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Query Common Crawl serially
        run: |
          mkdir -p out/wc-google-feed-archive-v3
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const sites = [
            ["Ads Store","adsstore.in"],
            ["ithunt","ithunt.in"],
            ["KC Computers","kccomputers.co.in"],
            ["KRG KART","krgkart.com"]
          ];
          const ua='Mozilla/5.0 (compatible; WCFeedArchiveDiscovery/2026.09)';
          const coll=await (await fetch('https://index.commoncrawl.org/collinfo.json',{headers:{'User-Agent':ua},signal:AbortSignal.timeout(30000)})).json();
          const crawls=coll.map(x=>x.id).filter(x=>/^CC-MAIN-2026-/.test(x)).slice(0,4);
          const feedLike=s=>{const u=String(s||'').toLowerCase();return u.includes('woocommerce_gpf')||u.includes('feedcraft')||u.includes('wppfm')||u.includes('codesolz')||u.includes('google')||u.includes('merchant')||u.includes('shopping')||u.includes('product-feed')||u.endsWith('.xml')||u.includes('.xml?')||u.endsWith('.rss')||u.includes('.rss?');};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const results=[];
          for(const [site,host] of sites){
            const candidates=[];
            for(const id of crawls){
              try{
                const u=new URL('https://index.commoncrawl.org/'+id+'-index');
                u.searchParams.set('url','*.'+host);
                u.searchParams.set('matchType','domain');
                u.searchParams.set('output','json');
                u.searchParams.set('filter','status:200');
                u.searchParams.set('limit','300');
                u.searchParams.set('fl','url,timestamp,mime,status,filename,offset,length');
                const r=await fetch(u,{headers:{'User-Agent':ua},signal:AbortSignal.timeout(30000)});
                const t=await r.text();
                if(r.status===200){
                  for(const line of t.split('\n')){
                    if(!line.trim())continue;
                    try{const x=JSON.parse(line);if(feedLike(x.url)&&!candidates.some(y=>y.url===x.url))candidates.push(x);}catch{}
                  }
                }
              }catch{}
              await sleep(1200);
            }
            const report={site,host,crawls,candidate_count:candidates.length,candidates:candidates.slice(0,150)};
            await writeFile('out/wc-google-feed-archive-v3/'+host+'.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
            await sleep(1500);
          }
          NODE
      - name: Upload archive URL candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wc-google-feed-archive-v3
          path: out/wc-google-feed-archive-v3/
          if-no-files-found: warn
          retention-days: 14
