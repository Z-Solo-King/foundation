name: Monitor OEM API Discovery
on:
  push:
    branches:
      - probe/monitor-oem-api-20260926
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Discover monitor APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > monitor-api.mjs <<'NODE'
          import fs from 'fs';

          const sites = {
            acer: { roots:['https://store.acer.com/en-in/'], graphql:'https://store.acer.com/en-in/graphql' },
            msi: { roots:['https://www.msi.com/Monitor'] },
            samsung: { roots:['https://www.samsung.com/in/monitors/'] },
            aoc: { roots:['https://www.aoc.com/in/gaming/monitors/27g4'] },
            dell: { roots:['https://www.dell.com/en-in/shop/monitors-and-monitor-accessories/sac/monitors','https://www.dell.com/en-in/shop/dell-ultrasharp-27-monitor-u2724d/apd/210-bkmv/monitors-monitor-accessories'], api:'https://www.dellstore.com/rest/V1/products?searchCriteria%5BpageSize%5D=20&searchCriteria%5BcurrentPage%5D=1' },
            rog: { roots:['https://rog.asus.com/in/monitors-group/allmodels/'] },
            asus: { roots:['https://www.asus.com/in/displays-desktops/monitors/all-series/'], api:'https://odinapi.asus.com/recent-data/apiv2/SearchResult?WebsiteCode=in&Keyword=monitor&PageSize=20&Page=1' },
            benq: { roots:['https://www.benq.com/en-in/monitor/gaming.html','https://www.benq.com/en-in/monitor/gaming/ex271/spec.html'] },
            gigabyte: { roots:['https://www.gigabyte.com/Monitor'] },
            aorus: { roots:['https://www.aorus.com/Monitors'] },
            lg: { roots:['https://www.lg.com/in/monitors/ultragear/','https://www.lg.com/in/monitors/ultragear-gaming-oled-monitors/27gx790a-b/'] }
          };

          const H={'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136.0.0.0 Safari/537.36','accept':'application/json,text/html,application/xml,text/xml,*/*','accept-language':'en-IN,en;q=0.9','x-requested-with':'XMLHttpRequest'};

          async function get(url, extra={}) {
            try {
              const r=await fetch(url,{headers:{...H,...extra},redirect:'follow',signal:AbortSignal.timeout(15000)});
              const body=await r.text();
              return {status:r.status,ctype:r.headers.get('content-type')||'',bytes:body.length,body};
            } catch(e) { return {status:0,ctype:'',bytes:0,body:'',error:String(e)} }
          }

          async function post(url, body, extra={}) {
            try {
              const r=await fetch(url,{method:'POST',headers:{...H,'content-type':'application/json',...extra},body:JSON.stringify(body),redirect:'follow',signal:AbortSignal.timeout(20000)});
              const b=await r.text();
              return {status:r.status,ctype:r.headers.get('content-type')||'',bytes:b.length,body:b};
            } catch(e) { return {status:0,ctype:'',bytes:0,body:'',error:String(e)} }
          }

          function jsonInfo(body) {
            const s=(body||'').trim();
            if(!s.startsWith('{')&&!s.startsWith('[')) return null;
            try {
              const j=JSON.parse(s);
              let arr=Array.isArray(j)?j:null;
              if(!arr&&j&&typeof j==='object'){
                for(const k of ['products','items','data','results','ProductList','resultsList']) {
                  if(Array.isArray(j[k])) {arr=j[k];break}
                }
                if(!arr&&j.Result&&typeof j.Result==='object'){
                  for(const k of ['ProductList','products','items']) if(Array.isArray(j.Result[k])) {arr=j.Result[k];break}
                }
              }
              const first=arr?.[0];
              return {topKeys:j&&typeof j==='object'?Object.keys(j).slice(0,80):[],rows:arr?.length||0,firstKeys:first&&typeof first==='object'?Object.keys(first).slice(0,100):[],sample:first||j};
            } catch { return null }
          }

          function mine(body) {
            const out=[];
            for(const re of [
              /https?:\/\/[^"'<>\\s]+/g,
              /(?:\\/api\\/|\\/pdp\\/api\\/|\\/graphql|graphql\\?|Ajax\\/|\\/Monitor\\/|\\/Product\\/)[^"'<>\\s<)]*/gi
            ]) {
              let m; while((m=re.exec(body||''))) out.push(m[0]);
            }
            return [...new Set(out)].filter(x=>x.length<1200).slice(0,500);
          }

          function interesting(body) {
            const lo=(body||'').toLowerCase();
            return {graphql:lo.includes('graphql'),api:/\\/api\\/|api\\./i.test(body||''),productApi:/(pdp\\/api|product\\/|productsspec|searchresult|typesense|graphql|products\\/)/i.test(body||''),specs:/(technical specifications|all specifications|panel type|refresh rate|brightness|resolution)/i.test(body||''),pdf:/\\.pdf/i.test(body||'')};
          }

          async function probeAcer(endpoint) {
            const queries = [
              'query { products(search:"monitor", pageSize:20, currentPage:1) { total_count items { sku name url_key stock_status } } }',
              'query { products(search:"monitor", pageSize:20, currentPage:1) { total_count items { sku name url_key stock_status description { html } short_description { html } } } }'
            ];
            const out=[];
            for(const q of queries){
              const r=await post(endpoint,{query:q});
              out.push({query:q,status:r.status,ctype:r.ctype,bytes:r.bytes,json:jsonInfo(r.body),sample:r.body.slice(0,8000)});
            }
            return out;
          }

          async function main() {
            const out={generated_at:new Date().toISOString(),sites:{}};
            for(const [name,cfg] of Object.entries(sites)){
              const entry={roots:[],scripts:[],discovered:[],apiProbe:[]};
              for(const root of cfg.roots){
                const r=await get(root);
                entry.roots.push({url:root,status:r.status,ctype:r.ctype,bytes:r.bytes,interesting:interesting(r.body),sample:r.body.slice(0,700)});
                const scripts=[...new Set([...r.body.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>{try{return new URL(m[1],root).href}catch{return ''}}).filter(Boolean))].slice(0,24);
                entry.scripts.push(...scripts);
                const js=await Promise.all(scripts.map(async u=>({url:u,r:await get(u)})));
                for(const x of js) if(x.r.status===200) entry.discovered.push(...mine(x.r.body));
              }
              entry.scripts=[...new Set(entry.scripts)].slice(0,60);
              entry.discovered=[...new Set(entry.discovered)].filter(x=>/api|graphql|product|monitor|typesense|spec|pdp/i.test(x)).slice(0,500);

              if(cfg.graphql) entry.apiProbe.push(...await probeAcer(cfg.graphql));
              if(cfg.api){
                const r=await get(cfg.api);
                entry.apiProbe.push({url:cfg.api,status:r.status,ctype:r.ctype,bytes:r.bytes,json:jsonInfo(r.body),sample:r.body.slice(0,12000)});
              }

              if(name==='samsung'){
                const urls=[
                  'https://p1-smi-api-cdn.shop.samsung.com/tokocommercewebservices/v2/in/products/search?query=monitor%3Arelevance&pageSize=100&currentPage=0&fields=FULL',
                  'https://p1-smi-api-cdn.shop.samsung.com/tokocommercewebservices/v2/in/products/search?query=odyssey%3Arelevance&pageSize=100&currentPage=0&fields=FULL'
                ];
                for(const u of urls){const r=await get(u,{referer:'https://www.samsung.com/in/',origin:'https://www.samsung.com'});entry.apiProbe.push({url:u,status:r.status,ctype:r.ctype,bytes:r.bytes,json:jsonInfo(r.body),sample:r.body.slice(0,12000)});}
              }

              if(name==='asus'){
                const urls=[
                  'https://odinapi.asus.com/recent-data/apiv2/SearchResult?WebsiteCode=in&Keyword=monitor&PageSize=100&Page=1',
                  'https://odinapi.asus.com/recent-data/apiv2/SearchResult?WebsiteCode=in&Keyword=monitor&PageSize=100&PageIndex=1'
                ];
                for(const u of urls){const r=await get(u);entry.apiProbe.push({url:u,status:r.status,ctype:r.ctype,bytes:r.bytes,json:jsonInfo(r.body),sample:r.body.slice(0,9000)});}
              }

              if(name==='dell'){
                const candidates=entry.discovered.filter(x=>/typesense|rest\\/V1|catalogsearch|graphql/i.test(x));
                for(const raw of candidates.slice(0,12)){
                  let u=raw.startsWith('http')?raw:new URL(raw,'https://www.dell.com').href;
                  if(/typesense/i.test(u)&&!u.includes('q=')) u += (u.includes('?')?'&':'?')+'q=monitor&query_by=name,sku&per_page=100';
                  const r=await get(u);
                  entry.apiProbe.push({url:u,status:r.status,ctype:r.ctype,bytes:r.bytes,json:jsonInfo(r.body),sample:r.body.slice(0,10000)});
                }
              }

              out.sites[name]=entry;
            }
            fs.writeFileSync('out/monitor-oem-api-discovery.json',JSON.stringify(out,null,2));
            for(const [name,e] of Object.entries(out.sites)){
              console.log('\\n### '+name);
              console.log('ROOTS',e.roots);
              console.log('DISCOVERED',e.discovered.slice(0,100));
              console.log('API',e.apiProbe.slice(0,20));
            }
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node monitor-api.mjs
          test -s out/monitor-oem-api-discovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-oem-api-discovery-20260926
          path: out/monitor-oem-api-discovery.json
          retention-days: 14
