name: Nightly research provider preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check protected configuration presence
        env:
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          RESEARCH_LLM_ENDPOINT: ${{ secrets.RESEARCH_LLM_ENDPOINT }}
          RESEARCH_LLM_API_KEY: ${{ secrets.RESEARCH_LLM_API_KEY }}
          RESEARCH_LLM_MODEL: ${{ secrets.RESEARCH_LLM_MODEL }}
        run: |
          set +e
          app_id=false; app_key=false; endpoint=false; api_key=false; model=false
          [ -n "${OPERATIONS_APP_ID:-}" ] && app_id=true
          [ -n "${OPERATIONS_APP_PRIVATE_KEY:-}" ] && app_key=true
          [ -n "${RESEARCH_LLM_ENDPOINT:-}" ] && endpoint=true
          [ -n "${RESEARCH_LLM_API_KEY:-}" ] && api_key=true
          [ -n "${RESEARCH_LLM_MODEL:-}" ] && model=true
          ready=false
          if [ "$app_id" = true ] && [ "$app_key" = true ] && [ "$endpoint" = true ] && [ "$api_key" = true ] && [ "$model" = true ]; then ready=true; fi
          python - <<PY
          import json
          d={"schema":"live-nightly-preflight/v1","ready":${ready},"operations_app_id_set":${app_id},"operations_app_private_key_set":${app_key},"research_endpoint_set":${endpoint},"research_api_key_set":${api_key},"research_model_set":${model},"operations_ref":"3a7e350ddd5648caf93f58651323425186544f66"}
          open("preflight.json","w").write(json.dumps(d,indent=2,sort_keys=True)+"\n")
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - name: Publish preflight receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(python - <<PY
          import json, os
          p="preflight.json"
          d=json.load(open(p)) if os.path.exists(p) else {"ready":False,"error":"no receipt"}
          print("### Live nightly research preflight")
          print("```json")
          print(json.dumps(d,indent=2,sort_keys=True))
          print("```")
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/issues/157/comments" -f body="$body"
      - name: Upload preflight receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-nightly-preflight-${{ github.run_id }}
          path: preflight.json
          retention-days: 30