name: Nightly research provider preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify authenticated Worker-backed Workers AI
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          PUBLIC_WORKER_URL: "https://heroic.ai.workers.dev"
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
        run: |
          set +e
          auth_token=false; app_id=false; app_key=false; endpoint=false; api_key=false; model=false
          [ -n "${AUTH_TOKEN:-}" ] && auth_token=true
          [ -n "${OPERATIONS_APP_ID:-}" ] && app_id=true
          [ -n "${OPERATIONS_APP_PRIVATE_KEY:-}" ] && app_key=true
          [ -n "${PUBLIC_WORKER_URL:-}" ] && endpoint=true
          [ "$auth_token" = true ] && api_key=true
          model=true
          ready=false
          if [ "$auth_token" = true ] && [ "$app_id" = true ] && [ "$app_key" = true ] && [ "$endpoint" = true ]; then ready=true; fi
          worker_health_status=000
          worker_health_curl_exit=0
          worker_health_curl_error=""
          worker_dns=""
          probe_curl_exit=0
          probe_curl_error=""
          worker_ai_verified=false
          if [ "$ready" = true ]; then
            health_file="$RUNNER_TEMP/nightly-research-worker-health.json"
            health_headers="$RUNNER_TEMP/nightly-research-worker-health.headers"
            health_error="$RUNNER_TEMP/nightly-research-worker-health.error"
            worker_health_status=$(curl -sS --max-time 30 -D "$health_headers" -o "$health_file" -w '%{http_code}' \
              "${PUBLIC_WORKER_URL}/health" 2>"$health_error")
            worker_health_curl_exit=$?
            worker_health_status="${worker_health_status:-000}"
            worker_health_curl_error="$(cat "$health_error" 2>/dev/null || true)"
            worker_dns="$(getent ahostsv4 "${PUBLIC_WORKER_URL#https://}" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ' || true)"
            echo "Public Worker health probe -> HTTP ${worker_health_status}"
            echo "Worker health edge headers:"
            awk 'BEGIN{IGNORECASE=1} /^(cf-ray|server|content-type):/ {print}' "$health_headers" | head -20 || true

            response_file="$RUNNER_TEMP/nightly-research-worker-preflight.json"
            probe_id="nightly-provider-preflight-${GITHUB_RUN_ID}"
            probe_payload=$(jq -nc --arg id "$probe_id" '{chat_id:$id,request_id:$id,message:"Return exactly OK.",mode:"chat",operation:"knowledge",strict_zero_cost_only:true,require_model_generation:true}')
            probe_error="$RUNNER_TEMP/nightly-research-worker-preflight.error"
            status=$(curl -sS --max-time 90 -o "$response_file" -w '%{http_code}' \
              -H "Authorization: Bearer ${AUTH_TOKEN}" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: ${probe_id}" \
              -d "$probe_payload" \
              "${PUBLIC_WORKER_URL}/api/v1/chat" 2>"$probe_error")
            probe_curl_exit=$?
            probe_curl_error="$(cat "$probe_error" 2>/dev/null || true)"
            echo "Worker-backed Workers AI probe -> HTTP ${status}"
            if [ "$status" = "200" ] && jq -e '.ok == true and .response.generation_status == "model_generated" and .response.provider == "cloudflare_workers_ai"' "$response_file" >/dev/null 2>&1; then
              worker_ai_verified=true
              echo "Worker-backed Workers AI probe: PASS"
            else
              echo "Worker-backed Workers AI probe: FAIL"
              jq -c '{ok,error,response:{generation_status:.response.generation_status,provider:.response.provider,configuration_diagnostics:.response.configuration_diagnostics}}' "$response_file" 2>/dev/null || true
            fi
          fi
          ready=false
          if [ "$auth_token" = true ] && [ "$app_id" = true ] && [ "$app_key" = true ] && [ "$endpoint" = true ] && [ "$worker_health_status" = 200 ] && [ "$worker_ai_verified" = true ]; then ready=true; fi
          export PREFLIGHT_APP_ID="$app_id"
          export PREFLIGHT_APP_KEY="$app_key"
          export PREFLIGHT_ENDPOINT="$endpoint"
          export PREFLIGHT_API_KEY="$api_key"
          export PREFLIGHT_MODEL="$model"
          export PREFLIGHT_AUTH_TOKEN="$auth_token"
          export PREFLIGHT_WORKER_AI="$worker_ai_verified"
          export PREFLIGHT_WORKER_HEALTH_STATUS="$worker_health_status"
          export PREFLIGHT_WORKER_HEALTH_CURL_EXIT="${worker_health_curl_exit:-0}"
          export PREFLIGHT_WORKER_HEALTH_CURL_ERROR="${worker_health_curl_error:-}"
          export PREFLIGHT_WORKER_DNS="${worker_dns:-}"
          export PREFLIGHT_PROBE_CURL_EXIT="${probe_curl_exit:-0}"
          export PREFLIGHT_PROBE_CURL_ERROR="${probe_curl_error:-}"
          export PREFLIGHT_READY="$ready"
          python - <<'PY'
          import json, os
          d = {
              "schema": "live-nightly-preflight/v2",
              "ready": os.environ["PREFLIGHT_READY"] == "true",
              "transport": "authenticated_foundation_worker",
              "worker_ai_path_verified": os.environ["PREFLIGHT_WORKER_AI"] == "true",
              "worker_health_http_status": int(os.environ.get("PREFLIGHT_WORKER_HEALTH_STATUS") or "0"),
              "worker_health_curl_exit": int(os.environ.get("PREFLIGHT_WORKER_HEALTH_CURL_EXIT") or "0"),
              "worker_health_transport_error": os.environ["PREFLIGHT_WORKER_HEALTH_CURL_ERROR"][:240],
              "worker_dns_ipv4": os.environ["PREFLIGHT_WORKER_DNS"][:512],
              "probe_curl_exit": int(os.environ["PREFLIGHT_PROBE_CURL_EXIT"]),
              "probe_transport_error": os.environ["PREFLIGHT_PROBE_CURL_ERROR"][:240],
              "edge_gate_suspected": int(os.environ.get("PREFLIGHT_WORKER_HEALTH_STATUS") or "0") == 403,
              "auth_token_set": os.environ["PREFLIGHT_AUTH_TOKEN"] == "true",
              "operations_app_id_set": os.environ["PREFLIGHT_APP_ID"] == "true",
              "operations_app_private_key_set": os.environ["PREFLIGHT_APP_KEY"] == "true",
              "research_endpoint_set": os.environ["PREFLIGHT_ENDPOINT"] == "true",
              "research_api_key_set": os.environ["PREFLIGHT_API_KEY"] == "true",
              "research_model_set": os.environ["PREFLIGHT_MODEL"] == "true",
              "operations_ref": "a3171f353539f1a31020c432f98cf0530cbf91ef",
              "workers_ai_model": "@cf/zai-org/glm-4.7-flash",
              "network_classification": (
                  "dns_or_network_unreachable" if int(os.environ.get("PREFLIGHT_WORKER_HEALTH_STATUS") or "0") == 0 else
                  "edge_http_403" if int(os.environ.get("PREFLIGHT_WORKER_HEALTH_STATUS") or "0") == 403 else
                  "worker_health_non_200" if int(os.environ.get("PREFLIGHT_WORKER_HEALTH_STATUS") or "0") != 200 else
                  "worker_health_ok_model_path_unverified"
              ),
          }
          with open("preflight.json", "w", encoding="utf-8") as handle:
              json.dump(d, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(d, indent=2, sort_keys=True))
          PY
          if [ "$ready" != "true" ]; then
            echo "Nightly research Worker-backed Workers AI path is unavailable; live research remains blocked."
            exit 1
          fi
      - name: Publish preflight receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > preflight-comment.md
          import json
          from pathlib import Path
          path = Path("preflight.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"ready": False, "error": "no receipt"}
          print("### Live nightly research preflight")
          print()
          print("```json")
          print(json.dumps(data, indent=2, sort_keys=True))
          print("```")
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/157/comments" -f body="$(cat preflight-comment.md)" || true
      - name: Upload preflight receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-nightly-preflight-${{ github.run_id }}
          path: preflight.json
          retention-days: 30