name: Nightly research provider preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check protected configuration presence
        env:
          OPERATIONS_APP_ID: ${{ secrets.OPERATIONS_APP_ID }}
          OPERATIONS_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEARCH_LLM_ENDPOINT: "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/ai/v1"
          RESEARCH_LLM_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEARCH_LLM_MODEL: "@cf/meta/llama-3.1-8b-instruct-fast"
        run: |
          set +e
          app_id=false; app_key=false; endpoint=false; api_key=false; model=false
          [ -n "${OPERATIONS_APP_ID:-}" ] && app_id=true
          [ -n "${OPERATIONS_APP_PRIVATE_KEY:-}" ] && app_key=true
          [ -n "${RESEARCH_LLM_ENDPOINT:-}" ] && endpoint=true
          [ -n "${RESEARCH_LLM_API_KEY:-}" ] && api_key=true
          [ -n "${RESEARCH_LLM_MODEL:-}" ] && model=true
          ready=false
          if [ "$app_id" = true ] && [ "$app_key" = true ] && [ "$endpoint" = true ] && [ "$api_key" = true ] && [ "$model" = true ]; then ready=true; fi
          if [ "$ready" = "true" ]; then
            probe=$(curl -fsS --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d '{"model":"@cf/meta/llama-3.1-8b-instruct-fast","messages":[{"role":"user","content":"Return OK"}],"max_tokens":1,"temperature":0}' \
              "${RESEARCH_LLM_ENDPOINT}/chat/completions")
            if ! printf '%s' "$probe" | jq -e '.choices[0].message.content | type == "string"' >/dev/null 2>&1; then
              echo "Cloudflare Workers AI inference probe failed; live research remains blocked."
              ready=false
            else
              echo "Cloudflare Workers AI inference probe: PASS"
            fi
          fi
          export PREFLIGHT_APP_ID="$app_id"
          export PREFLIGHT_APP_KEY="$app_key"
          export PREFLIGHT_ENDPOINT="$endpoint"
          export PREFLIGHT_API_KEY="$api_key"
          export PREFLIGHT_MODEL="$model"
          export PREFLIGHT_READY="$ready"
          python - <<'PY'
          import json, os
          d = {
              "schema": "live-nightly-preflight/v1",
              "ready": os.environ["PREFLIGHT_READY"] == "true",
              "operations_app_id_set": os.environ["PREFLIGHT_APP_ID"] == "true",
              "operations_app_private_key_set": os.environ["PREFLIGHT_APP_KEY"] == "true",
              "research_endpoint_set": os.environ["PREFLIGHT_ENDPOINT"] == "true",
              "research_api_key_set": os.environ["PREFLIGHT_API_KEY"] == "true",
              "research_model_set": os.environ["PREFLIGHT_MODEL"] == "true",
              "operations_ref": "41db817dee6aa7d369ea9a07dd072b58ece1695a",
          }
          with open("preflight.json", "w", encoding="utf-8") as handle:
              json.dump(d, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(d, indent=2, sort_keys=True))
          PY
          if [ "$ready" != "true" ]; then
            echo "Nightly research executor configuration is incomplete; receipt recorded and live research remains blocked."
            exit 1
          fi
      - name: Publish preflight receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > preflight-comment.md
          import json
          from pathlib import Path
          path = Path("preflight.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"ready": False, "error": "no receipt"}
          print("### Live nightly research preflight")
          print()
          print("```json")
          print(json.dumps(data, indent=2, sort_keys=True))
          print("```")
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/157/comments" -f body="$(cat preflight-comment.md)" || true
      - name: Upload preflight receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-nightly-preflight-${{ github.run_id }}
          path: preflight.json
          retention-days: 30