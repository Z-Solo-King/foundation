name: required PR checks

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  security-events: write

concurrency:
  group: foundation-required-pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:python

  public_tests:
    name: Public tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate multi-lens planner contract
        run: |
          set -euo pipefail
          node --check tools/multi_lens_planner.mjs
          node --test tests/multi_lens_planner.test.mjs
          mkdir -p .runtime
          node tools/multi_lens_planner.mjs < docs/MULTI_LENS_CHATBOT_PROFILE.json > .runtime/multi-lens-plan.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const profile = JSON.parse(fs.readFileSync("docs/MULTI_LENS_CHATBOT_PROFILE.json", "utf8"));
          const plan = JSON.parse(fs.readFileSync(".runtime/multi-lens-plan.json", "utf8"));
          if (plan.schema !== "multi-lens-plan/v1") throw new Error("invalid multi-lens plan schema");
          if (plan.authority !== "scheduling_only") throw new Error("planner authority boundary violated");
          if (plan.feasible !== true) throw new Error("planner produced an infeasible plan: " + JSON.stringify(plan.errors));
          if (plan.totals.lanes > plan.constraints.max_lanes) throw new Error("lane limit exceeded");
          if (plan.totals.cost > plan.constraints.cost_budget) throw new Error("cost budget exceeded");
          if (plan.totals.latency > plan.constraints.latency_budget) throw new Error("latency budget exceeded");
          if (plan.totals.quota > plan.constraints.quota_budget) throw new Error("quota budget exceeded");
          for (const id of profile.required_ids || []) {
            if (!plan.selected.some((lane) => lane.id === id)) throw new Error("required lane missing: " + id);
          }
          if (new Set(plan.selected.map((lane) => lane.family)).size < 3) throw new Error("insufficient lane diversity");
          NODE
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio coverage workers-py workers-runtime-sdk pyyaml jsonschema
      - name: Compile every Python source
        run: python -m compileall -q foundation_core
      - name: Verify package installation
        run: python -c "import foundation_core; print(foundation_core.__all__)"
      - name: Run product tests
        run: coverage run --branch --source=foundation_core --omit='tests/*' -m pytest tests/ -v
      - name: Enforce complete product coverage
        run: coverage report --show-missing --fail-under=100 --omit='tests/*'
      - name: Run deterministic natural-language research benchmark
        run: python -m benchmark.chatbot_query_benchmark --input benchmark/chatbot-query-corpus.json --output .runtime/chatbot-query-benchmark.json
      - name: Run frontend UI contract
        working-directory: frontend
        run: npm test
      - name: Public workflow policy tests
        run: python -m pytest -q tests/test_workflow_policy.py
      - name: Public trust-boundary security lint
        run: python scripts/public_security_lint.py --strict
      - name: Public documentation surface scan
        run: python tools/public_surface_scan.py --strict
      - name: Workflow authority boundary scan
        run: python tools/validate_workflow_authority.py
      - name: Foundation tracked-file coverage
        run: python tools/validate_family_full_coverage.py --foundation-root . --output .runtime/foundation-full-coverage.json --strict
      - name: GitHub Actions zero-cost policy
        run: python scripts/validate_github_actions_zero_cost.py
      - name: Hybrid & Alternative zero-cost policy
        run: python scripts/validate_hybrid_alternative_policy.py
      - name: System integration contract (Foundation)
        run: python tools/validate_system_integration.py --foundation-root . --strict
      - name: Source surface maintainability audit
        run: python tools/source_surface_audit.py --root . --output .runtime/source-surface-audit.json

      - name: Public PR metadata security scan
        if: "${{ github.event_name == 'pull_request' }}"
        env:
          PR_EVENT_PATH: "${{ github.event_path }}"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          event=json.load(open(os.environ['PR_EVENT_PATH'], encoding='utf-8'))
          payload=event.get('pull_request', {})
          out={'title':payload.get('title',''),'body':payload.get('body',''),'commits':[]}
          with open(os.environ['RUNNER_TEMP'] + '/public-pr-metadata.json','w',encoding='utf-8') as handle:
              json.dump(out, handle)
          PY
          python tools/public_surface_scan.py --strict --metadata-file "$RUNNER_TEMP/public-pr-metadata.json"
      - name: Public boundary scan
        shell: bash
        run: |
          set -euo pipefail
          test ! -e backend/learning/promotion.py
          ! grep -RniE 'extractor_mapper|private.chatbot|resource_ledger|promotion.py|trust_boundary|CONTROL_PLANE|research-intelligence-engine-(private|public)' foundation_core edge.ts wrangler.toml migrations
          ! grep -RniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AWS_SECRET_ACCESS_KEY|github_pat_[A-Za-z0-9_]+' backend foundation_core worker.py wrangler.toml migrations