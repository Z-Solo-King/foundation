name: required PR checks

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  security-events: write

concurrency:
  group: foundation-required-pr-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:python

  public_tests:
    name: Public tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio coverage workers-py workers-runtime-sdk
      - name: Compile every Python source
        run: python -m compileall -q backend foundation_core worker.py
      - name: Verify package installation
        run: python -c "import foundation_core; print(foundation_core.__all__)"
      - name: Run product tests
        run: coverage run --branch --source=backend,foundation_core,worker --omit='tests/*' -m pytest tests/ -v
      - name: Enforce complete product coverage
        run: coverage report --show-missing --fail-under=100 --omit='tests/*'
      - name: Run deterministic natural-language research benchmark
        run: python -m benchmark.chatbot_query_benchmark --input benchmark/chatbot-query-corpus.json --output .runtime/chatbot-query-benchmark.json
      - name: Run frontend UI contract
        working-directory: frontend
        run: npm test
      - name: Public workflow policy tests
        run: python -m pytest -q tests/test_workflow_policy.py
      - name: Public trust-boundary security lint
        run: python scripts/public_security_lint.py --strict
      - name: Public boundary scan
        shell: bash
        run: |
          set -euo pipefail
          test ! -e backend/learning/promotion.py
          ! grep -RniE 'operations|extractor_mapper|private\.chatbot|resource_ledger|promotion\.py|trust_boundary|CONTROL_PLANE|research-intelligence-engine-private' foundation_core backend worker.py wrangler.toml migrations
          ! grep -RniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AWS_SECRET_ACCESS_KEY|github_pat_[A-Za-z0-9_]+' backend foundation_core worker.py wrangler.toml migrations
      - name: Full tracked-tree secret scan
        shell: bash
        run: |
          set -euo pipefail
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[0-9A-Za-z-]{20,}'
          if git grep --no-color -nI -E "$pattern" -- .; then
            echo 'Potential credential material found in tracked current-tree content.' >&2
            exit 1
          fi
          if git grep --no-color -nI -E '(^|[[:space:]])(Bearer[[:space:]]+[A-Za-z0-9._~+/-]{32,}|api[_-]?key[[:space:]]*[:=][[:space:]]*["'"'][A-Za-z0-9._~+/-]{16,})' -- .; then
            echo 'Potential bearer/API credential material found in tracked current-tree content.' >&2
            exit 1
          fi

      - name: Full git-history secret scan
        shell: bash
        run: |
          set -euo pipefail
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[0-9A-Za-z-]{20,}'
          if git log --all --no-ext-diff --unified=0 -G "$pattern" --pretty=format: --; then
            echo 'Potential credential material found in git history.' >&2
            exit 1
          fi

      - name: Public protected-boundary cross-check
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/FAMILY_CONTRACT.json
          test -f CAPABILITIES.json
          ! grep -RniE 'private_secrets[[:space:]]*:[[:space:]]*true|protected[[:space:]_-]*operations[[:space:]_-]*information[[:space:]]*:[[:space:]]*true' docs/FAMILY_CONTRACT.json CAPABILITIES.json
