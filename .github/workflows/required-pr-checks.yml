name: required PR checks

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:python

  public_tests:
    name: Public tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio coverage workers-py workers-runtime-sdk
      - name: Compile every Python source
        run: python -m compileall -q backend foundation_core worker.py
      - name: Verify package installation
        run: python -c "import foundation_core; print(foundation_core.__all__)"
      - name: Run product tests
        run: coverage run --branch --source=backend,foundation_core,worker --omit='tests/*,backend/persistence/artifacts.py' -m pytest tests/ -v
      - name: Enforce complete product coverage
        run: coverage report --show-missing --fail-under=100 --omit='tests/*,backend/persistence/artifacts.py'
      - name: Run deterministic natural-language research benchmark
        run: python -m benchmark.chatbot_query_benchmark --input benchmark/chatbot-query-corpus.json --output .runtime/chatbot-query-benchmark.json
      - name: Run frontend UI contract
        working-directory: frontend
        run: npm test
      - name: Public workflow policy tests
        run: python -m pytest -q tests/test_workflow_policy.py
      - name: Public trust-boundary security lint
        run: python scripts/public_security_lint.py --strict
      - name: Public boundary scan
        shell: bash
        run: |
          set -euo pipefail
          test ! -e backend/learning/promotion.py
          ! grep -RniE 'operations|extractor_mapper|private\.chatbot|resource_ledger|promotion\.py|trust_boundary|CONTROL_PLANE|research-intelligence-engine-private' foundation_core backend worker.py wrangler.toml migrations tests
          ! grep -RniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AWS_SECRET_ACCESS_KEY|github_pat_[A-Za-z0-9_]+' backend foundation_core worker.py wrangler.toml migrations tests
  live-production-runtime:
    name: Live production runtime acceptance
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 650
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Require runtime credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTH_TOKEN:-}" || { echo 'AUTH_TOKEN secret missing'; exit 1; }

      - name: Health and readiness
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "${BASE_URL}/health")
          readiness=$(curl -sS --max-time 20 -o readiness.json -w '%{http_code}' "${BASE_URL}/readiness")
          echo "health=${health} readiness=${readiness}"
          test "$health" = 200
          test "$readiness" = 200
          jq -e '.ok == true' health.json >/dev/null
          jq -e '.ready == true and .database == true' readiness.json >/dev/null

      - name: Infrastructure diagnostic
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 45 -o diagnostic.json -w '%{http_code}'             -H "Authorization: Bearer ${AUTH_TOKEN}"             -H 'Content-Type: application/json'             -d '{"operation":"infrastructure_verify_public_test"}'             "${BASE_URL}/api/v1/chatbot/diagnostic")
          echo "diagnostic=${status}"
          test "$status" = 200
          jq -e '.ok == true and .status == "ok" and any(.checks[]?; .name == "public_chatbot" and .ok == true)' diagnostic.json >/dev/null

      - name: Chat and idempotent replay
        shell: bash
        run: |
          set -euo pipefail
          key="live-runtime-${RUN_ID}"
          jq -n             --arg chat_id "${key}"             --arg request_id "live-runtime-request-${RUN_ID}"             '{chat_id:$chat_id,request_id:$request_id,message:"Explain the Foundation public to Operations private boundary in one sentence.",mode:"chat",strict_zero_cost_only:true}' > chat.json
          status=$(curl -sS --max-time 90 -o chat-response.json -w '%{http_code}'             -H "Authorization: Bearer ${AUTH_TOKEN}"             -H 'Content-Type: application/json'             -H "Idempotency-Key: ${key}"             --data @chat.json "${BASE_URL}/api/v1/chat")
          replay=$(curl -sS --max-time 45 -o chat-replay.json -w '%{http_code}'             -H "Authorization: Bearer ${AUTH_TOKEN}"             -H 'Content-Type: application/json'             -H "Idempotency-Key: ${key}"             --data @chat.json "${BASE_URL}/api/v1/chat")
          echo "chat=${status} replay=${replay}"
          test "$status" = 200
          test "$replay" = 200
          jq -e '.ok == true and (.response.result_state == "COMPLETE" or .response.result_state == "PARTIAL")' chat-response.json >/dev/null
          jq -e '.ok == true and .response.result_state != "BLOCKED"' chat-replay.json >/dev/null

      - name: SSE lifecycle
        shell: bash
        run: |
          set -euo pipefail
          jq -n             --arg chat_id "live-stream-${RUN_ID}"             --arg request_id "live-stream-request-${RUN_ID}"             '{chat_id:$chat_id,request_id:$request_id,message:"Return one sentence describing the service boundary.",mode:"chat",strict_zero_cost_only:true}' > stream.json
          status=$(curl -sS --no-buffer --max-time 90 -D stream.headers -o stream.txt -w '%{http_code}'             -H "Authorization: Bearer ${AUTH_TOKEN}"             -H 'Content-Type: application/json'             -H "Idempotency-Key: live-stream-${RUN_ID}"             --data @stream.json "${BASE_URL}/api/v1/chat/stream")
          echo "stream=${status}"
          test "$status" = 200
          grep -qi '^Content-Type: text/event-stream' stream.headers
          grep -q '^event: start' stream.txt
          grep -q '^event: done' stream.txt

      - name: Research execution and readback
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{question:"Runtime acceptance: ingest one permitted public source and return grounded state.",depth:"quick",require_citations:true,max_sources:1,max_evidence_items:4,strict_zero_cost_only:true,source_urls:["https://example.com/"]}' > research.json
          status=$(curl -sS --max-time 90 -o research-response.json -w '%{http_code}'             -H "Authorization: Bearer ${AUTH_TOKEN}"             -H 'Content-Type: application/json'             -H "Idempotency-Key: live-research-${RUN_ID}"             --data @research.json "${BASE_URL}/api/v1/research")
          test "$status" = 200
          run_id=$(jq -r '.run_id // empty' research-response.json)
          test -n "$run_id"
          read_status=$(curl -sS --max-time 45 -o research-read.json -w '%{http_code}'             -H "Authorization: Bearer ${AUTH_TOKEN}"             "${BASE_URL}/api/v1/research/${run_id}")
          echo "research=${status} readback=${read_status}"
          test "$read_status" = 200
          jq -e --arg run_id "$run_id" '.ok == true and .run_id == $run_id' research-read.json >/dev/null

