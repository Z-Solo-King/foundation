name: Full history secret scan

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-full-history-secret-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Full history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run full tree and history scan
        run: bash tools/full_history_secret_scan.sh
      - name: Upload truthful receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-full-history-secret-scan
          path: .runtime/security/full-secret-scan.json
          if-no-files-found: error
