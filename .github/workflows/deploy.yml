name: deploy-public-worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.12.11
      - name: Validate D1 configuration
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'database_id = "REPLACE_WITH_D1_DATABASE_ID"' wrangler.toml; then
            echo 'Set the real D1 database_id in wrangler.toml before deployment.'
            exit 1
          fi
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.129.1 d1 migrations apply research-intelligence --remote
      - name: Deploy Python Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run --with workers-py==1.16.7 pywrangler deploy
