name: deploy-public-worker

on:
  workflow_run:
    workflows: [public-tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-public-worker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Resolve Cloudflare account and D1
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is required'; exit 1; }
          account_id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$account_id" ]; then
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
              https://api.cloudflare.com/client/v4/user/tokens/verify | jq -e '.success == true and .result.status == "active"' >/dev/null
            accounts=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
              'https://api.cloudflare.com/client/v4/accounts?per_page=100')
            test "$(jq '.result | length' <<<"$accounts")" -eq 1
            account_id=$(jq -r '.result[0].id' <<<"$accounts")
          fi
          d1=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database")
          database_id=$(jq -r '.result[] | select(.name == "research-intelligence") | .uuid' <<<"$d1" | head -n 1)
          test -n "$database_id" && test "$database_id" != null
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
      - name: Generate deployment Wrangler configuration
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          cat > wrangler.production.generated.toml <<EOF
name = "research-intelligence-engine-public"
main = "worker.py"
compatibility_date = "2026-09-09"
compatibility_flags = ["python_workers"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "research-intelligence"
database_id = "${D1_DATABASE_ID}"

[secrets]
required = ["AUTH_TOKEN", "B2_KEY_ID", "B2_APPLICATION_KEY"]

[vars]
ENVIRONMENT = "production"
STRICT_ZERO_COST_ONLY = "true"
B2_BUCKET = "SoloKing"
B2_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
EOF
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.d1.outputs.account_id }}
        run: npx wrangler@4.131.1 d1 migrations apply research-intelligence --remote --config wrangler.production.generated.toml
      - name: Deploy public Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.d1.outputs.account_id }}
        run: uv run pywrangler deploy --config wrangler.production.generated.toml
