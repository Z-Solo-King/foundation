name: deploy-public-worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-public-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.11
      - name: Run public tests
        run: uv run --with pytest pytest tests/ -v
      - name: Resolve production Cloudflare account and D1 database
        id: d1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is not configured." >&2
            exit 1
          fi

          account_id="${CLOUDFLARE_ACCOUNT_ID:-}"

          if [ -z "${account_id}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is unset; attempting safe account discovery from the authorized token."
            verify_json=$(curl -sS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              -w '\n%{http_code}' \
              'https://api.cloudflare.com/client/v4/user/tokens/verify')
            verify_status=$(tail -n 1 <<<"${verify_json}")
            verify_body=$(sed '$d' <<<"${verify_json}")
            if [ "${verify_status}" != "200" ]; then
              echo "ERROR: Cloudflare API token verification endpoint returned HTTP ${verify_status}."
              echo "${verify_body}"
              exit 1
            fi
            jq -e '.success == true and .result.status == "active"' <<<"${verify_body}" >/dev/null || {
              echo "ERROR: Cloudflare API token is not active."
              exit 1
            }

            accounts_json=$(curl -sS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              -w '\n%{http_code}' \
              'https://api.cloudflare.com/client/v4/accounts?per_page=100')
            accounts_status=$(tail -n 1 <<<"${accounts_json}")
            accounts_body=$(sed '$d' <<<"${accounts_json}")
            if [ "${accounts_status}" != "200" ]; then
              echo "ERROR: Cloudflare token cannot enumerate accounts (HTTP ${accounts_status})."
              echo "The deployment workflow needs either CLOUDFLARE_ACCOUNT_ID or token permission to list accessible accounts."
              echo "${accounts_body}"
              exit 1
            fi

            account_count=$(jq '.result | length' <<<"${accounts_body}")
            if [ "${account_count}" != "1" ]; then
              echo "ERROR: expected exactly one accessible Cloudflare account when CLOUDFLARE_ACCOUNT_ID is unset; found ${account_count}."
              echo "Set CLOUDFLARE_ACCOUNT_ID explicitly to the intended account."
              exit 1
            fi
            account_id=$(jq -r '.result[0].id' <<<"${accounts_body}")
          fi

          if [ -z "${account_id}" ] || [ "${account_id}" = "null" ]; then
            echo "ERROR: Cloudflare account identifier is unavailable."
            exit 1
          fi

          echo "Using Cloudflare account id ${account_id}."

          d1_json=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -w '\n%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database")
          d1_status=$(tail -n 1 <<<"${d1_json}")
          d1_body=$(sed '$d' <<<"${d1_json}")
          if [ "${d1_status}" != "200" ]; then
            echo "ERROR: unable to access D1 databases for account ${account_id} (HTTP ${d1_status})."
            echo "This usually means the token lacks the required account/D1 permissions or the account id is wrong."
            echo "${d1_body}"
            exit 1
          fi

          database_id=$(jq -r '.result[] | select(.name == "research-intelligence") | .uuid' <<<"${d1_body}" | head -n 1)
          if [ -z "${database_id}" ] || [ "${database_id}" = "null" ]; then
            echo "ERROR: D1 database 'research-intelligence' was not found in account ${account_id}."
            exit 1
          fi

          echo "account_id=${account_id}" >> "$GITHUB_OUTPUT"
          echo "database_id=${database_id}" >> "$GITHUB_OUTPUT"
      - name: Generate production Wrangler configuration
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cat > wrangler.production.generated.toml <<EOF
name = "research-intelligence-engine-public"
main = "worker.py"
compatibility_date = "2026-09-09"
compatibility_flags = ["python_workers"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "research-intelligence"
database_id = "${D1_DATABASE_ID}"

[[services]]
binding = "CONTROL_PLANE"
service = "research-intelligence-engine-private"

[secrets]
required = ["AUTH_TOKEN", "B2_KEY_ID", "B2_APPLICATION_KEY"]

[vars]
ENVIRONMENT = "production"
STRICT_ZERO_COST_ONLY = "true"
B2_BUCKET = "SoloKing"
B2_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
EOF
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.d1.outputs.account_id }}
        run: npx wrangler@4.131.1 d1 migrations apply research-intelligence --remote --config wrangler.production.generated.toml
      - name: Deploy Python Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.d1.outputs.account_id }}
        run: uv run pywrangler deploy --config wrangler.production.generated.toml
