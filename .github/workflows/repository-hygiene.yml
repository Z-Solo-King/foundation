name: Repository hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install pinned hygiene tools
        run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - name: Render exact Prettier output for changed live workflows
        run: npx --yes prettier@3.9.9 --write .github/workflows/browser-engine-runtime-evidence.yml .github/workflows/live-ai-provider-crossfire.yml .github/workflows/nightly-benchmark-ai-crossfire.yml
      - name: Upload exact Prettier output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-prettier-live-workflows-${{ github.run_id }}
          path: |
            .github/workflows/browser-engine-runtime-evidence.yml
            .github/workflows/live-ai-provider-crossfire.yml
            .github/workflows/nightly-benchmark-ai-crossfire.yml
          retention-days: 1
      - name: Run strict changed-file hygiene gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/repository_hygiene.mjs               --changed-from "${{ github.event.pull_request.base.sha }}"               --format-check               --strict               --report .runtime/hygiene.json
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            node tools/repository_hygiene.mjs               --changed-from "${{ github.event.before }}"               --format-check               --strict               --report .runtime/hygiene.json
          else
            node tools/repository_hygiene.mjs               --all               --format-check               --strict               --report .runtime/hygiene.json
          fi
      - name: Run code-documentation synchronization gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/code_documentation_sync.mjs               --changed-from "${{ github.event.pull_request.base.sha }}"               --strict               --report .runtime/code-doc-sync.json
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            node tools/code_documentation_sync.mjs               --changed-from "${{ github.event.before }}"               --strict               --report .runtime/code-doc-sync.json
          else
            node tools/code_documentation_sync.mjs               --all               --strict               --report .runtime/code-doc-sync.json
          fi
      - name: Upload hygiene reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-hygiene-report-${{ github.run_id }}
          path: .runtime/*.json
          retention-days: 14
