name: Repository hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install pinned hygiene tools
        run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - name: Run strict changed-file hygiene gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/repository_hygiene.py               --changed-from "${{ github.event.pull_request.base.sha }}"               --format-check               --strict               --report .runtime/hygiene.json
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python tools/repository_hygiene.py               --changed-from "${{ github.event.before }}"               --format-check               --strict               --report .runtime/hygiene.json
          else
            python tools/repository_hygiene.py               --all               --format-check               --strict               --report .runtime/hygiene.json
          fi
      - name: Run code-documentation synchronization gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/code_documentation_sync.py               --changed-from "${{ github.event.pull_request.base.sha }}"               --strict               --report .runtime/code-doc-sync.json
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python tools/code_documentation_sync.py               --changed-from "${{ github.event.before }}"               --strict               --report .runtime/code-doc-sync.json
          else
            python tools/code_documentation_sync.py               --all               --strict               --report .runtime/code-doc-sync.json
          fi
      - name: Upload hygiene reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-hygiene-report-${{ github.run_id }}
          path: .runtime/*.json
          retention-days: 14
