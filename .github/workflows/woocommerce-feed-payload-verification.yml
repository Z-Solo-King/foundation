name: WooCommerce feed payload verification

on:
  push:
    branches:
      - hunt/woocommerce-plugin-feed-fingerprinting-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site: [onlyssd, aarnacomputers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: c2f9019fce9e05f41140abeb4e3c99ce89ff18d5
          token: ${{ steps.operations-app.outputs.token }}
          persist-credentials: false
          path: operations
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install browser
        working-directory: operations
        run: |
          python -m pip install --disable-pip-version-check -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Capture payload
        working-directory: operations
        env:
          SITE: ${{ matrix.site }}
        run: |
          mkdir -p evidence/feed-bodies
          python scripts/woocommerce_feed_body_probe.py \
            --site "$SITE" \
            --out "evidence/feed-bodies/$SITE.json"
      - name: Upload payload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-woocommerce-feed-payload-${{ matrix.site }}
          path: operations/evidence/feed-bodies/
          retention-days: 7
