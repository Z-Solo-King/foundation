name: WooCommerce public Foundation hunt

on:
  push:
    branches:
      - hunt/woocommerce-plugin-feed-fingerprinting-20260929
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Exact Operations revision containing the WooCommerce extractor
        required: false
        default: fdc387c06a7e0e08c04fe331a2e39732db426a63
        type: string

permissions:
  contents: read

concurrency:
  group: foundation-woocommerce-public-hunt-v2
  cancel-in-progress: false

jobs:
  probe:
    name: WooCommerce shard ${{ matrix.shard }}
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-woo-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      OPERATIONS_REPOSITORY: Z-Solo-King/operations
      OPERATIONS_REF: ${{ inputs.operations_ref || 'fdc387c06a7e0e08c04fe331a2e39732db426a63' }}
      SHARD: ${{ matrix.shard }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Verify Operations token and revision
        env:
          GH_TOKEN: ${{ steps.operations-app.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/Z-Solo-King/operations --jq '.full_name')" = "Z-Solo-King/operations"
          test "$(gh api "repos/Z-Solo-King/operations/commits/$OPERATIONS_REF" --jq '.sha')" = "$OPERATIONS_REF"

      - name: Checkout exact Operations extractor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.OPERATIONS_REPOSITORY }}
          ref: ${{ env.OPERATIONS_REF }}
          token: ${{ steps.operations-app.outputs.token }}
          persist-credentials: false
          path: operations

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Install extractor browser dependencies
        working-directory: operations
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[browser]"
          python -m playwright install --with-deps chromium firefox webkit

      - name: Compile WooCommerce probe
        working-directory: operations
        run: python -m py_compile scripts/woocommerce_browser_probe_v3.py scripts/woocommerce_cross_browser_probe.py extractor_mapper/acquisition/browser.py extractor_mapper/extraction/google_merchant_feed_compat.py

      - name: Run 32-site shard
        working-directory: operations
        env:
          SHARD: ${{ matrix.shard }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          sites = [
              "aarnacomputers.com","adsstore.in","avikaretails.com","ezpzsolutions.in",
              "gamesncomps.com","geekbees.in","hotshiftpc.com","itgadgetsonline.com",
              "ithunt.in","kccomputers.co.in","krgkart.com","kryptronix.in",
              "nclcomputer.com","networkitstore.in","mynexusinfosys.com","onlyssd.com",
              "pckumar.in","pcstudio.in","pchubshop.com","primeabgb.com",
              "quickincomputers.com","sclgaming.in","solankienterprises.com",
              "varietyinfotech.com","viperpc.in","aulaindia.com","thecosmicbyte.com",
              "meckeys.com","moskeys.com","ninjadog.in","stackskb.com","theproaudio.com",
          ]

          shard = int(os.environ["SHARD"])
          selected = sites[shard::8]
          out = Path("evidence/final-v3")
          out.mkdir(parents=True, exist_ok=True)

          for site in selected:
              output = out / f"{site}.json"
              print(f"=== v3: {site} ===", flush=True)
              subprocess.run(
                  [
                      "python", "scripts/woocommerce_browser_probe_v3.py",
                      "--site", site,
                      "--output", str(output),
                  ],
                  check=True,
              )
              payload = json.loads(output.read_text(encoding="utf-8"))
              assert payload.get("site") == site, (site, payload.get("site"))
              assert payload.get("feed_status") in {"verified", "api_only", "unresolved"}, payload

          assert len(list(out.glob("*.json"))) == len(selected), selected

      - name: Upload v3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-woocommerce-v3-shard-${{ matrix.shard }}
          path: operations/evidence/final-v3/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate v3 32-site evidence
    needs: probe
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-woo-final]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download v3 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: foundation-woocommerce-v3-shard-*
          path: evidence
          merge-multiple: true

      - name: Aggregate and enforce coverage
        shell: python
        run: |
          import json
          from pathlib import Path

          expected = {
              "aarnacomputers.com","adsstore.in","avikaretails.com","ezpzsolutions.in",
              "gamesncomps.com","geekbees.in","hotshiftpc.com","itgadgetsonline.com",
              "ithunt.in","kccomputers.co.in","krgkart.com","kryptronix.in",
              "nclcomputer.com","networkitstore.in","mynexusinfosys.com","onlyssd.com",
              "pckumar.in","pcstudio.in","pchubshop.com","primeabgb.com",
              "quickincomputers.com","sclgaming.in","solankienterprises.com",
              "varietyinfotech.com","viperpc.in","aulaindia.com","thecosmicbyte.com",
              "meckeys.com","moskeys.com","ninjadog.in","stackskb.com","theproaudio.com",
          }

          # merge-multiple=true flattens each artifact's files directly under evidence/
          files = sorted(Path("evidence").glob("*.json"))
          by_site = {}
          for path in files:
              row = json.loads(path.read_text(encoding="utf-8"))
              site = row.get("site")
              if site:
                  by_site[site] = row

          missing = sorted(expected - set(by_site))
          duplicates = len(files) != len(by_site)
          verified = [r for r in by_site.values() if r.get("feed_status") == "verified"]
          api_only = [r for r in by_site.values() if r.get("feed_status") == "api_only"]
          unresolved = [r for r in by_site.values() if r.get("feed_status") == "unresolved"]

          summary = {
              "schema": "foundation-woocommerce-v3.1-32-site-hunt/v2",
              "expected_sites": len(expected),
              "observed_site_files": len(files),
              "observed_sites": len(by_site),
              "coverage_complete": (
                  not missing
                  and not duplicates
                  and len(by_site) == len(expected)
              ),
              "missing_sites": missing,
              "duplicate_site_files": duplicates,
              "verified_feed_count": len(verified),
              "api_only_count": len(api_only),
              "unresolved_count": len(unresolved),
              "verified_feeds": [
                  {"site": r.get("site"), "urls": r.get("verified_feed_urls", [])}
                  for r in verified
              ],
              "plugin_signals": {
                  r.get("site"): r.get("woocommerce_fingerprint", {}).get("plugin_signals", [])
                  for r in by_site.values()
              },
              "sites": by_site,
          }

          Path("summary-v3.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              k: summary[k] for k in (
                  "expected_sites","observed_site_files","observed_sites",
                  "coverage_complete","verified_feed_count",
                  "api_only_count","unresolved_count","missing_sites"
              )
          }, indent=2))

          if not summary["coverage_complete"]:
              raise SystemExit("32-site evidence coverage is incomplete")

      - name: Upload v3 summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-woocommerce-v3-32-site-summary
          path: summary-v3.json
          if-no-files-found: error
          retention-days: 30