name: Finalize Foundation private-runtime boundary

on:
  push:
    branches:
      - migration/move-private-work-into-operations-20261002
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-foundation-private-runtime-20261002
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Foundation migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: migration/move-private-work-into-operations-20261002
          fetch-depth: 1

      - name: Remove private runtime from public tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend
          rm -f worker.py wrangler.python-core.toml
          find tests -type f \( -name '*.py' -o -name '*.mjs' \) -print0 |
            while IFS= read -r -d '' f; do
              if grep -qE '(^|[[:space:]])(from|import)[[:space:]]+backend([.]|[[:space:]]|$)|(^|[[:space:]])import[[:space:]]+worker([[:space:]]|$)' "$f"; then
                rm -f "$f"
              fi
            done
          find tests -type d -empty -delete 2>/dev/null || true

      - name: Remove migration trigger artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/PRIVATE_RUNTIME_MIGRATION_TRIGGER_2026-10-02.md
          rm -f docs/PRIVATE_RUNTIME_FINALIZE_TRIGGER_2026-10-02.md
          rm -f .github/workflows/private-runtime-migration-20261002.yml
          rm -f .github/workflows/finalize-private-runtime-20261002.yml
          test ! -d backend
          test ! -f worker.py
          test ! -f wrangler.python-core.toml

      - name: Verify public boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f edge.ts
          test -d foundation_core
          test -f REPOSITORY_MAP.json
          test -f docs/PRIVATE_RUNTIME_BOUNDARY_2026-10-02.md || true
          python -m compileall -q foundation_core
          if grep -RniE 'from backend|import backend|(^|[[:space:]/])worker\.py([[:space:]"'\''/]|$)|wrangler\.python-core\.toml' .github/workflows tests docs README.md REPOSITORY_MAP.json 2>/dev/null; then
            echo "stale public runtime reference detected"
            exit 1
          fi

      - name: Commit Foundation cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Foundation boundary already clean'
          else
            git commit -m 'refactor: complete public Foundation runtime boundary'
            git push origin HEAD:migration/move-private-work-into-operations-20261002
          fi
