name: Restore existing prepare chatbot workflow

on:
  push:
    branches:
      - fix/chatbot-production-source-sync-20260922

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore exact main version and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/prepare-live-chat-source-fix.yml > .github/workflows/prepare-live-chat-source-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/prepare-live-chat-source-fix.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore prepare chatbot workflow from main"
          fi
          git rm -f .github/workflows/restore-prepare-chatbot-workflow.yml
          git commit -m "chore: remove temporary restore helper"
          git push origin HEAD:${{ github.ref_name }}
