name: WooCommerce WPFM Targeted Native XML Hunt

on:
  push:
    branches: [hunt/native-google-feed-urls-20260927]
    paths:
      - "tools/feed-lab/woocommerce_31_group_xml_guess.mjs"
      - ".github/workflows/native-google-feed-wpfm-targeted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Load verified browser plugin evidence
        run: |
          set -euo pipefail
          mkdir -p out/itgadgetsonline
          cat > out/itgadgetsonline/plugin-groups.json <<'JSON'
          {
            "schema_version": "woocommerce-targeted-plugin-group/v3",
            "source": {
              "kind": "v175-browser-recovery",
              "workflow_run": 36629019347,
              "evidence": "public WP-JSON namespace wpfm/v1"
            },
            "site_count": 1,
            "groups": {
              "wpfm_product_feed_manager": ["itgadgetsonline"]
            },
            "sites": [
              {
                "site": "itgadgetsonline",
                "configured_root": "https://itgadgetsonline.com",
                "selected_origin": "https://itgadgetsonline.com",
                "primary_group": "wpfm_product_feed_manager",
                "status": "PLUGIN_SURFACE_RECOVERED_NO_FEED_SIGNAL",
                "feed_like_plugin_assets": [],
                "feed_family_signals": [
                  {
                    "family": "wpfm_product_feed_manager",
                    "confidence": "strong",
                    "evidence": ["namespace:wpfm/v1"]
                  }
                ],
                "identity_tokens": ["itgadgetsonline"],
                "public_api_namespaces": ["wpfm/v1"]
              }
            ]
          }
          JSON
      - name: Probe WPFM XML naming corpus
        run: |
          set -euo pipefail
          node tools/feed-lab/woocommerce_31_group_xml_guess.mjs             --group wpfm_product_feed_manager             --input out/itgadgetsonline/plugin-groups.json             --out out/itgadgetsonline/xml-guess
      - name: Upload WPFM targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-wpfm-itgadgetsonline-final
          path: out/itgadgetsonline/
          retention-days: 14
