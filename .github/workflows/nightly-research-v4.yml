name: nightly research v4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  PYTHONUNBUFFERED: "1"
  OPERATIONS_REPOSITORY: Z-Solo-King/operations
  OPERATIONS_RESEARCH_REF: 453dbe07fb1f06f7f181b561d65dda2b916c421d

jobs:
  control-plane:
    name: Nightly research permissions canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          echo "permissions-canary: PASS"
