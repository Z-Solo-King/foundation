name: WooCommerce Known Feed Guess Calibration

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/woocommerce_known_feed_guess_calibration.mjs"
      - ".github/workflows/woocommerce-known-feed-guess-calibration.yml"
      - "tests/test_woocommerce_v175_feed_detection.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    name: Guess ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        site:
          - "PC Studio"
          - "Quickin Computers"
          - "Avikaretails"
          - "Geekbees"
          - "Ninja Dog"
          - "Network IT Store"
          - "My Nexus Infosys"
          - "Solanki Enterprises"
          - "Only SSD"
          - "IT Gadgets Online"
    env:
      SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Run four cross-fire guessing lanes
        run: node tools/woocommerce_known_feed_guess_calibration.mjs
      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-known-feed-guess-${{ matrix.site }}
          path: out/woocommerce-known-feed-guess-calibration/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: calibrate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download calibration evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: woocommerce-known-feed-guess-*
          path: out/calibration
          merge-multiple: true
      - name: Validate calibration contract
        shell: python
        run: |
          import json
          from pathlib import Path

          files = sorted(Path("out/calibration").glob("*.json"))
          rows = [json.loads(p.read_text(encoding="utf-8")) for p in files if p.stat().st_size]
          expected = {
              "pc studio", "quickin computers", "avikaretails", "geekbees",
              "ninja dog", "network it store", "my nexus infosys",
              "solanki enterprises", "only ssd", "it gadgets online",
          }
          actual = {str(r.get("site", "")).lower() for r in rows}
          assert actual == expected, (actual, expected)
          assert all(r.get("known_target") is True for r in rows)
          assert all(r.get("active_cohort") is False for r in rows)
          hits = [h for r in rows for h in r.get("verified_guess_hits", [])]
          print("known_targets=", len(rows))
          print("verified_guess_hits=", len(hits))
          for h in hits:
              print(h)

      - name: Upload aggregate calibration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woocommerce-known-feed-guess-aggregate
          path: out/calibration/
          if-no-files-found: warn
          retention-days: 30