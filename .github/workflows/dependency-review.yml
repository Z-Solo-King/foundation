name: Dependency Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-graph-preflight:
    name: Dependency graph capability preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.graph.outputs.enabled }}
    steps:
      - name: Detect Dependency Graph
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$RUNNER_TEMP/dependency-graph.json" -w '%{http_code}'             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")"
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Dependency Review::Dependency Graph is disabled; native dependency review is skipped."
              ;;
            *)
              echo "Dependency Graph capability probe failed with HTTP ${status}" >&2
              cat "$RUNNER_TEMP/dependency-graph.json" >&2 || true
              exit 1
              ;;
          esac

  dependency-review:
    name: Dependency review
    needs: dependency-graph-preflight
    if: needs.dependency-graph-preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
