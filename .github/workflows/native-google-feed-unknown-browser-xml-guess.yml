name: WooCommerce 22 Unknown Browser XML Guess
on:
  push:
    branches: [hunt/native-google-feed-urls-20260927]
    paths:
      - "tools/feed-lab/woocommerce_22_browser_xml_guess.py"
      - ".github/workflows/native-google-feed-unknown-browser-xml-guess.yml"
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - "tools/feed-lab/woocommerce_22_browser_xml_guess.py"
      - ".github/workflows/native-google-feed-unknown-browser-xml-guess.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guess:
    name: "browser XML guess shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1,2,3,4]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: "4"
      OUT_DIR: out/browser-xml-guess
      SITE_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install chromium
      - run: python tools/feed-lab/woocommerce_22_browser_xml_guess.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-xml-guess-shard-${{ matrix.shard }}
          path: out/browser-xml-guess/shard-${{ matrix.shard }}.json
          retention-days: 14
  aggregate:
    needs: guess
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-xml-guess-shard-*
          path: out/shards
          merge-multiple: false
      - name: Aggregate
        run: |
          python - <<'PY'
          import json, pathlib
          rows=[]
          for p in pathlib.Path('out/shards').glob('**/shard-*.json'):
              rows += json.loads(p.read_text()).get('results',[])
          rows=sorted({r['site']:r for r in rows}.values(),key=lambda r:r['site'].lower())
          pathlib.Path('out/browser-xml-guess-aggregate.json').write_text(json.dumps({'schema_version':'woocommerce-22-browser-xml-guess-aggregate/v2','site_count':len(rows),'results':rows},indent=2)+'\n')
          assert len(rows)==22, len(rows)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: woocommerce22-browser-xml-guess-aggregate
          path: out/browser-xml-guess-aggregate.json
          retention-days: 14
