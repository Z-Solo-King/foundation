name: WooCommerce 22 Unknown Browser XML Guess
on:
  push:
    branches: [hunt/native-google-feed-urls-20260927]
    paths:
      - "tools/feed-lab/woocommerce_22_browser_xml_guess.py"
      - ".github/workflows/native-google-feed-unknown-browser-xml-guess.yml"
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - "tools/feed-lab/woocommerce_22_browser_xml_guess.py"
      - ".github/workflows/native-google-feed-unknown-browser-xml-guess.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guess:
    name: "browser XML guess — ${{ matrix.id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {id: aula-india, site: AULA India, root: https://aulaindia.com}
          - {id: aarna-computers, site: Aarna Computers, root: https://aarnacomputers.com}
          - {id: ads-store, site: Ads Store, root: https://adsstore.in}
          - {id: cosmic-byte, site: Cosmic Byte, root: https://www.thecosmicbyte.com}
          - {id: ezpz-solutions, site: EZPZ Solutions, root: https://www.ezpzsolutions.in}
          - {id: kc-computers, site: KC Computers, root: https://kccomputers.co.in}
          - {id: krg-kart, site: KRG KART, root: https://krgkart.com}
          - {id: kryptronix-gaming, site: Kryptronix Gaming, root: https://kryptronix.in}
          - {id: meckeys, site: Meckeys, root: https://www.meckeys.com}
          - {id: moskeys, site: Moskeys, root: https://moskeys.com}
          - {id: ncl-computer, site: NCL Computer, root: https://nclcomputer.com}
          - {id: pc-kumar-infotech, site: PC Kumar Infotech, root: https://pckumar.in}
          - {id: pchubshop, site: PCHubShop, root: https://www.pchubshop.com}
          - {id: prime-abgb, site: Prime ABGB, root: https://www.primeabgb.com}
          - {id: scl-gaming, site: SCL Gaming, root: https://sclgaming.in}
          - {id: stackskb, site: StacksKB, root: https://stackskb.com}
          - {id: theproaudio, site: Theproaudio, root: https://www.theproaudio.com}
          - {id: variety-infotech, site: Variety Infotech, root: https://varietyinfotech.com}
          - {id: viper-pc, site: Viper PC, root: https://viperpc.in}
          - {id: hotshiftpc, site: hotshiftpc, root: https://hotshiftpc.com}
          - {id: itgadgetsonline, site: itgadgetsonline, root: https://itgadgetsonline.com}
          - {id: ithunt, site: ithunt, root: https://ithunt.in}
    env:
      SITE_NAME: ${{ matrix.site }}
      SITE_ROOT: ${{ matrix.root }}
      OUT_DIR: out/browser-xml-guess/${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install chromium
      - run: python tools/feed-lab/woocommerce_22_browser_xml_guess.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-xml-guess-${{ matrix.id }}
          path: out/browser-xml-guess/${{ matrix.id }}/
          retention-days: 14
  aggregate:
    needs: guess
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-xml-guess-*
          path: out
          merge-multiple: false
      - name: Aggregate
        run: |
          python - <<'PY'
          import json, pathlib
          rows=[]
          for p in pathlib.Path('out').glob('**/result.json'):
              d=json.loads(p.read_text()); rows.append(d)
          rows=sorted({r['site']:r for r in rows}.values(),key=lambda r:r['site'].lower())
          pathlib.Path('out/browser-xml-guess-aggregate.json').write_text(json.dumps({'schema_version':'woocommerce-22-browser-xml-guess-aggregate/v1','site_count':len(rows),'results':rows},indent=2)+'\n')
          assert len(rows)==22, len(rows)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: woocommerce22-browser-xml-guess-aggregate
          path: out/browser-xml-guess-aggregate.json
          retention-days: 14
