name: Flipkart Rome direct replay

on:
  push:
    branches:
      - diag/left-targets-v4-2026-09-26

permissions:
  contents: read

jobs:
  flipkart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: "24"}
      - name: Replay Rome API
        run: node scripts/flipkart_rome_direct_probe.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: flipkart-rome-direct, path: flipkart-rome-direct.json, if-no-files-found: warn, retention-days: 14}
