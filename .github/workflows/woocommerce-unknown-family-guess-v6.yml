name: WooCommerce Unknown Family Guess V6\non:\n  push:\n    branches: [feat/wc-unknown-family-guess-v6-20260930]\n    paths:\n      - "tools/woocommerce_unknown_family_guess_v6.mjs"\n      - "tests/test_woocommerce_unknown_family_guess_v6.mjs"\n      - ".github/workflows/woocommerce-unknown-family-guess-v6.yml"\n  pull_request:\n    branches: [main]\n    paths:\n      - "tools/woocommerce_unknown_family_guess_v6.mjs"\n      - "tests/test_woocommerce_unknown_family_guess_v6.mjs"\n      - ".github/workflows/woocommerce-unknown-family-guess-v6.yml"\n  workflow_dispatch:\npermissions:\n  contents: read\nconcurrency:\n  group: wc-unknown-family-v6-${{ github.ref }}\n  cancel-in-progress: true\njobs:\n  guess:\n    name: unknown-family shard ${{ matrix.shard }}\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    strategy:\n      fail-fast: false\n      matrix:\n        shard: [1,2,3,4,5,6]\n    env:\n      SHARD: ${{ matrix.shard }}\n      SHARDS: 6\n    steps:\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1\n      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020\n        with:\n          node-version: "22"\n          package-manager-cache: false\n      - name: Unit tests\n        run: node --test tests/test_woocommerce_unknown_family_guess_v6.mjs\n      - name: Unknown-family guessing\n        run: node tools/woocommerce_unknown_family_guess_v6.mjs\n      - name: Upload shard evidence\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02\n        with:\n          name: woocommerce-unknown-family-v6-shard-${{ matrix.shard }}\n          path: out/woocommerce-unknown-family-guess-v6/\n          retention-days: 30\n  aggregate:\n    needs: guess\n    if: always()\n    runs-on: ubuntu-latest\n    timeout-minutes: 8\n    steps:\n      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c\n        with:\n          pattern: woocommerce-unknown-family-v6-shard-*\n          path: out/shards\n          merge-multiple: false\n      - name: Aggregate\n        run: |\n          set -euo pipefail\n          node --input-type=module <<'NODE'\n          import fs from 'node:fs';\n          import path from 'node:path';\n          const files=[];\n          function walk(p){for(const e of fs.readdirSync(p,{withFileTypes:true})){const q=path.join(p,e.name);if(e.isDirectory())walk(q);else if(e.name.endsWith('.json'))files.push(q);}}\n          walk('out/shards');\n          const rows=files.sort().flatMap(f=>JSON.parse(fs.readFileSync(f,'utf8')).results||[]);\n          const unique=new Map(rows.map(x=>[x.root,x]));\n          const ordered=[...unique.values()].sort((a,b)=>a.root.localeCompare(b.root));\n          if(ordered.length!==17) throw new Error('expected 17 unique unknown targets, got '+ordered.length);\n          const out={schema:'woocommerce-unknown-family-guess-v6-aggregate/v1',target_count:17,native_verified:ordered.filter(x=>x.candidate_hits?.length).length,native_urls:ordered.flatMap(x=>x.positive_urls||[]),transport_limited:ordered.filter(x=>x.status.includes('TRANSPORT_LIMITED')).length,clean_no_hit:ordered.filter(x=>x.status==='NO_NATIVE_FEED_VERIFIED').length,candidate_total:ordered.reduce((n,x)=>n+x.candidate_count,0),results:ordered};\n          fs.mkdirSync('out/aggregate',{recursive:true}); fs.writeFileSync('out/aggregate/aggregate.json',JSON.stringify(out,null,2)+'\n');\n          console.log(JSON.stringify({...out,results:undefined},null,2));\n          NODE\n      - name: Upload aggregate evidence\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02\n        with:\n          name: woocommerce-unknown-family-v6-aggregate\n          path: out/aggregate/\n          retention-days: 30\n