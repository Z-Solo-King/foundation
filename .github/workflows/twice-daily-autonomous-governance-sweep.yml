name: Twice-daily autonomous governance sweep

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan and publish findings; do not dispatch the autonomous supervisor"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: twice-daily-autonomous-governance-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Foundation main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Mint read/write Operations issue token
        id: operations-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796da409d3eb1 # v3.2.0
        with:
          client-id: \${{ secrets.OPERATIONS_APP_ID }}
          private-key: \${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
          permission-issues: write

      - name: Checkout Operations main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: main
          token: \${{ steps.operations-token.outputs.token }}
          path: operations
          fetch-depth: 0
          persist-credentials: false

      - name: Snapshot live GitHub metadata
        env:
          GH_TOKEN: \${{ github.token }}
          OPERATIONS_GH_TOKEN: \${{ steps.operations-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/governance
          gh api "repos/Z-Solo-King/foundation/issues?state=open&per_page=100" --jq '[.[] | {number,title,updatedAt:.updated_at,createdAt:.created_at,labels:[.labels[].name],url:.html_url}]' > .runtime/governance/foundation-issues.json
          gh api "repos/Z-Solo-King/foundation/pulls?state=open&per_page=100" --jq '[.[] | {number,title,updatedAt:.updated_at,createdAt:.created_at,headSha:.head.sha,headRef:.head.ref,url:.html_url}]' > .runtime/governance/foundation-prs.json
          gh api "repos/Z-Solo-King/foundation/actions/runs?per_page=100" --jq '[.workflow_runs[] | {id,name,path,status,conclusion,created_at,run_started_at,updated_at,head_sha,event}]' > .runtime/governance/foundation-runs.json
          GH_TOKEN="$OPERATIONS_GH_TOKEN" gh api "repos/Z-Solo-King/operations/issues?state=open&per_page=100" --jq '[.[] | {number,title,updatedAt:.updated_at,createdAt:.created_at,labels:[.labels[].name],url:.html_url}]' > .runtime/governance/operations-issues.json
          GH_TOKEN="$OPERATIONS_GH_TOKEN" gh api "repos/Z-Solo-King/operations/pulls?state=open&per_page=100" --jq '[.[] | {number,title,updatedAt:.updated_at,createdAt:.created_at,headSha:.head.sha,headRef:.head.ref,url:.html_url}]' > .runtime/governance/operations-prs.json
          GH_TOKEN="$OPERATIONS_GH_TOKEN" gh api "repos/Z-Solo-King/operations/actions/runs?per_page=100" --jq '[.workflow_runs[] | {id,name,path,status,conclusion,created_at,run_started_at,updated_at,head_sha,event}]' > .runtime/governance/operations-runs.json
          GH_TOKEN="$OPERATIONS_GH_TOKEN" gh api repos/Z-Solo-King/operations/commits/main --jq .sha > .runtime/governance/operations-main-sha

      - name: Build consolidated live GitHub snapshot
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".runtime/governance")
          payload={
            "schema":"governance-github-snapshot/v1",
            "foundation":{
              "issues":json.loads((root/"foundation-issues.json").read_text()),
              "prs":json.loads((root/"foundation-prs.json").read_text()),
              "runs":json.loads((root/"foundation-runs.json").read_text()),
            },
            "operations":{
              "issues":json.loads((root/"operations-issues.json").read_text()),
              "prs":json.loads((root/"operations-prs.json").read_text()),
              "runs":json.loads((root/"operations-runs.json").read_text()),
            },
          }
          (root/"github-snapshot.json").write_text(json.dumps(payload)+"\n")
          PY

      - name: Launch eight cross-fire observation lanes
        run: |
          set -euo pipefail
          lanes=(
            structure_hygiene
            migration_boundary
            research_feed
            provider_runtime
            work_items_workflow
            maps_docs_policy
            quality_learning_evolution
            performance_resources
          )
          pids=()
          for lane in "\${lanes[@]}"; do
            python tools/comprehensive_governance_scan.py \
              --foundation . \
              --operations operations \
              --snapshot .runtime/governance/github-snapshot.json \
              --lane "$lane" \
              --output ".runtime/governance/$lane.json" &
            pids+=("$!")
          done
          for pid in "\${pids[@]}"; do wait "$pid"; done

      - name: Build immutable live snapshot envelope
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".runtime/governance")
          payload={
            "schema":"governance-github-snapshot/v1",
            "foundation":{
              "issues":json.loads((root/"foundation-issues.json").read_text()),
              "prs":json.loads((root/"foundation-prs.json").read_text()),
              "runs":json.loads((root/"foundation-runs.json").read_text()),
            },
            "operations":{
              "issues":json.loads((root/"operations-issues.json").read_text()),
              "prs":json.loads((root/"operations-prs.json").read_text()),
              "runs":json.loads((root/"operations-runs.json").read_text()),
            },
          }
          (root/"github-snapshot.json").write_text(json.dumps(payload)+"\n")
          PY

      - name: Merge cross-fire findings
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path(".runtime/governance")
          findings={}
          for path in root.glob("*.json"):
            if path.name in {"github-snapshot.json","merged.json","public.json"} or "-" in path.name:
              continue
            payload=json.loads(path.read_text())
            for finding in payload.get("findings",[]):
              findings[finding["finding_id"]]=finding
          snap=json.loads((root/"github-snapshot.json").read_text())
          merged={
            "schema":"comprehensive-governance-scan/v1",
            "generated_at":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
            "lane":"crossfire",
            "repos":{repo:{kind:len(value) for kind,value in data.items()} for repo,data in snap.items()},
            "coverage":{
              "finding_count":len(findings),
              "critical_findings":sum(x["severity"]=="critical" for x in findings.values()),
              "attention_findings":sum(x["severity"]=="attention" for x in findings.values()),
              "telemetry_status":"descriptive_only"
            },
            "findings":list(findings.values()),
            "cross_fire_lanes":["structure_hygiene","migration_boundary","research_feed","provider_runtime","work_items_workflow","maps_docs_policy","quality_learning_evolution","performance_resources"],
            "authority_note":"Observation/governance overlay only."
          }
          (root/"merged.json").write_text(json.dumps(merged,indent=2)+"\n")
          PY

      - name: Publish Foundation findings without private paths
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".runtime/governance")
          merged=json.loads((root/"merged.json").read_text())
          public=[]
          for finding in merged.get("findings",[]):
            safe_paths=[p for p in finding.get("paths",[]) if (Path(p).exists())]
            item={k:finding[k] for k in ("finding_id","lane","category","severity","code","summary") if k in finding}
            if safe_paths: item["paths"]=safe_paths
            public.append(item)
          safe={**merged,"findings":public,"privacy":"Foundation-safe; Operations-only paths and raw private details removed."}
          (root/"public.json").write_text(json.dumps(safe,indent=2)+"\n")
          PY
          python tools/publish_governance_findings.py --repo Z-Solo-King/foundation --report .runtime/governance/public.json

      - name: Publish full Operations findings
        env:
          GH_TOKEN: \${{ steps.operations-token.outputs.token }}
        run: python tools/publish_governance_findings.py --repo Z-Solo-King/operations --report .runtime/governance/merged.json

      - name: Dispatch existing autonomous supervisor
        if: \${{ !(inputs.dry_run || false) }}
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          active="\$(gh run list --workflow autonomous-engineering-supervisor.yml --status queued --status in_progress --limit 1 --json databaseId --jq 'length')"
          if [ "\$active" = "0" ]; then
            gh workflow run autonomous-engineering-supervisor.yml --ref main
          else
            echo "existing autonomous supervisor run is active; no duplicate dispatch"
          fi

      - name: Publish sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: comprehensive-governance-public-receipt-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: .runtime/governance/public.json
          if-no-files-found: error
