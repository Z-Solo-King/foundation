name: temporary session format check

on:
  push:
    branches:
      - "fix/session-independent-automation-current-20261003"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: npm exec --yes prettier@3.9.9 -- --write .github/workflows/autonomous-engineering-supervisor.yml .github/workflows/commerce-feed-product-crawl.yml .github/workflows/coverage-driven-runtime-matrix.yml .github/workflows/project-improvement-supervisor.yml .github/workflows/woocommerce-emergency-xml-recovery.yml .github/workflows/woocommerce-native-xml-recovery-v18.yml docs/OPEN_ISSUE_ACCEPTANCE_MATRIX.json tools/autonomous_engineering_supervisor.mjs
      - run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - run: ruff format tests/test_crossfire_workflows.py
      - name: Emit diff
        run: git diff --unified=3 -- .github/workflows/autonomous-engineering-supervisor.yml .github/workflows/commerce-feed-product-crawl.yml .github/workflows/coverage-driven-runtime-matrix.yml .github/workflows/project-improvement-supervisor.yml .github/workflows/woocommerce-emergency-xml-recovery.yml .github/workflows/woocommerce-native-xml-recovery-v18.yml docs/OPEN_ISSUE_ACCEPTANCE_MATRIX.json tools/autonomous_engineering_supervisor.mjs tests/test_crossfire_workflows.py
