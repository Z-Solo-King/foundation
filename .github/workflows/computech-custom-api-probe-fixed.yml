name: Computech custom XHR probe

on:
  push:
    branches:
      - diag/computech-custom-api-2026-09-26
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computech-custom-api-probe-fixed
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Capture XHR and test custom API candidates
        run: |
          python - <<'PY'
          import asyncio, json, re
          from urllib.parse import urljoin, urlsplit
          from playwright.async_api import async_playwright

          ROOT = "https://computechstore.in"
          SEEDS = [
              ROOT + "/",
              ROOT + "/shop/",
              ROOT + "/product-category/graphics-card/",
              ROOT + "/?dgwt_wcas=1&post_type=product&s=RTX%205080",
              ROOT + "/search/?q=rtx",
          ]
          STATIC = re.compile(r"\\.(?:css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|webp|avif|map)(?:[?#].*)?$", re.I)
          SIGNAL = re.compile(r"(?i)(api|ajax|json|graphql|product|catalog|search|item|inventory|filter|load|partial|htmx)")

          def same_host(u):
              h = (urlsplit(u).hostname or "").lower()
              return h == "computechstore.in" or h.endswith(".computechstore.in")

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  ctx = await browser.new_context(
                      user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                      locale="en-IN",
                      timezone_id="Asia/Kolkata",
                      viewport={"width":1366,"height":768},
                  )
                  events = []
                  seen = set()

                  async def on_request(req):
                      try:
                          u=req.url
                          if not same_host(u) or STATIC.search(urlsplit(u).path):
                              return
                          if req.resource_type not in ("xhr","fetch","document") and not SIGNAL.search(u):
                              return
                          key=(req.method,u,req.resource_type)
                          if key in seen: return
                          seen.add(key)
                          events.append({
                              "phase":"request","method":req.method,"resource_type":req.resource_type,
                              "url":u,"post_data":(req.post_data or "")[:2000]
                          })
                      except: pass

                  async def on_response(resp):
                      try:
                          u=resp.url
                          if not same_host(u) or STATIC.search(urlsplit(u).path):
                              return
                          req=resp.request
                          ct=(resp.headers.get("content-type") or "").lower()
                          if req.resource_type not in ("xhr","fetch","document") and "json" not in ct and not SIGNAL.search(u):
                              return
                          body=""
                          if resp.status==200:
                              try: body=await resp.text()
                              except: pass
                          events.append({
                              "phase":"response","method":req.method,"resource_type":req.resource_type,
                              "status":resp.status,"url":u,"content_type":ct,
                              "len":len(body),"sample":re.sub(r"\\s+"," ",body[:2500])
                          })
                      except: pass

                  ctx.on("request", on_request)
                  ctx.on("response", on_response)

                  pages={}
                  page=await ctx.new_page()
                  for u in SEEDS:
                      try:
                          await page.goto(u,wait_until="domcontentloaded",timeout=60000)
                          await page.wait_for_timeout(1800)
                          html=await page.content()
                          # Trigger likely dynamic pathways.
                          if "/shop/" in u:
                              await page.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                              await page.wait_for_timeout(1200)
                              try:
                                  inp=page.locator('input[placeholder*="Search products" i]').first
                                  if await inp.count():
                                      await inp.fill("RTX 5080")
                                      await inp.press("Enter")
                                      await page.wait_for_timeout(1800)
                              except: pass
                              try:
                                  candidates_btn=page.get_by_text("View More Gear", exact=True).first
                                  if await candidates_btn.count():
                                      await candidates_btn.click(timeout=3000)
                                      await page.wait_for_timeout(1600)
                              except: pass
                          attrs=re.findall(r'(?is)\\b(?:hx-get|hx-post|hx-trigger|hx-target|hx-include|hx-vals|data-url|data-endpoint|data-api|data-action|formaction|action)=["\\\']([^"\\\']+)["\\\']',html)
                          endpoints=sorted(set(
                              [urljoin(ROOT,x) for x in attrs if x]
                              + re.findall(r'(?i)(?:https?://computechstore\\.in[^"\\\'\\s<>]+|/[^"\\\'\\s<>]*(?:api|ajax|graphql|json|product|catalog|search|filter|load|partial)[^"\\\'\\s<>]*)',html)
                          ))
                          pages[u]={
                              "html_len":len(html),
                              "hx_data_attrs":sorted(set(attrs))[:200],
                              "endpoint_strings":endpoints[:300],
                              "scripts":re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)',html,re.I)[:120],
                          }
                          print("PAGE",u,"HTML_LEN",len(html))
                      except Exception as e:
                          pages[u]={"error":repr(e)[:800]}
                          print("NAVERR",u,repr(e))

                  # Create API request context with the browser's cookies.
                  reqctx=await p.request.new_context(
                      storage_state=await ctx.storage_state(),
                      extra_http_headers={
                          "Accept":"application/json, text/html;q=0.9, */*;q=0.8",
                          "X-Requested-With":"XMLHttpRequest",
                          "Accept-Language":"en-IN,en;q=0.9",
                      },
                  )

                  candidates=set()
                  for rec in pages.values():
                      for u in rec.get("endpoint_strings",[]):
                          if same_host(u):
                              candidates.add(u)

                  hardcoded=[
                      "/api/products","/api/products/","/api/v1/products","/api/v1/products/",
                      "/api/catalog","/api/catalog/","/api/catalog/products","/api/catalog/products/",
                      "/api/search","/api/search/","/api/items","/api/items/","/api/store/products","/api/store/products/",
                      "/api/inventory/products","/api/inventory/products/","/api/product-list/","/api/products/list/",
                      "/api/catalogue/","/api/catalogue/products/","/api/shop/products/","/api/store/",
                      "/products/","/search/","/shop/","/catalog/","/catalogue/","/graphql/","/api/graphql/",
                  ]
                  for pth in hardcoded: candidates.add(urljoin(ROOT,pth))
                  bases=["/api/products/","/api/catalog/","/api/search/","/api/items/","/products/","/search/","/shop/"]
                  qs=["?page=2","?page=2&limit=100","?page=2&per_page=100","?page=2&offset=100",
                      "?q=rtx","?search=rtx","?query=rtx","?s=rtx","?format=json","?ajax=1","?partial=1"]
                  for b in bases:
                      for q in qs: candidates.add(urljoin(ROOT,b+q))
                  candidates=sorted(candidates)[:140]

                  sem=asyncio.Semaphore(12)
                  direct=[]
                  async def probe(u):
                      async with sem:
                          for hx in (False,True):
                              try:
                                  headers={"HX-Request":"true"} if hx else {}
                                  r=await reqctx.get(u,headers=headers,timeout=8000)
                                  body=await r.text()
                                  ct=(r.headers.get("content-type") or "").lower()
                                  sig=body[:4000].lower()
                                  productish=sum(x in sig for x in (
                                      '"price"','"sku"','"products"','"product"','"items"','"results"',
                                      '"name"','"title"','inr','₹','add to cart','view product'
                                  ))
                                  jsonish=("json" in ct or sig.lstrip().startswith(("{","[")))
                                  if r.status==200 and (jsonish or productish>=3):
                                      direct.append({
                                          "url":u,"status":r.status,"content_type":ct,
                                          "hx_request":hx,"len":len(body),"productish":productish,
                                          "sample":re.sub(r"\\s+"," ",body[:3500])
                                      })
                              except: pass

                  await asyncio.gather(*(probe(u) for u in candidates))
                  await reqctx.dispose()
                  await ctx.close()
                  await browser.close()

                  print("\\n=== REQUEST/RESPONSE EVENTS ===")
                  for e in events: print(json.dumps(e,ensure_ascii=False))
                  print("\\n=== PAGE DOM SIGNALS ===")
                  print(json.dumps(pages,ensure_ascii=False,indent=2)[:100000])
                  print("\\n=== DIRECT HITS ===")
                  for e in sorted(direct,key=lambda x:(-x["productish"],-x["len"]))[:100]:
                      print(json.dumps(e,ensure_ascii=False))
                  print("\\n=== SUMMARY ===")
                  json_events=[e for e in events if e.get("phase")=="response" and ("json" in e.get("content_type","") or e.get("sample","").lstrip().startswith(("{","[")))]
                  print(json.dumps({
                      "event_count":len(events),
                      "json_like_responses":len(json_events),
                      "candidate_count":len(candidates),
                      "direct_hit_count":len(direct),
                      "unique_event_urls":sorted(set(e.get("url","") for e in events)),
                      "json_urls":sorted(set(e.get("url","") for e in json_events)),
                      "top_direct_hits":sorted(direct,key=lambda x:(-x["productish"],-x["len"]))[:30],
                  },ensure_ascii=False,indent=2))

          asyncio.run(main())
          PY
