name: Production registration bootstrap v2

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    name: Reindex production deployment workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reindex production deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/production-publish.yml
          current_name=$(sed -n 's/^name: //p' "$workflow" | head -n1)
          if [ "$current_name" != 'Foundation production release (reindexed)' ]; then
            python - "$workflow" <<'PY'
from pathlib import Path
import sys

path = Path(sys.argv[1])
text = path.read_text(encoding="utf-8")
old = "name: Foundation production release\n"
new = "name: Foundation production release (reindexed)\n"
if old not in text:
    raise SystemExit("expected production workflow name was not found")
path.write_text(text.replace(old, new, 1), encoding="utf-8")
PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            branch='automation/reindex-production-publish-v2'
            git checkout -B "$branch"
            git add "$workflow"
            git commit -m 'ci: reindex production workflow registration v2'
            git push --set-upstream origin "$branch"
            existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -z "$existing_pr" ]; then
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --head "$branch" \
                --base main \
                --title 'ci: reindex production workflow registration v2' \
                --body 'Change only the production workflow name so GitHub registers its workflow_dispatch trigger from fresh workflow metadata.'
            fi
            echo 'Created production workflow reindex PR.'
            exit 0
          fi

      - name: Dispatch reindexed production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-publish.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo 'Dispatched production-publish.yml via workflow_dispatch.'
