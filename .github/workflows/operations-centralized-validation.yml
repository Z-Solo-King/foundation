name: Centralized Operations validation

'on':
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Operations branch or immutable commit SHA to validate
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate private Operations source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Validate private repository boundary
        env:
          GH_TOKEN: ${{ steps.operations-app.outputs.token }}
        run: |
          set -euo pipefail
          repo_response="$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/Z-Solo-King/operations")"
          jq -e '.full_name == "Z-Solo-King/operations" and .private == true' <<<"$repo_response" >/dev/null

      - name: Checkout private Operations source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref || 'main' }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Verify checkout identity
        working-directory: operations
        env:
          REQUESTED_REF: ${{ inputs.operations_ref || 'main' }}
        run: |
          set -euo pipefail
          resolved="$(git rev-parse HEAD)"
          test -n "$resolved"
          echo "Operations validation revision: $resolved"
          if [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]; then
            test "$resolved" = "$REQUESTED_REF"
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Materialize pinned public Foundation core
        working-directory: operations
        run: python scripts/sync_public_core.py

      - name: Install Operations test dependencies
        working-directory: operations
        run: |
          python -m pip install --disable-pip-version-check -e ".[test,media]"
          python -m pip install --disable-pip-version-check workers-py workers-runtime-sdk coverage

      - name: Run Operations test suite
        working-directory: operations
        run: |
          set -o pipefail
          python -m pytest tests -q -rA 2>&1 | tee "$RUNNER_TEMP/operations-pytest.log"

      - name: Upload Operations pytest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operations-pytest-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/operations-pytest.log
          if-no-files-found: error
          retention-days: 14

      - name: Assert private repository has no GitHub Actions workflows
        env:
          GH_TOKEN: ${{ steps.operations-app.outputs.token }}
          OPERATIONS_REF: ${{ inputs.operations_ref || 'main' }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$RUNNER_TEMP/operations-workflows.json" -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/Z-Solo-King/operations/contents/.github/workflows?ref=${OPERATIONS_REF}" || true)"
          if [[ "$status" == "404" ]]; then
            echo "private Operations GitHub Actions boundary: PASS"
          elif [[ "$status" == "200" ]] && jq -e 'length == 0' "$RUNNER_TEMP/operations-workflows.json" >/dev/null 2>&1; then
            echo "private Operations GitHub Actions boundary: PASS"
          else
            echo "private Operations GitHub Actions boundary: FAIL"
            jq -c 'map({name,path,type})' "$RUNNER_TEMP/operations-workflows.json" 2>/dev/null || cat "$RUNNER_TEMP/operations-workflows.json"
            exit 1
          fi
