name: WooCommerce 21 Plugin Extraction — V175 3-Shard Final

on:
  push:
    branches: [hunt/native-google-feed-urls-20260927]
    paths:
      - "tools/feed-lab/woocommerce_21_plugin_extraction_browser_v175.py"
      - ".github/workflows/native-google-feed-21-plugin-extraction-3shard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wc21-v175-final-extraction
  cancel-in-progress: true

jobs:
  shard:
    name: "V175 plugin extraction — shard ${{ matrix.id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: "a"
            targets: |
              AULA India|https://aulaindia.com
              Aarna Computers|https://aarnacomputers.com
              Ads Store|https://adsstore.in
              Cosmic Byte|https://www.thecosmicbyte.com
              EZPZ Solutions|https://www.ezpzsolutions.in
              KC Computers|https://kccomputers.co.in
              KRG KART|https://krgkart.com
          - id: "b"
            targets: |
              Kryptronix Gaming|https://kryptronix.in
              Meckeys|https://www.meckeys.com
              Moskeys|https://moskeys.com
              NCL Computer|https://nclcomputer.com
              PC Kumar Infotech|https://pckumar.in
              PCHubShop|https://www.pchubshop.com
              Prime ABGB|https://www.primeabgb.com
          - id: "c"
            targets: |
              SCL Gaming|https://sclgaming.in
              StacksKB|https://stackskb.com
              Theproaudio|https://www.theproaudio.com
              Variety Infotech|https://varietyinfotech.com
              Viper PC|https://viperpc.in
              hotshiftpc|https://hotshiftpc.com
              ithunt|https://ithunt.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install chromium
      - name: Extract seven sites with V175-derived channels
        env:
          TARGETS: ${{ matrix.targets }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/shard-${{ matrix.id }}"
          while IFS='|' read -r site root; do
            [[ -z "${site}" ]] && continue
            slug="$(printf '%s' "${site}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//')"
            out="out/shard-${{ matrix.id }}/${slug}"
            mkdir -p "${out}"
            echo "=== ${site} ==="
            SITE_NAME="${site}" SITE_ROOT="${root}" OUT_DIR="${out}" \
              python tools/feed-lab/woocommerce_21_plugin_extraction_browser_v175.py || true
            test -f "${out}/recovery.json"
          done <<< "${TARGETS}"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wc21-final-shard-${{ matrix.id }}
          path: out/shard-${{ matrix.id }}/
          retention-days: 14

  aggregate:
    name: Aggregate final 21-site V175 evidence
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wc21-final-shard-*
          path: out/shards
          merge-multiple: false
      - name: Validate and aggregate 21 sites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("out/shards")
          rows=[]
          for p in sorted(root.glob("wc21-final-shard-*/**/recovery.json")):
              rows.append(json.loads(p.read_text()))
          rows=sorted({r.get("site",""):r for r in rows}.values(),key=lambda r:r.get("site","").lower())
          assert len(rows)==21, f"expected 21 site reports, got {len(rows)}"
          payload={
            "schema_version":"woocommerce-21-plugin-extraction-final-aggregate/v1",
            "extractor":"V175-derived-browser-plugin-extractor",
            "channels":[
              "Playwright browser",
              "homepage XHR/fetch response URL metadata",
              "WP-JSON /wp-json/",
              "WordPress REST /wp/v2",
              "generic REST root",
              "WooCommerce REST v1 capability probe",
              "WooCommerce REST v2 capability probe",
              "WooCommerce REST v3 capability probe",
              "product route GET v1/v2/v3 with per_page=1&_fields=id (metadata only; body not persisted)",
              "product route OPTIONS v1/v2/v3"
            ],
            "policy":"Public read-only plugin evidence. Product route probes record capability metadata only; no product records are retained. No feed URL mining, CAPTCHA solving, Cloudflare challenge bypass, clearance-cookie replay, authentication bypass, or stealth/evasion.",
            "site_count":21,
            "results":rows
          }
          pathlib.Path("out/final-recovery-aggregate.json").write_text(json.dumps(payload,indent=2)+"\\n")
          lines=["# Final 21-site V175 plugin extraction","","| Site | Status | Plugins | Feed-like assets | Feed families | WC v1 | WC v2 | WC v3 |","|---|---|---:|---|---|---:|---:|---:|"]
          for r in rows:
              wc={x["version"]:x["status"] for x in r.get("product_api_options",[])}
              lines.append(f'| {r["site"]} | {r["status"]} | {len(r["plugin_assets"])} | {", ".join(r.get("feed_like_plugin_assets",[])) or "none"} | {", ".join(x.get("family","") for x in r.get("feed_family_signals",[])) or "none"} | {wc.get("v1","-")} | {wc.get("v2","-")} | {wc.get("v3","-")} |')
          pathlib.Path("out/final-recovery-aggregate.md").write_text("\n".join(lines)+"\n")
          PY
      - name: Upload final aggregate
        uses: actions/upload-artifact@v4
        with:
          name: wc21-final-plugin-extraction
          path: out/
          retention-days: 14
