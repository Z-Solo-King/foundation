name: production-chatbot-deploy-smoke

on:
  workflow_run:
    workflows: [deploy-public-worker]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  public-chatbot-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Select deployment revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            sha='${{ github.event.workflow_run.head_sha }}'
          else
            sha='${GITHUB_SHA}'
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Verify active Cloudflare deployment provenance
        if: github.event_name == 'workflow_run'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VARIABLE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          account_id="${SECRET_ACCOUNT_ID:-${VARIABLE_ACCOUNT_ID:-}}"
          test -n "$account_id" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          expected="github:${EXPECTED_SHA}"

          for attempt in {1..12}; do
            deployments=$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${account_id}/workers/scripts/research-intelligence-engine-public/deployments")
            latest_message=$(jq -r '.result.deployments[0].annotations["workers/message"] // ""' <<<"$deployments")
            latest_version=$(jq -r '.result.deployments[0].versions[0].version_id // ""' <<<"$deployments")
            echo "latest_version=${latest_version} latest_message=${latest_message} attempt=${attempt}"
            if [[ "$latest_message" == "$expected" && "$latest_version" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Active Cloudflare deployment did not advertise expected GitHub revision: $expected"
          exit 1

      - name: Verify public Worker health
        run: |
          set -euo pipefail
          curl -fsS https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/health | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json

      - name: Verify public Worker readiness and D1
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/readiness.json -w '%{http_code}' \
            https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/readiness)
          cat /tmp/readiness.json
          test "$status" = "200"
          jq -e '.ready == true and .database == true' /tmp/readiness.json

      - name: Execute authenticated Cloudflare and B2 verification when configured
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUTH_TOKEN:-}" ]]; then
            echo 'AUTH_TOKEN is not configured in this public-repo workflow context; authenticated B2 verification is not claimed.'
            exit 0
          fi
          status=$(curl -sS -o /tmp/chatbot.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"operation":"infrastructure_verify_public_test"}' \
            https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/api/v1/chatbot/diagnostic)
          cat /tmp/chatbot.json
          test "$status" = "200"
          jq -e '
            .ok == true and
            .status == "ok" and
            (.checks | map(select(.ok != true)) | length == 0) and
            ([.checks[].name] | index("public_chatbot")) and
            ([.checks[].name] | index("cloudflare_d1")) and
            ([.checks[].name] | index("backblaze_b2_lifecycle"))
          ' /tmp/chatbot.json
