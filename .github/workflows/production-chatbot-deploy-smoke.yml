name: production-chatbot-deploy-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.11
      - name: Run chatbot bridge tests
        run: uv run --with pytest --with pytest-asyncio pytest tests/test_chatbot_live_bridge.py tests/test_worker_diagnostics.py -q
      - name: Verify deployed public Worker health
        run: |
          set -euo pipefail
          curl -fsS https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/health | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json
      - name: Verify deployed Cloudflare readiness and private binding
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/readiness.json -w '%{http_code}' https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/readiness)
          cat /tmp/readiness.json
          test "$status" = "200"
          jq -e '.ready == true and .control_plane == true' /tmp/readiness.json
      - name: Exercise deployed D1 plus Backblaze B2 persistence path
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/research.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"question":"Live D1/B2 integration verification","depth":"quick","require_citations":false,"max_sources":1,"max_evidence_items":4,"strict_zero_cost_only":true,"source_urls":["https://example.com/"]}' \
            https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/api/v1/research)
          cat /tmp/research.json
          test "$status" = "200"
          jq -e '.ok == true and (.run_id | length > 0) and (.sources | length == 1) and (.sources[0].status >= 200 and .sources[0].status < 400)' /tmp/research.json
          run_id=$(jq -r '.run_id' /tmp/research.json)
          status=$(curl -sS -o /tmp/run.json -w '%{http_code}' \
            "https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/api/v1/research/${run_id}")
          cat /tmp/run.json
          test "$status" = "200"
          jq -e '.ok == true and (.observations | length == 1) and .observations[0].integrity_state == "verified"' /tmp/run.json
