name: production-chatbot-deploy-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.11
      - name: Run chatbot bridge tests
        run: uv run --with pytest --with pytest-asyncio pytest tests/test_chatbot_live_bridge.py tests/test_worker_diagnostics.py -q
      - name: Probe Cloudflare account discovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          found=""
          for endpoint in \
            "https://api.cloudflare.com/client/v4/memberships" \
            "https://api.cloudflare.com/client/v4/zones?per_page=1" \
            "https://api.cloudflare.com/client/v4/user"; do
            body=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$endpoint")
            candidate=$(jq -r '
              .result[0].account.id //
              .result[0].account_id //
              .result.account.id //
              empty
            ' <<<"${body}" | head -n 1)
            if [ -n "${candidate}" ] && [ "${candidate}" != "null" ]; then
              found="${candidate}"
              echo "Cloudflare account discovery succeeded via ${endpoint}"
              break
            fi
          done
          test -n "${found}"
