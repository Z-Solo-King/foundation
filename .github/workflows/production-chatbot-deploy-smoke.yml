name: production-chatbot-deploy-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-smoke-main
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  public-chatbot-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            runs=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-public-worker.yml/runs?head_sha=${GITHUB_SHA}&per_page=20")
            status=$(jq -r '.workflow_runs[0].status // "missing"' <<<"$runs")
            conclusion=$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$runs")
            echo "deploy-public-worker status=${status} conclusion=${conclusion} attempt=${attempt}"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo 'Cloudflare deployment did not succeed; refusing verification'; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for Cloudflare deployment for this commit'
          exit 1

      - name: Verify public Worker health
        run: |
          set -euo pipefail
          curl -fsS https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/health | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json

      - name: Execute authenticated Cloudflare and B2 verification when configured
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUTH_TOKEN:-}" ]]; then
            echo 'AUTH_TOKEN GitHub secret is not configured; authenticated D1/B2 proof is intentionally skipped.'
            echo 'Production deployment and public Worker health were still verified.'
            {
              echo '### Authenticated infrastructure proof'
              echo ''
              echo 'Skipped: the GitHub Actions AUTH_TOKEN secret is not configured.'
              echo ''
              echo 'This is not treated as a production-runtime failure. Run the protected authenticated proof path after configuring the repository secret.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          status=$(curl -sS -o /tmp/chatbot.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"operation":"infrastructure_verify_public_test"}' \
            https://research-intelligence-engine-public.soloking-research-intelligence.workers.dev/api/v1/chatbot/diagnostic)
          cat /tmp/chatbot.json
          test "$status" = "200"
          jq -e '
            .ok == true and
            .status == "ok" and
            (.checks | map(select(.ok != true)) | length == 0) and
            ([.checks[].name] | index("public_chatbot")) and
            ([.checks[].name] | index("cloudflare_d1")) and
            ([.checks[].name] | index("backblaze_b2_lifecycle"))
          ' /tmp/chatbot.json
