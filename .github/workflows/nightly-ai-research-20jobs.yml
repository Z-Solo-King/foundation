name: nightly-ai-research-20jobs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm task workflow is paused
        run: |
          echo "The public 20-job research task workflow is paused; task corpus is not exposed or auto-executed."
          echo "No task, benchmark, provider cross-fire, research, dispatch, mutation, or self-improvement work is executed by this workflow."
