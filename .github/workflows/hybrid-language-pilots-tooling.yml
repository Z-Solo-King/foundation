name: Hybrid language pilots — Tooling

'on':
  workflow_call:
    inputs:
      operations_ref:
        description: Immutable Operations revision resolved by the canonical parent workflow
        required: true
        type: string
    secrets:
      OPERATIONS_APP_ID:
        required: true
      OPERATIONS_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  go:
        name: Go HTTP fanout pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
  
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
  
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25"
  
      - name: Test
        working-directory: operations/experiments/go_http_fanout
        run: |
          go test ./...
          go test -race ./...
  
  edge_worker:
    name: TypeScript public edge contract shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: polyglot/edge-worker/package.json
  
      - name: Install and test
        working-directory: polyglot/edge-worker
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
  
  
  browser_acquisition:
        name: TypeScript browser acquisition shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
  
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
  
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
  
      - name: Install and test
        working-directory: operations/polyglot/browser-acquisition
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
  
  
  frontend_state:
    name: TypeScript frontend lifecycle parity shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
  
      - name: Install and test
        working-directory: polyglot/frontend-state
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
  
  go_bench:
        name: Go fanout 32x3 benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25"
      - name: Benchmark
        working-directory: operations/experiments/go_http_fanout
        run: go test -run '^$' -bench . -count=3
  
  go_vet:
        name: Go fanout static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25"
      - name: Vet
        working-directory: operations/experiments/go_http_fanout
        run: go vet ./...
  
  python_language_policy:
        name: Migration language policy regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Determine pinned Foundation public-core revision
        id: foundation-core-pin
        working-directory: operations
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path
          tree = ast.parse(Path("scripts/sync_public_core.py").read_text(encoding="utf-8"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "FOUNDATION_COMMIT":
                          output.write_text(f"ref={node.value.value}\n", encoding="utf-8")
                          raise SystemExit
          raise SystemExit("FOUNDATION_COMMIT not found")
  
      - name: Checkout exact pinned Foundation public core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/foundation
          token: ${{ github.token }}
          path: foundation-core
          fetch-depth: 1
  
      - name: Ensure exact Foundation Git object is present
        working-directory: foundation-core
        shell: bash
        env:
          FOUNDATION_COMMIT: ${{ steps.foundation-core-pin.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$FOUNDATION_COMMIT"
          git cat-file -e "$FOUNDATION_COMMIT^{commit}"
          git cat-file -e "$FOUNDATION_COMMIT:foundation_core/__init__.py"
          git checkout --detach "$FOUNDATION_COMMIT"
  
      - name: Materialize pinned public foundation_core
        working-directory: operations
        env:
          FOUNDATION_CORE_GIT: ${{ github.workspace }}/foundation-core
        run: |
          set -euo pipefail
          python scripts/sync_public_core.py
          test -f foundation_core/__init__.py
  
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install migration policy test runtime
        working-directory: operations
        run: |
          python -m pip install --disable-pip-version-check -e ".[test]"
          python -m pip install --disable-pip-version-check "workers-py>=1.9" workers-runtime-sdk
  
      - name: Run migration policy tests
        working-directory: operations
        run: |
          python -m pytest -q tests/test_runtime_language_policy.py tests/test_runtime_language_catalog.py
  
  adaptive_matrix_contract:
    name: Validate 40-case adaptive migration matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate 40 orthogonal cases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
  
          path = Path("benchmark/polyglot/migration_matrix_40.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          cases = data["cases"]
          assert data["case_count"] == 40
          assert len(cases) == 40
          assert len({case["id"] for case in cases}) == 40
          assert all(case["repeats"] == 3 for case in cases)
          assert {case["topic"] for case in cases} == set(data["topics"])
          assert {case["approach"] for case in cases} == set(data["approaches"])
          assert {case["agent_count"] for case in cases} == set(data["agent_counts"])
          assert {case["execution_mode"] for case in cases} == set(data["execution_modes"])
          assert all(case["candidate_pair"] in {"python-rust", "python-typescript", "python-go"} for case in cases)
          assert all(case["evidence"] in {"contract", "error-taxonomy", "cancellation", "resource-bounds", "provenance"} for case in cases)
          print("40-case adaptive migration matrix: PASS")
          PY
  
  workflow_yaml_syntax:
    name: All Foundation workflow YAML syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse every workflow
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |path| data = YAML.load_file(path); abort "invalid workflow: #{path}" unless data.is_a?(Hash) && data.key?("jobs"); puts "YAML PASS #{path}" }'
  
