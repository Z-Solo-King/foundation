name: Migration Factory CrossFire

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Immutable Operations revision to audit; blank resolves current Operations main
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: migration-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      operations_ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Mint read-only Operations App token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - id: resolve
        env:
          REQUESTED: ${{ inputs.operations_ref }}
          GH_TOKEN: ${{ steps.operations-app.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED}" ]; then
            ref="${REQUESTED}"
          else
            ref="$(gh api repos/Z-Solo-King/operations/commits/main --jq .sha)"
          fi
          [[ "${ref}" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

  crossfire:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        lane:
          - runtime-frontier
          - dependency-frontier
          - tooling-ci
          - tests-benchmarks
          - target-language
          - retirement-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Mint read-only Operations App token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve.outputs.operations_ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Run Foundation lens
        run: |
          mkdir -p .runtime
          node tools/migration_factory.mjs --root . --lane "${{ matrix.lane }}" --out ".runtime/foundation-${{ matrix.lane }}.json"
      - name: Run Operations lens
        run: |
          mkdir -p operations/.runtime
          node tools/migration_factory.mjs --root operations --lane "${{ matrix.lane }}" --out ".runtime/operations-${{ matrix.lane }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-factory-${{ matrix.lane }}
          path: |
            .runtime/
            operations/.runtime/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: crossfire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: migration-factory-*
          path: .runtime/crossfire
          merge-multiple: false
      - name: Aggregate
        run: |
          set -euo pipefail
          files=$(find .runtime/crossfire -name '*.json' -type f | wc -l)
          test "$files" -eq 12
          echo "CrossFire complete: $files independent reports (expected 12)"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root=".runtime/crossfire";
          const reports=[];
          for (const dir of fs.readdirSync(root,{withFileTypes:true})) {
            if (!dir.isDirectory()) continue;
            for (const f of fs.readdirSync(root+"/"+dir.name).filter(x=>x.endsWith(".json"))) {
              try { reports.push(JSON.parse(fs.readFileSync(root+"/"+dir.name+"/"+f,"utf8"))); } catch {}
            }
          }
          if (reports.length !== 12) throw new Error("expected 12 reports");
          const repositories = new Set(reports.map(r => r.repository));
          if (repositories.size !== 2) throw new Error("expected both repositories in aggregation");
          const lanes = new Set(reports.map(r => r.lane));
          if (lanes.size !== 6) throw new Error("expected six independent lanes");
          const summary={schema:"migration-factory-crossfire-summary/v1",reports:reports.length,lanes:[...lanes].sort(),repositories:[...repositories].sort(),by_repo:{}};
          for (const r of reports) {
            summary.by_repo[r.repository] ??=[];
            summary.by_repo[r.repository].push({lane:r.lane,python:r.total_python_files,counts:r.counts,blockers:r.blockers});
          }
          fs.mkdirSync(".runtime",{recursive:true});
          fs.writeFileSync(".runtime/migration-factory-summary.json",JSON.stringify(summary,null,2)+"\n");
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-factory-summary
          path: .runtime/migration-factory-summary.json
          if-no-files-found: error
          retention-days: 30