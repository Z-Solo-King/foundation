name: Nightly research dispatch bridge

'on':
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pass the dry_run input to the canonical nightly research workflow"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch canonical nightly research
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: nightly-multi-agent-research.yml
          TARGET_REF: main
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            -f "ref=${TARGET_REF}" \
            -f "inputs[dry_run]=${DRY_RUN}"
          echo "dispatch submitted for ${TARGET_WORKFLOW} on ${TARGET_REF}"
          echo "dispatch_started_at=${before}" >> "$GITHUB_ENV"

      - name: Confirm workflow run admission
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: nightly-multi-agent-research.yml
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            run_url="$(gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq '.workflow_runs | map(select(.created_at >= env.dispatch_started_at)) | sort_by(.created_at) | last | .html_url // empty')"
            if [[ -n "$run_url" ]]; then
              echo "canonical nightly workflow run admitted: $run_url"
              exit 0
            fi
            sleep 5
          done
          echo 'canonical nightly workflow dispatch was submitted but no admitted run was observed' >&2
          exit 1
