name: WooCommerce iCopyDoc V9 StacksKB Recovery
on:
  pull_request:
    branches: [main]
    paths: ["tools/woocommerce_icopydoc_v9_stackskb.mjs",".github/workflows/woocommerce-icopydoc-v9-stackskb.yml"]
  push:
    branches: [feat/wc-unknown-family-v7-source-94a5-20261001]
    paths: ["tools/woocommerce_icopydoc_v9_stackskb.mjs",".github/workflows/woocommerce-icopydoc-v9-stackskb.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node tools/woocommerce_icopydoc_v9_stackskb.mjs
