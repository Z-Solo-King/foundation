name: Apply Cloudflare chatbot provider/runtime source fix

on:
  push:
    branches:
      - fix/cloudflare-chatbot-provider-runtime-20260922

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python scripts/patch_chatbot_provider_runtime.py

      - name: Validate source and deployment scripts
        run: |
          python -m py_compile worker.py
          python -m pytest -q tests/test_chatbot_cloudflare_source_contract.py tests/test_frontend_ux_completeness.py tests/test_workflow_policy.py
          node --check frontend/app.js
          node --check frontend/ux_enhancements.js
          bash -n scripts/production_release.sh
          bash -n scripts/deploy_operations_chatbot_config.sh

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/production_release.sh scripts/deploy_operations_chatbot_config.sh frontend/app.js frontend/ux_enhancements.js tests/test_frontend_ux_completeness.py tests/test_workflow_policy.py tests/test_chatbot_cloudflare_source_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: wire Cloudflare AI provider and canonical chat cancellation"
          git push origin HEAD:fix/cloudflare-chatbot-provider-runtime-20260922
