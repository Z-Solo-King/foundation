name: GitHub Actions static security analysis

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - "tests/test_workflow_static_analysis_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - "tests/test_workflow_static_analysis_policy.py"
  schedule:
    - cron: "41 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor workflow analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          inputs: "--min-severity=high .github/workflows"
          version: "1.30.1"

  scorecard:
    name: OpenSSF Scorecard analysis
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

  policy-regression:
    name: workflow security regression fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: python -m pip install "zizmor==1.30.1"
      - name: Assert unsafe fixture is detected
        run: |
          set -euo pipefail
          if zizmor --min-severity=high --format=json-v1 tests/fixtures/unsafe-pull-request-target.yml > "$RUNNER_TEMP/zizmor.json"; then
            echo "expected fixture to produce a high-severity finding"
            cat "$RUNNER_TEMP/zizmor.json"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads(Path(os.environ["RUNNER_TEMP"]) / "zizmor.json".read_text())
          assert payload, "fixture produced no findings"
          PY
