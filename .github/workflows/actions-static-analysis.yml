name: GitHub Actions static security analysis

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - "tests/test_workflow_static_analysis_policy.py"
      - "docs/GITHUB_ACTIONS_ZERO_COST_POLICY.json"
      - "docs/HYBRID_ALTERNATIVE_ZERO_COST_POLICY.json"
      - "docs/HYBRID_ALTERNATIVE_ECOSYSTEM_AUDIT_2026-10-01.json"
      - "scripts/validate_hybrid_alternative_policy.py"
      - "tests/test_hybrid_alternative_policy.py"
      - "scripts/validate_github_actions_zero_cost.py"
      - "tests/test_github_actions_zero_cost_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - "tests/test_workflow_static_analysis_policy.py"
      - "docs/GITHUB_ACTIONS_ZERO_COST_POLICY.json"
      - "scripts/validate_github_actions_zero_cost.py"
      - "tests/test_github_actions_zero_cost_policy.py"
  schedule:
    - cron: "41 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor workflow analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          advanced-security: false
          inputs: ".github/workflows"
          min-severity: high
          version: "1.30.1"

  scorecard:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

  zero-cost:
    name: GitHub Actions zero-cost policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Verify public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }} --jq '.private')" = "false"
      - name: Validate $0 policy
        run: python scripts/validate_github_actions_zero_cost.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --timeout 120 --retries 5 "pytest"
      - name: Run $0 policy tests
        run: python -m pytest -q tests/test_github_actions_zero_cost_policy.py

  policy-regression:
    name: workflow security regression fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install zizmor with bounded retries
        run: python -m pip install --disable-pip-version-check --timeout 120 --retries 5 "zizmor==1.30.1"
      - name: Assert unsafe fixture is detected
        run: |
          set -euo pipefail
          if zizmor --min-severity=high --format=json-v1 tests/fixtures/unsafe-pull-request-target.yml > "$RUNNER_TEMP/zizmor.json"; then
            echo "expected fixture to produce a high-severity finding"
            cat "$RUNNER_TEMP/zizmor.json"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads((Path(os.environ["RUNNER_TEMP"]) / "zizmor.json").read_text())
          assert payload, "fixture produced no findings"
          PY
