name: Computech live XHR only

on:
  push:
    branches:
      - diag/computech-xhr-only-2026-09-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture browser network
        run: |
          python - <<'PY'
          import asyncio, json, re
          from urllib.parse import urlsplit
          from playwright.async_api import async_playwright

          ROOT="https://computechstore.in"
          TARGETS=[
            ROOT+"/",
            ROOT+"/shop/",
            ROOT+"/product-category/graphics-card/",
            ROOT+"/?dgwt_wcas=1&post_type=product&s=RTX%205080",
            ROOT+"/search/?q=RTX%205080",
          ]
          STATIC=re.compile(r"\\.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|webp|avif|map)(?:[?#].*)?$",re.I)
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=["--no-sandbox"])
              ctx=await browser.new_context(
                user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                locale="en-IN",timezone_id="Asia/Kolkata",
                viewport={"width":1440,"height":900}
              )
              seen=set(); events=[]
              async def on_request(req):
                try:
                  u=req.url
                  if urlsplit(u).hostname not in ("computechstore.in","www.computechstore.in"): return
                  if STATIC.search(urlsplit(u).path): return
                  if req.resource_type not in ("xhr","fetch"): return
                  key=(req.method,u,req.post_data or "")
                  if key in seen:return
                  seen.add(key)
                  events.append({
                    "kind":"request","method":req.method,"url":u,
                    "resource_type":req.resource_type,
                    "post_data":(req.post_data or "")[:4000]
                  })
                except: pass
              async def on_response(resp):
                try:
                  req=resp.request; u=resp.url
                  if urlsplit(u).hostname not in ("computechstore.in","www.computechstore.in"): return
                  if STATIC.search(urlsplit(u).path): return
                  if req.resource_type not in ("xhr","fetch"): return
                  ct=(resp.headers.get("content-type") or "").lower()
                  body=""
                  if resp.status==200:
                    try: body=await resp.text()
                    except: pass
                  events.append({
                    "kind":"response","method":req.method,"status":resp.status,"url":u,
                    "resource_type":req.resource_type,"content_type":ct,"len":len(body),
                    "sample":re.sub(r"\\s+"," ",body[:5000])
                  })
                except: pass
              ctx.on("request",on_request); ctx.on("response",on_response)
              page=await ctx.new_page()
              for t in TARGETS:
                print("NAV",t)
                try:
                  await page.goto(t,wait_until="domcontentloaded",timeout=60000)
                  await page.wait_for_timeout(2500)
                  # Interact with the live catalog/search UI to force lazy requests.
                  if "/shop/" in t:
                    await page.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                    await page.wait_for_timeout(1500)
                    for sel in [
                      'input[placeholder*="Search products" i]',
                      'input[type="search"]'
                    ]:
                      try:
                        inp=page.locator(sel).first
                        if await inp.count():
                          await inp.fill("RTX 5080")
                          await inp.press("Enter")
                          await page.wait_for_timeout(2200)
                          break
                      except: pass
                    try:
                      btn=page.get_by_text("View More Gear",exact=True).first
                      if await btn.count():
                        await btn.click(timeout=2500)
                        await page.wait_for_timeout(1800)
                    except: pass
                  await page.wait_for_timeout(1000)
                except Exception as e:
                  print("NAVERR",repr(e))
              await page.close(); await ctx.close(); await browser.close()
              print("\n=== XHR/FETCH EVENTS ===")
              for e in events: print(json.dumps(e,ensure_ascii=False))
              print("\n=== UNIQUE XHR/FETCH URLS ===")
              for u in sorted(set(e["url"] for e in events)): print(u)
              print("\n=== JSON RESPONSES ===")
              for e in events:
                if e.get("kind")=="response" and ("json" in e.get("content_type","") or e.get("sample","").lstrip().startswith(("{","["))):
                  print(json.dumps(e,ensure_ascii=False))
              print("\nCOUNT",len(events))
          asyncio.run(main())
          PY
