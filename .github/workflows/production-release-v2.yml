name: Foundation production release v2

on:
  workflow_run:
    workflows: ["frontend-ui"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Production release gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify release trigger
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            test "${{ github.event.workflow_run.head_branch }}" = "main"
            test "${{ github.event.workflow_run.conclusion }}" = "success"
            test "${{ github.event.workflow_run.head_sha }}" = "$(git rev-parse HEAD)"
          fi
          echo "PRODUCTION_RELEASE_TRIGGER=PASS"
