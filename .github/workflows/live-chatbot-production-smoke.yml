name: Live chatbot production smoke

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact Foundation SHA released and being smoke-tested"
        required: false
        default: ""
        type: string
      production_release_run_id:
        description: "Exact successful production-release run supplying the target SHA"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: live-chatbot-production-smoke
  cancel-in-progress: true

env:
  PUBLIC_WORKER_URL: https://heroic-ai.pages.dev
  OPERATIONS_REF: 5a5ae97ff83c60d755cc964bd1ac639565e2f298
  TARGET_FOUNDATION_SHA: ${{ inputs.target_sha || github.sha }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for deployed revision
        env:
          EXPECTED_FOUNDATION: ${{ env.TARGET_FOUNDATION_SHA }}
        run: |
          set -euo pipefail
          for _ in {1..24}; do
            status=$(curl -sS --max-time 20 -o /tmp/readiness.json -w '%{http_code}' "$PUBLIC_WORKER_URL/readiness" || true)
            if [ "$status" = "200" ] && jq -e --arg f "$EXPECTED_FOUNDATION" --arg o "$OPERATIONS_REF" '.ready == true and .database == true and .release.foundation_sha == $f and .release.operations_ref == $o' /tmp/readiness.json >/dev/null 2>&1; then
              jq '{ready,database,release}' /tmp/readiness.json
              exit 0
            fi
            sleep 5
          done
          cat /tmp/readiness.json 2>/dev/null || true
          exit 1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check httpx
      - name: Run live production chatbot smoke
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p live-chatbot
          cat > /tmp/live_chatbot_smoke.py <<'PY'
          import json, os, uuid
          import httpx

          base = os.environ["PUBLIC_WORKER_URL"].rstrip("/")
          token = os.environ.get("AUTH_TOKEN", "")
          if not token:
              print(json.dumps({"ok": False, "error": "AUTH_TOKEN missing"}))
              raise SystemExit(1)

          headers = {"Authorization": f"Bearer {token}"}
          result = {"ok": True, "checks": {}}

          def record(name, status, body=None, *, critical=True):
              item = {"status": status, "critical": critical}
              if isinstance(body, dict):
                  item["ok"] = body.get("ok")
                  item["ready"] = body.get("ready")
                  response = body.get("response") if isinstance(body.get("response"), dict) else {}
                  item["result_state"] = response.get("result_state")