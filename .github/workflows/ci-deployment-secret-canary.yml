name: ci-deployment-secret-canary

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTH: ${{ secrets.AUTH_TOKEN }}
      B2_ID: ${{ secrets.B2_KEY_ID }}
      B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Report deployment secret presence
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "CLOUDFLARE_API_TOKEN:${CF_TOKEN}" \
            "AUTH_TOKEN:${AUTH}" \
            "B2_KEY_ID:${B2_ID}" \
            "B2_APPLICATION_KEY:${B2_KEY}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -n "$value" ]; then
              echo "$name=present"
            else
              echo "$name=missing"
            fi
          done
