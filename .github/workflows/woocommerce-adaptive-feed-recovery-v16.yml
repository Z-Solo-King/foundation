name: WooCommerce Adaptive Feed Recovery V16
on:
  pull_request:
    branches: [main]
    paths:
      - tools/woocommerce_adaptive_feed_recovery_v16.mjs
      - tests/test_woocommerce_adaptive_feed_recovery_v16.mjs
      - .github/workflows/woocommerce-adaptive-feed-recovery-v16.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JINA_PACE_MS: "3200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node --check tools/woocommerce_adaptive_feed_recovery_v16.mjs
      - run: node --test tests/test_woocommerce_adaptive_feed_recovery_v16.mjs
      - run: node tools/woocommerce_adaptive_feed_recovery_v16.mjs
      - run: |
          set -euo pipefail
          report=out/woocommerce-adaptive-feed-v16/woocommerce_adaptive_feed_recovery_v16.json
          test -f "$report"
          jq -e '.schema_version == "woocommerce-adaptive-feed-recovery-v16/v2" and .target_count == 30' "$report" >/dev/null
          jq -r '.results[] | select(.winner != null) | [.site,.status,(.winner.final_url // .winner.url)] | @tsv' "$report" || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-woocommerce-adaptive-feed-v16
          path: out/woocommerce-adaptive-feed-v16/
          if-no-files-found: error
          retention-days: 30
