name: WooCommerce Google Feed Audit

on:
  push:
    branches:
      - "ai/woocommerce-google-feed-audit-20260926"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-a:
    name: Feed audit A (8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_START: "0"
      TARGET_COUNT: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run public feed audit
        run: node .github/workflows/woocommerce_google_feed_audit.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-google-feed-audit-a
          path: out/
          if-no-files-found: warn
          retention-days: 14

  audit-b:
    name: Feed audit B (8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_START: "8"
      TARGET_COUNT: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
