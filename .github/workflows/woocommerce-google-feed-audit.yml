      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-google-feed-audit-c
          path: out/
          if-no-files-found: warn
          retention-days: 14

  audit-d:
    name: Feed audit D (8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_START: "24"
