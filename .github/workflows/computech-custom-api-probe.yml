name: Computech custom API probe

on:
  push:
    branches:
      - diag/computech-custom-api-2026-09-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright httpx
          python -m playwright install --with-deps chromium

      - name: Probe live Computech custom storefront
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import asyncio, json, re, sys
          from urllib.parse import urljoin, urlsplit

          from playwright.async_api import async_playwright

          ROOT = "https://computechstore.in"
          seed_urls = [
              ROOT + "/",
              ROOT + "/shop/",
              ROOT + "/products/",
              ROOT + "/search/?q=rtx",
              ROOT + "/?s=rtx",
          ]

          api_words = (
              "api", "ajax", "json", "product", "catalog", "search", "item",
              "inventory", "store", "graphql", "htmx", "load", "filter",
          )
          static_ext = re.compile(r"\\.(?:css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|webp|avif)(?:[?#].*)?$", re.I)

          def interesting_url(u):
              x = urlsplit(u)
              path = (x.path or "").lower()
              q = (x.query or "").lower()
              if x.netloc and x.netloc != "computechstore.in" and not x.netloc.endswith(".computechstore.in"):
                  return False
              if static_ext.search(path):
                  return False
              return any(w in (path + "?" + q) for w in api_words)

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                      locale="en-IN",
                      timezone_id="Asia/Kolkata",
                      extra_http_headers={
                          "Accept-Language": "en-IN,en;q=0.9",
                      },
                  )

                  events = []
                  seen = set()

                  async def response_handler(resp):
                      try:
                          req = resp.request
                          u = resp.url
                          ct = (resp.headers.get("content-type") or "").lower()
                          if not interesting_url(u) and not ("json" in ct or "xml" in ct):
                              return
                          key = (req.method, u, resp.status)
                          if key in seen:
                              return
                          seen.add(key)
                          body = ""
                          if resp.status == 200:
                              try:
                                  body = await resp.text()
                              except Exception:
                                  body = ""
                          excerpt = re.sub(r"\\s+", " ", body[:1800])[:1800]
                          post = ""
                          try:
                              post = req.post_data or ""
                          except Exception:
                              pass
                          events.append({
                              "type": "response",
                              "method": req.method,
                              "status": resp.status,
                              "url": u,
                              "content_type": ct,
                              "post_data": post[:2000],
                              "body_len": len(body),
                              "body_excerpt": excerpt,
                          })
                      except Exception as e:
                          events.append({"type":"response_error","error":repr(e)[:500]})

                  context.on("response", response_handler)
                  page = await context.new_page()

                  html_samples = {}
                  for target in seed_urls:
                      try:
                          print("\\n=== NAVIGATE", target)
                          await page.goto(target, wait_until="domcontentloaded", timeout=60000)
                          await page.wait_for_timeout(2500)
                          try:
                              await page.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                              await page.wait_for_timeout(1500)
                          except Exception:
                              pass

                          html = await page.content()
                          html_samples[target] = {
                              "len": len(html),
                              "scripts": re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)', html, re.I)[:80],
                              "hrefs": re.findall(r'(?:href|action)=["\\\']([^"\\\']+)', html, re.I)[:150],
                              "data_attrs": re.findall(r'\\b(?:hx-get|hx-post|hx-trigger|hx-target|hx-include|hx-vals|data-url|data-endpoint|data-api|data-action)=["\\\']([^"\\\']+)', html, re.I)[:150],
                              "api_strings": sorted(set(re.findall(r'(?i)(?:https?://[^"\\\'\\s<>]+|/[^"\\\'\\s<>]*(?:api|ajax|graphql|json|product|catalog|search)[^"\\\'\\s<>]*)', html)))[:250],
                          }
                          print("HTML_LEN", len(html))
                      except Exception as e:
                          html_samples[target] = {"error": repr(e)[:800]}
                          print("NAV_ERROR", repr(e))

                  # Extract and exercise candidate URLs found in HTML.
                  discovered = set()
                  for rec in html_samples.values():
                      for k in ("scripts","hrefs","data_attrs","api_strings"):
                          for v in rec.get(k, []) if isinstance(rec.get(k, []), list) else []:
                              if not isinstance(v, str):
                                  continue
                              discovered.add(urljoin(ROOT, v))

                  candidates = set(discovered)
                  hardcoded = [
                      "/api/products", "/api/products/", "/api/v1/products", "/api/v1/products/",
                      "/api/catalog", "/api/catalog/", "/api/catalog/products", "/api/catalog/products/",
                      "/api/product", "/api/product/", "/api/search", "/api/search/",
                      "/api/items", "/api/items/", "/api/inventory/products", "/api/inventory/products/",
                      "/api/store/products", "/api/store/products/", "/api/products/list", "/api/product-list/",
                      "/products", "/products/", "/search", "/search/", "/shop/", "/shop/?page=2",
                      "/products/?page=2", "/catalog/", "/catalogue/", "/store/products/",
                      "/graphql", "/api/graphql", "/graphql/",
                  ]
                  for path in hardcoded:
                      candidates.add(urljoin(ROOT, path))

                  # Probe conventional Django/HTMX pagination/search forms with GET.
                  query_variants = [
                      "?page=2", "?page=2&limit=100", "?page=2&per_page=100",
                      "?page=2&offset=100", "?page=2&size=100", "?q=rtx",
                      "?search=rtx", "?query=rtx", "?s=rtx",
                  ]
                  base_for_queries = ["/api/products", "/api/products/", "/api/catalog", "/api/catalog/",
                                      "/api/search", "/api/search/", "/products/", "/search/", "/shop/"]
                  for b in base_for_queries:
                      for q in query_variants:
                          candidates.add(urljoin(ROOT, b + q))

                  # Limit to 300 stable candidates.
                  candidates = sorted(candidates)[:300]

                  print("\\n=== CANDIDATE PROBES", len(candidates))
                  request = await context.request.new_context(
                      extra_http_headers={
                          "Accept": "application/json, text/html;q=0.9, */*;q=0.8",
                          "X-Requested-With": "XMLHttpRequest",
                      }
                  )

                  direct = []
                  for u in candidates:
                      for headers in ({}, {"HX-Request":"true"}, {"HX-Request":"true","HX-Trigger":"load-more"}):
                          try:
                              r = await request.get(u, headers=headers, timeout=25000)
                              ct = (r.headers.get("content-type") or "").lower()
                              body = await r.text()
                              sig = body[:3000].lower()
                              productish = sum(x in sig for x in (
                                  '"price"', '"sku"', '"product"', '"products"', '"results"',
                                  '"items"', '"name"', '"title"', '₹', 'inr',
                              ))
                              jsonish = "json" in ct or sig.lstrip().startswith(("{","["))
                              if r.status == 200 and (jsonish or productish >= 2 or "hx-" in str(headers).lower()):
                                  direct.append({
                                      "url": u, "status": r.status, "content_type": ct,
                                      "headers": headers, "body_len": len(body),
                                      "productish": productish,
                                      "body_excerpt": re.sub(r"\\s+", " ", body[:2200])[:2200],
                                  })
                                  print("HIT", r.status, ct, productish, headers, u, "len", len(body))
                              elif r.status not in (404, 405):
                                  print("RESP", r.status, ct, u)
                          except Exception as e:
                              pass
                  await request.dispose()

                  print("\\n=== XHR/FETCH EVENTS", len(events))
                  for e in sorted(events, key=lambda x: (x.get("url",""), x.get("method",""))):
                      print(json.dumps(e, ensure_ascii=False))

                  print("\\n=== HTML SIGNALS")
                  print(json.dumps(html_samples, ensure_ascii=False, indent=2)[:60000])

                  print("\\n=== DIRECT HITS")
                  print(json.dumps(direct, ensure_ascii=False, indent=2)[:60000])

                  # Simple machine summary.
                  api_events = [e for e in events if e.get("type")=="response" and ("json" in e.get("content_type","") or e.get("body_excerpt","").lstrip().startswith(("{","[")))]
                  print("\\n=== SUMMARY")
                  print(json.dumps({
                      "xhr_events": len(events),
                      "json_like_events": len(api_events),
                      "direct_hits": len(direct),
                      "top_candidates": direct[:20],
                      "possible_api_urls": [e["url"] for e in api_events[:100]],
                  }, ensure_ascii=False, indent=2))

                  await browser.close()

          asyncio.run(main())
          PY
