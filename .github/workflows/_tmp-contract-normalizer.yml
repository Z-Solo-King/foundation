name: Temporary contract normalizer
on:
  push:
    branches:
      - fix/heroic-first-chat-submit-current-main-2026-10-03-r2
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Normalize quote-sensitive contract assertions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "frontend/guest_test_mode_contract_test.mjs";
          let value = fs.readFileSync(path, "utf8");
          value = value.replace(/event === '([^']+)'/g, 'event === [\'"]$1[\'"]');
          fs.writeFileSync(path, value);
          NODE
      - name: Validate
        run: node --check frontend/guest_test_mode_contract_test.mjs
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-contract-normalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/guest_test_mode_contract_test.mjs .github/workflows/_tmp-contract-normalizer.yml
          git diff --cached --quiet && exit 0
          git commit -m "test: accept canonical frontend event quote styles"
          git push