name: Temporary first-chat formatter

on:
  push:
    branches:
      - fix/heroic-first-chat-submit-current-main-2026-10-03-r2

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/fix/heroic-first-chat-submit-current-main-2026-10-03-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Format source files
        run: |
          set -euo pipefail
          ruff format tests/test_frontend_ux_completeness.py
          npx --yes prettier@3.9.9 --write frontend/app.js
          git diff --check

      - name: Commit source formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add frontend/app.js tests/test_frontend_ux_completeness.py
          git commit -m "style: format first-chat fix"
          git push
