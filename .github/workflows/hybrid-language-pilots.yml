name: Hybrid language pilots

'on':
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Optional immutable Operations revision; blank uses current main SHA resolved at run start
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/hybrid-language-pilots.yml"
      - ".github/workflows/hybrid-language-pilots-*.yml"
      - "polyglot/edge-worker/**"
      - "docs/**"
      - "tools/verify_rust_url_identity_parity.py"

permissions:
  contents: read

concurrency:
  group: foundation-hybrid-language-pilots-${{github.ref}}
  cancel-in-progress: true

jobs:
  resolve_operations_ref:
      name: Resolve immutable Operations revision
      runs-on: ubuntu-latest
      timeout-minutes: 3
      outputs:
        ref: ${{ steps.resolve.outputs.ref }}
      steps:
        - name: Create Operations read token
          id: operations-app
          uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
          with:
            client-id: ${{ secrets.OPERATIONS_APP_ID }}
            private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
            owner: Z-Solo-King
            repositories: operations
            permission-contents: read
        - name: Resolve Operations ref
          id: resolve
          uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
          with:
            github-token: ${{ steps.operations-app.outputs.token }}
            script: |
              const requested = (context.payload.inputs?.operations_ref || "").trim();
              if (requested) {
                core.setOutput("ref", requested);
                return;
              }
              const response = await github.rest.repos.getBranch({
                owner: "Z-Solo-King",
                repo: "operations",
                branch: "main",
              });
              core.setOutput("ref", response.data.commit.sha);
  
  rust_core:
    name: Rust core
    needs: resolve_operations_ref
    uses: ./.github/workflows/hybrid-language-pilots-rust-core.yml
    with:
      operations_ref: ${{ needs.resolve_operations_ref.outputs.ref }}
    secrets: inherit
  rust_bench:
    name: Rust differential and benchmark
    needs: resolve_operations_ref
    uses: ./.github/workflows/hybrid-language-pilots-rust-bench.yml
    with:
      operations_ref: ${{ needs.resolve_operations_ref.outputs.ref }}
    secrets: inherit
  typescript:
    name: TypeScript and public-edge pilots
    needs: resolve_operations_ref
    uses: ./.github/workflows/hybrid-language-pilots-typescript.yml
    with:
      operations_ref: ${{ needs.resolve_operations_ref.outputs.ref }}
    secrets: inherit
  tooling:
    name: Go/browser/tooling pilots
    needs: resolve_operations_ref
    uses: ./.github/workflows/hybrid-language-pilots-tooling.yml
    with:
      operations_ref: ${{ needs.resolve_operations_ref.outputs.ref }}
    secrets: inherit
