name: Hybrid language pilots

on:
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Operations revision to test
        required: true
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/hybrid-language-pilots.yml"

permissions:
  contents: read

jobs:
  rust:
    name: Rust HTML parser pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref || 'main' }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable

      - name: Test
        working-directory: operations
        run: cargo test --manifest-path experiments/rust_html_kernel/Cargo.toml

  go:
    name: Go HTTP fanout pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref || 'main' }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25"

      - name: Test
        working-directory: operations/experiments/go_http_fanout
        run: go test ./...

  typescript:
    name: TypeScript search adapter shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref || 'main' }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install and typecheck
        working-directory: operations/polyglot/search-adapters
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
