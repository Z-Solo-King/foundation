  rust_html_sample:
    name: Rust HTML parity 32x3 differential benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ inputs.operations_ref || 'a82753c2b23dac355a3424249ed7d9fd3dc4d86e' }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
      - name: Determine pinned Foundation public-core revision
        id: foundation-core-pin
        working-directory: operations
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path
          tree = ast.parse(Path("scripts/sync_public_core.py").read_text(encoding="utf-8"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "FOUNDATION_COMMIT":
                          output.write_text(f"ref={node.value.value}\n", encoding="utf-8")
                          raise SystemExit
          raise SystemExit("FOUNDATION_COMMIT not found")

      - name: Checkout exact pinned Foundation public core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/foundation
          ref: ${{ steps.foundation-core-pin.outputs.ref }}
          token: ${{ github.token }}
          path: foundation-core
          fetch-depth: 1

      - name: Ensure exact Foundation Git object is present
        working-directory: foundation-core
        shell: bash
        env:
          FOUNDATION_COMMIT: ${{ steps.foundation-core-pin.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$FOUNDATION_COMMIT"
          git cat-file -e "$FOUNDATION_COMMIT^{commit}"
          git cat-file -e "$FOUNDATION_COMMIT:foundation_core/__init__.py"

      - name: Materialize pinned public foundation_core
        working-directory: operations
        env:
          FOUNDATION_CORE_GIT: ${{ github.workspace }}/foundation-core
        run: |
          set -euo pipefail
          python scripts/sync_public_core.py
          test -f foundation_core/__init__.py

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install Python extractor baseline
        working-directory: operations
        run: |
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip install --disable-pip-version-check "lxml>=5,<7" "httpx>=0.27,<1"
      - name: Build Rust kernel
        working-directory: operations
        run: cargo build --release --manifest-path experiments/rust_html_kernel/Cargo.toml
      - name: Run 32x3 Python/Rust differential benchmark
        working-directory: operations
        env:
          PYTHONPATH: .
        shell: python
        run: |
          import json, os, subprocess, time
          from statistics import median
          from extractor_mapper.extraction.generic_html import products_from_html

          cases = [
              f'<article class="product-card"><h2>Product {i}</h2><a href="/p/{i}">/p/{i}</a><span class="price">₹{100+i}</span></article>'
              for i in range(32)
          ]
          binary = "./experiments/rust_html_kernel/target/release/rie_html_kernel"
          rust_times = []

          for repeat in range(3):
              for index, html in enumerate(cases):
                  expected = products_from_html(html)
                  start = time.perf_counter_ns()
                  proc = subprocess.run([binary], input=html, text=True, capture_output=True, check=True)
                  elapsed = time.perf_counter_ns() - start
                  rust_times.append(elapsed)
                  actual = json.loads(proc.stdout)
                  expected_common = [
                      {"name": row["name"], "url": row["url"], "price": row["price"]}
                      for row in expected
                  ]
                  actual_common = [
                      {"name": row["name"], "url": row["url"], "price": row["price"]}
                      for row in actual
                  ]
                  assert actual_common == expected_common, f"parity mismatch repeat={repeat+1} case={index}: {actual_common!r} != {expected_common!r}"

          ordered = sorted(rust_times)
          def pct(p):
              pos = (len(ordered)-1) * p
              lo, hi = int(pos), min(int(pos)+1, len(ordered)-1)
              return int(ordered[lo] + (ordered[hi]-ordered[lo]) * (pos-lo))

          summary = {
              "schema": "rust-html-differential-v1",
              "cases": 32,
              "repeats": 3,
              "parity": "PASS",
              "rust_latency_ns": {
                  "p50": int(median(ordered)),
                  "p95": pct(0.95),
                  "p99": pct(0.99),
              },
              "operations_revision": "${{ inputs.operations_ref || 'a82753c2b23dac355a3424249ed7d9fd3dc4d86e' }}",
              "python_reference": "extractor_mapper.extraction.generic_html.products_from_html",
              "candidate": "experiments/rust_html_kernel",
          }
          os.makedirs(".runtime", exist_ok=True)
          with open(".runtime/rust-html-differential.json", "w", encoding="utf-8") as handle:
              json.dump(summary, handle, indent=2)
          print(json.dumps(summary, indent=2))
      - name: Upload Rust HTML differential receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-html-differential-receipt
          path: operations/.runtime/rust-html-differential.json
