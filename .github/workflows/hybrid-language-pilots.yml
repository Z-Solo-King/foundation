      operations_ref:
        description: Operations revision to test
        required: true
        default: a82753c2b23dac355a3424249ed7d9fd3dc4d86e
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/hybrid-language-pilots.yml"
      - "polyglot/edge-worker/**"
      - "docs/**"

