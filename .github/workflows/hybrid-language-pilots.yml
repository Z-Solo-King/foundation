name: Hybrid language pilots

on:
  workflow_dispatch:
    inputs:
      operations_ref:
        description: Optional immutable Operations revision; blank uses current main SHA resolved at run start
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/hybrid-language-pilots.yml"
      - "polyglot/edge-worker/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: foundation-hybrid-language-pilots-${{github.ref}}
  cancel-in-progress: true

jobs:
  resolve_operations_ref:
    name: Resolve immutable Operations revision
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Resolve Operations ref
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.operations-app.outputs.token }}
          script: |
            const requested = (context.payload.inputs?.operations_ref || "").trim();
            if (requested) {
              core.setOutput("ref", requested);
              return;
            }
            const response = await github.rest.repos.getBranch({
              owner: "Z-Solo-King",
              repo: "operations",
              branch: "main",
            });
            core.setOutput("ref", response.data.commit.sha);

  rust:
    needs: resolve_operations_ref
    name: Rust HTML parser pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable

      - name: Test
        working-directory: operations
        run: cargo test --manifest-path experiments/rust_html_kernel/Cargo.toml

  go:
    needs: resolve_operations_ref
    name: Go HTTP fanout pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25"

      - name: Test
        working-directory: operations/experiments/go_http_fanout
        run: |
          go test ./...
          go test -race ./...

  typescript:
    needs: resolve_operations_ref
    name: TypeScript search adapter shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install and typecheck
        working-directory: operations/polyglot/search-adapters
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test


  rust_url_identity:
    needs: resolve_operations_ref
    name: Rust URL identity parity pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
      - name: Test
        working-directory: operations
        run: cargo test --manifest-path benchmark/polyglot/rust_url_identity/Cargo.toml

  edge_worker:
    name: TypeScript public edge contract shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: polyglot/edge-worker/package.json

      - name: Install and test
        working-directory: polyglot/edge-worker
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test


  browser_acquisition:
    needs: resolve_operations_ref
    name: TypeScript browser acquisition shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install and test
        working-directory: operations/polyglot/browser-acquisition
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test


  rust_text_normalization:
    needs: resolve_operations_ref
    name: Rust text normalization parity pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read

      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable

      - name: Test
        working-directory: operations
        run: cargo test --manifest-path experiments/rust_text_normalization/Cargo.toml


  frontend_state:
    name: TypeScript frontend lifecycle parity shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install and test
        working-directory: polyglot/frontend-state
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test

  rust_url_canonical_differential:
    needs: resolve_operations_ref
    name: Rust URL canonicalization Python differential
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{secrets.OPERATIONS_APP_ID}}
          private-key: ${{secrets.OPERATIONS_APP_PRIVATE_KEY}}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{needs.resolve_operations_ref.outputs.ref}}
          token: ${{steps.operations-app.outputs.token}}
          path: operations
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
          cache: false
      - name: Determine current Foundation URL-reference revision
        id: foundation-url-ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Checkout Foundation URL-reference repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/foundation
          token: ${{ github.token }}
          path: foundation-reference
          fetch-depth: 1
      - name: Select exact pinned Foundation URL-reference commit
        working-directory: foundation-reference
        shell: bash
        env:
          FOUNDATION_COMMIT: ${{ steps.foundation-url-ref.outputs.ref }}
        run: |
          set -euo pipefail
          FOUNDATION_COMMIT="$(printf "%s" "$FOUNDATION_COMMIT" | tr -d "\r\n" | xargs)"
          test -n "$FOUNDATION_COMMIT"
          git fetch --no-tags --depth=1 origin "$FOUNDATION_COMMIT"
          git cat-file -e "$FOUNDATION_COMMIT^{commit}"
          git cat-file -e "$FOUNDATION_COMMIT:backend/sources/http.py"
          git checkout --detach "$FOUNDATION_COMMIT"
      - name: Build corpus with adversarial URL cases
        working-directory: operations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(v) for v in Path("benchmark/polyglot/rust_url_identity/corpus.jsonl").read_text().splitlines() if v]
          invalid=["not-a-url","ftp://example.com/file","https:///missing-host","https://","http:///example.com","https://example.com:8443/a","https://user:pass@example.com/a","http://user@example.com/a","http://localhost/a","http://127.0.0.1/a","http://10.0.0.1/a","http://192.168.1.1/a","http://[::1]/a","http://[fc00::1]/a"]
          rows += [{"id":f"invalid-{i+1:02d}","input":value} for i,value in enumerate(invalid)]
          Path("benchmark/polyglot/rust_url_identity/differential_corpus.jsonl").write_text("\n".join(json.dumps(v) for v in rows)+"\n", encoding="utf-8")
          assert len(rows) == 71
          PY
      - name: Generate Python canonical outputs
        working-directory: operations
        env:
          PYTHONPATH: ${{ github.workspace }}/foundation-reference

        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.sources.http import canonicalize_url
          rows=[json.loads(v) for v in Path("benchmark/polyglot/rust_url_identity/differential_corpus.jsonl").read_text().splitlines() if v]
          out=[]
          for row in rows:
            try:
              value=canonicalize_url(row["input"])
            except Exception:
              out.append({"id":row["id"],"ok":False})
            else:
              out.append({"id":row["id"],"ok":True,"output":value})
          Path("python-url.jsonl").write_text("\n".join(json.dumps(v,sort_keys=True) for v in out)+"\n")
          PY
      - name: Verify URL Python reference import
        working-directory: operations
        env:
          PYTHONPATH: ${{ github.workspace }}/foundation-reference
        run: python -c "from backend.sources.http import canonicalize_url; assert callable(canonicalize_url)"
      - name: Generate Rust candidate outputs
        working-directory: operations
        run: cargo run --quiet --manifest-path benchmark/polyglot/rust_url_identity/Cargo.toml --bin differential -- benchmark/polyglot/rust_url_identity/differential_corpus.jsonl rust-url.jsonl
      - name: Compare Python and Rust URL contract
        working-directory: operations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          py=[json.loads(v) for v in Path("python-url.jsonl").read_text().splitlines() if v]
          rs=[json.loads(v) for v in Path("rust-url.jsonl").read_text().splitlines() if v]
          assert len(py)==len(rs)==71
          for a,b in zip(py,rs):
              assert a["id"]==b["id"]
              assert a["ok"]==b["ok"], (a,b)
              if a["ok"]:
                  assert a["output"]==b["output"], (a,b)
          print("URL canonicalization differential parity: PASS (57 corpus + 14 adversarial)")
          PY
      - name: Benchmark Rust URL candidate
        working-directory: operations
        run: cargo bench --manifest-path benchmark/polyglot/rust_url_identity/Cargo.toml --bench normalization

  rust_url_bench:
    needs: resolve_operations_ref
    name: Rust URL identity 32x3 benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
      - name: Benchmark
        working-directory: operations
        run: cargo bench --manifest-path benchmark/polyglot/rust_url_identity/Cargo.toml --bench normalization

  rust_text_bench:
    needs: resolve_operations_ref
    name: Rust text normalization 32x3 benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
      - name: Benchmark
        working-directory: operations
        run: cargo bench --manifest-path experiments/rust_text_normalization/Cargo.toml --bench normalization

  rust_html_sample:
    needs: resolve_operations_ref
    name: Rust HTML parity 32x3 differential benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Operations read token
        id: operations-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OPERATIONS_APP_ID }}
          private-key: ${{ secrets.OPERATIONS_APP_PRIVATE_KEY }}
          owner: Z-Solo-King
          repositories: operations
          permission-contents: read
      - name: Checkout Operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/operations
          ref: ${{ needs.resolve_operations_ref.outputs.ref }}
          token: ${{ steps.operations-app.outputs.token }}
          path: operations
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
          cache: false
      - name: Determine pinned Foundation public-core revision
        id: foundation-core-pin
        working-directory: operations
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path
          tree = ast.parse(Path("scripts/sync_public_core.py").read_text(encoding="utf-8"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "FOUNDATION_COMMIT":
                          output.write_text(f"ref={node.value.value}\n", encoding="utf-8")
                          raise SystemExit
          raise SystemExit("FOUNDATION_COMMIT not found")

      - name: Checkout Foundation public core repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Z-Solo-King/foundation
          token: ${{ github.token }}
          path: foundation-core
          fetch-depth: 1

      - name: Select exact pinned Foundation public-core commit
        working-directory: foundation-core
        shell: bash
        env:
          FOUNDATION_COMMIT: ${{ steps.foundation-core-pin.outputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$FOUNDATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "foundation_core_pin_must_be_immutable_sha: $FOUNDATION_COMMIT"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$FOUNDATION_COMMIT"
          git cat-file -e "$FOUNDATION_COMMIT^{commit}"
          git cat-file -e "$FOUNDATION_COMMIT:foundation_core/__init__.py"
          git checkout --detach "$FOUNDATION_COMMIT"
      - name: Materialize pinned Foundation public core for Python reference
        working-directory: operations
        env:
          FOUNDATION_CORE_GIT: ${{ github.workspace }}/foundation-core
        run: |
          set -euo pipefail
          python scripts/sync_public_core.py
          test -f foundation_core/__init__.py

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install Python extractor baseline
        working-directory: operations
        run: |
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip install --disable-pip-version-check "lxml>=5,<7" "httpx>=0.27,<1"
      - name: Build Rust kernel
        working-directory: operations
        run: cargo build --release --manifest-path experiments/rust_html_kernel/Cargo.toml
      - name: Run 32x3 Python/Rust differential benchmark against active extractor
        working-directory: operations
        env:
          PYTHONPATH: .
        shell: python
        run: |
          import json, os, subprocess, time
          from statistics import median
          from extractor_mapper.extraction.generic import _products_from_html

          cases = []
          for i in range(32):
              classes = ("product-card", "item-card", "listing-card", "catalog-card")
              card = classes[i % len(classes)]
              extras = []
              if i % 2 == 0:
                  extras.append(f'<meta itemprop="sku" content="SKU-{i}">')
              else:
                  extras.append(f'<span data-sku="SKU-{i}"></span>')
              if i % 3 == 0:
                  extras.append(f'<meta itemprop="mpn" content="MPN-{i}">')
              if i % 4 == 0:
                  extras.append(f'<meta itemprop="gtin" content="{1000000000000+i}">')
              if i % 5 == 0:
                  extras.append('<img src="/img/a.jpg" data-src="/img/b.jpg">')
              if i % 6 == 0:
                  extras.append('<table><tr><th>RAM</th><td>32 GB</td></tr></table>')
              if i % 7 == 0:
                  extras.append('<p itemprop="description">Fast machine</p>')
              if i % 3 == 0:
                  extras.append('<span>In Stock</span>')
              price = f"₹{100+i:,}"
              cases.append(
                  f'<article class="{card}"><h2>Product {i}</h2>'
                  f'<a href="/p/{i}">/p/{i}</a>'
                  f'<span class="price">{price}</span>'
                  + "".join(extras) + '</article>'
              )

          binary = "./experiments/rust_html_kernel/target/release/rie_html_kernel"
          rust_times = []
          for repeat in range(3):
              for index, html in enumerate(cases):
                  expected = _products_from_html(html)
                  expected_norm = json.loads(json.dumps(expected, default=list, sort_keys=True))
                  started = time.perf_counter_ns()
                  proc = subprocess.run([binary], input=html, text=True, capture_output=True, check=True)
                  rust_times.append(time.perf_counter_ns() - started)
                  actual = json.loads(proc.stdout)
                  assert actual == expected_norm, (
                      f"full parity mismatch repeat={repeat+1} case={index}: "
                      f"{actual!r} != {expected_norm!r}"
                  )

          ordered = sorted(rust_times)
          def pct(p):
              pos = (len(ordered)-1) * p
              lo, hi = int(pos), min(int(pos)+1, len(ordered)-1)
              return int(ordered[lo] + (ordered[hi]-ordered[lo]) * (pos-lo))

          summary = {
              "schema": "rust-html-active-extractor-differential-v2",
              "cases": 32,
              "repeats": 3,
              "parity": "PASS",
              "rust_latency_ns": {"p50": int(median(ordered)), "p95": pct(0.95), "p99": pct(0.99)},
              "operations_revision": "${{needs.resolve_operations_ref.outputs.ref}}",
              "python_reference": "extractor_mapper.extraction.generic._products_from_html",
              "candidate": "experiments/rust_html_kernel",
              "comparison": "full_record",
          }
          os.makedirs(".runtime", exist_ok=True)
          with open(".runtime/rust-html-differential.json", "w", encoding="utf-8") as handle:
              json.dump(summary, handle, indent=2)
