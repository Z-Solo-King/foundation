name: autonomous benchmark

on:
  push:
    branches: [main]
    paths:
      - "benchmark/targets-20.json"
      - "benchmark/public_chatbot_runner.py"
      - "benchmark/chatbot-query-corpus.json"
      - "benchmark/chatbot_query_benchmark.py"
      - "benchmark/nightly/**"
      - "backend/intelligence/planning.py"
      - "backend/intelligence/contracts.py"
      - ".github/workflows/autonomous-benchmark.yml"
      - ".github/workflows/nightly-ai-research-20jobs.yml"
      - "scripts/build_nightly_ai_research_report.js"
      - "docs/FAMILY_INTEGRATION_GRAPH.json"
      - "benchmark/ai_agent_task_matrix_v1.json"
  schedule:
    # 01:15 IST = 19:45 UTC on the previous day. Staggered away from 01:00.
    - cron: "45 19 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: autonomous-benchmark
  cancel-in-progress: false

env:
  BENCHMARK_MINUTES: "18"

jobs:
  research_feed:
    name: Validate latest nightly research feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locate latest successful 20-job research
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/research-feed
          latest="$(gh run list --workflow nightly-ai-research-20jobs.yml --repo "$GITHUB_REPOSITORY" --limit 25 --json databaseId,status,conclusion,headSha,createdAt --jq '[.[] | select(.status=="completed" and .conclusion=="success")] | sort_by(.createdAt) | reverse | .[0]')"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            jq -n --arg state "unavailable" --arg reason "no successful nightly-ai-research-20jobs run is available" --arg current_sha "$GITHUB_SHA" \
              '{schema:"nightly-research-feed-status/v1",state:$state,reason:$reason,benchmark_sha:$current_sha}' > .runtime/research-feed/research-feed-status.json
            exit 0
          fi
          run_id="$(jq -r '.databaseId' <<<"$latest")"
          head_sha="$(jq -r '.headSha' <<<"$latest")"
          created_at="$(jq -r '.createdAt' <<<"$latest")"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name nightly-ai-research-synthesis --dir .runtime/research-feed
          test -f .runtime/research-feed/nightly_ai_research_report.json
          test -f .runtime/research-feed/benchmark_improvement_candidates.json
          candidates=.runtime/research-feed/benchmark_improvement_candidates.json
          candidate_schema="$(jq -r '.schema // empty' "$candidates")"
          candidate_count="$(jq -r '.candidate_count // empty' "$candidates")"
          candidate_state="structured"
          if [ "$candidate_schema" != "nightly-ai-research-improvement-candidates/v2" ]; then
            jq -n --arg state "invalid" --arg reason "latest research candidate feed has an unknown schema" --arg run_id "$run_id" --arg head_sha "$head_sha" --arg current_sha "$GITHUB_SHA" --arg created_at "$created_at"               '{schema:"nightly-research-feed-status/v1",state:$state,reason:$reason,run_id:($run_id|tonumber),head_sha:$head_sha,benchmark_sha:$current_sha,created_at:$created_at,candidate_feed_state:"invalid"}' > .runtime/research-feed/research-feed-status.json
            exit 1
          fi
          if [ -z "$candidate_count" ]; then
            candidate_state="legacy"
          elif ! jq -e '(.candidate_count|tonumber) > 0 and ((.signal_candidates|length) == .candidate_count)' "$candidates" >/dev/null; then
            jq -n --arg state "invalid" --arg reason "latest research candidate feed has inconsistent candidate_count" --arg run_id "$run_id" --arg head_sha "$head_sha" --arg current_sha "$GITHUB_SHA" --arg created_at "$created_at"               '{schema:"nightly-research-feed-status/v1",state:$state,reason:$reason,run_id:($run_id|tonumber),head_sha:$head_sha,benchmark_sha:$current_sha,created_at:$created_at,candidate_feed_state:"invalid"}' > .runtime/research-feed/research-feed-status.json
            exit 1
          fi
          report=.runtime/research-feed/nightly_ai_research_report.json
          current_graph_sha256="$(sha256sum docs/FAMILY_INTEGRATION_GRAPH.json | awk '{print $1}')"
          report_graph_sha256="$(jq -r '.family_graph_digests[0] // empty' "$report")"
          if ! jq -e '.schema == "nightly-ai-research-report/v2" and .expected_jobs == 20 and (.missing_jobs|length == 0) and (.invalid_jobs|length == 0) and (.benchmark_targets|length > 0) and (.stale_benchmark_targets|length == 0)' "$report" >/dev/null; then
            jq -n --arg state "invalid" --arg reason "latest research synthesis failed core integrity validation" --arg run_id "$run_id" --arg head_sha "$head_sha" --arg current_sha "$GITHUB_SHA" --arg created_at "$created_at"               '{schema:"nightly-research-feed-status/v1",state:$state,reason:$reason,run_id:($run_id|tonumber),head_sha:$head_sha,benchmark_sha:$current_sha,created_at:$created_at,candidate_feed_state:"invalid"}' > .runtime/research-feed/research-feed-status.json
            exit 1
          fi
          state="available"
          reason="latest successful research synthesis is structurally valid"
          if [ "$candidate_state" = "legacy" ]; then state="legacy_feed"; reason="latest successful research synthesis predates structured signal-candidate fields"; fi
          if [ "$head_sha" != "$GITHUB_SHA" ] && [ "$state" = "available" ]; then state="stale_head"; reason="latest successful research synthesis is from a different Foundation revision"; fi
          if [ "$head_sha" != "$GITHUB_SHA" ] && [ "$state" = "legacy_feed" ]; then state="stale_legacy_feed"; reason="latest research feed is structurally valid but predates structured signal-candidate fields and uses a different Foundation revision"; fi
          if [ -n "$report_graph_sha256" ] && [ "$report_graph_sha256" != "$current_graph_sha256" ]; then state="stale_graph"; reason="latest research synthesis references an older family integration graph"; fi
          jq -n --arg state "$state" --arg reason "$reason" --arg run_id "$run_id" --arg head_sha "$head_sha" --arg benchmark_sha "$GITHUB_SHA" --arg created_at "$created_at" --arg report_graph_sha256 "$report_graph_sha256" --arg current_graph_sha256 "$current_graph_sha256" --arg candidate_state "$candidate_state" --arg candidate_count "$candidate_count"             '{schema:"nightly-research-feed-status/v1",state:$state,reason:$reason,run_id:($run_id|tonumber),head_sha:$head_sha,benchmark_sha:$benchmark_sha,created_at:$created_at,report_graph_sha256:$report_graph_sha256,current_graph_sha256:$current_graph_sha256,candidate_feed_state:$candidate_state,candidate_count:(if $candidate_count=="" then null else ($candidate_count|tonumber) end)}' > .runtime/research-feed/research-feed-status.json
      - name: Upload research feed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latest-research-feed
          path: .runtime/research-feed
          retention-days: 30
          if-no-files-found: error

  benchmark:
    needs: [research_feed]
    name: Benchmark shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout public foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download latest nightly research feed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: latest-research-feed
          path: .runtime/research-feed

      - name: Validate research feed handoff
        shell: bash
        run: |
          set -euo pipefail
          status=.runtime/research-feed/research-feed-status.json
          test -f "$status"
          jq -e '.schema == "nightly-research-feed-status/v1"' "$status" >/dev/null
          cat "$status" >> "$GITHUB_STEP_SUMMARY"

      - name: Test public chatbot durable contract
        run: |
          set -euo pipefail
          python -m benchmark.public_chatbot_runner chatbot-smoke

      - name: Validate nightly research tracking contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from benchmark.nightly.research_ledger import can_visit, empty_ledger, record_visit

          schema = json.loads(Path('benchmark/nightly/research-ledger.schema.json').read_text(encoding='utf-8'))
          assert schema['properties']['visits']['items']['required']
          ledger = empty_ledger('contract-test')
          assert can_visit(ledger, 'T04-chatbot-research-benchmark', 'https://example.com/a')[0]
          record_visit(
              ledger,
              task_id='T04-chatbot-research-benchmark',
              url='https://example.com/a',
              source_family='web_search',
              purpose='contract test',
              method='direct',
              result='useful',
          )
          allowed, reason = can_visit(ledger, 'T04-chatbot-research-benchmark', 'https://example.com/a')
          assert not allowed and reason == 'already_visited_for_task'
          assert can_visit(ledger, 'T05-unreachable-evidence', 'https://example.com/a')[0]
          with tempfile.TemporaryDirectory() as tmp:
              p = Path(tmp) / 'ledger.json'
              p.write_text(json.dumps(ledger, indent=2), encoding='utf-8')
              assert json.loads(p.read_text(encoding='utf-8'))['visits'][0]['canonical_url'] == 'https://example.com/a'
          print('nightly research tracking contract: PASS')
          PY

      - name: Test natural-language deep research queries
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          rm -rf .runtime
          python -m benchmark.chatbot_query_benchmark \
            --input benchmark/chatbot-query-corpus.json \
            --output .runtime/chatbot-query-benchmark.json
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run bounded public benchmark
        id: live_benchmark
        timeout-minutes: 19
        run: |
          set -euo pipefail
          rm -rf .runtime/benchmarks
          python -m benchmark.public_chatbot_runner run \
            --input benchmark/targets-20.json \
            --output .runtime/benchmarks \
            --run-id "github-${GITHUB_RUN_ID}-shard-${{ matrix.shard }}" \
            --shards 4 \
            --shard ${{ matrix.shard }} \
            --workers 6 \
            --duration-minutes "${BENCHMARK_MINUTES}"
        env:
          PYTHONUNBUFFERED: "1"

      - name: Build sanitized benchmark summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from collections import Counter
          from pathlib import Path

          def percentile(values, fraction):
              if not values:
                  return None
              ordered = sorted(values)
              index = max(0, min(len(ordered) - 1, math.ceil(fraction * len(ordered)) - 1))
              return ordered[index]

          root = Path('.runtime/benchmarks')
          rows = []
          receipts = []
          if root.exists():
              for path in root.glob('*/summary-*.json'):
                  rows.append(json.loads(path.read_text(encoding='utf-8')))
              for path in root.glob('*/shard-*.jsonl'):
                  with path.open(encoding='utf-8') as handle:
                      for line in handle:
                          if line.strip():
                              receipts.append(json.loads(line))

          selected = sum(int(row.get('selected') or row.get('selected_targets') or 0) for row in rows)
          cycles = sum(int(row.get('cycles') or 0) for row in rows)
          status_counts = Counter()
          http_status_counts = Counter()
          diagnostic_counts = Counter()
          target_counts = {}
          latency_values = []
          bytes_read_total = 0
          product_candidates_total = 0
          jsonld_blocks_total = 0
          observations_with_product_candidates = 0
          observations_with_jsonld = 0
          for row in rows:
              status_counts.update({k: int(v) for k, v in (row.get('status_counts') or {}).items()})
              http_status_counts.update({k: int(v) for k, v in (row.get('http_status_counts') or {}).items()})
              diagnostic_counts.update({k: int(v) for k, v in (row.get('diagnostic_counts') or {}).items()})
          for receipt in receipts:
              key = receipt.get('key') or receipt.get('url') or 'unknown'
              entry = target_counts.setdefault(key, {
                  'url': receipt.get('url', ''),
                  'ok': 0,
                  'empty': 0,
                  'blocked': 0,
                  'resource_limited': 0,
                  'error': 0,
                  'http_status_counts': {},
                  'diagnostics': {},
              })
              status = receipt.get('status', 'error')
              entry[status] = entry.get(status, 0) + 1
              elapsed = int(receipt.get('elapsed_ms') or 0)
              latency_values.append(elapsed)
              bytes_read_total += int(receipt.get('bytes_read') or 0)
              product_candidates = int(receipt.get('product_candidates') or 0)
              jsonld_blocks = int(receipt.get('jsonld_blocks') or 0)
              product_candidates_total += product_candidates
              jsonld_blocks_total += jsonld_blocks
              observations_with_product_candidates += int(product_candidates > 0)
              observations_with_jsonld += int(jsonld_blocks > 0)
              http_status = receipt.get('http_status')
              if http_status:
                  code = str(http_status)
                  entry['http_status_counts'][code] = entry['http_status_counts'].get(code, 0) + 1
              for diagnostic in receipt.get('diagnostics') or []:
                  entry['diagnostics'][diagnostic] = entry['diagnostics'].get(diagnostic, 0) + 1

          total_observations = sum(status_counts.values())
          error_count = int(status_counts.get('error', 0))
          blocked_count = int(status_counts.get('blocked', 0))
          resource_limited_count = int(status_counts.get('resource_limited', 0))
          operational_failure_count = error_count + blocked_count + resource_limited_count
          usable_count = int(status_counts.get('ok', 0))
          target_failure_summary = []
          for entry in target_counts.values():
              observations = sum(entry.get(k, 0) for k in ('ok', 'empty', 'blocked', 'resource_limited', 'error'))
              failures = entry.get('error', 0) + entry.get('blocked', 0) + entry.get('resource_limited', 0)
              if failures:
                  target_failure_summary.append({
                      'url': entry['url'],
                      'observations': observations,
                      'failures': failures,
                      'failure_rate': round(failures / observations, 6) if observations else None,
                      'status_counts': {k: entry.get(k, 0) for k in ('ok', 'empty', 'blocked', 'resource_limited', 'error')},
                      'http_status_counts': entry['http_status_counts'],
                      'diagnostics': entry['diagnostics'],
                  })
          target_failure_summary.sort(key=lambda item: (-item['failure_rate'], item['url']))

          safe = {
              'schema': 'autonomous-public-benchmark-summary/v9',
              'run_id': '${{ github.run_id }}',
              'shard': ${{ matrix.shard }},
              'summaries': len(rows),
              'selected_targets': selected,
              'cycles': cycles,
              'total_observations': total_observations,
              'error_rate': round(error_count / total_observations, 6) if total_observations else None,
              'operational_failure_rate': round(operational_failure_count / total_observations, 6) if total_observations else None,
              'usable_observation_rate': round(usable_count / total_observations, 6) if total_observations else None,
              'failure_counts': {
                  'error': error_count,
                  'blocked': blocked_count,
                  'resource_limited': resource_limited_count,
                  'operational_failure': operational_failure_count,
                  'usable': usable_count,
              },
              'status_counts': dict(sorted(status_counts.items())),
              'http_status_counts': dict(sorted(http_status_counts.items())),
              'diagnostic_counts': dict(sorted(diagnostic_counts.items())),
              'measurement': {
                  'observations': total_observations,
                  'elapsed_ms': {
                      'min': percentile(latency_values, 0.0),
                      'median': percentile(latency_values, 0.5),
                      'p95': percentile(latency_values, 0.95),
                      'max': percentile(latency_values, 1.0),
                  },
                  'bytes_read_total': bytes_read_total,
                  'product_candidates_total': product_candidates_total,
                  'jsonld_blocks_total': jsonld_blocks_total,
                  'observations_with_product_candidates': observations_with_product_candidates,
                  'observations_with_jsonld': observations_with_jsonld,
                  'field_level_correctness_oracle': False,
                  'evidence_scope': 'transport_and_structural_signals_only',
              },
              'targets_with_failures': target_failure_summary,
              'measurement_gaps': [
                  'no oracle-backed product-field precision/recall',
                  'product-candidates and JSON-LD counts are structural hints, not correctness judgments',
              ],
          }

          Path('benchmark-summary.json').write_text(json.dumps(safe, indent=2), encoding='utf-8')
          print(json.dumps(safe, indent=2))
          if selected <= 0:
              raise SystemExit('No live benchmark summary was produced; benchmark infrastructure is invalid.')
          PY

      - name: Upload sanitized benchmark summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autonomous-benchmark-summary-shard-${{ matrix.shard }}
          path: benchmark-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload deep-query benchmark
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autonomous-chatbot-query-benchmark
          path: .runtime/chatbot-query-benchmark.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove runtime artifacts
        if: always()
        run: rm -rf .runtime
