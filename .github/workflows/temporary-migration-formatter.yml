name: Temporary migration formatter

on:
  push:
    branches:
      - migration/node-governance-tooling-v2-2026-10-02

permissions:
  contents: write

jobs:
  format:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore: migration format pass')
      && !startsWith(github.event.head_commit.message, 'chore: remove migration formatter') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Format migration files
        shell: bash
        run: |
          set -u
          mapfile -t prettier_files < <(
            git diff --name-only origin/main...HEAD |
            grep -E '\.(cjs|js|mjs|ts|tsx|json|jsonc|md|yml|yaml)$' || true
          )
          if [ "${#prettier_files[@]}" -gt 0 ]; then
            npx --yes prettier@3.9.9 --write "${prettier_files[@]}"
          fi

          mapfile -t markdown_files < <(
            git diff --name-only origin/main...HEAD |
            grep -E '\.md$' || true
          )
          if [ "${#markdown_files[@]}" -gt 0 ]; then
            npx --yes markdownlint-cli2@0.23.3 --fix "${markdown_files[@]}" || true
          fi

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: migration format pass"
          git push origin "HEAD:${GITHUB_REF_NAME}"
