name: WooCommerce clean recovery execution

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/woocommerce_32_cross_runner_feed_recovery.mjs"
      - ".github/workflows/woocommerce-clean-recovery.yml"
  push:
    branches: [main]
    paths:
      - "tools/woocommerce_32_cross_runner_feed_recovery.mjs"
      - ".github/workflows/woocommerce-clean-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Recover ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        site:
          - "Ads Store"
          - ithunt
          - kccomputers
          - "KRG KART"
          - "PC Kumar Infotech"
          - PCHubShop
          - "SCL Gaming"
          - "Variety Infotech"
          - Moskeys
          - Theproaudio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Run recovery
        run: node tools/woocommerce_32_cross_runner_feed_recovery.mjs --site "$SITE"
        env:
          SITE: ${{ matrix.site }}
      - name: Probe public recovery worker
        if: always()
        shell: bash
        env:
          SITE: ${{ matrix.site }}
        run: |
          set -u
          mkdir -p out/worker
          slug="${SITE,,}"
          slug="${slug// /-}"
          worker="https://wc-google-feed-research-20260927.heroic-ai.workers.dev/${slug}.xml"
          echo "Worker endpoint: $worker"
          status="$(curl -L -sS --connect-timeout 15 --max-time 180 -o out/worker/feed.xml -w '%{http_code}' "$worker" || true)"
          echo "$status" > out/worker/status.txt
          printf '%s\n' "$worker" > out/worker/url.txt
          echo "WORKER_HTTP_STATUS=$status"
          if [[ "$status" = "200" ]] && grep -Eqi 'base.google.com/ns/1.0' out/worker/feed.xml && grep -Eqi '<item[ >]' out/worker/feed.xml && grep -Eqi '<g:id>|<id>' out/worker/feed.xml && grep -Eqi '<g:price>|<price>' out/worker/feed.xml; then
            items="$(grep -Eio '<item[ >]' out/worker/feed.xml | wc -l | tr -d ' ')"
            echo "WORKER_GOOGLE_XML=1" > out/worker/probe.txt
            echo "ITEMS=$items" >> out/worker/probe.txt
          else
            echo "WORKER_GOOGLE_XML=0" > out/worker/probe.txt
            echo "ITEMS=0" >> out/worker/probe.txt
          fi
      - name: Probe public web archive for historical feed
        if: always()
        env:
          SITE: ${{ matrix.site }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const fs = await import('node:fs/promises');
          const site = process.env.SITE;
          const domains = {
            'Ads Store':'adsstore.in','ithunt':'ithunt.in','kccomputers':'kccomputers.co.in','KRG KART':'krgkart.com',
            'PC Kumar Infotech':'pckumar.in','PCHubShop':'www.pchubshop.com','SCL Gaming':'sclgaming.in',
            'Variety Infotech':'varietyinfotech.com','Moskeys':'moskeys.com','Theproaudio':'www.theproaudio.com'
          };
          const domain = domains[site];
          await fs.mkdir('out/archive',{recursive:true});
          const slug = site.toLowerCase().replace(/[^a-z0-9]+/g,'-');
          const out = {site,domain,candidates:[],verified:null,status:'NO_ARCHIVE_FEED'};
          try {
            const q = new URL('https://web.archive.org/cdx/search/cdx');
            q.searchParams.set('url',`${domain}/*`);
            q.searchParams.set('output','json');
            q.searchParams.set('fl','timestamp,original,statuscode,mimetype');
            q.searchParams.append('filter','statuscode:200');
            q.searchParams.append('collapse','urlkey');
            q.searchParams.set('limit','200');
            const cr = await fetch(q,{headers:{'User-Agent':'WooCommerceFeedRecovery/2026.09'}});
            out.cdx_http_status=cr.status;
            const txt=await cr.text();
            await fs.writeFile(`out/archive/${slug}-cdx.txt`,txt);
            if(cr.ok){
              let rows=[]; try{rows=JSON.parse(txt);}catch{}
              for(const row of rows.slice(1)){
                const [timestamp,original,statuscode,mimetype]=row;
                if(!timestamp||!original||statuscode!=='200') continue;
                if(!/(google|merchant|shopping|product[-_]?feed|feeds?|gpf|products?\\.(?:xml|rss))/i.test(original)) continue;
                out.candidates.push({timestamp,original,mimetype});
              }
              for(const c of out.candidates.slice(0,30)){
                const au=`https://web.archive.org/web/${c.timestamp}id_/${c.original}`;
                const ar=await fetch(au,{redirect:'follow',headers:{'User-Agent':'WooCommerceFeedRecovery/2026.09','Accept':'application/xml,text/xml,text/plain,*/*'}}).catch(()=>null);
                if(!ar||ar.status!==200) continue;
                const body=await ar.text();
                if(/base\\.google\\.com\\/ns\\/1\\.0/i.test(body)&&/<item\\b/i.test(body)&&/<(?:g:)?price\\b/i.test(body)&&/<(?:g:)?(?:id|title|link)\\b/i.test(body)){
                  await fs.writeFile(`out/archive/${slug}-historical-feed.xml`,body);
                  out.verified={archive_url:au,original:c.original,timestamp:c.timestamp,bytes:Buffer.byteLength(body),items:(body.match(/<item\\b/gi)||[]).length};
                  out.status='HISTORICAL_NATIVE_GOOGLE_XML';
                  break;
                }
              }
            }
          } catch(e){ out.error=String(e); }
          await fs.writeFile(`out/archive/${slug}-report.json`,JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wc-clean-recovery-${{ matrix.site }}
          path: |
            out/woocommerce-32-cross-runner/
            out/worker/
            out/archive/
          if-no-files-found: warn
          retention-days: 14
