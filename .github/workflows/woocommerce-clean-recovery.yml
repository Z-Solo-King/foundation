name: WooCommerce clean recovery execution
# Final archive validation refresh 2026-09-27

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/woocommerce_32_cross_runner_feed_recovery.mjs"
      - ".github/workflows/woocommerce-clean-recovery.yml"
  push:
    branches: [main]
    paths:
      - "tools/woocommerce_32_cross_runner_feed_recovery.mjs"
      - ".github/workflows/woocommerce-clean-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Recover ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        site:
          - "Ads Store"
          - ithunt
          - kccomputers
          - "KRG KART"
          - "PC Kumar Infotech"
          - PCHubShop
          - "SCL Gaming"
          - "Variety Infotech"
          - Moskeys
          - Theproaudio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Run recovery
        run: node tools/woocommerce_32_cross_runner_feed_recovery.mjs --site "$SITE"
        env:
          SITE: ${{ matrix.site }}
      - name: Probe public web archive for historical feed
        if: always()
        env:
          SITE: ${{ matrix.site }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const fs = await import('node:fs/promises');
          const site = process.env.SITE;
          const domains = {
            'Ads Store':'adsstore.in','ithunt':'ithunt.in','kccomputers':'kccomputers.co.in','KRG KART':'krgkart.com',
            'PC Kumar Infotech':'pckumar.in','PCHubShop':'www.pchubshop.com','SCL Gaming':'sclgaming.in',
            'Variety Infotech':'varietyinfotech.com','Moskeys':'moskeys.com','Theproaudio':'www.theproaudio.com'
          };
          const domain = domains[site];
          await fs.mkdir('out/archive',{recursive:true});
          const slug = site.toLowerCase().split('').map(ch => /[a-z0-9]/i.test(ch) ? ch : '-').join('').replace(/-+/g,'-');
          const out = {site,domain,candidates:[],verified:null,status:'NO_ARCHIVE_FEED'};
          try {
            const q = new URL('https://web.archive.org/cdx/search/cdx');
            q.searchParams.set('url',`${domain}/*`);
            q.searchParams.set('output','json');
            q.searchParams.set('fl','timestamp,original,statuscode,mimetype');
            q.searchParams.append('filter','statuscode:200');
            q.searchParams.append('collapse','urlkey');
            q.searchParams.set('limit','200');
            const cr = await fetch(q,{headers:{'User-Agent':'WooCommerceFeedRecovery/2026.09'}});
            out.cdx_http_status=cr.status;
            const txt=await cr.text();
            await fs.writeFile(`out/archive/${slug}-cdx.txt`,txt);
            if(cr.ok){
              let rows=[]; try{rows=JSON.parse(txt);}catch{}
              for(const row of rows.slice(1)){
                const [timestamp,original,statuscode,mimetype]=row;
                if(!timestamp||!original||statuscode!=='200') continue;
                const low=original.toLowerCase();
                if(!(low.includes('google')||low.includes('merchant')||low.includes('shopping')||low.includes('feed')||low.includes('gpf')||low.includes('.xml')||low.includes('.rss'))) continue;
                out.candidates.push({timestamp,original,mimetype});
              }
              for(const c of out.candidates.slice(0,30)){
                const au=`https://web.archive.org/web/${c.timestamp}id_/${c.original}`;
                const ar=await fetch(au,{redirect:'follow',headers:{'User-Agent':'WooCommerceFeedRecovery/2026.09','Accept':'application/xml,text/xml,text/plain,*/*'}}).catch(()=>null);
                if(!ar||ar.status!==200) continue;
                const body=await ar.text();
                const low=body.toLowerCase();
                if(low.includes('base.google.com/ns/1.0')&&low.includes('<item')&&(low.includes('<g:price')||low.includes('<price'))&&(low.includes('<g:id')||low.includes('<id'))&&(low.includes('<g:title')||low.includes('<title'))&&(low.includes('<g:link')||low.includes('<link'))){
                  await fs.writeFile(`out/archive/${slug}-historical-feed.xml`,body);
                  out.verified={archive_url:au,original:c.original,timestamp:c.timestamp,bytes:Buffer.byteLength(body),items:(body.match(/<item/gi)||[]).length};
                  out.status='HISTORICAL_NATIVE_GOOGLE_XML';
                  break;
                }
              }
            }
          } catch(e){ out.error=String(e); }
          await fs.writeFile(`out/archive/${slug}-report.json`,JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wc-clean-recovery-${{ matrix.site }}
          path: |
            out/woocommerce-32-cross-runner/
            out/archive/
          if-no-files-found: warn
          retention-days: 14
