name: ci-secret-canary

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      TEST_AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
    steps:
      - name: Verify runner and secret availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TEST_AUTH_TOKEN}"
          echo "runner-and-secret-ok"
