name: Repository hygiene mechanical autofix PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repository-hygiene-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted Foundation main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pinned formatter
        run: python -m pip install --disable-pip-version-check ruff==0.16.9

      - name: Apply mechanical formatting only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' py_files < <(git ls-files -z -- '*.py')
          if ((${#py_files[@]})); then
            ruff format "${py_files[@]}"
          fi
          mapfile -d '' prettier_files < <(git ls-files -z -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.json' '*.jsonc' '*.yml' '*.yaml' '*.md')
          if ((${#prettier_files[@]})); then
            npx --yes prettier@3.9.9 --write "${prettier_files[@]}"
          fi
          git diff --check

      - name: Open review PR when changes exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No mechanical hygiene changes required."
            exit 0
          fi
          branch="auto/repository-hygiene-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply repository hygiene formatting"
          git push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore: apply repository hygiene formatting" \
            --body "## Scope\nMechanical formatter-only normalization from the canonical repository hygiene contract.\n\n## Safety\nNo lint auto-fix, policy change, credential change, deployment, or merge is performed by this workflow. A human/normal protected review remains required.\n\n## Evidence\nGenerated by the twice-daily governance sweep's allowlisted mechanical repair workflow."