name: Temporary app formatter

on:
  push:
    branches:
      - fix/heroic-first-chat-submit-current-main-2026-10-03-r2

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Format app.js exactly
        run: npx --yes prettier@3.9.9 --write frontend/app.js
      - name: Emit formatted app.js
        run: |
          echo "FORMAT_OK"
          base64 -w0 frontend/app.js
