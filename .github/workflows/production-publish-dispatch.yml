name: Production publish dispatcher

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  dispatch:
    name: Reindex and dispatch production publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reindex production workflow registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/production-publish.yml
          current_name=$(sed -n 's/^name: //p' "$workflow" | head -n1)
          if [ "$current_name" != 'Foundation production release (reindexed)' ]; then
            python - "$workflow" <<'PY'
from pathlib import Path
import sys

path = Path(sys.argv[1])
text = path.read_text(encoding="utf-8")
old = "name: Foundation production release\n"
new = "name: Foundation production release (reindexed)\n"
if old not in text:
    raise SystemExit("expected production workflow name was not found")
path.write_text(text.replace(old, new, 1), encoding="utf-8")
PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            branch='automation/reindex-production-publish'
            git checkout -B "$branch"
            git add "$workflow"
            git commit -m 'ci: reindex production workflow registration'
            git push --set-upstream origin "$branch"
            if ! gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --head "$branch" \
                --base main \
                --title 'ci: reindex production workflow registration' \
                --body 'Force a fresh GitHub Actions workflow registration by changing the canonical production workflow name without changing deployment logic or trigger semantics.'
            fi
            echo 'Created production workflow reindex PR; production dispatch will resume after it merges.'
            exit 0
          fi

      - name: Dispatch reindexed production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-publish.yml --repo "${GITHUB_REPOSITORY}" --ref main
          for attempt in $(seq 1 12); do
            run_json=$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow production-publish.yml \
              --branch main \
              --limit 1 \
              --json databaseId,status,conclusion,event,headSha)
            database_id=$(jq -r '.[0].databaseId // empty' <<<"$run_json")
            head_sha=$(jq -r '.[0].headSha // empty' <<<"$run_json")
            event=$(jq -r '.[0].event // empty' <<<"$run_json")
            if [ "$head_sha" = "$GITHUB_SHA" ] && [ "$event" = "workflow_dispatch" ] && [ -n "$database_id" ]; then
              echo "PRODUCTION_PUBLISH_DISPATCHED=$database_id"
              exit 0
            fi
            sleep 5
          done
          echo 'Production publish workflow dispatch was not observed for the current main SHA'
          exit 1
