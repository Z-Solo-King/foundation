name: Temporary first-chat formatter
on:
  push:
    branches:
      - fix/heroic-first-chat-submit-current-main-2026-10-03-r2
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Format changed frontend contracts
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --diff-filter=ACMRTUXB --name-only HEAD^ -- '*.mjs' '*.js' '*.json' '*.html' '*.css' | tr '\n' ' ')"
          if [ -n "$files" ]; then npx --yes prettier --write $files; fi
      - name: Remove formatter and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-first-chat-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize first-chat frontend formatting"
          git push