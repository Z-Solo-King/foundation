name: Temporary first-chat formatter
on:
  push:
    branches:
      - fix/heroic-first-chat-submit-current-main-2026-10-03-r2
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Format contract files
        run: npx --yes prettier --write frontend/guest_test_mode_contract_test.mjs frontend/ui_contract_test.mjs
      - name: Remove formatter and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-first-chat-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/guest_test_mode_contract_test.mjs frontend/ui_contract_test.mjs .github/workflows/_tmp-first-chat-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format first-chat contract tests"
          git push