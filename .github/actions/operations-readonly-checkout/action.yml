name: Operations read-only checkout
description: Mint a read-only Operations App token and check out the requested immutable revision.
inputs:
  client-id:
    description: GitHub App client ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  owner:
    description: GitHub owner
    required: false
    default: Z-Solo-King
  repository:
    description: Operations repository name
    required: false
    default: operations
  ref:
    description: Immutable Operations revision
    required: true
  path:
    description: Checkout path
    required: false
    default: operations
outputs:
  token:
    description: Short-lived read-only GitHub App installation token
    value: ${{ steps.operations-token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Mint read-only Operations App token
      id: operations-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repository }}
        permission-contents: read
    - name: Checkout pinned Operations
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.owner }}/${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ steps.operations-token.outputs.token }}
        path: ${{ inputs.path }}
        persist-credentials: false
