name: Operations read-only checkout
description: Check out an immutable private Operations revision with a caller-provided read-only token.
inputs:
  token:
    description: Short-lived GitHub App installation token
    required: true
  owner:
    description: GitHub owner
    required: false
    default: Z-Solo-King
  repository:
    description: Private repository
    required: false
    default: operations
  ref:
    description: Immutable Operations revision
    required: true
  path:
    description: Checkout path
    required: false
    default: operations
  fetch-depth:
    description: Git fetch depth
    required: false
    default: "1"
runs:
  using: composite
  steps:
    - name: Checkout pinned Operations
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.owner }}/${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false
