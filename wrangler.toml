name = "research-intelligence-engine-public"
main = "worker.py"
compatibility_date = "2026-09-09"
compatibility_flags = ["python_workers"]

# Replace the two placeholders with the IDs/names created in the owner's
# Cloudflare account before production deployment. No credentials belong here.
[[d1_databases]]
binding = "DB"
database_name = "research-intelligence"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "research-intelligence-artifacts"

[vars]
ENVIRONMENT = "production"
STRICT_ZERO_COST_ONLY = "true"
