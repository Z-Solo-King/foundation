[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heroic-ai"
version = "0.2.0"
description = "Public-safe Heroic AI application contract and deterministic core"
requires-python = ">=3.14"
dependencies = []

[tool.setuptools.packages.find]
include = ["foundation_core*"]

[dependency-groups]
dev = [
  "workers-py>=1.9",
  "workers-runtime-sdk",
  "pytest",
  "pytest-asyncio",
  "coverage",
]
